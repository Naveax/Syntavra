name: Apply R24 Config Explain Clippy Fix

on:
  push:
    branches:
      - feature/full-parity-r24-config-explain-cli
    paths:
      - tools/apply_r24_config_explain_clippy_fix.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r24-config-explain-cli
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Apply assertion-locked refactor
        run: python tools/apply_r24_config_explain_clippy_fix.py
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo 'Clippy refactor already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/syntavra-cli/src/main.rs
          git commit -m 'Refactor native config explain execution'
          git push origin HEAD:feature/full-parity-r24-config-explain-cli
