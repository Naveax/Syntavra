name: Dispatch Canonical Publish Dry Run

on:
  push:
    branches:
      - agent/pre-release-publish-orchestrator

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Dispatch canonical publish dry-run'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: 0dcd5cc143d547f6ed62e3578589622c9632052f
    steps:
      - name: Verify canonical main is still the intended target
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current_main" = "$TARGET_HEAD"
      - name: Dispatch zero-write publication dry-run
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/publish-pre-release.yml/dispatches" \
            --input - <<JSON
          {
            "ref": "main",
            "inputs": {
              "exact_head": "$TARGET_HEAD",
              "mode": "dry-run",
              "confirmation": "",
              "publish_legacy_native": "false"
            }
          }
          JSON
