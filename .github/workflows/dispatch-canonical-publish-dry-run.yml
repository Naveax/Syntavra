name: Dispatch Canonical Publish Dry Run

on:
  push:
    branches:
      - agent/pre-release-registry-preflight
    paths:
      - '.github/workflows/dispatch-canonical-publish-dry-run.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: d199be93f5fe6848c75f1fea3b74fc19388d5320
    steps:
      - name: Verify canonical main is still the intended target
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current_main" = "$TARGET_HEAD"
      - name: Dispatch zero-write publication dry-run
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-pre-release.yml/dispatches" \
            -f ref=main \
            -f "inputs[exact_head]=$TARGET_HEAD" \
            -f 'inputs[mode]=dry-run' \
            -f 'inputs[confirmation]=' \
            -f 'inputs[publish_legacy_native]=false'
