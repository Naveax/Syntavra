name: Provider E5 Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'syntavra_runtime/provider_e5.py'
      - 'benchmarks/token_economy_provider_replay.py'
      - 'benchmarks/token_economy_frozen_corpus.py'
      - 'contracts/python/token-economy-frozen-workloads-v1.json'
      - 'tests/runtime/test_provider_e5.py'
      - 'tests/runtime/test_token_economy_provider_replay.py'
      - 'tools/certify_provider_e5.py'
      - '.github/workflows/provider-e5-proof.yml'
  push:
    branches: [main]
    paths:
      - 'syntavra_runtime/provider_e5.py'
      - 'benchmarks/token_economy_provider_replay.py'
      - 'benchmarks/token_economy_frozen_corpus.py'
      - 'contracts/python/token-economy-frozen-workloads-v1.json'
      - 'tests/runtime/test_provider_e5.py'
      - 'tests/runtime/test_token_economy_provider_replay.py'
      - 'tools/certify_provider_e5.py'
      - '.github/workflows/provider-e5-proof.yml'
  workflow_dispatch:
    inputs:
      arms_path:
        description: 'Repository path to an exact two-arm provider-observed SignalBench configuration'
        required: true
        type: string
      repetitions:
        description: 'Repetitions per frozen workload variant (minimum 3)'
        required: true
        default: '3'
        type: string
      require_superiority:
        description: 'Fail unless the hardened comparator proves scoped paired superiority'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: provider-e5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  contract-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Prove E5 and superiority claim separation
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_provider_e5 -v
          python -m unittest tests.runtime.test_token_economy_provider_replay -v
          python -m compileall -q syntavra_runtime/provider_e5.py tools/certify_provider_e5.py benchmarks/token_economy_provider_replay.py
      - name: Enforce clean exact head
        if: always()
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  live-e5:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout dispatched exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Execute frozen B0-B9 paired provider replay
        shell: bash
        env:
          E5_ARMS_PATH: ${{ inputs.arms_path }}
          E5_REPETITIONS: ${{ inputs.repetitions }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test "$E5_REPETITIONS" -ge 3
          test -f "$E5_ARMS_PATH"
          python benchmarks/token_economy_provider_replay.py \
            --corpus-root "${RUNNER_TEMP}/provider-e5-corpus" \
            --run-root "${RUNNER_TEMP}/provider-e5-runs" \
            --arms "$E5_ARMS_PATH" \
            --repetitions "$E5_REPETITIONS" \
            --seed 20260908 \
            --execute \
            --output "${RUNNER_TEMP}/provider-e5-replay.json"
      - name: Certify E5 provider evidence
        run: |
          set -euo pipefail
          python tools/certify_provider_e5.py \
            "${RUNNER_TEMP}/provider-e5-replay.json" \
            --require-e5 \
            --output "${RUNNER_TEMP}/provider-e5-certificate.json"
      - name: Enforce optional scoped superiority gate
        if: inputs.require_superiority
        run: |
          set -euo pipefail
          python tools/certify_provider_e5.py \
            "${RUNNER_TEMP}/provider-e5-replay.json" \
            --require-e5 \
            --require-superiority \
            --output "${RUNNER_TEMP}/provider-e5-superiority-certificate.json"
      - name: Upload E5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-e5-${{ github.sha }}
          path: |
            ${{ runner.temp }}/provider-e5-replay.json
            ${{ runner.temp }}/provider-e5-certificate.json
            ${{ runner.temp }}/provider-e5-superiority-certificate.json
          if-no-files-found: warn
