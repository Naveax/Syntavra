name: Rebase stacked R4 after R0-R3 squash

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebase-stacked-r4.yml"

permissions:
  contents: write

jobs:
  rebase-r4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dual-engine-r4-selector
          fetch-depth: 0
      - name: Rebuild R4 on merged main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feature/dual-engine-r0-r3 feature/dual-engine-r4-selector
          git checkout -B r4-rebased origin/main
          git diff --binary \
            99ce98aa97c37d0dd5c3f7d9d6ca64ed52be3373 \
            f799e6e0e72a40013fbc68da7d2421736c131173 \
            -- . \
            ':(exclude).github/workflows/contract-drift.yml' \
            ':(exclude)MANIFEST.sha256' > /tmp/r4.patch
          git apply --index /tmp/r4.patch
          git config user.name "Syntavra Stack Rebase"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Rebase R4 selector onto merged R0-R3 foundation"
          git push origin HEAD:feature/dual-engine-r4-selector --force
