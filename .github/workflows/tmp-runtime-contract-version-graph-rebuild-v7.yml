name: Temporary Runtime Contract Version Graph Rebuild v7

on:
  push:
    branches:
      - automation/runtime-contract-version-graph-rebuild-v2-20260827
    paths:
      - ".github/workflows/tmp-runtime-contract-version-graph-rebuild-v7.yml"

permissions:
  contents: write

concurrency:
  group: tmp-runtime-contract-version-graph-rebuild-v7
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install runtime dependencies once
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          rm -rf syntavra_runtime.egg-info

      - name: Rebuild, commit locally, then certify exact clean head
        shell: bash
        run: python tools/tmp_runtime_contract_graph_rebuild_v7.py

      - name: Upload rebuild receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-contract-version-graph-rebuild-v7-${{ github.sha }}
          path: |
            /tmp/runtime-contract-version-graph-rebuild-v7.json
            /tmp/runtime-contract-version-graph.json
            /tmp/python-capability-completeness.json
            /tmp/python-completion-certificate.json
            /tmp/rust-feature-freeze-guard.json
            /tmp/runtime-contract-version-graph-release-validation.json
          if-no-files-found: warn
