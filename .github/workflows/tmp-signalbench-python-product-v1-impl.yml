name: Temporary SignalBench Python Product v1 Implementer

on:
  push:
    branches:
      - automation/signalbench-python-product-v1-impl

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_BRANCH: agent/signalbench-python-product-v1
      TARGET_HEAD: 1b0c5b110b29164439066dc9a711c2d839369c60
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout helper history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify target branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          actual="$(git rev-parse "origin/$TARGET_BRANCH")"
          printf 'target=%s actual=%s\n' "$TARGET_HEAD" "$actual"
          test "$actual" = "$TARGET_HEAD"

      - name: Checkout exact target base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_HEAD"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply SignalBench Python product hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Harden the existing runner without adding a parallel benchmark engine.
          path = Path('syntavra_runtime/signalbench.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import os\nimport random\n', 'import os\nimport platform\nimport random\n', 1)
          text = text.replace(
              'from .claim_governance import bootstrap_ci\nfrom .util import atomic_write_json, canonical_json, sha256_bytes, sha256_file\n',
              'from .claim_governance import bootstrap_ci\nfrom .signalbench_hardened import HardenedSignalBench, HardwareIdentity, UsageReceipt\nfrom .util import atomic_write_json, canonical_json, sha256_bytes, sha256_file\n',
              1,
          )
          old_tail = '    provider_receipt_hash: str = ""\n\n\nTASK_FAMILIES = ('
          new_tail = '''    provider_receipt_hash: str = ""
    arm_version: str = ""
    reasoning: str = ""
    context_window: int = 0
    hardware_hash: str = ""
    provider_response_hash: str = ""
    usage_receipt_hash: str = ""

    def usage_receipt(self) -> UsageReceipt | None:
        if not self.provider_observed or not self.usage_receipt_hash:
            return None
        return UsageReceipt(
            task_id=self.task_id,
            arm_id=self.arm_id,
            repetition=self.repetition,
            cache_mode=self.cache_mode,
            provider=self.provider,
            request_id_hash=self.request_id_hash,
            provider_response_hash=self.provider_response_hash,
            fresh_input_tokens=self.fresh_input_tokens,
            cached_input_tokens=self.cached_input_tokens,
            output_tokens=self.output_tokens,
            reasoning_tokens=self.reasoning_tokens,
            quota_cost=float(self.quota_cost or 0.0),
            hardware_hash=self.hardware_hash,
            receipt_hash=self.usage_receipt_hash,
        )


TASK_FAMILIES = ('''
          if old_tail not in text:
              raise SystemExit('RunResult tail anchor missing')
          text = text.replace(old_tail, new_tail, 1)

