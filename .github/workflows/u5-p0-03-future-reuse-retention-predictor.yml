name: U5-P0-03 Future-Reuse Retention Predictor

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'syntavra_runtime/context_value_predictor.py'
      - 'syntavra_runtime/reacquisition_tax.py'
      - 'syntavra_runtime/context_governor.py'
      - 'tests/runtime/test_future_reuse_retention_predictor.py'
      - 'contracts/python/u5-p0-03-future-reuse-retention-predictor-v1.json'
      - 'contracts/engine/dual-engine-public-surface-v2.json'
      - 'tools/validate_u5_p0_03_future_reuse_retention_predictor.py'
      - 'tools/verify_dual_engine_public_surface.py'
      - 'docs/U5_P0_03_FUTURE_REUSE_RETENTION_PREDICTOR.md'
      - '.github/workflows/u5-p0-03-future-reuse-retention-predictor.yml'
  push:
    branches:
      - main
    paths:
      - 'syntavra_runtime/context_value_predictor.py'
      - 'syntavra_runtime/reacquisition_tax.py'
      - 'syntavra_runtime/context_governor.py'
      - 'tests/runtime/test_future_reuse_retention_predictor.py'
      - 'contracts/python/u5-p0-03-future-reuse-retention-predictor-v1.json'
      - 'contracts/engine/dual-engine-public-surface-v2.json'
      - 'tools/validate_u5_p0_03_future_reuse_retention_predictor.py'
      - 'tools/verify_dual_engine_public_surface.py'
      - 'docs/U5_P0_03_FUTURE_REUSE_RETENTION_PREDICTOR.md'
      - '.github/workflows/u5-p0-03-future-reuse-retention-predictor.yml'

permissions:
  contents: read

concurrency:
  group: u5-p0-03-future-reuse-retention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run U5-P0-03 regressions
        run: python -m unittest tests.runtime.test_future_reuse_retention_predictor -v

      - name: Verify synchronized Python public surface
        run: python tools/verify_dual_engine_public_surface.py > /tmp/u5-p0-03-dual-engine-public-surface.json

      - name: Generate exact-head U5-P0-03 certificate
        run: |
          python tools/validate_u5_p0_03_future_reuse_retention_predictor.py --out /tmp/u5-p0-03-future-reuse-retention-predictor.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('/tmp/u5-p0-03-future-reuse-retention-predictor.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'U5_P0_03_FUTURE_REUSE_RETENTION_PREDICTOR'
          assert report['mechanism_id'] == 'U5-P0-03'
          assert report['wave'] == 'TE-U31'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['provider_savings_claim'] is False
          assert report['public_surface']['module_count'] == 234
          assert report['public_surface']['public_command_count'] == 245
          runtime = report['runtime']
          assert runtime['complete_horizon_labels'] is True
          assert runtime['incomplete_horizon_excluded'] is True
          assert runtime['beta_smoothed_probability'] == 0.5
          assert runtime['expected_reacquisition_cost_units'] == 60
          assert runtime['positive_retention_value_recommends_keep'] is True
          assert runtime['shadow_does_not_change_effective_action'] is True
          assert runtime['mandatory_verifier_evidence_hard_pinned'] is True
          assert runtime['clean_gate_does_not_auto_promote'] is True
          assert runtime['provider_calls'] == 0
          assert runtime['provider_tokens'] == 0
          assert runtime['provider_savings_claim'] is False
          PY

      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info .pytest_cache
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload U5-P0-03 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u5-p0-03-future-reuse-retention-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/u5-p0-03-future-reuse-retention-predictor.json
            /tmp/u5-p0-03-dual-engine-public-surface.json
          if-no-files-found: error
