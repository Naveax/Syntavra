name: Apply R25-R37 Compile Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/full-parity-r25-r37-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r25-r37-completion
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Apply compile fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/syntavra-cli/src/full_parity_runtime.rs')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'use rusqlite::{params, Connection, OptionalExtension};': 'use rusqlite::{params, Connection};',
              'use crate::config_contract::{resolve_config_wire, snapshot_json};': 'use crate::config_contract::resolve_config_wire;',
              'fn object(value: &Value, code: &str) -> Result<&Map<String, Value>> {': "fn object<'a>(value: &'a Value, code: &str) -> Result<&'a Map<String, Value>> {",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'missing expected source fragment: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          cargo fmt --all
          rm -f .patches/r25-r37-compile-fix.patch
          rmdir .patches 2>/dev/null || true
          rm -f .github/workflows/apply-r25-r37-compile-fix.yml
      - name: Commit compile fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R25-R37: fix native runtime compilation" || exit 0
          git push origin HEAD:feature/full-parity-r25-r37-completion
