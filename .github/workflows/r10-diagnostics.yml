name: Diagnose R10 Live Broker Backup Parity

on:
  pull_request:
    branches: ["feature/dual-engine-r9-broker-snapshot"]
    paths:
      - ".github/workflows/r10-diagnostics.yml"
      - "tools/r10_wire_source.py"
      - "syntavra_runtime/broker_live_snapshot_contract.py"
      - "crates/syntavra-cli/src/broker_live_snapshot_contract.rs"
      - "contracts/state/broker-live-snapshot-v1.json"
      - "tests/runtime/test_broker_live_snapshot_contract_r10.py"
      - "tools/verify_broker_live_snapshot_parity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dual-engine-r10-live-broker-backup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - name: Wire the R10 source tree
        id: wiring
        shell: bash
        run: |
          set +e
          python tools/r10_wire_source.py > /tmp/r10-wire-output.txt 2>&1
          status=$?
          cat /tmp/r10-wire-output.txt
          exit "$status"
      - name: Diagnose R10 validation
        id: validation
        if: success()
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            cargo check --workspace
            cargo fmt --all
            cargo fmt --all -- --check
            cargo test --workspace --all-targets --locked
            cargo clippy --workspace --all-targets --locked -- -D warnings
            python -m pip install -e . pytest
            python -m pytest -q \
              tests/runtime/test_broker_snapshot_contract_r9.py \
              tests/runtime/test_broker_live_snapshot_contract_r10.py
            python tools/verify_dual_engine_contract.py
            python tools/verify_broker_snapshot_parity.py
            python tools/verify_broker_live_snapshot_parity.py
            python tools/run_engine_parity.py
          ) > /tmp/r10-diagnostics.txt 2>&1
          status=$?
          cat /tmp/r10-diagnostics.txt
          exit "$status"
      - name: Package validated R10 candidate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/r10-validated-source.tar.gz \
            Cargo.lock \
            crates/syntavra-cli/Cargo.toml \
            crates/syntavra-cli/src/broker_live_snapshot_contract.rs \
            crates/syntavra-cli/src/broker_snapshot_contract.rs \
            crates/syntavra-cli/src/main.rs \
            crates/syntavra-contracts/src/lib.rs \
            contracts/engine/rust-contract-v1.txt \
            contracts/state/broker-live-snapshot-v1.json \
            syntavra_runtime/broker_live_snapshot_contract.py \
            tests/runtime/test_broker_live_snapshot_contract_r10.py \
            tools/run_engine_parity.py \
            tools/verify_broker_live_snapshot_parity.py
          sha256sum /tmp/r10-validated-source.tar.gz > /tmp/r10-validated-source.sha256
      - name: Upload R10 diagnostics and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syntavra-r10-diagnostics-${{ github.sha }}
          path: |
            /tmp/r10-wire-output.txt
            /tmp/r10-diagnostics.txt
            /tmp/r10-validated-source.tar.gz
            /tmp/r10-validated-source.sha256
            Cargo.lock
          if-no-files-found: warn
          retention-days: 7
