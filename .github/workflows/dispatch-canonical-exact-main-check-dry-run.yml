name: Dispatch Canonical Exact Main Check Dry Run

on:
  push:
    branches:
      - agent/release-main-required-check-context
    paths:
      - '.github/workflows/dispatch-canonical-exact-main-check-dry-run.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: 16f0960cc8a07d4513051c685d61b2d26f9121e4
    steps:
      - name: Verify canonical main exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$actual" = "$EXPECTED_HEAD"
      - name: Dispatch zero-write publication dry-run
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg ref main \
            --arg head "$EXPECTED_HEAD" \
            '{ref:$ref,inputs:{exact_head:$head,mode:"dry-run",confirmation:"",publish_legacy_native:"false"}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-pre-release.yml/dispatches" --input -
