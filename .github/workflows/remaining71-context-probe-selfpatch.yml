name: Remaining 71 Context Probe Self Patch

on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: remaining71-context-probe
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/r31-provider-capture-native
      - run: rustup toolchain install 1.82.0 --profile minimal --component rustfmt
      - name: Apply context integration
        run: python tools/apply_remaining71_context_probe.py
      - name: Format and compile
        run: |
          cargo +1.82.0 fmt --all
          cargo +1.82.0 check --locked -p syntavra-cli --bins
      - name: Remove one-shot machinery
        run: |
          rm tools/apply_remaining71_context_probe.py
          rm .github/workflows/remaining71-context-probe-selfpatch.yml
      - name: Commit context integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire native context compiler behind parity probe"
          git fetch origin agent/r31-provider-capture-native
          git rebase origin/agent/r31-provider-capture-native
          git push origin HEAD:agent/r31-provider-capture-native
