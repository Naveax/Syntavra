name: Rust Feature Freeze Guard Finalize

on:
  push:
    branches:
      - agent/rust-feature-freeze-guard-v1

permissions:
  contents: write

concurrency:
  group: rust-feature-freeze-guard-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/rust-feature-freeze-guard-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install -e .

      - name: Run pre-admission guard smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-guard.json
          python tools/check_rust_feature_freeze.py \
            --base 3672b4855a109c04fbad4e50278f941019bfd310 \
            --head "$(git rev-parse HEAD)" \
            --out /tmp/rust-feature-freeze-diff.json

      - name: Remove finalizer and refresh canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rust-feature-freeze-finalize.yml
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git diff --check

      - name: Commit final Rust freeze guard tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 .github/workflows/rust-feature-freeze-finalize.yml
          git commit -m "Refresh Rust feature freeze guard manifest"
          git push origin HEAD:agent/rust-feature-freeze-guard-v1
