name: Python Provider Proxy Reference Contract

on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: python-provider-proxy-reference
  cancel-in-progress: true

jobs:
  python-provider-proxy-reference:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run Python provider/proxy regression tests
        run: python -m unittest tests.runtime.test_python_provider_proxy_reference -v

      - name: Generate exact-head Python provider/proxy evidence
        if: always()
        run: |
          set +e
          python tools/certify_python_provider_proxy_reference.py \
            --output /tmp/python-provider-proxy-reference.json \
            > /tmp/python-provider-proxy-reference.log 2>&1
          report_exit=$?
          set -e
          cat /tmp/python-provider-proxy-reference.log
          test -f /tmp/python-provider-proxy-reference.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          value = json.loads(Path('/tmp/python-provider-proxy-reference.json').read_text(encoding='utf-8'))
          checkout_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert value['ok'] is True, value
          assert value['family'] == 'provider-proxy'
          assert value['engine'] == 'python'
          assert value['exact_head'] == checkout_head, (value['exact_head'], checkout_head)
          assert value['routes']['route_count'] == 15, value['routes']
          assert value['network_boundary'] == 'localhost-only deterministic HTTP fixture; no live provider or SaaS endpoint'
          assert value['exit_policy'] == {
              'success': 0,
              'python_application_error': 4,
              'provider_replay_miss': 4,
              'provider_verify_failure': 3,
              'argparse_error': 2,
          }
          transport = value['transport']
          assert transport['retry_policy'] == 'no-automatic-retry'
          assert transport['normal']['upstream_attempts'] == 1
          assert transport['replay']['upstream_attempts'] == 0
          assert transport['http_error']['status'] == 429
          assert transport['http_error']['upstream_attempts'] == 1
          assert transport['timeout']['status'] == 502
          assert transport['timeout']['upstream_attempts'] == 1
          assert transport['timeout']['body'] == {'error': 'TimeoutError', 'detail': 'upstream request failed'}
          assert transport['missing_credential']['status'] == 502
          assert transport['missing_credential']['upstream_attempts'] == 0
          assert transport['control']['unauthorized_status'] == 401
          assert value['provider_gateway']['replay_exact_fixture'] is True
          assert value['helpers']['adaptive_route']['provider'] == 'anthropic'
          assert value['helpers']['provider_pool']['selected_account'] == 'primary'
          PY
          exit "$report_exit"

      - name: Upload Python provider/proxy reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-provider-proxy-reference
          path: |
            /tmp/python-provider-proxy-reference.json
            /tmp/python-provider-proxy-reference.log
          if-no-files-found: error

      - name: Show exact head and enforce clean repository tree
        if: always()
        run: |
          echo "head=$(git rev-parse HEAD)"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"
