name: Observability Attribution

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: observability-attribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  observability-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
      - name: Run observability attribution regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.runtime.test_observability_attribution_v1 \
            tests.runtime.test_token_saver_unification_v001 -v
      - name: Generate exact-head Observability Attribution certificate
        shell: bash
        run: |
          set -euo pipefail
          python tools/certify_observability_attribution_v1.py --out /tmp/observability-attribution.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('/tmp/observability-attribution.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'OBSERVABILITY_ATTRIBUTION_V1'
          assert report['exact_head'] == head
          assert report['runtime_ready'] is True
          assert report['decision_kinds'] == ['context', 'tool', 'policy']
          assert report['provider_usage_receipt_linkage'] is True
          assert report['token_attribution_receipt_linkage'] is True
          assert report['performance_budget_gate'] is True
          assert report['recovery_amplification_gate'] is True
          assert report['context_quality_slo_gate'] is True
          assert report['parallel_persistent_store'] is False
          assert report['public_cli_route'] is False
          assert report['python_complete_ready'] is True
          assert report['rust_resume_allowed'] is False
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          PY
      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"
      - name: Upload Observability Attribution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observability-attribution-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/observability-attribution.json
          if-no-files-found: error
