name: Python Graph Language Reference Contract

on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: python-graph-language-reference
  cancel-in-progress: true

jobs:
  python-graph-language-reference:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run Python graph/language reference regression tests
        run: python -m unittest tests.runtime.test_python_graph_language_reference -v

      - name: Generate exact-head Python graph/language evidence
        run: |
          set +e
          python tools/certify_python_graph_language_reference.py \
            --output /tmp/python-graph-language-reference.json \
            > /tmp/python-graph-language-reference.log 2>&1
          report_exit=$?
          set -e
          cat /tmp/python-graph-language-reference.log
          test -f /tmp/python-graph-language-reference.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          value = json.loads(Path('/tmp/python-graph-language-reference.json').read_text(encoding='utf-8'))
          checkout_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert value['ok'] is True, value
          assert value['engine'] == 'python'
          assert value['family'] == 'graph-language-semantic'
          assert value['exact_head'] == checkout_head, (value['exact_head'], checkout_head)
          assert len(value['routes']) == 9, value['routes']
          assert value['exit_policy'] == {
              'success': 0,
              'application_error': 4,
              'argument_parser_error': 2,
          }
          assert value['cases']['fixture_detect']['detection']['language_id'] == 'fixturelang'
          assert value['cases']['unknown_detect']['detection']['language_id'] == 'unknown:futurelang'
          assert value['cases']['csharp_detect']['detection']['language_id'] == 'csharp'
          assert value['registry_contract']['fixture_alias_identity'] is True
          assert {'c_sharp', 'csharp'} <= set(value['registry_contract']['tree_sitter']['language_ids'])
          assert value['cases']['graph_index']['canonical_graph'] is True
          assert value['cases']['graph_query']['results']
          assert value['cases']['graph_impact']['exact_evidence'] is True
          assert value['cases']['language_query_no_match']['results'] == []
          for name in ('missing_detect_error', 'escaped_detect_error'):
              assert value['cases'][name]['exit'] == 4, (name, value['cases'][name])
              assert value['cases'][name]['error_code'] == 'PYTHON_PUBLIC_COMMAND_FAILED', (name, value['cases'][name])
          assert value['cases']['invalid_limit_error']['exit'] == 2
          assert value['cases']['missing_detect_argument']['exit'] == 2
          PY
          exit "$report_exit"

      - name: Upload Python graph/language reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-graph-language-reference
          path: |
            /tmp/python-graph-language-reference.json
            /tmp/python-graph-language-reference.log
          if-no-files-found: error

      - name: Show exact head and enforce clean repository tree
        if: always()
        run: |
          echo "head=$(git rev-parse HEAD)"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"
