name: Temporary Final Manifest Refresh

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/tmp-refresh-manifest-final.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/release-authority-action-pins'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/release-authority-action-pins
          fetch-depth: 0

      - name: Restore final tree and refresh exact manifest
        shell: bash
        run: |
          rm .github/workflows/tmp-refresh-manifest-final.yml
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git diff --check
          git status --short
          test "$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')" = ".github/workflows/tmp-refresh-manifest-final.yml MANIFEST.sha256 "

      - name: Commit exact final manifest
        shell: bash
        run: |
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -A .github/workflows/tmp-refresh-manifest-final.yml MANIFEST.sha256
          git commit -m "Refresh exact release manifest"
          git push origin HEAD:agent/release-authority-action-pins
