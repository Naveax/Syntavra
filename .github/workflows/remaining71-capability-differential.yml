name: Remaining 71 Capability Differential

# Compares public Python and Rust capability-security behavior on one exact head.
on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: remaining71-capability-differential
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pending capability parity repair
        run: |
          if [ -f tools/apply_remaining71_capability_parity_fix.py ]; then
            python tools/apply_remaining71_capability_parity_fix.py
          fi
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Build full Rust CLI probe surface
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
      - name: Run capability differential
        run: |
          python tools/validate_remaining71_capability_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/capability-differential.json
      - name: Commit validated capability parity repair
        if: github.event_name == 'push'
        run: |
          if [ -f tools/apply_remaining71_capability_parity_fix.py ]; then
            rm tools/apply_remaining71_capability_parity_fix.py
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Close capability Python Rust parity"
            git fetch origin agent/r31-provider-capture-native
            git rebase origin/agent/r31-provider-capture-native
            git push origin HEAD:agent/r31-provider-capture-native
          fi
      - name: Show exact head and clean tree
        run: |
          echo "head=$(git rev-parse HEAD)"
          git status --porcelain --untracked-files=all
