name: Typed Context Object Store Finalize

on:
  push:
    branches:
      - agent/typed-context-object-store-v1

permissions:
  contents: write

concurrency:
  group: typed-context-object-store-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/typed-context-object-store-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install -e .

      - name: Run Typed Context pre-admission smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_typed_context_object_store -v
          python tools/certify_typed_context_object_store.py --out /tmp/typed-context-object-store.json

      - name: Append admitted Evidence Store and active Typed Context checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt')
          text = path.read_text(encoding='utf-8')
          evidence_marker = 'APPENDED CURRENT CHECKPOINT — 2026-08-18 — EVIDENCE STORE V2 ADMITTED'
          typed_marker = 'APPENDED CURRENT CHECKPOINT — 2026-08-18 — TYPED CONTEXT OBJECT STORE ACTIVE'
          assert evidence_marker not in text, 'Evidence Store admitted checkpoint already appended'
          assert typed_marker not in text, 'Typed Context checkpoint already appended'
          appendix = '''

======================================================================
APPENDED CURRENT CHECKPOINT — 2026-08-18 — EVIDENCE STORE V2 ADMITTED
======================================================================

CURRENT ADMITTED MAIN:
c782815c63435798319ef6004e8233949a96354d

ADMITTED IMPLEMENTATION:
evidence_store_v2

PYTHON STATUS:
PYTHON-FIRST ACTIVE — evidence_store_v2 is certified; typed_context_object_store_v1 is next.

RUST STATUS:
FEATURE FROZEN AND CI-ENFORCED — implementation coverage 245/245; production promotion 174/245; remaining parity/promotion set 71; Rust resume false.

COMPLETED:
- Evidence Store v2 hardened secret policy regression PASS on PR #139.
- Evidence Store v2 exact-head workflow PASS on final head d7e77fa14e79e69446dd62573329413794c60c8f.
- Universal Context Item PASS on the same final head.
- Python Capability Completeness PASS on the same final head.
- Rust Feature Freeze Guard and ordinary diff freeze PASS on the same final head.
- Python Authority PASS on the same final head.
- Release Main Merge Gate PASS on the same final head.
- Release Package Provenance PASS on the same final head.
- tracked MANIFEST.sha256 matched the canonical Package Provenance candidate byte-for-byte.
- PR #139 merged as c782815c63435798319ef6004e8233949a96354d.
- capability registry records evidence_store_v2 as certified.

VERIFIED DESIGN BOUNDARY:
- UniversalContextItem remains the canonical content-addressed evidence identity.
- trust/freshness are mutable journaled evaluations, not stable identity.
- secret-bearing exact evidence is rejected before persistence by default.
- hash-chained mutation journal, lineage, retention, pinning and GC are first-class.
- legacy RuntimeEvidenceGraph node/edge schemas remain intact.
- Python COMPLETE remains false.
- Rust resume remains false.

NEXT EXACT TASK:
- Implement and certify typed_context_object_store_v1.

======================================================================
APPENDED CURRENT CHECKPOINT — 2026-08-18 — TYPED CONTEXT OBJECT STORE ACTIVE
======================================================================

CURRENT ADMITTED MAIN:
c782815c63435798319ef6004e8233949a96354d

ACTIVE IMPLEMENTATION BRANCH:
agent/typed-context-object-store-v1

PYTHON STATUS:
PYTHON-FIRST ACTIVE — typed_context_object_store_v1 is the current milestone.

RUST STATUS:
FEATURE FROZEN AND CI-ENFORCED — implementation coverage 245/245; production promotion 174/245; remaining parity/promotion set 71; Rust resume false.

CURRENT IMPLEMENTATION:
- TypedContextObject deterministic codec added.
- 16 roadmap object types registered: GitDiff, TestRun, CompilerDiagnostics, ASTGraph, DependencyGraph, SearchResultSet, LogStream, BrowserDOM, TraceSet, MetricSeries, DataFrame, FileSnapshot, SymbolSnapshot, ToolSchemaSet, MemoryObservation, TaskStateSnapshot.
- exact / structural / semantic / bounded-preview representations supported.
- typed objects compile into UniversalContextItem and persist only through EvidenceStoreV2.
- no parallel database, retention, lineage, secret policy or mutation journal introduced.
- required payload fields, kind/type, representation and typed digest mismatches fail closed.
- typed persistence inherits Evidence Store secret rejection and recovery integrity.
- Typed Context contract, regression suite, certifier and exact-head workflow added.
- Release Main, repository validator and immutable action-pin policy are bound to Typed Context certification.
- capability registry records evidence_store_v2 as certified and typed_context_object_store_v1 as implemented.

VERIFIED DESIGN BOUNDARY:
- typed object digest represents typed payload/representation/metadata.
- provenance remains part of UniversalContextItem identity, not typed payload digest.
- persistence authority remains EvidenceStoreV2.
- identity authority remains UniversalContextItem.
- Python COMPLETE remains false.
- Rust resume remains false.

BLOCKERS:
- Typed Context Object Store still requires canonical manifest seal, final exact-head CI and merge before certification is admitted.

NEXT EXACT TASK:
- Finish and certify typed_context_object_store_v1.
- After admission advance to programmatic_execution_v1.
'''
          path.write_text(text + appendix, encoding='utf-8')
          PY

      - name: Remove finalizer and refresh canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/typed-context-object-finalize.yml
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          python tools/validate.py > /tmp/repository-validation.json
          git diff --check

      - name: Commit final Typed Context tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            MANIFEST.sha256 \
            docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt \
            .github/workflows/typed-context-object-finalize.yml
          git commit -m "Seal Typed Context Object Store milestone"
          git push origin HEAD:agent/typed-context-object-store-v1
