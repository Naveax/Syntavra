name: Remove R24 Scheduler Duplicate Match Arms

on:
  push:
    branches:
      - feature/full-parity-r24-scheduler-read-only-cli

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r24-scheduler-read-only-cli
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Remove duplicate scheduler arms
        run: python tools/remove_r24_scheduler_duplicate_arms.py
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Remove temporary cleanup files
        run: |
          git rm tools/remove_r24_scheduler_duplicate_arms.py
          git rm .github/workflows/remove-r24-scheduler-duplicates.yml
      - name: Commit structural cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/syntavra-cli/src/main.rs
          git commit -m 'Remove duplicate R24 scheduler command arms'
          git push origin HEAD:feature/full-parity-r24-scheduler-read-only-cli
