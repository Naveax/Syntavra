name: Syntavra Full Engine Parity Program

on:
  pull_request:
    paths:
      - "contracts/parity/**"
      - "contracts/cli/**"
      - "syntavra_runtime/**"
      - "crates/**"
      - "tools/export_python_surface.py"
      - "tools/export_rust_surface.py"
      - "tools/verify_full_parity_catalog.py"
      - "tools/verify_r25_r37_full_parity.py"
      - "tools/verify_r37_resilience.py"
      - "tools/run_engine_parity*.py"
      - "tests/runtime/test_full_parity_catalog_v1.py"
      - "tests/runtime/test_full_parity_runtime_r25_r37.py"
      - ".github/workflows/full-engine-parity.yml"
      - "docs/PYTHON_RUST_FULL_PARITY_PLAN.md"
      - "docs/adr/0023-full-python-rust-parity-program.md"
      - "docs/adr/0034-r25-r37-integrated-full-parity-completion.md"
  push:
    branches:
      - main
      - "feature/full-parity-**"

permissions:
  contents: read

jobs:
  parity-program:
    name: R0-R37 Full Parity Certification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      RUSTUP_TOOLCHAIN: "1.82.0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: r37-full-engine-parity
          cache-on-failure: false

      - name: Export Python surface
        run: python tools/export_python_surface.py --output python-surface.json
      - name: Export Rust surface
        run: python tools/export_rust_surface.py --output rust-surface.json
      - name: Verify R37 full parity catalog
        run: python tools/verify_full_parity_catalog.py | tee full-parity-report.json
      - name: Run catalog and runtime regressions
        run: >-
          python -m pytest -q
          tests/runtime/test_full_parity_catalog_v1.py
          tests/runtime/test_full_parity_runtime_r25_r37.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run aggregate R0-R37 parity
        run: python tools/run_engine_parity_r37.py | tee aggregate-r0-r37.json

      - name: Upload parity certification inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-engine-parity-r37-inventory
          path: |
            python-surface.json
            rust-surface.json
            full-parity-report.json
            aggregate-r0-r37.json
          if-no-files-found: warn
          retention-days: 90
