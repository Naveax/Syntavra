name: Syntavra Full Engine Parity Program

on:
  pull_request:
    paths:
      - "contracts/parity/**"
      - "contracts/cli/**"
      - "syntavra_runtime/**"
      - "crates/**"
      - "tools/export_python_surface.py"
      - "tools/export_rust_surface.py"
      - "tools/verify_full_parity_catalog.py"
      - "tools/verify_r24_static_cli_parity.py"
      - "tools/verify_r24_config_validate.py"
      - "tools/verify_r24_config_explain.py"
      - "tools/verify_r24_config_show.py"
      - "tools/verify_r24_migration_plan.py"
      - "tools/verify_r24_scheduler_read_only.py"
      - "tools/run_engine_parity.py"
      - "tools/run_engine_parity_r24.py"
      - "tests/runtime/test_full_parity_catalog_v1.py"
      - "tests/runtime/test_read_only_cli_r24.py"
      - "tests/runtime/test_config_validate_r24.py"
      - "tests/runtime/test_config_explain_r24.py"
      - "tests/runtime/test_config_show_r24.py"
      - "tests/runtime/test_migration_plan_read_only_r24.py"
      - "tests/runtime/test_scheduler_read_only_r24.py"
      - ".github/workflows/full-engine-parity.yml"
      - "docs/PYTHON_RUST_FULL_PARITY_PLAN.md"
      - "docs/adr/0023-full-python-rust-parity-program.md"
      - "docs/adr/0024-static-read-only-cli-parity.md"
      - "docs/adr/0025-config-validate-read-only-parity.md"
      - "docs/adr/0026-config-explain-native-parity.md"
      - "docs/adr/0027-canonical-config-show-parity.md"
      - "docs/adr/0028-scheduler-read-only-cli-parity.md"
      - "docs/adr/0029-migration-plan-read-only-cli-parity.md"
  push:
    branches:
      - main
      - "feature/full-parity-**"

permissions:
  contents: read

jobs:
  parity-program:
    name: R23-R37 Full Parity Freeze Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest

      - name: Export Python surface
        run: python tools/export_python_surface.py --output python-surface.json

      - name: Export Rust surface
        run: python tools/export_rust_surface.py --output rust-surface.json

      - name: Verify full parity catalog
        run: python tools/verify_full_parity_catalog.py | tee full-parity-report.json

      - name: Run catalog and R24 regressions
        run: >-
          python -m pytest -q
          tests/runtime/test_full_parity_catalog_v1.py
          tests/runtime/test_read_only_cli_r24.py
          tests/runtime/test_config_validate_r24.py
          tests/runtime/test_config_explain_r24.py
          tests/runtime/test_config_show_r24.py
          tests/runtime/test_migration_plan_read_only_r24.py
          tests/runtime/test_scheduler_read_only_r24.py

      - name: Set up pinned Rust 1.82
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run R24 migration plan parity
        run: python tools/verify_r24_migration_plan.py | tee r24-migration-plan-parity.json

      - name: Run aggregate R0-R24 parity
        run: python tools/run_engine_parity_r24.py | tee aggregate-r0-r24.json

      - name: Upload parity inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-engine-parity-inventory
          path: |
            python-surface.json
            rust-surface.json
            full-parity-report.json
            r24-migration-plan-parity.json
            aggregate-r0-r24.json
          if-no-files-found: warn
