name: Temporary Proxy Service Verify Exit Repair

on:
  push:
    branches:
      - agent/r31-provider-capture-native

permissions:
  contents: write

concurrency:
  group: tmp-proxy-service-verify-exit-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - name: Apply only proxy-service verify exit semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/syntavra-cli/src/bin/syntavra.rs')
          text = path.read_text(encoding='utf-8')
          old = '''                        let integrity_failure = value["ok"].as_bool() == Some(false)
                              && matches!(path.as_slice(), [root, action] if
                                  root == "run" && action == "memory-verify");
                          emit(&value);
                          if blocked_agent || integrity_failure {
                              ExitCode::from(3)
          '''
          new = '''                        let integrity_failure = value["ok"].as_bool() == Some(false)
                              && matches!(path.as_slice(), [root, action] if
                                  root == "run" && action == "memory-verify");
                          let proxy_service_verify_failure = value["ok"].as_bool() == Some(false)
                              && matches!(path.as_slice(), [root, action] if
                                  root == "run" && action == "proxy-service")
                              && parsed
                                  .forwarded
                                  .iter()
                                  .position(|item| item == "proxy-service")
                                  .and_then(|index| parsed.forwarded.get(index + 1))
                                  .is_some_and(|item| item == "verify");
                          emit(&value);
                          if blocked_agent || integrity_failure || proxy_service_verify_failure {
                              ExitCode::from(3)
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exact selector exit block once, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          changed="$(git diff --name-only)"
          test "$changed" = "crates/syntavra-cli/src/bin/syntavra.rs"
          git diff --check
      - name: Validate exact Rust repair
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all
          changed="$(git diff --name-only)"
          test "$changed" = "crates/syntavra-cli/src/bin/syntavra.rs"
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
          git diff --check
      - name: Commit validated exit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/syntavra-cli/src/bin/syntavra.rs
          git commit -m "fix(phase2): align proxy service verify exit"
          git fetch origin agent/r31-provider-capture-native
          git rebase origin/agent/r31-provider-capture-native
          git push origin HEAD:agent/r31-provider-capture-native
