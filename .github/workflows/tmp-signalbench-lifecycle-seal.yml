name: Temporary SignalBench Lifecycle Seal Executor

on:
  push:
    branches:
      - agent/signalbench-lifecycle-executor-20260826
    paths:
      - .github/workflows/tmp-signalbench-lifecycle-seal.yml

permissions:
  contents: write

concurrency:
  group: tmp-signalbench-lifecycle-seal-20260826
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/signalbench-lifecycle-executor-20260826
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Seal SignalBench lifecycle registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("contracts/python/capability-completeness-registry-v1.json")
          registry = json.loads(path.read_text(encoding="utf-8"))
          order = registry["milestone_order"]
          capabilities = registry["capabilities"]
          by_id = {item["id"]: item for item in capabilities}

          assert order[-1] == "signalbench_python_product_v1", order[-3:]
          assert "python_completion_certificate_v1" not in order
          signalbench = by_id["signalbench_python_product_v1"]
          assert signalbench["state"] == "partial", signalbench["state"]
          assert signalbench["certification_evidence"] == []
          assert registry["python_complete"]["ready"] is False
          assert registry["python_complete"]["rust_resume_allowed"] is False

          signalbench["state"] = "certified"
          signalbench["certification_evidence"] = list(signalbench["implementation_evidence"])

          completion = {
              "id": "python_completion_certificate_v1",
              "group": "phase-exit",
              "state": "partial",
              "classification": "NEW",
              "required_for_python_complete": True,
              "implementation_evidence": [
                  "contracts/python/capability-completeness-registry-v1.json",
                  "docs/SYNTAVRA_PYTHON_FIRST_ROADMAP_APPENDIX.md",
                  "docs/SYNTAVRA_PYTHON_FIRST_CONTINUATION_CHECKLIST.md",
              ],
              "certification_evidence": [],
              "acceptance": (
                  "Machine-readable Python Completion Certificate must prove all required internal capabilities certified, "
                  "required unit/integration/security gates, exact recovery, deterministic replay, clean install/fresh repository smoke, "
                  "Windows/Linux basic runtime, SignalBench product validation, behavior/contract freeze, and exact-head certification "
                  "before Python COMPLETE or Rust resume may become true."
              ),
          }

          external_index = next(i for i, item in enumerate(capabilities) if item["id"] == "external_superiority_adoption_evidence")
          capabilities.insert(external_index, completion)
          order.append("python_completion_certificate_v1")

          # Phase-exit remains deliberately closed in this lifecycle-only seal.
          registry["python_complete"]["ready"] = False
          registry["python_complete"]["rust_resume_allowed"] = False

          path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Remove helper and regenerate permanent manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-signalbench-lifecycle-seal.yml
          python tools/refresh_manifest.py
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py --check
          git diff --check

      - name: Certify lifecycle and completion boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_signalbench_python_product_v1 -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python tools/certify_signalbench_python_product_v1.py --repo . --out /tmp/signalbench.json
          python tools/certify_python_capability_completeness.py --repo . --out /tmp/completeness.json
          python tools/certify_rust_feature_freeze_guard.py --repo . --out /tmp/rust-freeze.json
          python - <<'PY'
          import json
          from pathlib import Path

          signalbench = json.loads(Path("/tmp/signalbench.json").read_text(encoding="utf-8"))
          completeness = json.loads(Path("/tmp/completeness.json").read_text(encoding="utf-8"))
          rust = json.loads(Path("/tmp/rust-freeze.json").read_text(encoding="utf-8"))

          assert signalbench["ok"] is True, signalbench
          assert signalbench["lifecycle_state"] == "certified", signalbench
          assert signalbench["admission_ready"] is True, signalbench
          assert signalbench["external_superiority_proven"] is False, signalbench
          assert signalbench["python_complete_ready"] is False, signalbench
          assert signalbench["rust_resume_allowed"] is False, signalbench

          assert completeness["ok"] is True, completeness
          assert completeness["current_milestone"] == "python_completion_certificate_v1", completeness
          assert completeness["python_complete_ready"] is False, completeness
          assert completeness["rust_resume_allowed"] is False, completeness
          assert completeness["uncertified_required"] == ["python_completion_certificate_v1"], completeness

          assert rust["ok"] is True, rust
          assert rust["python_complete_ready"] is False, rust
          assert rust["rust_resume_allowed"] is False, rust
          assert rust["rust"]["production_promoted"] == 174, rust
          assert rust["rust"]["remaining_parity_promotion"] == 71, rust
          PY

      - name: Require exact final scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/tmp-signalbench-lifecycle-seal.yml",
              "MANIFEST.sha256",
              "contracts/python/capability-completeness-registry-v1.json",
          }
          rows = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True).splitlines()
          actual = {row[3:] for row in rows}
          print("\n".join(rows))
          assert actual == expected, (actual, expected)
          PY

      - name: Commit final helper-free lifecycle tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -A
          git commit -m "certify: seal SignalBench lifecycle"
          git push origin HEAD:agent/signalbench-lifecycle-executor-20260826
