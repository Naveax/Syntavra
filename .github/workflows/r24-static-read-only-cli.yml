name: R24 Static Read-Only CLI Parity

on:
  pull_request:
    paths:
      - "contracts/cli/read-only-static-v1.json"
      - "crates/syntavra-cli/**"
      - "crates/syntavra-contracts/**"
      - "syntavra_runtime/engine_entry.py"
      - "syntavra_runtime/engine_cli.py"
      - "syntavra_runtime/engine_selector.py"
      - "syntavra_runtime/read_only_cli_contract.py"
      - "syntavra_runtime/read_only_router_r24.py"
      - "syntavra_runtime/unified_cli.py"
      - "tests/runtime/test_read_only_cli_r24.py"
      - "tools/verify_r24_static_cli_parity.py"
      - "tools/run_engine_parity_r24.py"
      - ".github/workflows/r24-static-read-only-cli.yml"
  push:
    branches:
      - main
      - "feature/full-parity-r24-**"

permissions:
  contents: read

jobs:
  parity:
    name: R24 Static CLI Contract and Cargo Parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run R24 Python regressions
        run: python -m pytest -q tests/runtime/test_read_only_cli_r24.py
      - name: Set up pinned Rust 1.82
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run real Cargo-backed R24 verifier
        run: python tools/verify_r24_static_cli_parity.py | tee r24-static-cli-report.json
      - name: Upload R24 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r24-static-read-only-cli-diagnostics
          path: r24-static-cli-report.json
          if-no-files-found: warn
