name: Reparent Verified P4 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reparent-p4-once.yml

permissions:
  contents: write

jobs:
  reparent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reparent exact verified P4 tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/p0-p4-runtime-consolidation
          verified_commit=4407a1eb236ad63b1bd0d631f07fe75c013f114e
          tree="$(git rev-parse "${verified_commit}^{tree}")"
          clean_parent="$(git rev-parse HEAD^)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit="$(printf '%s\n' 'Complete P0-P4 runtime architecture' | git commit-tree "$tree" -p "$clean_parent")"
          test "$(git rev-parse "${commit}^{tree}")" = "$tree"
          git push --force origin "${commit}:refs/heads/agent/p0-p4-runtime-consolidation"
