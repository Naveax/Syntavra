name: Unified Context Namespace Admission Migration

on:
  push:
    branches:
      - agent/unified-context-namespace-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: unified-context-namespace-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/unified-context-namespace-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Apply exact lifecycle and validator migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')

          registry_path = root / 'contracts/python/capability-completeness-registry-v1.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          by_id = {row['id']: row for row in registry['capabilities']}

          deferred = by_id['deferred_tool_discovery_v1']
          assert deferred['state'] in {'implemented', 'verified', 'certified'}
          deferred['state'] = 'certified'
          deferred['certification_evidence'] = [
              'contracts/python/deferred-tool-discovery-v1.json',
              'syntavra_runtime/deferred_tool_discovery.py',
              'tools/certify_deferred_tool_discovery.py',
              'tests/runtime/test_deferred_tool_discovery.py',
              '.github/workflows/deferred-tool-discovery.yml',
          ]

          namespace = by_id['unified_context_namespace_v1']
          assert namespace['state'] in {'planned', 'implemented'}
          namespace['state'] = 'implemented'
          namespace['implementation_evidence'] = [
              'syntavra_runtime/context_namespace.py',
              'contracts/python/unified-context-namespace-v1.json',
              'tools/certify_context_namespace.py',
              'tests/runtime/test_context_namespace.py',
              '.github/workflows/unified-context-namespace.yml',
              'syntavra_runtime/universal_context_item.py',
          ]
          namespace['certification_evidence'] = []

          order = registry['milestone_order']
          if 'multi_graph_retrieval_v1' not in order:
              index = order.index('adaptive_context_policy_v1')
              order.insert(index, 'multi_graph_retrieval_v1')
          assert order.index('unified_context_namespace_v1') < order.index('multi_graph_retrieval_v1') < order.index('adaptive_context_policy_v1')
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          completeness_path = root / 'tools/certify_python_capability_completeness.py'
          text = completeness_path.read_text(encoding='utf-8')
          old = '    "unified_context_namespace_v1",\n    "adaptive_context_policy_v1",\n]'
          new = '    "unified_context_namespace_v1",\n    "multi_graph_retrieval_v1",\n    "adaptive_context_policy_v1",\n]'
          assert text.count(old) == 1, text.count(old)
          completeness_path.write_text(text.replace(old, new), encoding='utf-8')

          deferred_certifier = root / 'tools/certify_deferred_tool_discovery.py'
          text = deferred_certifier.read_text(encoding='utf-8')
          old = '_require(completeness.get("current_milestone") == "deferred_tool_discovery_v1", "registry has not advanced to deferred_tool_discovery_v1")'
          new = '_require(bool(completeness.get("current_milestone")), "capability registry current milestone missing")'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = '_require((by_id.get("deferred_tool_discovery_v1") or {}).get("state") in {"implemented", "verified"}, "Deferred discovery registry state must be pre-certification implemented/verified")'
          new = '_require((by_id.get("deferred_tool_discovery_v1") or {}).get("state") in {"implemented", "verified", "certified"}, "Deferred discovery registry state is not admissible")'
          assert text.count(old) == 1, text.count(old)
          deferred_certifier.write_text(text.replace(old, new), encoding='utf-8')

          validator = root / 'tools/validate.py'
          text = validator.read_text(encoding='utf-8')
          replacements = [
              ('    ROOT / "contracts" / "python" / "deferred-tool-discovery-v1.json",\n', '    ROOT / "contracts" / "python" / "deferred-tool-discovery-v1.json",\n    ROOT / "contracts" / "python" / "unified-context-namespace-v1.json",\n'),
              ('    ROOT / "syntavra_runtime" / "deferred_tool_discovery.py",\n', '    ROOT / "syntavra_runtime" / "deferred_tool_discovery.py",\n    ROOT / "syntavra_runtime" / "context_namespace.py",\n'),
              ('    ROOT / "tests" / "runtime" / "test_deferred_tool_discovery.py",\n', '    ROOT / "tests" / "runtime" / "test_deferred_tool_discovery.py",\n    ROOT / "tests" / "runtime" / "test_context_namespace.py",\n'),
              ('    ROOT / "tools" / "certify_deferred_tool_discovery.py",\n', '    ROOT / "tools" / "certify_deferred_tool_discovery.py",\n    ROOT / "tools" / "certify_context_namespace.py",\n'),
              ('    ROOT / ".github" / "workflows" / "deferred-tool-discovery.yml",\n', '    ROOT / ".github" / "workflows" / "deferred-tool-discovery.yml",\n    ROOT / ".github" / "workflows" / "unified-context-namespace.yml",\n'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new)

          function = '''\n\ndef _context_namespace_check() -> tuple[bool, str]:\n    try:\n        from tools.certify_context_namespace import certify\n\n        report = certify(ROOT)\n        summary = {\n            "claim": report.get("claim"),\n            "exact_head": report.get("exact_head"),\n            "admission_ready": report.get("admission_ready"),\n            "syntavra_scheme": (report.get("runtime") or {}).get("syntavra_scheme"),\n            "progressive_descent": (report.get("runtime") or {}).get("progressive_repo_directory_file_symbol_lines"),\n            "l3_exact_reveal": (report.get("runtime") or {}).get("l3_integrity_checked_exact_reveal"),\n            "trajectory": (report.get("runtime") or {}).get("retrieval_trajectory"),\n            "rust_promoted": (report.get("rust") or {}).get("production_promoted"),\n            "rust_resume_allowed": report.get("rust_resume_allowed"),\n        }\n        return bool(report.get("ok")), json.dumps(summary, sort_keys=True)\n    except Exception as exc:\n        return False, f"{type(exc).__name__}: {exc}"\n'''
          marker = '\n\ndef main() -> int:\n'
          assert text.count(marker) == 1, text.count(marker)
          if 'def _context_namespace_check()' not in text:
              text = text.replace(marker, function + marker)

          old = '    deferred_ok, deferred_detail = _deferred_tool_discovery_check()\n    checks.append(("deferred_tool_discovery", deferred_ok, deferred_detail))\n'
          new = old + '\n    context_namespace_ok, context_namespace_detail = _context_namespace_check()\n    checks.append(("context_namespace", context_namespace_ok, context_namespace_detail))\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          validator.write_text(text, encoding='utf-8')

          checkpoint = root / 'docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt'
          marker = 'APPENDED CURRENT CHECKPOINT — 2026-08-19 — UNIFIED CONTEXT NAMESPACE ACTIVE'
          body = f'''\n\n======================================================================\n{marker}\n======================================================================\n\nCURRENT ADMITTED MAIN:\n89ac2260885a971bbedff113a66071af54804dcf\n\nACTIVE IMPLEMENTATION BRANCH:\nagent/unified-context-namespace-v1\n\nACTIVE PR:\n#143 — Add Unified Context Namespace v1\n\nPYTHON STATUS:\nPYTHON-FIRST ACTIVE — deferred_tool_discovery_v1 is admitted; unified_context_namespace_v1 is the current milestone.\n\nRUST STATUS:\nFEATURE FROZEN AND CI-ENFORCED — implementation coverage 245/245; production promotion 174/245; remaining parity/promotion set 71; Rust resume false.\n\nCURRENT IMPLEMENTATION:\n- resolver-backed syntavra:// unified namespace added over UniversalContextItem authority.\n- canonical repo/evidence/memory/task/tool/artifact/context roots added.\n- progressive repo -> directory -> file -> symbol -> lines addressing added.\n- L0 identity, L1 explanation/trust/freshness, L2 bounded structure, and L3 integrity-checked exact payload views added.\n- payload-free why explanation added.\n- browse/why/reveal retrieval trajectory receipts added with deterministic content-addressed identities.\n- namespace stores no parallel persistent database; canonical payload authority remains resolver/EvidenceStore-backed.\n- no public CLI route added.\n- Deferred Tool Discovery lifecycle state advances to certified on this branch.\n- milestone order is corrected so Multi-Graph Retrieval follows Context Namespace before Adaptive Context Policy.\n\nVERIFIED PRE-ADMISSION BOUNDARY:\n- Context Namespace runtime regression suite exists and is exact-head workflow bound.\n- Context Namespace contract and certifier exist.\n- Python COMPLETE remains false.\n- Rust production promotion remains 174/245 and Rust resume remains false.\n\nBLOCKERS:\n- final enforcement integration and exact-head Context Namespace certificate still required.\n- canonical MANIFEST.sha256 seal still required after permanent tree is frozen.\n- final exact-head load-bearing CI and merge required before admission.\n\nNEXT EXACT TASK:\n- finish enforcement integration without weakening immutable action pins.\n- pass Context Namespace runtime/certifier on exact PR head.\n- seal MANIFEST.sha256 from the permanent tree.\n- pass final Release Main + Package Provenance + Python-first gates.\n- merge, then advance to multi_graph_retrieval_v1.\n'''
          current = checkpoint.read_text(encoding='utf-8')
          if marker not in current:
              checkpoint.write_text(current + body, encoding='utf-8')
          PY

      - name: Verify migrated state and runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_context_namespace -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_deferred_tool_discovery -v
          python tools/certify_python_capability_completeness.py --out /tmp/completeness.json
          python tools/certify_deferred_tool_discovery.py --out /tmp/deferred.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/completeness.json').read_text(encoding='utf-8'))
          assert report['ok'] is True, report
          assert report['current_milestone'] == 'unified_context_namespace_v1', report
          deferred = json.loads(Path('/tmp/deferred.json').read_text(encoding='utf-8'))
          assert deferred['ok'] is True, deferred
          PY
          python -m py_compile tools/validate.py tools/certify_context_namespace.py tools/certify_deferred_tool_discovery.py tools/certify_python_capability_completeness.py
          git diff --check

      - name: Commit migrated normal files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            contracts/python/capability-completeness-registry-v1.json \
            tools/certify_python_capability_completeness.py \
            tools/certify_deferred_tool_discovery.py \
            tools/validate.py \
            docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'migration already applied'
            exit 0
          fi
          git commit -m 'Advance Context Namespace admission state'
          git push origin HEAD:agent/unified-context-namespace-v1
