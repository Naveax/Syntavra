name: Apply R25-R37 Cross-Engine Verifier

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/full-parity-r25-r37-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r25-r37-completion
      - name: Decode verifier
        shell: bash
        run: |
          base64 -d .patches/verify-r25-r37.b64 > tools/verify_r25_r37_full_parity.py
          chmod +x tools/verify_r25_r37_full_parity.py
          python -m py_compile tools/verify_r25_r37_full_parity.py
          rm -f .patches/verify-r25-r37.b64
          rmdir .patches 2>/dev/null || true
          rm -f .github/workflows/apply-r25-r37-verifier.yml
      - name: Commit verifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R25-R37: add cross-engine parity verifier" || exit 0
          git push origin HEAD:feature/full-parity-r25-r37-completion
