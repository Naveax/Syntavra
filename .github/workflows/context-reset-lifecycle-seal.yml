name: Context Reset Lifecycle Seal

on:
  push:
    branches:
      - agent/certify-context-reset-handoff-v1

permissions:
  contents: write

concurrency:
  group: context-reset-lifecycle-seal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seal:
    if: github.actor == 'Naveax'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify sealed certification prerequisites
        shell: bash
        env:
          EXPECTED_PARENT: d6e7c037093ea31607773ec33fd44b7b43fc4902
          EXPECTED_BASE: 9838235404a834cfbc4882ebfb989cf1b40ef42e
          EXPECTED_STAGED_WORKFLOW_SHA256: 0915e2f41166455b730670e0748cffdc60fa7fb173ecaa85add37ea8818ac560
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git cat-file -e "$EXPECTED_BASE^{commit}"
          test "$(sha256sum .github/workflows/context-reset-handoff.yml | awk '{print $1}')" = "$EXPECTED_STAGED_WORKFLOW_SHA256"
          test -f .github/workflows/context-reset-lifecycle-seal.yml

      - name: Materialize final lifecycle seal
        shell: bash
        env:
          EXPECTED_BASE: 9838235404a834cfbc4882ebfb989cf1b40ef42e
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('contracts/python/capability-completeness-registry-v1.json')
          registry = json.loads(path.read_text(encoding='utf-8'))
          row = next(item for item in registry['capabilities'] if item['id'] == 'context_reset_handoff_v1')
          row['state'] = 'certified'
          row['implementation_evidence'] = [
              'syntavra_runtime/session_memory.py',
              'syntavra_runtime/autonomous_agent.py',
              'syntavra_runtime/context_reset_handoff.py',
              'contracts/python/context-reset-handoff-v1.json',
              'tools/certify_context_reset_handoff.py',
              'tests/runtime/test_context_reset_handoff.py',
              '.github/workflows/context-reset-handoff.yml',
          ]
          row['certification_evidence'] = [
              'contracts/python/context-reset-handoff-v1.json',
              'syntavra_runtime/context_reset_handoff.py',
              'tools/certify_context_reset_handoff.py',
              'tests/runtime/test_context_reset_handoff.py',
              '.github/workflows/context-reset-handoff.yml',
          ]
          path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          assert registry['python_complete']['ready'] is False
          assert registry['python_complete']['rust_resume_allowed'] is False
          PY
          git show "$EXPECTED_BASE":.github/workflows/context-reset-handoff.yml > .github/workflows/context-reset-handoff.yml
          git rm .github/workflows/context-reset-lifecycle-seal.yml
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          test "$(sha256sum contracts/python/capability-completeness-registry-v1.json | awk '{print $1}')" = "7b0447d827e1ac6f9d9fc11b5750b0fbf193b2fc41e2808cab09d4fc00b4df09"
          grep -F "7b0447d827e1ac6f9d9fc11b5750b0fbf193b2fc41e2808cab09d4fc00b4df09  contracts/python/capability-completeness-registry-v1.json" MANIFEST.sha256
          git diff --check

      - name: Commit exact final seal
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -F 'MANIFEST.sha256'
          printf '%s\n' "$changed" | grep -F 'contracts/python/capability-completeness-registry-v1.json'
          printf '%s\n' "$changed" | grep -F '.github/workflows/context-reset-handoff.yml'
          printf '%s\n' "$changed" | grep -F '.github/workflows/context-reset-lifecycle-seal.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256 contracts/python/capability-completeness-registry-v1.json .github/workflows/context-reset-handoff.yml
          git commit -m 'Seal Context Reset Handoff lifecycle certification'
          git push origin HEAD:agent/certify-context-reset-handoff-v1
