name: Remaining 71 Memory Intelligence Persist

# Human trigger after workflow registration.
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: remaining71-memory-intelligence-persist
  cancel-in-progress: true

jobs:
  persist:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Reuse exact validated repair patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/remaining71-memory-intelligence-differential.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply memory-intelligence parity repair in workspace'
          start = workflow.index(marker)
          run_line = next(index for index in range(start + 1, len(workflow)) if workflow[index] == '        run: |')
          body = []
          for line in workflow[run_line + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          script = Path('/tmp/apply-memory-intelligence-repair.py')
          script.write_text('\n'.join(body) + '\n', encoding='utf-8')
          subprocess.run(['python', str(script)], check=True)
      - name: Reprove repaired source
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 test --locked -p syntavra-cli python_casefold_matches_sharp_s_expansion -- --exact
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
          python tools/validate_remaining71_memory_intelligence_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/memory-intelligence-differential.json
          python tools/validate_remaining71_session_memory_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/session-memory-differential.json
          git diff --check
      - name: Persist only validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/syntavra-cli/src/native_remaining71_memory.rs crates/syntavra-cli/src/native_python_casefold.rs
          if git diff --cached --quiet; then
            echo "validated source already persisted"
          else
            git commit -m "Fix native memory intelligence parity"
            git push origin HEAD:agent/r31-provider-capture-native
          fi
      - name: Require clean tree
        run: test -z "$(git status --porcelain --untracked-files=all)"
