name: Refresh R38 Generated Metadata

on:
  push:
    branches: ["agent/full-dual-engine-runtime"]
    paths:
      - ".github/workflows/r38-refresh-branch-manifest.yml"
      - ".github/workflows/r38-dual-engine-runtime.yml"
      - ".github/workflows/validate-fusion-runtime.yml"
      - "contracts/engine/dual-engine-public-surface-v2.json"
      - "crates/syntavra-cli/src/bin/syntavra.rs"
      - "crates/syntavra-cli/src/native_cache_amortize.rs"
      - "crates/syntavra-cli/src/native_context_stress.rs"
      - "crates/syntavra-cli/src/native_mode.rs"
      - "crates/syntavra-cli/src/native_product.rs"
      - "crates/syntavra-cli/src/native_proof_status.rs"
      - "crates/syntavra-cli/src/native_prove_plan.rs"
      - "crates/syntavra-cli/src/native_proxy_plan.rs"
      - "crates/syntavra-cli/src/native_read_only_product.rs"
      - "crates/syntavra-cli/src/native_redact.rs"
      - "crates/syntavra-cli/src/native_statusline.rs"
      - "crates/syntavra-cli/src/native_wire.rs"
      - "crates/syntavra-cli/src/native_wrap.rs"
      - "syntavra_runtime/engine_entry.py"
      - "tests/runtime/test_dual_engine_public_surface_r38.py"
      - "tests/runtime/test_native_mode_r38.py"
      - "tests/runtime/test_native_proxy_plan_r38.py"
      - "tests/runtime/test_native_redact_r38.py"
      - "tests/runtime/test_native_wire_r38.py"
      - "tests/runtime/test_native_wrap_r38.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r38-generated-metadata-25-wrap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dual-engine-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Synchronize R38 inventory assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/runtime/test_dual_engine_public_surface_r38.py")
          text = path.read_text(encoding="utf-8")
          count_candidates = [
              'assert result["rust"]["native_public_command_count"] == 20',
              'assert result["rust"]["native_public_command_count"] == 21',
              'assert result["rust"]["native_public_command_count"] == 22',
              'assert result["rust"]["native_public_command_count"] == 23',
              'assert result["rust"]["native_public_command_count"] == 24',
              'assert result["rust"]["native_public_command_count"] == 25',
          ]
          missing_candidates = [
              'assert result["rust"]["missing_native_public_command_count"] == 237',
              'assert result["rust"]["missing_native_public_command_count"] == 236',
              'assert result["rust"]["missing_native_public_command_count"] == 235',
              'assert result["rust"]["missing_native_public_command_count"] == 234',
              'assert result["rust"]["missing_native_public_command_count"] == 233',
              'assert result["rust"]["missing_native_public_command_count"] == 232',
          ]
          count_matches = [candidate for candidate in count_candidates if candidate in text]
          missing_matches = [candidate for candidate in missing_candidates if candidate in text]
          assert len(count_matches) == 1, count_matches
          assert len(missing_matches) == 1, missing_matches
          text = text.replace(
              count_matches[0],
              'assert result["rust"]["native_public_command_count"] == 25',
          )
          text = text.replace(
              missing_matches[0],
              'assert result["rust"]["missing_native_public_command_count"] == 232',
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Synchronize native command metadata
        run: python tools/sync_r38_native_command_count.py
      - name: Refresh deterministic root manifest
        run: python tools/refresh_manifest.py
      - name: Validate generated scope
        run: |
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          allowed = {
              "MANIFEST.sha256",
              "crates/syntavra-cli/src/bin/syntavra.rs",
              "crates/syntavra-cli/src/native_cache_amortize.rs",
              "crates/syntavra-cli/src/native_context_stress.rs",
              "crates/syntavra-cli/src/native_mode.rs",
              "crates/syntavra-cli/src/native_product.rs",
              "crates/syntavra-cli/src/native_proof_status.rs",
              "crates/syntavra-cli/src/native_prove_plan.rs",
              "crates/syntavra-cli/src/native_proxy_plan.rs",
              "crates/syntavra-cli/src/native_read_only_product.rs",
              "crates/syntavra-cli/src/native_redact.rs",
              "crates/syntavra-cli/src/native_statusline.rs",
              "crates/syntavra-cli/src/native_wire.rs",
              "crates/syntavra-cli/src/native_wrap.rs",
              "tests/runtime/test_dual_engine_public_surface_r38.py",
          }
          assert changed <= allowed, changed
          assert "MANIFEST.sha256" in changed, changed
          assert "crates/syntavra-cli/src/bin/syntavra.rs" in changed, changed
          assert "tests/runtime/test_dual_engine_public_surface_r38.py" in changed, changed
          PY
      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/native_cache_amortize.rs \
            crates/syntavra-cli/src/native_context_stress.rs \
            crates/syntavra-cli/src/native_mode.rs \
            crates/syntavra-cli/src/native_product.rs \
            crates/syntavra-cli/src/native_proof_status.rs \
            crates/syntavra-cli/src/native_prove_plan.rs \
            crates/syntavra-cli/src/native_proxy_plan.rs \
            crates/syntavra-cli/src/native_read_only_product.rs \
            crates/syntavra-cli/src/native_redact.rs \
            crates/syntavra-cli/src/native_statusline.rs \
            crates/syntavra-cli/src/native_wire.rs \
            crates/syntavra-cli/src/native_wrap.rs \
            tests/runtime/test_dual_engine_public_surface_r38.py
          git commit -m "R38: synchronize wrapper coverage metadata"
          git push origin HEAD:agent/full-dual-engine-runtime
