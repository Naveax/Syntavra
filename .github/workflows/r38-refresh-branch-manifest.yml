name: Refresh R38 Generated Metadata

on:
  push:
    branches: ["agent/full-dual-engine-runtime"]
    paths:
      - ".github/workflows/r38-refresh-branch-manifest.yml"
      - ".github/workflows/validate-fusion-runtime.yml"
      - "contracts/engine/dual-engine-public-surface-v2.json"
      - "crates/syntavra-cli/src/bin/syntavra.rs"
      - "crates/syntavra-cli/src/native_product.rs"
      - "crates/syntavra-cli/src/native_prove_plan.rs"
      - "tests/runtime/test_dual_engine_public_surface_r38.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r38-generated-metadata-17-selector-fix
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dual-engine-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Repair selector management error propagation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/syntavra-cli/src/bin/syntavra.rs")
          text = path.read_text(encoding="utf-8")
          old = '''fn engine_command(parsed: &Parsed) -> Option<Result<Value, String>> {
              if parsed.forwarded.first().map(String::as_str) != Some("engine") {
                  return None;
              }
              let action = parsed.forwarded.get(1).map(String::as_str).unwrap_or("status");
              Some(match action {
                  "status" | "list" => Ok(engine_status(parsed)),
                  "verify" => {
                      let engine = parsed
                          .forwarded
                          .get(2)
                          .ok_or_else(|| "ENGINE_VERIFY_MISSING_ENGINE".to_owned())
                          .and_then(|value| Engine::parse(value))?;
                      Ok(verify_engine(engine))
                  }
                  "use" => {
                      let engine = parsed
                          .forwarded
                          .get(2)
                          .ok_or_else(|| "ENGINE_USE_MISSING_ENGINE".to_owned())
                          .and_then(|value| Engine::parse(value))?;
                      let scope = parsed
                          .forwarded
                          .iter()
                          .position(|value| value == "--scope")
                          .and_then(|index| parsed.forwarded.get(index + 1))
                          .map(String::as_str)
                          .unwrap_or("project");
                      use_engine(parsed, scope, engine)
                  }
                  _ => Err("ENGINE_MANAGEMENT_ACTION_INVALID".to_owned()),
              })
          }
          '''
          new = '''fn engine_command(parsed: &Parsed) -> Option<Result<Value, String>> {
              if parsed.forwarded.first().map(String::as_str) != Some("engine") {
                  return None;
              }
              let action = parsed.forwarded.get(1).map(String::as_str).unwrap_or("status");
              let result = match action {
                  "status" | "list" => Ok(engine_status(parsed)),
                  "verify" => parsed
                      .forwarded
                      .get(2)
                      .ok_or_else(|| "ENGINE_VERIFY_MISSING_ENGINE".to_owned())
                      .and_then(|value| Engine::parse(value))
                      .map(verify_engine),
                  "use" => {
                      let scope = parsed
                          .forwarded
                          .iter()
                          .position(|value| value == "--scope")
                          .and_then(|index| parsed.forwarded.get(index + 1))
                          .map(String::as_str)
                          .unwrap_or("project");
                      parsed
                          .forwarded
                          .get(2)
                          .ok_or_else(|| "ENGINE_USE_MISSING_ENGINE".to_owned())
                          .and_then(|value| Engine::parse(value))
                          .and_then(|engine| use_engine(parsed, scope, engine))
                  }
                  _ => Err("ENGINE_MANAGEMENT_ACTION_INVALID".to_owned()),
              };
              Some(result)
          }
          '''
          old_count = text.count(old)
          new_count = text.count(new)
          assert (old_count, new_count) in {(1, 0), (0, 1)}, (old_count, new_count)
          if old_count == 1:
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
      - name: Synchronize native command metadata
        run: python tools/sync_r38_native_command_count.py
      - name: Refresh deterministic root manifest
        run: python tools/refresh_manifest.py
      - name: Validate isolated generated changes
        run: |
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          allowed = {
              "MANIFEST.sha256",
              "crates/syntavra-cli/src/bin/syntavra.rs",
          }
          assert changed <= allowed, changed
          PY
      - name: Commit refreshed generated metadata
        run: |
          if git diff --quiet; then
            echo "Generated metadata already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 crates/syntavra-cli/src/bin/syntavra.rs
          git commit -m "fix: preserve selector management errors"
          git push origin HEAD:agent/full-dual-engine-runtime
