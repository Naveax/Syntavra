name: Refresh R38 Generated Files

on:
  push:
    branches: ["agent/full-dual-engine-runtime"]
    paths:
      - ".github/workflows/r38-refresh-branch-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r38-refresh-branch-manifest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dual-engine-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Normalize strict-Clippy source structure
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/syntavra-cli/src/native_product.rs')
          source = path.read_text(encoding='utf-8')

          def normalize(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count > 1:
                  raise SystemExit(f'normalization pattern duplicated: {old!r}')
              if count == 1:
                  source = source.replace(old, new, 1)
              elif new and new not in source:
                  raise SystemExit(f'normalization target missing: {new!r}')

          normalize('        "simple" => 0,\n', '')
          normalize('"context_window": 200000', '"context_window": 200_000')
          normalize('"context_window": 64000', '"context_window": 64_000')
          path.write_text(source, encoding='utf-8', newline='\n')
          PY
      - name: Format native Rust sources
        run: cargo fmt --all
      - name: Synchronize native command metadata
        run: python tools/sync_r38_native_command_count.py
      - name: Refresh deterministic root manifest
        run: python tools/refresh_manifest.py
      - name: Validate isolated generated changes
        run: |
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          allowed = {
              'MANIFEST.sha256',
              'crates/syntavra-cli/src/bin/syntavra.rs',
              'crates/syntavra-cli/src/native_product.rs',
          }
          assert changed <= allowed, changed
          assert 'MANIFEST.sha256' in changed, changed
          PY
      - name: Commit refreshed generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 crates/syntavra-cli/src/bin/syntavra.rs crates/syntavra-cli/src/native_product.rs
          git commit -m "chore: normalize and sync R38 generated files"
          git push origin HEAD:agent/full-dual-engine-runtime
