name: Refresh R38 Generated Metadata

on:
  push:
    branches: ["agent/full-dual-engine-runtime"]
    paths:
      - ".github/workflows/r38-refresh-branch-manifest.yml"
      - ".github/workflows/validate-fusion-runtime.yml"
      - "contracts/engine/dual-engine-public-surface-v2.json"
      - "crates/syntavra-cli/src/bin/syntavra.rs"
      - "crates/syntavra-cli/src/native_cache_amortize.rs"
      - "crates/syntavra-cli/src/native_product.rs"
      - "crates/syntavra-cli/src/native_prove_plan.rs"
      - "tests/runtime/test_dual_engine_public_surface_r38.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r38-generated-metadata-17-strict-clippy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dual-engine-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Repair selector strict-Clippy findings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/syntavra-cli/src/bin/syntavra.rs")
          text = path.read_text(encoding="utf-8")

          rust_start = "fn discover_rust_program() -> Option<Program> {"
          python_start = "fn discover_python_program() -> Option<Program> {"
          if rust_start in text:
              start = text.index(rust_start)
              end = text.index(python_start, start)
              text = text[:start] + text[end:]

          replacements = [
              (
                  '''    let available = match engine {
                      Engine::Python => discover_python_program().is_some(),
                      Engine::Rust => true,
                      Engine::Auto => discover_python_program().is_some(),
                  };''',
                  '''    let available = match engine {
                      Engine::Auto | Engine::Python => discover_python_program().is_some(),
                      Engine::Rust => true,
                  };''',
              ),
              (
                  '''    let action = parsed
                      .forwarded
                      .get(1)
                      .map(String::as_str)
                      .unwrap_or("status");''',
                  '''    let action = parsed.forwarded.get(1).map_or("status", String::as_str);''',
              ),
              (
                  '''            let scope = parsed
                          .forwarded
                          .iter()
                          .position(|value| value == "--scope")
                          .and_then(|index| parsed.forwarded.get(index + 1))
                          .map(String::as_str)
                          .unwrap_or("project");''',
                  '''            let scope = parsed
                          .forwarded
                          .iter()
                          .position(|value| value == "--scope")
                          .and_then(|index| parsed.forwarded.get(index + 1))
                          .map_or("project", String::as_str);''',
              ),
              (
                  '''    Ok(ExitCode::from(status.code().unwrap_or(1) as u8))''',
                  '''    let code = status
                      .code()
                      .and_then(|value| u8::try_from(value).ok())
                      .unwrap_or(1);
                  Ok(ExitCode::from(code))''',
              ),
          ]
          for old, new in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              assert (old_count, new_count) in {(1, 0), (0, 1)}, (old_count, new_count, old)
              if old_count == 1:
                  text = text.replace(old, new)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Synchronize native command metadata
        run: python tools/sync_r38_native_command_count.py
      - name: Refresh deterministic root manifest
        run: python tools/refresh_manifest.py
      - name: Validate isolated generated changes
        run: |
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          allowed = {
              "MANIFEST.sha256",
              "crates/syntavra-cli/src/bin/syntavra.rs",
              "crates/syntavra-cli/src/native_cache_amortize.rs",
              "crates/syntavra-cli/src/native_product.rs",
              "crates/syntavra-cli/src/native_prove_plan.rs",
          }
          assert changed <= allowed, changed
          PY
      - name: Commit refreshed generated metadata
        run: |
          if git diff --quiet; then
            echo "Generated metadata already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/native_cache_amortize.rs \
            crates/syntavra-cli/src/native_product.rs \
            crates/syntavra-cli/src/native_prove_plan.rs
          git commit -m "fix: satisfy strict Clippy for native-17"
          git push origin HEAD:agent/full-dual-engine-runtime
