# Canonical formatter, inventory and manifest synchronization for the active R38 branch.
# Every independently implemented native command slice is synchronized from the contract inventory.
# The current refresh seals the receipts, benchmark and readiness native proof slice.
name: Refresh R38 Generated Metadata

on:
  push:
    branches: ["agent/full-dual-engine-runtime"]
    paths:
      - ".github/workflows/r38-refresh-branch-manifest.yml"
      - ".github/workflows/r38-dual-engine-runtime.yml"
      - ".github/workflows/validate-fusion-runtime.yml"
      - "contracts/engine/dual-engine-public-surface-v2.json"
      - "crates/syntavra-cli/src/bin/syntavra.rs"
      - "crates/syntavra-cli/src/native_*.rs"
      - "syntavra_runtime/engine_entry.py"
      - "syntavra_runtime/prerelease_cli.py"
      - "tools/export_python_surface.py"
      - "tools/export_rust_surface.py"
      - "tools/sync_r38_native_command_count.py"
      - "tests/runtime/test_dual_engine_public_surface_r38.py"
      - "tests/runtime/test_native_*_r38.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r38-generated-metadata-current
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dual-engine-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Normalize external-suite numeric helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/syntavra-cli/src/native_external_suite_gate.rs")
          text = path.read_text(encoding="utf-8")
          helper = (
              "\nfn integer_as_f64(value: i64) -> f64 {\n"
              "    value.to_string().parse::<f64>().unwrap_or(0.0)\n"
              "}\n"
          )
          count = text.count(helper)
          if count == 2:
              first = text.find(helper)
              second = text.find(helper, first + len(helper))
              text = text[:second] + text[second + len(helper):]
              path.write_text(text, encoding="utf-8")
          elif count != 1:
              raise SystemExit(f"unexpected integer_as_f64 definition count: {count}")
          PY
      - name: Normalize proof evidence bool conversion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/syntavra-cli/src/native_proof_evidence.rs")
          text = path.read_text(encoding="utf-8")
          before = ".or_else(|| item.as_bool().map(|flag| if flag { 1 } else { 0 }))"
          after = ".or_else(|| item.as_bool().map(i64::from))"
          count = text.count(before)
          if count == 1:
              path.write_text(text.replace(before, after, 1), encoding="utf-8")
          elif count == 0 and text.count(after) == 1:
              pass
          else:
              raise SystemExit(f"unexpected bool conversion state: before={count}, after={text.count(after)}")
          PY
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Synchronize complete R38 surface metadata
        run: python tools/sync_r38_native_command_count.py
      - name: Refresh deterministic root manifest
        run: python tools/refresh_manifest.py
      - name: Validate generated scope
        run: |
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          fixed = {
              "MANIFEST.sha256",
              "contracts/engine/dual-engine-public-surface-v2.json",
              "crates/syntavra-cli/src/bin/syntavra.rs",
              "tests/runtime/test_dual_engine_public_surface_r38.py",
              "tests/runtime/test_native_redact_r38.py",
          }
          unexpected = {
              path
              for path in changed
              if path not in fixed
              and not (
                  path.startswith("crates/syntavra-cli/src/native_")
                  and path.endswith(".rs")
              )
          }
          assert not unexpected, unexpected
          assert "MANIFEST.sha256" in changed, changed
          PY
      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 \
            contracts/engine/dual-engine-public-surface-v2.json \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/native_*.rs \
            tests/runtime/test_dual_engine_public_surface_r38.py \
            tests/runtime/test_native_redact_r38.py
          git diff --cached --quiet && exit 0
          git commit -m "R38: synchronize complete surface metadata"
          git push origin HEAD:agent/full-dual-engine-runtime
