name: Wire R38 Native Route

on:
  push:
    branches: ["agent/full-dual-engine-runtime"]
    paths:
      - ".github/workflows/r38-refresh-branch-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r38-wire-native-route-16-final
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dual-engine-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Wire route policy and differential tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count > 1:
                  raise SystemExit(f"{label} pattern duplicated")
              if count == 1:
                  return source.replace(old, new, 1)
              if new not in source:
                  raise SystemExit(f"{label} target missing")
              return source

          selector_path = Path("crates/syntavra-cli/src/bin/syntavra.rs")
          selector = selector_path.read_text(encoding="utf-8")
          selector = replace_once(
              selector,
              '#[path = "../native_product.rs"]\nmod native_product;\n',
              '#[path = "../native_product.rs"]\nmod native_product;\n#[path = "../native_route.rs"]\nmod native_route;\n',
              "native route module",
          )
          selector = replace_once(
              selector,
              '    (tokens.len() == 2 && tokens[0] == "run" && tokens[1] == "cache-amortize")\n        || native_product::supports(&tokens)\n',
              '    (tokens.len() == 2 && tokens[0] == "run" && tokens[1] == "cache-amortize")\n        || (tokens.len() == 2 && tokens[0] == "run" && tokens[1] == "route")\n        || native_product::supports(&tokens)\n',
              "route availability",
          )
          selector = replace_once(
              selector,
              'fn run_rust(parsed: &Parsed) -> Result<ExitCode, String> {\n    if let Some(value) = direct_rust_result(parsed)? {\n',
              'fn run_rust(parsed: &Parsed) -> Result<ExitCode, String> {\n    let tokens = command_tokens(&parsed.forwarded);\n    if tokens.len() == 2 && tokens[0] == "run" && tokens[1] == "route" {\n        let decision = native_route::execute(&parsed.forwarded)?;\n        emit(&decision.value);\n        return Ok(ExitCode::from(decision.exit_code));\n    }\n    if let Some(value) = direct_rust_result(parsed)? {\n',
              "route execution",
          )
          selector_path.write_text(selector, encoding="utf-8", newline="\n")

          test_path = Path("tests/runtime/test_dual_engine_public_surface_r38.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              'assert result["rust"]["native_public_command_count"] == 15',
              'assert result["rust"]["native_public_command_count"] == 16',
              "native command count",
          )
          tests = replace_once(
              tests,
              'assert result["rust"]["missing_native_public_command_count"] == 242',
              'assert result["rust"]["missing_native_public_command_count"] == 241',
              "missing command count",
          )
          route_tests = '''


def test_native_read_route_matches_python_exactly() -> None:
    arguments = ("run", "route", "syntavra.output.search")
    assert _rust_engine(*arguments) == _python_engine(*arguments)


def test_native_denied_route_matches_python_output_and_exit_code() -> None:
    if shutil.which("cargo") is None:
        pytest.skip("Cargo is required for the real Rust binary differential")
    arguments = ("run", "route", "host.shell", "--profile", "audit")
    python_result = subprocess.run(
        [
            sys.executable,
            "-m",
            "syntavra_runtime.engine_entry",
            "--engine",
            "python",
            *arguments,
        ],
        cwd=ROOT,
        check=False,
        capture_output=True,
        text=True,
        timeout=180,
    )
    rust_result = subprocess.run(
        [
            "cargo",
            "run",
            "--quiet",
            "--locked",
            "--bin",
            "syntavra",
            "--",
            "--engine",
            "rust",
            *arguments,
        ],
        cwd=ROOT,
        check=False,
        capture_output=True,
        text=True,
        timeout=180,
    )
    assert python_result.returncode == 5, python_result.stderr
    assert rust_result.returncode == 5, rust_result.stderr
    assert json.loads(rust_result.stdout) == json.loads(python_result.stdout)
'''
          if "def test_native_read_route_matches_python_exactly()" not in tests:
              tests = tests.rstrip() + route_tests
          test_path.write_text(tests, encoding="utf-8", newline="\n")
          PY
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Synchronize native command metadata
        run: python tools/sync_r38_native_command_count.py
      - name: Refresh deterministic root manifest
        run: python tools/refresh_manifest.py
      - name: Validate isolated changes
        run: |
          python - <<'PY'
          import subprocess
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          allowed = {
              "MANIFEST.sha256",
              "crates/syntavra-cli/src/bin/syntavra.rs",
              "crates/syntavra-cli/src/native_route.rs",
              "tests/runtime/test_dual_engine_public_surface_r38.py",
          }
          assert changed <= allowed, changed
          assert "MANIFEST.sha256" in changed, changed
          assert "crates/syntavra-cli/src/bin/syntavra.rs" in changed, changed
          assert "tests/runtime/test_dual_engine_public_surface_r38.py" in changed, changed
          PY
      - name: Commit native route wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/native_route.rs \
            tests/runtime/test_dual_engine_public_surface_r38.py
          git commit -m "feat(r38): wire native route policy and exit parity"
          git push origin HEAD:agent/full-dual-engine-runtime
