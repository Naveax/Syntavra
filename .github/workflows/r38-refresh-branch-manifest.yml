# Verification-only generated metadata gate for the active R38 branch.
# Normal pull-request runs never create bot-authored branch heads. A same-repo
# PR may opt into one atomic refresh by committing .github/r38-manifest-refresh;
# the marker is removed before the manifest is generated and in the same commit.
name: Verify R38 Generated Metadata

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/r38-manifest-refresh"
      - ".github/workflows/r38-refresh-branch-manifest.yml"
      - ".github/workflows/r38-dual-engine-runtime.yml"
      - "MANIFEST.sha256"
      - "contracts/engine/dual-engine-public-surface-v2.json"
      - "contracts/engine/r38-missing-native-commands-v1.json"
      - "crates/syntavra-cli/src/bin/syntavra.rs"
      - "crates/syntavra-cli/src/native_*.rs"
      - "crates/syntavra-cli/src/state_layout_contract.rs"
      - "syntavra_runtime/engine_entry.py"
      - "syntavra_runtime/prerelease_cli.py"
      - "tools/export_python_surface.py"
      - "tools/export_rust_surface.py"
      - "tools/refresh_manifest.py"
      - "tools/repair_r38_rust_sources.py"
      - "tools/sync_r38_generated_metadata.py"
      - "tools/sync_r38_native_command_count.py"
      - "tests/runtime/test_dual_engine_public_surface_r38.py"
      - "tests/runtime/test_native_*_r38.py"
      - "tests/runtime/test_r38_generated_metadata_sync.py"
      - "tests/runtime/test_r38_rust_source_repairs.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r38-generated-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Verify repair and metadata idempotence
        run: |
          python -m pytest -q \
            tests/runtime/test_r38_rust_source_repairs.py \
            tests/runtime/test_r38_generated_metadata_sync.py
      - name: Reproduce canonical generated state
        run: |
          python tools/repair_r38_rust_sources.py
          python tools/sync_r38_generated_metadata.py
          cargo fmt --all
          python tools/repair_r38_rust_sources.py
          python tools/sync_r38_generated_metadata.py
          python tools/refresh_manifest.py
      - name: Validate generated contract consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("contracts/engine/dual-engine-public-surface-v2.json").read_text(encoding="utf-8"))
          missing = json.loads(Path("contracts/engine/r38-missing-native-commands-v1.json").read_text(encoding="utf-8"))
          rust = contract["rust_surface"]
          python_count = contract["python_surface"]["public_command_count"]

          assert missing["python_public_command_count"] == python_count
          assert missing["native_public_command_count"] == rust["native_public_command_count"]
          assert missing["missing_native_public_command_count"] == rust["missing_native_public_command_count"]
          assert len(missing["missing_native_public_commands"]) == rust["missing_native_public_command_count"]
          assert rust["native_public_command_count"] + rust["missing_native_public_command_count"] == python_count
          assert rust["python_launcher_bridge_command_count"] == 0
          assert missing["python_launcher_bridge_command_count"] == 0
          assert Path("MANIFEST.sha256").is_file()
          PY
      - name: Reject stale canonical files
        if: ${{ hashFiles('.github/r38-manifest-refresh') == '' }}
        shell: bash
        run: |
          set +e
          git diff --exit-code -- \
            MANIFEST.sha256 \
            contracts/engine/dual-engine-public-surface-v2.json \
            contracts/engine/r38-missing-native-commands-v1.json \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/native_*.rs \
            crates/syntavra-cli/src/state_layout_contract.rs \
            tests/runtime/test_dual_engine_public_surface_r38.py
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "R38 canonical sources or metadata are stale. Run repair, synchronizer, formatter and manifest refresh, then commit all changes together."
            exit "$code"
          fi

  refresh-when-marked:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect one-shot refresh marker
        id: marker
        shell: bash
        run: |
          if [ -f .github/r38-manifest-refresh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.marker.outputs.present == 'true'
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        if: steps.marker.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check -e .
      - uses: dtolnay/rust-toolchain@1.82.0
        if: steps.marker.outputs.present == 'true'
        with:
          components: rustfmt
      - name: Generate canonical sources, metadata and manifest
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          python tools/repair_r38_rust_sources.py
          python tools/sync_r38_generated_metadata.py
          cargo fmt --all
          python tools/repair_r38_rust_sources.py
          python tools/sync_r38_generated_metadata.py
          rm .github/r38-manifest-refresh
          python tools/refresh_manifest.py
          test ! -e .github/r38-manifest-refresh
          ! grep -q '  .github/r38-manifest-refresh$' MANIFEST.sha256
      - name: Commit one-shot canonical refresh
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/r38-manifest-refresh \
            MANIFEST.sha256 \
            contracts/engine/dual-engine-public-surface-v2.json \
            contracts/engine/r38-missing-native-commands-v1.json \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/native_benchmark_tools.rs \
            crates/syntavra-cli/src/native_engine_routes.rs \
            crates/syntavra-cli/src/native_job_mutations.rs \
            crates/syntavra-cli/src/native_product.rs \
            crates/syntavra-cli/src/native_structural.rs \
            crates/syntavra-cli/src/native_verifier.rs \
            crates/syntavra-cli/src/state_layout_contract.rs \
            crates/syntavra-cli/src/native_*.rs \
            tests/runtime/test_dual_engine_public_surface_r38.py
          git diff --cached --quiet && exit 0
          git commit -m "R38: commit canonical generated state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
