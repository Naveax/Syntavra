name: Refresh R38 Generated Metadata

on:
  push:
    branches: ["agent/full-dual-engine-runtime"]
    paths:
      - ".github/workflows/r38-refresh-branch-manifest.yml"
      - ".github/workflows/r38-dual-engine-runtime.yml"
      - ".github/workflows/validate-fusion-runtime.yml"
      - "contracts/engine/dual-engine-public-surface-v2.json"
      - "crates/syntavra-cli/src/bin/syntavra.rs"
      - "crates/syntavra-cli/src/native_*.rs"
      - "syntavra_runtime/engine_entry.py"
      - "tests/runtime/test_dual_engine_public_surface_r38.py"
      - "tests/runtime/test_native_*_r38.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r38-generated-metadata-current
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dual-engine-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Synchronize R38 inventory assertions
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          contract = json.loads(
              Path("contracts/engine/dual-engine-public-surface-v2.json").read_text(encoding="utf-8")
          )
          expected = int(contract["rust_surface"]["native_public_command_count"])
          missing = int(contract["rust_surface"]["missing_native_public_command_count"])
          path = Path("tests/runtime/test_dual_engine_public_surface_r38.py")
          text = path.read_text(encoding="utf-8")
          text, count_changes = re.subn(
              r'assert result\["rust"\]\["native_public_command_count"\] == [0-9]+',
              f'assert result["rust"]["native_public_command_count"] == {expected}',
              text,
              count=1,
          )
          text, missing_changes = re.subn(
              r'assert result\["rust"\]\["missing_native_public_command_count"\] == [0-9]+',
              f'assert result["rust"]["missing_native_public_command_count"] == {missing}',
              text,
              count=1,
          )
          assert count_changes == 1, count_changes
          assert missing_changes == 1, missing_changes
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Synchronize native command metadata
        run: python tools/sync_r38_native_command_count.py
      - name: Refresh deterministic root manifest
        run: python tools/refresh_manifest.py
      - name: Validate generated scope
        run: |
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          fixed = {
              "MANIFEST.sha256",
              "crates/syntavra-cli/src/bin/syntavra.rs",
              "tests/runtime/test_dual_engine_public_surface_r38.py",
          }
          unexpected = {
              path
              for path in changed
              if path not in fixed
              and not (
                  path.startswith("crates/syntavra-cli/src/native_")
                  and path.endswith(".rs")
              )
          }
          assert not unexpected, unexpected
          assert "MANIFEST.sha256" in changed, changed
          PY
      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/native_*.rs \
            tests/runtime/test_dual_engine_public_surface_r38.py
          git diff --cached --quiet && exit 0
          git commit -m "R38: synchronize current native coverage metadata"
          git push origin HEAD:agent/full-dual-engine-runtime
