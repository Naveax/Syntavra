name: Refresh R38 Generated Files

on:
  push:
    branches: ["agent/full-dual-engine-runtime"]
    paths:
      - ".github/workflows/r38-refresh-branch-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r38-finalize-native-15-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dual-engine-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Normalize native command sources and parity tests
        run: |
          python - <<'PY'
          from pathlib import Path

          native_path = Path('crates/syntavra-cli/src/native_product.rs')
          native = native_path.read_text(encoding='utf-8')

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count > 1:
                  raise SystemExit(f'{label} pattern duplicated')
              if count == 1:
                  return source.replace(old, new, 1)
              if new not in source:
                  raise SystemExit(f'{label} target missing')
              return source

          native = replace_once(
              native,
              'use syntavra_core::sha256_hex;\n\n',
              'use syntavra_core::sha256_hex;\n\n#[path = "native_delegate.rs"]\nmod native_delegate;\n\n',
              'delegate module',
          )
          native = replace_once(
              native,
              'matches!(command[1].as_str(), "cache-health" | "provider-route")',
              'matches!(\n            command[1].as_str(),\n            "cache-health" | "delegate" | "provider-route"\n        )',
              'delegate support',
          )
          native = replace_once(
              native,
              '        "cache-health" => cache_health(state_root).map(Some),\n        "provider-route" => {',
              '        "cache-health" => cache_health(state_root).map(Some),\n        "delegate" => {\n            let arguments = env::args().skip(1).collect::<Vec<_>>();\n            native_delegate::execute(&arguments).map(Some)\n        }\n        "provider-route" => {',
              'delegate execution',
          )
          native = replace_once(native, '        "simple" => 0,\n', '', 'simple match arm')
          native = replace_once(
              native,
              '"context_window": 200000',
              '"context_window": 200_000',
              'large context literal',
          )
          native = replace_once(
              native,
              '"context_window": 64000',
              '"context_window": 64_000',
              'small context literal',
          )
          native_path.write_text(native, encoding='utf-8', newline='\n')

          test_path = Path('tests/runtime/test_dual_engine_public_surface_r38.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              'assert result["rust"]["native_public_command_count"] == 14',
              'assert result["rust"]["native_public_command_count"] == 15',
              'native command count',
          )
          tests = replace_once(
              tests,
              'assert result["rust"]["missing_native_public_command_count"] == 243',
              'assert result["rust"]["missing_native_public_command_count"] == 242',
              'missing command count',
          )
          delegate_tests = '''


def test_native_delegate_matches_python_exactly() -> None:
    arguments = (
        "run",
        "delegate",
        "Implement the API layer. Verify coverage and benchmark results. Audit security permissions. Update database migration and memory index.",
        "--context-path",
        "src/lib.rs",
        "--context-path",
        "tests/runtime",
        "--max-tasks",
        "4",
    )
    assert _rust_engine(*arguments) == _python_engine(*arguments)


def test_native_delegate_small_task_matches_python_exactly() -> None:
    arguments = ("run", "delegate", "Rename the variable carefully.")
    assert _rust_engine(*arguments) == _python_engine(*arguments)
'''
          if 'def test_native_delegate_matches_python_exactly()' not in tests:
              tests = tests.rstrip() + delegate_tests
          test_path.write_text(tests, encoding='utf-8', newline='\n')
          PY
      - name: Format native Rust sources
        run: cargo fmt --all
      - name: Synchronize native command metadata
        run: python tools/sync_r38_native_command_count.py
      - name: Refresh deterministic root manifest
        run: python tools/refresh_manifest.py
      - name: Validate isolated generated changes
        run: |
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          allowed = {
              'MANIFEST.sha256',
              'crates/syntavra-cli/src/bin/syntavra.rs',
              'crates/syntavra-cli/src/native_delegate.rs',
              'crates/syntavra-cli/src/native_product.rs',
              'tests/runtime/test_dual_engine_public_surface_r38.py',
          }
          assert changed <= allowed, changed
          assert 'MANIFEST.sha256' in changed, changed
          PY
      - name: Commit refreshed generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/native_delegate.rs \
            crates/syntavra-cli/src/native_product.rs \
            tests/runtime/test_dual_engine_public_surface_r38.py
          git commit -m "chore: finalize native delegate generated metadata"
          git push origin HEAD:agent/full-dual-engine-runtime
