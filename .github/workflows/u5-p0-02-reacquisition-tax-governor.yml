name: U5-P0-02 Reacquisition Tax Governor

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'syntavra_runtime/context_governor.py'
      - 'syntavra_runtime/reacquisition_tax.py'
      - 'syntavra_runtime/adaptive_context_policy.py'
      - 'syntavra_runtime/context_decision_trace.py'
      - 'tests/runtime/test_reacquisition_tax_governor.py'
      - 'contracts/python/u5-p0-02-reacquisition-tax-governor-v1.json'
      - 'tools/validate_u5_p0_02_reacquisition_tax_governor.py'
      - 'docs/U5_P0_02_REACQUISITION_TAX_GOVERNOR.md'
      - '.github/workflows/u5-p0-02-reacquisition-tax-governor.yml'
  push:
    branches:
      - main
    paths:
      - 'syntavra_runtime/context_governor.py'
      - 'syntavra_runtime/reacquisition_tax.py'
      - 'syntavra_runtime/adaptive_context_policy.py'
      - 'syntavra_runtime/context_decision_trace.py'
      - 'tests/runtime/test_reacquisition_tax_governor.py'
      - 'contracts/python/u5-p0-02-reacquisition-tax-governor-v1.json'
      - 'tools/validate_u5_p0_02_reacquisition_tax_governor.py'
      - 'docs/U5_P0_02_REACQUISITION_TAX_GOVERNOR.md'
      - '.github/workflows/u5-p0-02-reacquisition-tax-governor.yml'

permissions:
  contents: read

concurrency:
  group: u5-p0-02-reacquisition-tax-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run U5-P0-02 regressions
        run: python -m unittest tests.runtime.test_reacquisition_tax_governor -v

      - name: Generate exact-head U5-P0-02 certificate
        run: |
          python tools/validate_u5_p0_02_reacquisition_tax_governor.py --out /tmp/u5-p0-02-reacquisition-tax-governor.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('/tmp/u5-p0-02-reacquisition-tax-governor.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'U5_P0_02_REACQUISITION_TAX_GOVERNOR'
          assert report['mechanism_id'] == 'U5-P0-02'
          assert report['wave'] == 'TE-U31'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['provider_savings_claim'] is False
          runtime = report['runtime']
          assert runtime['expensive_reacquisition_retained'] is True
          assert runtime['cheap_reacquisition_pruned'] is True
          assert runtime['later_tool_attributed'] is True
          assert runtime['counterfactual_retention_baseline'] is True
          assert runtime['net_end_to_end_accounting'] is True
          assert runtime['context_decision_trace_compatible'] is True
          assert runtime['provider_savings_claim'] is False
          PY

      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload U5-P0-02 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u5-p0-02-reacquisition-tax-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/u5-p0-02-reacquisition-tax-governor.json
          if-no-files-found: error
