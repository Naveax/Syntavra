name: Bootstrap Immutable Publish Actions

on:
  push:
    branches:
      - agent/pre-release-immutable-action-pins
    paths:
      - '.github/workflows/bootstrap-immutable-publish-actions.yml'
      - 'tools/bootstrap_patch_immutable_publish_actions.py'

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Apply immutable action pin patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/bootstrap_patch_immutable_publish_actions.py
          python tools/bootstrap_patch_immutable_publish_actions.py
      - name: Remove bootstrap-only files from candidate tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-immutable-publish-actions.yml
          rm tools/bootstrap_patch_immutable_publish_actions.py
      - name: Verify immutable publish action contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_pre_release_publish_workflow_contract -v
          python -m unittest tests.runtime.test_pre_release_secret_scope -v
          python -m unittest tests.runtime.test_pre_release_publish_credentials -v
          python -m unittest tests.runtime.test_release_main_protection -v
      - name: Refresh bootstrap-free final manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
      - name: Enforce exact permanent diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only 6b7e2d628a50ec42206006bc56df6c309f025617 -- | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/publish-pre-release.yml'
            'MANIFEST.sha256'
            'tests/runtime/test_pre_release_publish_workflow_contract.py'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
      - name: Build validated candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/candidate/tests/runtime
          cp .github/workflows/publish-pre-release.yml /tmp/candidate/publish-pre-release.yml
          cp tests/runtime/test_pre_release_publish_workflow_contract.py /tmp/candidate/tests/runtime/
          cp MANIFEST.sha256 /tmp/candidate/
      - name: Create validated Git blobs without moving refs
        shell: bash
        run: |
          set -euo pipefail
          create_blob() {
            local label="$1"
            local file="$2"
            local payload
            payload="$(mktemp)"
            python - "$file" "$payload" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_bytes()
          Path(sys.argv[2]).write_text(
              json.dumps({"content": base64.b64encode(source).decode("ascii"), "encoding": "base64"}),
              encoding="utf-8",
          )
          PY
            local remote_sha
            remote_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$payload" --jq '.sha')"
            local local_sha
            local_sha="$(git hash-object "$file")"
            test "$remote_sha" = "$local_sha"
            printf '%s=%s\n' "$label" "$remote_sha" >> /tmp/candidate/validated-meta.txt
          }
          : > /tmp/candidate/validated-meta.txt
          create_blob workflow_blob .github/workflows/publish-pre-release.yml
          create_blob test_blob tests/runtime/test_pre_release_publish_workflow_contract.py
          create_blob manifest_blob MANIFEST.sha256
          printf 'base_head=%s\n' '6b7e2d628a50ec42206006bc56df6c309f025617' >> /tmp/candidate/validated-meta.txt
          printf 'refs_moved=false\n' >> /tmp/candidate/validated-meta.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-immutable-publish-actions-${{ github.sha }}
          path: /tmp/candidate
          if-no-files-found: error
          retention-days: 7
