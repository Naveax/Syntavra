name: R24 Canonical Config Show Parity

on:
  pull_request:
    paths:
      - "contracts/cli/config-show-v1.json"
      - "contracts/engine/descriptor.txt"
      - "contracts/parity/python-rust-full-parity-v1.json"
      - "crates/syntavra-cli/src/main.rs"
      - "crates/syntavra-contracts/src/lib.rs"
      - "syntavra_runtime/config_show_contract.py"
      - "syntavra_runtime/config_show_router_r24.py"
      - "syntavra_runtime/engine_entry.py"
      - "syntavra_runtime/engine_selector.py"
      - "syntavra_runtime/unified_cli.py"
      - "tests/runtime/test_config_show_r24.py"
      - "tests/runtime/test_engine_selector_r4.py"
      - "tools/run_engine_parity.py"
      - "tools/run_engine_parity_r24.py"
      - "tools/verify_r24_config_show.py"
      - ".github/workflows/r24-config-show.yml"
  push:
    branches:
      - main
      - "feature/full-parity-r24-**"

permissions:
  contents: read

jobs:
  parity:
    name: R24 Canonical Config Show Contract and Cargo Parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run R24 config show regressions
        run: python -m pytest -q tests/runtime/test_config_show_r24.py
      - name: Set up pinned Rust 1.82
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Cargo-backed config show verifier
        run: python tools/verify_r24_config_show.py | tee r24-config-show-report.json
      - name: Run aggregate R0-R24 parity
        run: python tools/run_engine_parity_r24.py | tee aggregate-r0-r24.json
      - name: Upload R24 config show diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r24-config-show-diagnostics
          path: |
            r24-config-show-report.json
            aggregate-r0-r24.json
          if-no-files-found: warn
