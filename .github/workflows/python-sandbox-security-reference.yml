name: Python Sandbox Security Reference Contract

on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: python-sandbox-security-reference
  cancel-in-progress: true

jobs:
  python-sandbox-security-reference:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run Python sandbox/security regression tests
        run: python -m unittest tests.runtime.test_python_sandbox_security_reference -v

      - name: Generate exact-head Python sandbox/security evidence
        if: always()
        run: |
          set +e
          python tools/certify_python_sandbox_security_reference.py \
            --output /tmp/python-sandbox-security-reference.json \
            > /tmp/python-sandbox-security-reference.log 2>&1
          report_exit=$?
          set -e
          cat /tmp/python-sandbox-security-reference.log
          test -f /tmp/python-sandbox-security-reference.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          value = json.loads(Path('/tmp/python-sandbox-security-reference.json').read_text(encoding='utf-8'))
          checkout_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert value['ok'] is True, value
          assert value['family'] == 'sandbox-security'
          assert value['engine'] == 'python'
          assert value['exact_head'] == checkout_head, (value['exact_head'], checkout_head)
          assert value['routes']['route_count'] == 5
          assert value['network_boundary'] == 'no live external network required; executed fixture commands are local child processes'
          assert value['exit_policy'] == {
              'direct_success': 0,
              'direct_child_exit': 'passthrough',
              'direct_timeout': 124,
              'direct_application_error': 4,
              'platform_success': 0,
              'platform_receipt_failure': 3,
              'platform_application_error': 4,
              'argparse_error': 2,
          }
          assert value['direct']['execute']['environment'] == {'sandbox': '1', 'secret': None, 'workspace': True}
          assert value['direct']['strict_denial']['exit'] == 4
          assert value['direct']['child_exit_passthrough'] == {'public_exit': 7, 'receipt_exit_code': 7}
          assert value['platform']['status']['fail_closed'] is True
          assert value['platform']['allowed_run']['public_exit'] == 0
          assert value['platform']['allowed_run']['durable_receipt_exact'] is True
          assert value['platform']['child_failure']['public_exit'] == 3
          assert value['platform']['child_failure']['receipt_exit_code'] == 7
          assert value['platform']['denials']['cwd_escape']['exit'] == 4
          assert value['platform']['denials']['writable_escape']['exit'] == 4
          assert value['platform']['denials']['malformed_argv']['exit'] == 4
          assert value['command_policy']['classification'] == 'content-agnostic'
          PY
          exit "$report_exit"

      - name: Upload Python sandbox/security reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sandbox-security-reference
          path: |
            /tmp/python-sandbox-security-reference.json
            /tmp/python-sandbox-security-reference.log
          if-no-files-found: error

      - name: Show exact head and enforce clean repository tree
        if: always()
        run: |
          echo "head=$(git rev-parse HEAD)"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"
