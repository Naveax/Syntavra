name: Recovery to 9.9 RC1

on:
  pull_request:
    paths:
      - 'syntavra_runtime/agent_runtime.py'
      - 'syntavra_runtime/agent_retrieval.py'
      - 'syntavra_runtime/autonomous_agent.py'
      - 'syntavra_runtime/agent_context_runtime.py'
      - 'syntavra_runtime/inference_skip_cache.py'
      - 'syntavra_runtime/retry_economics.py'
      - 'syntavra_runtime/provider_call_observation.py'
      - 'syntavra_runtime/evidence.py'
      - 'syntavra_runtime/tool_externalization.py'
      - 'syntavra_runtime/tool_externalization_types.py'
      - 'syntavra_runtime/semantic_wire_ir.py'
      - 'syntavra_runtime/model_gateway.py'
      - 'contracts/engine/dual-engine-public-surface-v2.json'
      - 'contracts/python/recovery-to-99-v1.json'
      - 'contracts/python/token-economy-frozen-workloads-v1.json'
      - 'docs/CURRENT_RECOVERY_TO_99.md'
      - 'benchmarks/token_economy_rc1_benchmark.py'
      - 'benchmarks/token_economy_frozen_corpus.py'
      - 'tests/runtime/test_token_economy_rc1_runtime.py'
      - 'tests/runtime/test_token_economy_frozen_corpus.py'
      - 'tests/runtime/test_agent_product_completion.py'
      - 'tests/runtime/test_agent_retrieval.py'
      - 'tests/runtime/test_retry_economics.py'
      - 'tests/runtime/test_recovery_to_99_security.py'
      - 'tests/runtime/test_inference_skip_cache.py'
      - 'tools/certify_recovery_to_99.py'
      - '.github/workflows/recovery-to-99-rc1.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'syntavra_runtime/agent_runtime.py'
      - 'syntavra_runtime/agent_retrieval.py'
      - 'syntavra_runtime/autonomous_agent.py'
      - 'syntavra_runtime/agent_context_runtime.py'
      - 'syntavra_runtime/inference_skip_cache.py'
      - 'syntavra_runtime/retry_economics.py'
      - 'syntavra_runtime/provider_call_observation.py'
      - 'syntavra_runtime/evidence.py'
      - 'syntavra_runtime/tool_externalization.py'
      - 'syntavra_runtime/tool_externalization_types.py'
      - 'syntavra_runtime/semantic_wire_ir.py'
      - 'syntavra_runtime/model_gateway.py'
      - 'contracts/engine/dual-engine-public-surface-v2.json'
      - 'contracts/python/recovery-to-99-v1.json'
      - 'contracts/python/token-economy-frozen-workloads-v1.json'
      - 'docs/CURRENT_RECOVERY_TO_99.md'
      - 'benchmarks/token_economy_rc1_benchmark.py'
      - 'benchmarks/token_economy_frozen_corpus.py'
      - 'tests/runtime/test_token_economy_rc1_runtime.py'
      - 'tests/runtime/test_token_economy_frozen_corpus.py'
      - 'tests/runtime/test_agent_product_completion.py'
      - 'tests/runtime/test_agent_retrieval.py'
      - 'tests/runtime/test_retry_economics.py'
      - 'tests/runtime/test_recovery_to_99_security.py'
      - 'tests/runtime/test_inference_skip_cache.py'
      - 'tools/certify_recovery_to_99.py'
      - '.github/workflows/recovery-to-99-rc1.yml'

permissions:
  contents: read

concurrency:
  group: recovery-to-99-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: '1'
  SYN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  recovery-critical-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Record exact-head recovery identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['SYN_EXPECTED_HEAD']
          value = {
              'schema_version': 1,
              'expected_head': expected,
              'actual_head': actual,
              'exact_head': actual == expected,
              'claim_boundary': 'FAILURE_RECEIPT_IDENTITY_ONLY_NOT_PROVIDER_PROOF',
          }
          Path('/tmp/recovery-exact-head.json').write_text(json.dumps(value, sort_keys=True) + '\n', encoding='utf-8')
          assert actual == expected, value
          PY

      - name: Install runtime
        run: python -m pip install -e .

      - name: Compile recovery surfaces
        run: |
          set -euo pipefail
          python -m compileall -q \
            syntavra_runtime/agent_runtime.py \
            syntavra_runtime/agent_retrieval.py \
            syntavra_runtime/autonomous_agent.py \
            syntavra_runtime/agent_context_runtime.py \
            syntavra_runtime/inference_skip_cache.py \
            syntavra_runtime/retry_economics.py \
            syntavra_runtime/provider_call_observation.py \
            tests/runtime/test_token_economy_rc1_runtime.py \
            tests/runtime/test_token_economy_frozen_corpus.py \
            tests/runtime/test_agent_product_completion.py \
            tests/runtime/test_agent_retrieval.py \
            tests/runtime/test_retry_economics.py \
            tests/runtime/test_recovery_to_99_security.py \
            tests/runtime/test_inference_skip_cache.py \
            benchmarks/token_economy_rc1_benchmark.py \
            benchmarks/token_economy_frozen_corpus.py \
            tools/certify_recovery_to_99.py

      - name: Run constant-context product regression
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_token_economy_rc1_runtime -v
          python -m unittest tests.runtime.test_agent_product_completion -v
          python -m unittest tests.runtime.test_agent_retrieval -v
          python -m unittest tests.runtime.test_retry_economics -v
          python -m unittest tests.runtime.test_p0_p4_runtime_consolidation -v

      - name: Prove executable portable B0-B9 corpus
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_token_economy_frozen_corpus -v
          corpus_root="$(mktemp -d)"
          python benchmarks/token_economy_frozen_corpus.py \
            "$corpus_root/corpus" \
            --output /tmp/recovery-frozen-corpus.json \
            --verify-initial-failures
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/recovery-frozen-corpus.json').read_text(encoding='utf-8'))
          assert value['claim_boundary'] == 'EXECUTABLE_FROZEN_CORPUS_NOT_PROVIDER_PROOF', value
          assert value['workload_count'] == 10, value
          assert value['initial_failure_gate']['ok'] is True, value
          assert len(value['portable_identity_sha256']) == 64, value
          identities = [row['metadata']['frozen_workload_identity'] for row in value['tasks']]
          assert len(identities) == len(set(identities)) == 10, identities
          PY
          rm -rf "$corpus_root"

      - name: Prove exact zero-inference replay and invalidation
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_inference_skip_cache -v

      - name: Run security and exact-recovery property suite
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_recovery_to_99_security -v
          python -m unittest tests.runtime.test_tool_externalization_v2 -v
          python -m unittest tests.runtime.test_semantic_wire_ir -v

      - name: Run local structural token regression
        run: |
          set -euo pipefail
          python benchmarks/token_economy_rc1_benchmark.py | tee /tmp/recovery-token-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/recovery-token-benchmark.json').read_text(encoding='utf-8'))
          assert value['claim_boundary'] == 'LOCAL_STRUCTURAL_REGRESSION_ONLY_NOT_PROVIDER_BILLED_PROOF', value
          assert all(value['gates'].values()), value
          assert value['candidate']['max_turn_tokens'] <= 6000, value
          PY

      - name: Verify provider/token/public-surface contracts
        run: |
          set -euo pipefail
          python tools/certify_token_economy_competitive_gap.py > /tmp/competitive-gap.json
          python tools/verify_dual_engine_public_surface.py > /tmp/dual-engine.json
          python tools/certify_python_mcp_integration_reference.py --output /tmp/mcp-integration.json > /tmp/mcp-integration.log

      - name: Certify recovery authority
        run: |
          set -euo pipefail
          python tools/certify_recovery_to_99.py --output /tmp/recovery-to-99.json > /tmp/recovery-to-99.log
          cat /tmp/recovery-to-99.log
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          value = json.loads(Path('/tmp/recovery-to-99.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['SYN_EXPECTED_HEAD'], (head, os.environ['SYN_EXPECTED_HEAD'])
          assert value['ok'] is True, value
          assert value['exact_head'] == head, value
          assert value['roadmap_frozen'] is True, value
          assert value['workload_count'] == 10, value
          assert value['target_achieved'] is False, 'offline CI must not fabricate provider-proof completion'
          assert value['provider_evidence']['paired_real_provider_receipts_present_in_certification'] is False, value
          PY

      - name: Enforce clean exact head
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SYN_EXPECTED_HEAD"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload exact-head recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-to-99-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/recovery-exact-head.json
            /tmp/recovery-frozen-corpus.json
            /tmp/recovery-token-benchmark.json
            /tmp/competitive-gap.json
            /tmp/dual-engine.json
            /tmp/mcp-integration.json
            /tmp/mcp-integration.log
            /tmp/recovery-to-99.json
            /tmp/recovery-to-99.log
          if-no-files-found: error
