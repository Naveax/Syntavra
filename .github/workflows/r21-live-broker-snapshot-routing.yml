name: R21 Live Broker Snapshot Routing Parity

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "syntavra_runtime/engine_cli.py"
      - "syntavra_runtime/read_only_router_r21.py"
      - "syntavra_runtime/broker_live_snapshot_contract.py"
      - "syntavra_runtime/broker_snapshot_contract.py"
      - "syntavra_runtime/state_snapshot_contract.py"
      - "contracts/engine/read-only-routing-v10.json"
      - "contracts/state/broker-live-snapshot-v1.json"
      - "tests/runtime/test_read_only_router_r21.py"
      - "tools/verify_r21_live_broker_snapshot_routing.py"
      - "tools/run_engine_parity.py"
      - ".github/workflows/r21-live-broker-snapshot-routing.yml"
  pull_request:
    branches: [main]
    paths:
      - "syntavra_runtime/engine_cli.py"
      - "syntavra_runtime/read_only_router_r21.py"
      - "syntavra_runtime/broker_live_snapshot_contract.py"
      - "syntavra_runtime/broker_snapshot_contract.py"
      - "syntavra_runtime/state_snapshot_contract.py"
      - "contracts/engine/read-only-routing-v10.json"
      - "contracts/state/broker-live-snapshot-v1.json"
      - "tests/runtime/test_read_only_router_r21.py"
      - "tools/verify_r21_live_broker_snapshot_routing.py"
      - "tools/run_engine_parity.py"
      - ".github/workflows/r21-live-broker-snapshot-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-broker-snapshot-routing:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - name: Install Python reference runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify R21 Python routing regressions
        run: python -m pytest tests/runtime/test_read_only_router_r21.py -q
      - name: Verify pinned Rust workspace quality
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify R21 live broker snapshot routing parity
        id: parity
        shell: bash
        run: |
          set -o pipefail
          python tools/verify_r21_live_broker_snapshot_routing.py 2>&1 | tee r21-live-broker-snapshot-routing.log
      - name: Upload R21 live broker snapshot diagnostics
        if: failure() && steps.parity.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: syntavra-r21-live-broker-snapshot-routing-diagnostics-${{ github.sha }}
          path: r21-live-broker-snapshot-routing.log
          if-no-files-found: error
          retention-days: 7
