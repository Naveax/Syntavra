name: Temporary Python Completion Report Reconciliation

on:
  push:
    branches:
      - agent/python-completion-report-reconciliation-v1
    paths:
      - .github/workflows/tmp-python-completion-report-reconciliation.yml

permissions:
  contents: write

concurrency:
  group: tmp-python-completion-report-reconciliation-v1
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
      TARGET_BRANCH: agent/python-completion-report-reconciliation-v1
      SOURCE_HEAD: 1292e0d3f4cee4c156006e165052fd1165067fdd
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/python-completion-report-reconciliation-v1
          fetch-depth: 0

      - name: Require exact staging identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^^)" = "$SOURCE_HEAD"
          test -f tools/tmp_reconcile_python_completion_reports.py
          test -f .github/workflows/tmp-python-completion-report-reconciliation.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install -e .

      - name: Reconcile current-state reports
        run: python tools/tmp_reconcile_python_completion_reports.py

      - name: Remove temporary surfaces and seal manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/tmp_reconcile_python_completion_reports.py
          git rm .github/workflows/tmp-python-completion-report-reconciliation.yml
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git diff --check
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^^'], text=True).splitlines()
          forbidden = [
              path for path in changed
              if path.startswith('native/')
              or path.startswith('crates/')
              or path.startswith('contracts/engine/')
              or path.startswith('.github/workflows/remaining71-')
              or path.startswith('tools/validate_remaining71_')
          ]
          assert not forbidden, forbidden
          assert 'contracts/engine/dual-engine-public-surface-v2.json' not in changed
          assert not any(path.startswith('contracts/python/') for path in changed), changed
          workflows = [path for path in changed if path.startswith('.github/workflows/')]
          certifiers = [path for path in changed if path.startswith('tools/certify') and path.endswith('.py')]
          assert len(workflows) == 17, workflows
          assert len(certifiers) == 18, certifiers
          assert 'tools/certify_python_capability_completeness.py' in certifiers
          assert 'tests/runtime/test_python_capability_completeness.py' in changed
          assert 'MANIFEST.sha256' in changed
          PY

      - name: Validate dirty reconciliation candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python tools/certify_python_capability_completeness.py --out /tmp/completeness-precommit.json
          python - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path
          root = Path('.')
          registry = json.loads((root / 'contracts/python/capability-completeness-registry-v1.json').read_text(encoding='utf-8'))
          assert registry['python_complete']['ready'] is True
          assert registry['python_complete']['rust_resume_allowed'] is False
          assert registry['python_complete']['rust_retired'] is True
          stale = []
          for path in sorted((root / '.github/workflows').glob('*.y*ml')):
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if line.lstrip().startswith('assert ') and 'python_complete_ready' in line and re.search(r'\bis\s+False\b', line):
                      stale.append(f'{path}:{lineno}:workflow')
          for path in sorted((root / 'tools').glob('certify*.py')):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Dict):
                      continue
                  for key, value in zip(node.keys, node.values):
                      if isinstance(key, ast.Constant) and key.value == 'python_complete_ready' and isinstance(value, ast.Constant) and value.value is False:
                          stale.append(f'{path}:{value.lineno}:certifier')
          assert not stale, stale
          PY
          python - <<'PY'
          import importlib.util
          import inspect
          import json
          import subprocess
          from pathlib import Path
          root = Path('.').resolve()
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^^'], text=True).splitlines()
          certifiers = sorted(path for path in changed if path.startswith('tools/certify') and path.endswith('.py'))
          results = []
          for index, relative in enumerate(certifiers):
              path = root / relative
              spec = importlib.util.spec_from_file_location(f'_reconcile_certifier_{index}', path)
              assert spec and spec.loader, relative
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              func = getattr(module, 'certify')
              signature = inspect.signature(func)
              required = [p for p in signature.parameters.values() if p.default is inspect._empty]
              if not required:
                  report = func()
              elif len(required) == 1:
                  report = func(root)
              else:
                  raise AssertionError(f'unsupported certify signature {relative}: {signature}')
              assert report.get('ok') is True, (relative, report)
              if 'python_complete_ready' in report:
                  assert report['python_complete_ready'] is True, (relative, report['python_complete_ready'])
              if 'rust_resume_allowed' in report:
                  assert report['rust_resume_allowed'] is False, (relative, report['rust_resume_allowed'])
              results.append(relative)
          print(json.dumps({'certifiers_checked': results, 'count': len(results)}, indent=2))
          PY
          python tools/validate.py
          python tools/validate_release.py --smoke --output /tmp/release-smoke-precommit.json

      - name: Commit permanent helper-free reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "python: reconcile completion state across exact-head certificates"

      - name: Validate exact final local commit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/tmp_reconcile_python_completion_reports.py
          test ! -e .github/workflows/tmp-python-completion-report-reconciliation.yml
          python tools/refresh_manifest.py --check
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python tools/certify_python_capability_completeness.py --out /tmp/completeness.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          report = json.loads(Path('/tmp/completeness.json').read_text(encoding='utf-8'))
          assert report['ok'] is True and report['exact_head'] == head
          assert report['python_complete_ready'] is True
          assert report['rust_resume_allowed'] is False
          consistency = report['current_state_report_consistency']
          assert consistency['checked'] is True
          assert consistency['stale_surfaces'] == []
          PY
          python - <<'PY'
          import importlib.util
          import inspect
          import subprocess
          from pathlib import Path
          root = Path('.').resolve()
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^^^'], text=True).splitlines()
          certifiers = sorted(path for path in changed if path.startswith('tools/certify') and path.endswith('.py'))
          assert len(certifiers) == 18, certifiers
          for index, relative in enumerate(certifiers):
              path = root / relative
              spec = importlib.util.spec_from_file_location(f'_final_reconcile_certifier_{index}', path)
              assert spec and spec.loader, relative
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              func = getattr(module, 'certify')
              signature = inspect.signature(func)
              required = [p for p in signature.parameters.values() if p.default is inspect._empty]
              report = func() if not required else func(root) if len(required) == 1 else None
              assert report is not None, (relative, signature)
              assert report.get('ok') is True, (relative, report)
              if 'python_complete_ready' in report:
                  assert report['python_complete_ready'] is True, (relative, report['python_complete_ready'])
              if 'rust_resume_allowed' in report:
                  assert report['rust_resume_allowed'] is False, (relative, report['rust_resume_allowed'])
          PY
          python tools/validate.py
          python tools/validate_release.py --smoke --output /tmp/release-smoke-final.json
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push only if reconciliation branch did not move
        shell: bash
        run: |
          set -euo pipefail
          final_head="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "$final_head:refs/heads/$TARGET_BRANCH"
