name: Verified Workflow Gateway Replay

on:
  pull_request:
    paths:
      - 'syntavra_runtime/verified_workflow.py'
      - 'syntavra_runtime/verified_workflow_extension.py'
      - 'syntavra_runtime/mcp_enforcement_extension.py'
      - 'syntavra_runtime/agent_runtime.py'
      - 'syntavra_runtime/autonomous_agent.py'
      - 'syntavra_runtime/agent_retrieval.py'
      - 'tests/runtime/test_verified_workflow_gateway_integration.py'
      - 'contracts/python/verified-workflow-gateway-v1.json'
      - 'docs/TE_P0_11_VERIFIED_WORKFLOW_GATEWAY.md'
      - '.github/workflows/verified-workflow-gateway.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'syntavra_runtime/verified_workflow.py'
      - 'syntavra_runtime/verified_workflow_extension.py'
      - 'syntavra_runtime/mcp_enforcement_extension.py'
      - 'syntavra_runtime/agent_runtime.py'
      - 'syntavra_runtime/autonomous_agent.py'
      - 'syntavra_runtime/agent_retrieval.py'
      - 'tests/runtime/test_verified_workflow_gateway_integration.py'
      - 'contracts/python/verified-workflow-gateway-v1.json'
      - 'docs/TE_P0_11_VERIFIED_WORKFLOW_GATEWAY.md'
      - '.github/workflows/verified-workflow-gateway.yml'

permissions:
  contents: read

concurrency:
  group: verified-workflow-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: '1'
  SYN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verified-workflow-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Compile gateway replay surfaces
        run: |
          set -euo pipefail
          python -m compileall -q \
            syntavra_runtime/verified_workflow.py \
            syntavra_runtime/verified_workflow_extension.py \
            syntavra_runtime/mcp_enforcement_extension.py \
            tests/runtime/test_verified_workflow_gateway_integration.py

      - name: Validate gateway replay contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path('contracts/python/verified-workflow-gateway-v1.json').read_text(encoding='utf-8')
          )
          assert value['schema_version'] == 1
          assert value['claim'] == 'TE_P0_11_VERIFIED_WORKFLOW_GATEWAY_REPLAY'
          assert value['strict'] is True
          assert value['execution_policy']['local_replay_makes_no_provider_call'] is True
          assert value['execution_policy']['fresh_primary_verifier_required'] is True
          assert value['quarantine_policy']['fresh_verifier_failure_quarantines'] is True
          assert value['compatibility_policy']['workflow_runtime_hash_mixed_into_policy_identity'] is True
          assert value['claim_boundary'].endswith('prove them.')
          PY

      - name: Prove product promotion replay quarantine and runtime invalidation
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_verified_workflow_gateway_integration -v
          python -m unittest tests.runtime.test_verified_workflow_macro -v

      - name: Record exact-head gateway receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['SYN_EXPECTED_HEAD']
          receipt = {
              'schema_version': 1,
              'claim': 'TE_P0_11_VERIFIED_WORKFLOW_GATEWAY_REPLAY',
              'exact_head': actual,
              'expected_head': expected,
              'head_match': actual == expected,
              'minimum_independent_verified_experiences': 2,
              'existing_gateway_dispatch_reused': True,
              'provider_calls_avoided_receipted': True,
              'fresh_reverification_required': True,
              'quarantine_fail_closed': True,
              'workflow_runtime_hash_bound': True,
              'provider_billed_savings_proven': False,
          }
          Path('/tmp/verified-workflow-gateway.json').write_text(
              json.dumps(receipt, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          assert receipt['head_match'], receipt
          PY

      - name: Enforce clean exact head
        if: always()
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test "$(git rev-parse HEAD)" = "$SYN_EXPECTED_HEAD"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload verified workflow gateway evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-workflow-gateway-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/verified-workflow-gateway.json
          if-no-files-found: error
