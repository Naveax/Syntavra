      - name: Remove one-shot finalizer and seal exact permanent tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/memory-retrieval-finalizer.yml
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_memory_retrieval_v1 -v
          python -m pytest tests/runtime/test_complete_competitive_features_v001.py -q
          python -m unittest tests.runtime.test_context_reset_handoff -v
          python -m unittest tests.runtime.test_release_action_pins -v
          git diff --check

      - name: Commit permanent sealed tree locally
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256 \
            syntavra_runtime/memory_intelligence.py \
            syntavra_runtime/session_memory.py \
            contracts/python/memory-retrieval-v1.json \
            tests/runtime/test_memory_retrieval_v1.py \
            tools/certify_memory_retrieval_v1.py \
            contracts/python/capability-completeness-registry-v1.json \
