name: Memory Retrieval Hardening Finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: memory-retrieval-hardening-finalizer-151
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.number == 151 && github.event.pull_request.head.ref == 'agent/memory-retrieval-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
      TARGET_BRANCH: agent/memory-retrieval-v1
      BASE_MAIN: 9838235404a834cfbc4882ebfb989cf1b40ef42e
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact target and install runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install -e . pytest

      - name: Apply Memory Retrieval scope and lifecycle hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, f'{path}: expected one anchor, found {count}: {old[:120]!r}'
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          memory_path = Path('syntavra_runtime/memory_intelligence.py')
          text = memory_path.read_text(encoding='utf-8')

          anchor = '''        return True\n\n    def _record(self, memory_id: str) -> dict[str, Any]:\n'''
          replacement = '''        return True\n\n    @staticmethod\n    def _scope_equal(candidate: Mapping[str, Any], requested: MemoryScope) -> bool:\n        return {\n            "project_id": str(candidate.get("project_id") or ""),\n            "user_id": str(candidate.get("user_id") or ""),\n            "session_id": str(candidate.get("session_id") or ""),\n        } == requested.as_dict()\n\n    def _record(self, memory_id: str) -> dict[str, Any]:\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement, 1)

          anchor = '''        for key in ("scope_json", "provenance_json", "supersedes_json", "conflicts_json"):\n            value[key.removesuffix("_json")] = json.loads(value.pop(key))\n        return value\n\n    def remember(\n'''
          replacement = '''        for key in ("scope_json", "provenance_json", "supersedes_json", "conflicts_json"):\n            value[key.removesuffix("_json")] = json.loads(value.pop(key))\n        return value\n\n    def _record_visible(self, memory_id: str, scope: MemoryScope) -> dict[str, Any]:\n        record = self._record(memory_id)\n        if not self._scope_matches(record["scope"], scope):\n            raise PermissionError("memory scope mismatch")\n        return record\n\n    def _record_mutable(self, memory_id: str, scope: MemoryScope) -> dict[str, Any]:\n        record = self._record(memory_id)\n        if not self._scope_equal(record["scope"], scope):\n            raise PermissionError("memory mutation scope mismatch")\n        return record\n\n    def remember(\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement, 1)

          old = '''        for related in (*supersedes_refs, *conflicts):\n            self._record(related)\n'''
          new = '''        for related in (*supersedes_refs, *conflicts):\n            self._record_mutable(related, scope)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            "scope": scope.as_dict(),\n            "provenance_refs": list(provenance),\n        }\n'''
          new = '''            "scope": scope.as_dict(),\n            "provenance_refs": list(provenance),\n            "supersedes": list(supersedes_refs),\n            "conflicts_with": list(conflicts),\n        }\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          start_anchor = '''        with self.store._connection() as db:\n            db.execute(\n                """\n                INSERT INTO memory_retrieval_records(\n'''
          start = text.index(start_anchor, text.index('    def remember('))
          end_anchor = '        return self.recover(memory_id)\n'
          end = text.index(end_anchor, start) + len(end_anchor)
          new_block = '''        with self.store._connection() as db:\n            cursor = db.execute(\n                """\n                INSERT OR IGNORE INTO memory_retrieval_records(\n                  memory_id,observation_id,memory_kind,scope_json,provenance_json,\n                  supersedes_json,conflicts_json,state,created_at,updated_at\n                ) VALUES(?,?,?,?,?,?,?,?,?,?)\n                """,\n                (\n                    memory_id,\n                    observation.observation_id,\n                    normalized_kind,\n                    json.dumps(scope.as_dict(), ensure_ascii=False, sort_keys=True),\n                    json.dumps(list(provenance), ensure_ascii=False, sort_keys=True),\n                    json.dumps(list(supersedes_refs), ensure_ascii=False, sort_keys=True),\n                    json.dumps(list(conflicts), ensure_ascii=False, sort_keys=True),\n                    "active",\n                    now,\n                    now,\n                ),\n            )\n            inserted = cursor.rowcount == 1\n            if inserted:\n                for old_id in supersedes_refs:\n                    db.execute(\n                        "UPDATE memory_retrieval_records SET state='superseded',updated_at=? WHERE memory_id=?",\n                        (now, old_id),\n                    )\n                for conflict_id in conflicts:\n                    row = db.execute(\n                        "SELECT conflicts_json FROM memory_retrieval_records WHERE memory_id=?",\n                        (conflict_id,),\n                    ).fetchone()\n                    existing = set(json.loads(row["conflicts_json"])) if row else set()\n                    existing.add(memory_id)\n                    db.execute(\n                        "UPDATE memory_retrieval_records SET conflicts_json=?,updated_at=? WHERE memory_id=?",\n                        (json.dumps(sorted(existing)), now, conflict_id),\n                    )\n        return self.recover(memory_id, scope=scope)\n'''
          text = text[:start] + new_block + text[end:]

          old = '''    def forget(self, memory_id: str, *, reason: str) -> dict[str, Any]:\n        if not reason.strip():\n            raise ValueError("forget reason is required")\n        self._record(memory_id)\n        now = time.time()\n        with self.store._connection() as db:\n            db.execute(\n                "UPDATE memory_retrieval_records SET state='forgotten',updated_at=? WHERE memory_id=?",\n                (now, memory_id),\n            )\n        recovered = self.recover(memory_id)\n        recovered["forget_reason"] = reason.strip()\n        return recovered\n'''
          new = '''    def forget(self, memory_id: str, *, scope: MemoryScope, reason: str) -> dict[str, Any]:\n        if not reason.strip():\n            raise ValueError("forget reason is required")\n        self._record_mutable(memory_id, scope)\n        now = time.time()\n        with self.store._connection() as db:\n            db.execute(\n                "UPDATE memory_retrieval_records SET state='forgotten',updated_at=? WHERE memory_id=?",\n                (now, memory_id),\n            )\n        recovered = self.recover(memory_id, scope=scope)\n        recovered["forget_reason"] = reason.strip()\n        return recovered\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        for memory_id in parents:\n            self._record(memory_id)\n'''
          new = '''        for memory_id in parents:\n            self._record_mutable(memory_id, scope)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    def recover(self, memory_id: str) -> dict[str, Any]:\n        record = self._record(memory_id)\n'''
          new = '''    def recover(self, memory_id: str, *, scope: MemoryScope) -> dict[str, Any]:\n        record = self._record_visible(memory_id, scope)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '        base = self.store.search(expanded, limit=max(64, bounded_limit * 8), include_invalid=True)\n'
          new = '        base = self.store.search(expanded, limit=max(64, bounded_limit * 8), include_invalid=False)\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '        latest = max((float(row["updated_at"]) for row in records), default=0.0)\n'
          new = '''        records = [\n            record\n            for record in records\n            if self._scope_matches(json.loads(record["scope_json"]), scope)\n        ]\n        latest = max((float(row["updated_at"]) for row in records), default=0.0)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if include_session and self.session_memory is not None and scope.session_id:\n            if getattr(self.session_memory, "project_id", None) != scope.project_id:\n                raise RuntimeError("session memory project scope mismatch")\n            verification = self.session_memory.verify(scope.session_id)\n            if verification.get("ok") is not True:\n                raise RuntimeError("session memory chain verification failed")\n            session_result = self.session_memory.retrieve(scope.session_id, query, limit=bounded_limit)\n            if session_result.get("exact_recovery") is not True:\n                raise RuntimeError("session memory exact recovery failed")\n'''
          new = '''        if include_session and self.session_memory is not None and scope.session_id:\n            if getattr(self.session_memory, "project_id", None) != scope.project_id:\n                raise RuntimeError("session memory project scope mismatch")\n            session = self.session_memory.describe(scope.session_id)\n            if str(session.get("project_id") or "") != scope.project_id:\n                raise RuntimeError("session memory project scope mismatch")\n            owner = str((session.get("metadata") or {}).get("user_id") or "")\n            if owner != scope.user_id:\n                raise RuntimeError("session memory user scope mismatch")\n            verification = self.session_memory.verify(scope.session_id)\n            if verification.get("ok") is not True:\n                raise RuntimeError("session memory chain verification failed")\n            session_result = self.session_memory.retrieve(scope.session_id, query, limit=bounded_limit)\n            if session_result.get("exact_recovery") is not True:\n                raise RuntimeError("session memory exact recovery failed")\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '        recovered = [self.recover(memory_id) for memory_id in ids]\n'
          new = '        recovered = [self.recover(memory_id, scope=scope) for memory_id in ids]\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            "scoped_retrieval": True,\n            "exact_recovery": True,\n            "cross_agent_handoff_receipts": True,\n'''
          new = '''            "scoped_retrieval": True,\n            "scoped_recovery": True,\n            "scope_safe_mutation": True,\n            "session_user_binding": True,\n            "no_silent_reactivation": True,\n            "invalid_memory_excluded": True,\n            "exact_recovery": True,\n            "cross_agent_handoff_receipts": True,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          memory_path.write_text(text, encoding='utf-8')

          session_path = Path('syntavra_runtime/session_memory.py')
          text = session_path.read_text(encoding='utf-8')
          anchor = '''    @staticmethod\n    def _require_session(db: Any, session_id: str) -> Any:\n        session = db.execute("SELECT * FROM sessions WHERE session_id = ?", (session_id,)).fetchone()\n        if not session:\n            raise KeyError(session_id)\n        return session\n\n    def open(self, session_id: str | None = None, *, parents: Sequence[str] = (), metadata: Mapping[str, Any] | None = None) -> dict[str, Any]:\n'''
          replacement = '''    @staticmethod\n    def _require_session(db: Any, session_id: str) -> Any:\n        session = db.execute("SELECT * FROM sessions WHERE session_id = ?", (session_id,)).fetchone()\n        if not session:\n            raise KeyError(session_id)\n        return session\n\n    def describe(self, session_id: str) -> dict[str, Any]:\n        with _connect(self.path) as db:\n            session = self._require_session(db, session_id)\n        return dict(session) | {\n            "parents": json.loads(session["parents_json"]),\n            "metadata": json.loads(session["metadata_json"]),\n        }\n\n    def open(self, session_id: str | None = None, *, parents: Sequence[str] = (), metadata: Mapping[str, Any] | None = None) -> dict[str, Any]:\n'''
          assert text.count(anchor) == 1
          session_path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          test_path = Path('tests/runtime/test_memory_retrieval_v1.py')
          text = test_path.read_text(encoding='utf-8')
          old = '        self.sessions.open("session-a")\n'
          new = '        self.sessions.open("session-a", metadata={"user_id": "naveax"})\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          text = re.sub(r'self\.engine\.recover\(([^\n,)]+\["memory_id"\])\)', r'self.engine.recover(\1, scope=self.scope)', text)
          old = '        forgotten = self.engine.forget(new["memory_id"], reason="superseded by external authority")\n'
          new = '        forgotten = self.engine.forget(new["memory_id"], scope=self.scope, reason="superseded by external authority")\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '\n\nif __name__ == "__main__":\n'
          assert text.count(marker) == 1
          hardening_tests = '''\n    def test_cross_scope_recovery_and_mutation_fail_closed(self) -> None:\n        local = self.remember("local scoped memory", kind="project")\n        foreign_scope = MemoryScope(project_id="other-project", user_id="other-user")\n        foreign = self.engine.remember(\n            "foreign scoped memory",\n            kind="project",\n            scope=foreign_scope,\n            provenance_refs=("evidence:foreign",),\n        )\n        with self.assertRaises(PermissionError):\n            self.engine.recover(foreign["memory_id"], scope=self.scope)\n        with self.assertRaises(PermissionError):\n            self.engine.forget(foreign["memory_id"], scope=self.scope, reason="must not cross scope")\n        with self.assertRaises(PermissionError):\n            self.engine.remember(\n                "illegal cross-scope supersession",\n                kind="semantic",\n                scope=self.scope,\n                provenance_refs=("evidence:cross-scope",),\n                supersedes=(foreign["memory_id"],),\n            )\n        with self.assertRaises(PermissionError):\n            self.engine.remember(\n                "illegal cross-scope conflict",\n                kind="semantic",\n                scope=self.scope,\n                provenance_refs=("evidence:cross-conflict",),\n                conflicts_with=(foreign["memory_id"],),\n            )\n        with self.assertRaises(PermissionError):\n            self.engine.consolidate(\n                (local["memory_id"], foreign["memory_id"]),\n                "illegal cross-scope consolidation",\n                kind="semantic",\n                scope=self.scope,\n            )\n\n    def test_duplicate_identity_does_not_reactivate_forgotten_memory(self) -> None:\n        item = self.remember("logical forgetting remains durable", kind="semantic")\n        self.engine.forget(item["memory_id"], scope=self.scope, reason="retire")\n        duplicate = self.remember("logical forgetting remains durable", kind="semantic")\n        self.assertEqual(duplicate["memory_id"], item["memory_id"])
        self.assertEqual(duplicate["state"], "forgotten")\n        result = self.engine.retrieve("logical forgetting", scope=self.scope, include_session=False)\n        self.assertNotIn(item["memory_id"], {row["memory_id"] for row in result["results"]})\n\n    def test_lifecycle_relations_are_part_of_memory_identity(self) -> None:\n        parent = self.remember("identity parent", kind="semantic")\n        conflict = self.remember(\n            "same lifecycle content",\n            kind="semantic",\n            provenance_refs=("evidence:lifecycle",),\n            conflicts_with=(parent["memory_id"],),\n        )\n        superseding = self.remember(\n            "same lifecycle content",\n            kind="semantic",\n            provenance_refs=("evidence:lifecycle",),\n            supersedes=(parent["memory_id"],),\n        )\n        self.assertNotEqual(conflict["memory_id"], superseding["memory_id"])\n\n    def test_invalid_memory_is_excluded_from_active_retrieval(self) -> None:\n        invalid = self.remember("invalid evidence must not rank", kind="semantic", validity=0.0)\n        result = self.engine.retrieve("invalid evidence", scope=self.scope, include_session=False)\n        self.assertNotIn(invalid["memory_id"], {row["memory_id"] for row in result["results"]})\n\n    def test_session_user_binding_fails_closed(self) -> None:\n        self.sessions.open("session-other", metadata={"user_id": "other-user"})\n        foreign_user_scope = MemoryScope(project_id="syntavra", user_id="naveax", session_id="session-other")\n        with self.assertRaises(RuntimeError):\n            self.engine.retrieve("anything", scope=foreign_user_scope)\n        self.sessions.open("session-unowned")\n        unowned_scope = MemoryScope(project_id="syntavra", user_id="naveax", session_id="session-unowned")\n        with self.assertRaises(RuntimeError):\n            self.engine.retrieve("anything", scope=unowned_scope)\n\n    def test_project_global_memory_is_visible_but_not_mutable_from_private_scope(self) -> None:\n        project_scope = MemoryScope(project_id="syntavra")\n        global_item = self.engine.remember(\n            "project global policy",\n            kind="project",\n            scope=project_scope,\n            provenance_refs=("evidence:global",),\n        )\n        recovered = self.engine.recover(global_item["memory_id"], scope=self.scope)\n        self.assertEqual(recovered["text"], "project global policy")\n        with self.assertRaises(PermissionError):\n            self.engine.forget(global_item["memory_id"], scope=self.scope, reason="private scope cannot mutate global")\n'''
          text = text.replace(marker, hardening_tests + marker, 1)
          test_path.write_text(text, encoding='utf-8')

          certifier_path = Path('tools/certify_memory_retrieval_v1.py')
          text = certifier_path.read_text(encoding='utf-8')
          old = '        sessions.open("session-cert")\n'
          new = '        sessions.open("session-cert", metadata={"user_id": "certifier"})\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          text = text.replace('engine.recover(first["memory_id"])', 'engine.recover(first["memory_id"], scope=scope)')
          anchor = '''        _require(status.get("new_persistent_database") is False, "parallel memory database introduced")\n        _require(status.get("exact_recovery") is True, "runtime exact recovery disabled")\n'''
          replacement = '''        _require(status.get("new_persistent_database") is False, "parallel memory database introduced")\n        _require(status.get("scoped_recovery") is True, "scoped memory recovery disabled")\n        _require(status.get("scope_safe_mutation") is True, "memory mutation scope guard disabled")\n        _require(status.get("session_user_binding") is True, "session user binding disabled")\n        _require(status.get("no_silent_reactivation") is True, "memory may silently reactivate")\n        _require(status.get("invalid_memory_excluded") is True, "invalid memory may be retrieved")\n        _require(status.get("exact_recovery") is True, "runtime exact recovery disabled")\n'''
          assert text.count(anchor) == 1
          certifier_path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          contract_path = Path('contracts/python/memory-retrieval-v1.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          contract['scope'].update({
              'recovery_requires_visible_scope': True,
              'relation_mutation_requires_exact_scope': True,
              'forget_requires_exact_scope': True,
              'consolidation_requires_exact_scope': True,
              'session_user_binding_required': True,
          })
          contract['storage'].update({
              'memory_identity_includes_lifecycle_relations': True,
              'duplicate_identity_does_not_reactivate': True,
              'invalid_memory_excluded_from_retrieval': True,
          })
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Run hardening regression before lifecycle seal
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q syntavra_runtime
          python -m unittest tests.runtime.test_memory_retrieval_v1 -v
          python -m pytest tests/runtime/test_complete_competitive_features_v001.py -q
          python -m unittest tests.runtime.test_context_reset_handoff -v
          python tools/certify_memory_retrieval_v1.py --out /tmp/memory-hardened.json
          python tools/certify_context_reset_handoff.py --out /tmp/context-reset-hardened.json
          python - <<'PY'
          import json
          from pathlib import Path
          memory=json.loads(Path('/tmp/memory-hardened.json').read_text(encoding='utf-8'))
          reset=json.loads(Path('/tmp/context-reset-hardened.json').read_text(encoding='utf-8'))
          assert memory['ok'] is True, memory
          assert memory['admission_ready'] is True, memory
          runtime=memory['runtime']
          for key in ('scoped_recovery','scope_safe_mutation','session_user_binding','no_silent_reactivation','invalid_memory_excluded','exact_recovery'):
              assert runtime[key] is True, (key, runtime)
          assert runtime['new_persistent_database'] is False
          assert reset['ok'] is True, reset
          PY

      - name: Advance lifecycle and repair continuation authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          full_order=[
              'python_authority_v1','capability_completeness_registry_v1','rust_feature_freeze_guard_v1',
              'universal_context_item_v1','evidence_store_v2','typed_context_object_store_v1',
              'programmatic_execution_v1','deferred_tool_discovery_v1','unified_context_namespace_v1',
              'multi_graph_retrieval_v1','adaptive_context_policy_v1','context_reset_handoff_v1',
              'memory_retrieval_v1','epistemic_safety_v1','cache_provider_budget_v1','output_intelligence_v1',
              'host_adapter_conformance_v1','observability_attribution_v1','signalbench_python_product_v1',
          ]
          registry_path=Path('contracts/python/capability-completeness-registry-v1.json')
          registry=json.loads(registry_path.read_text(encoding='utf-8'))
          current_order=list(registry.get('milestone_order') or [])
          assert current_order in [full_order[:12], full_order], current_order
          registry['milestone_order']=full_order
          caps={row['id']:row for row in registry['capabilities']}

          reset=caps['context_reset_handoff_v1']
          assert reset['state'] in {'partial','implemented','certified'}, reset['state']
          reset['state']='certified'
          reset['implementation_evidence']=[
              'syntavra_runtime/session_memory.py','syntavra_runtime/autonomous_agent.py',
              'syntavra_runtime/context_reset_handoff.py','contracts/python/context-reset-handoff-v1.json',
              'tools/certify_context_reset_handoff.py','tests/runtime/test_context_reset_handoff.py',
              '.github/workflows/context-reset-handoff.yml',
          ]
          reset['certification_evidence']=[
              'contracts/python/context-reset-handoff-v1.json','syntavra_runtime/context_reset_handoff.py',
              'tools/certify_context_reset_handoff.py','tests/runtime/test_context_reset_handoff.py',
              '.github/workflows/context-reset-handoff.yml',
          ]

          memory=caps['memory_retrieval_v1']
          assert memory['state'] in {'partial','implemented'}, memory['state']
          memory['state']='implemented'
          memory['implementation_evidence']=[
              'syntavra_runtime/memory_intelligence.py','syntavra_runtime/session_memory.py',
              'contracts/python/memory-retrieval-v1.json','tools/certify_memory_retrieval_v1.py',
              'tests/runtime/test_memory_retrieval_v1.py','.github/workflows/memory-retrieval.yml',
          ]
          memory['certification_evidence']=[]
          registry_path.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          certifier=Path('tools/certify_python_capability_completeness.py')
          text=certifier.read_text(encoding='utf-8')
          rendered='EXPECTED_MILESTONE_PREFIX = [\n'+''.join(f'    "{item}",\n' for item in full_order)+']\n'
          pattern=re.compile(r'EXPECTED_MILESTONE_PREFIX = \[\n(?:    "[^"]+",\n)+\]\n')
          text,count=pattern.subn(rendered,text,count=1)
          assert count == 1, 'capability milestone prefix anchor drifted'
          certifier.write_text(text,encoding='utf-8')

          checklist=Path('docs/SYNTAVRA_PYTHON_FIRST_CONTINUATION_CHECKLIST.md')
          text=checklist.read_text(encoding='utf-8')
          text=text.replace('Status checkpoint: **2026-08-18**','Status checkpoint: **2026-08-19**',1)
          text=text.replace('- [ ] Add a machine-enforced Rust feature-freeze guard once Python-first implementation begins.','- [x] Add a machine-enforced Rust feature-freeze guard once Python-first implementation begins.',1)
