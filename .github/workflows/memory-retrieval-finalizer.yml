name: Memory Retrieval Admission Finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: memory-retrieval-admission-finalizer-151
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.number == 151 && github.event.pull_request.head.ref == 'agent/memory-retrieval-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
      TARGET_BRANCH: agent/memory-retrieval-v1
      BASE_MAIN: 9838235404a834cfbc4882ebfb989cf1b40ef42e
      PRESEAL_MEMORY_HEAD: b5103c5ff821cf1a8e9062658c97039a0f289ad7
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact target and install runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install -e .

      - name: Revalidate pre-seal Memory implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_memory_retrieval_v1 -v
          python -m unittest tests.runtime.test_complete_competitive_features_v001 -v
          python -m unittest tests.runtime.test_context_reset_handoff -v
          python tools/certify_memory_retrieval_v1.py --out /tmp/memory-preseal.json
          python tools/certify_context_reset_handoff.py --out /tmp/context-reset-preseal.json
          python - <<'PY'
          import json
          from pathlib import Path
          memory=json.loads(Path('/tmp/memory-preseal.json').read_text(encoding='utf-8'))
          reset=json.loads(Path('/tmp/context-reset-preseal.json').read_text(encoding='utf-8'))
          assert memory['ok'] is True, memory
          assert memory['admission_ready'] is True, memory
          assert memory['runtime']['new_persistent_database'] is False, memory
          assert memory['runtime']['exact_recovery'] is True, memory
          assert reset['ok'] is True, reset
          PY

      - name: Advance lifecycle and repair continuation authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          registry_path=Path('contracts/python/capability-completeness-registry-v1.json')
          registry=json.loads(registry_path.read_text(encoding='utf-8'))
          full_order=[
              'python_authority_v1','capability_completeness_registry_v1','rust_feature_freeze_guard_v1',
              'universal_context_item_v1','evidence_store_v2','typed_context_object_store_v1',
              'programmatic_execution_v1','deferred_tool_discovery_v1','unified_context_namespace_v1',
              'multi_graph_retrieval_v1','adaptive_context_policy_v1','context_reset_handoff_v1',
              'memory_retrieval_v1','epistemic_safety_v1','cache_provider_budget_v1','output_intelligence_v1',
              'host_adapter_conformance_v1','observability_attribution_v1','signalbench_python_product_v1',
          ]
          current_order=list(registry.get('milestone_order') or [])
          assert current_order in [full_order[:12], full_order], current_order
          registry['milestone_order']=full_order
          caps={row['id']:row for row in registry['capabilities']}

          reset=caps['context_reset_handoff_v1']
          assert reset['state'] in {'partial','implemented','certified'}, reset['state']
          reset['state']='certified'
          reset['implementation_evidence']=[
              'syntavra_runtime/session_memory.py','syntavra_runtime/autonomous_agent.py',
              'syntavra_runtime/context_reset_handoff.py','contracts/python/context-reset-handoff-v1.json',
              'tools/certify_context_reset_handoff.py','tests/runtime/test_context_reset_handoff.py',
              '.github/workflows/context-reset-handoff.yml',
          ]
          reset['certification_evidence']=[
              'contracts/python/context-reset-handoff-v1.json','syntavra_runtime/context_reset_handoff.py',
              'tools/certify_context_reset_handoff.py','tests/runtime/test_context_reset_handoff.py',
              '.github/workflows/context-reset-handoff.yml',
          ]

          memory=caps['memory_retrieval_v1']
          assert memory['state'] in {'partial','implemented'}, memory['state']
          memory['state']='implemented'
          memory['implementation_evidence']=[
              'syntavra_runtime/memory_intelligence.py','syntavra_runtime/session_memory.py',
              'contracts/python/memory-retrieval-v1.json','tools/certify_memory_retrieval_v1.py',
              'tests/runtime/test_memory_retrieval_v1.py','.github/workflows/memory-retrieval.yml',
          ]
          memory['certification_evidence']=[]
          registry_path.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          certifier=Path('tools/certify_python_capability_completeness.py')
          text=certifier.read_text(encoding='utf-8')
          rendered='EXPECTED_MILESTONE_PREFIX = [\n'+''.join(f'    "{item}",\n' for item in full_order)+']\n'
          pattern=re.compile(r'EXPECTED_MILESTONE_PREFIX = \[\n(?:    "[^"]+",\n)+\]\n')
          text,count=pattern.subn(rendered,text,count=1)
          assert count == 1, 'capability milestone prefix anchor drifted'
          certifier.write_text(text,encoding='utf-8')

          checklist=Path('docs/SYNTAVRA_PYTHON_FIRST_CONTINUATION_CHECKLIST.md')
          text=checklist.read_text(encoding='utf-8')
          text=text.replace('Status checkpoint: **2026-08-18**','Status checkpoint: **2026-08-19**',1)
          text=text.replace('- [ ] Add a machine-enforced Rust feature-freeze guard once Python-first implementation begins.','- [x] Add a machine-enforced Rust feature-freeze guard once Python-first implementation begins.',1)
          start=text.index('## Repository state at checkpoint')
          end=text.index('## Existing Python baseline: do not reimplement blindly')
          current='''## Repository state at checkpoint\n\n- Admitted `main` before Memory work: `9838235404a834cfbc4882ebfb989cf1b40ef42e`.\n- Context Reset / Handoff v1 was exact-head admitted and merged through PR #148.\n- Active Memory branch: `agent/memory-retrieval-v1`.\n- Active PR: #151 — `Add Memory Retrieval v1`.\n- Pre-seal implementation head: `b5103c5ff821cf1a8e9062658c97039a0f289ad7`.\n- Memory Retrieval exact-head runtime/certifier workflow passed on the pre-seal implementation head.\n- Release Main on that head passed all runtime/certifier/freeze checks and failed only because `MANIFEST.sha256` was intentionally stale before the final seal.\n- Python COMPLETE remains false.\n- Rust remains feature-frozen at 174/245 production promotion with 71 remaining.\n\n## Immediate exact task\n\n- [x] Merge Context Reset / Handoff v1.\n- [x] Implement Memory Retrieval v1 without a parallel memory database.\n- [x] Add scoped retrieval, provenance, conflict/supersession, consolidation/forgetting, exact recovery and handoff receipts.\n- [x] Bind Memory Retrieval to exact-head CI, Release Main and immutable action-pin enforcement.\n- [ ] Seal the permanent PR #151 tree and pass final exact-head admission gates.\n- [ ] Merge PR #151 only after all load-bearing gates pass.\n- [ ] Re-read fresh `main`, then advance to `epistemic_safety_v1`.\n\n'''
          text=text[:start]+current+text[end:]
          first=text.index('## First exact Python commits after PR #132')
          wave=text.index('## Wave P0-A: authority / contracts / reproducibility')
          ordered='''## Canonical Python milestone order\n\nDo these in order. Do not begin item N+1 until N has acceptance tests and an exact-head receipt.\n\n- [x] `python_authority_v1`\n- [x] `capability_completeness_registry_v1`\n- [x] `rust_feature_freeze_guard_v1`\n- [x] `universal_context_item_v1`\n- [x] `evidence_store_v2`\n- [x] `typed_context_object_store_v1`\n- [x] `programmatic_execution_v1`\n- [x] `deferred_tool_discovery_v1`\n- [x] `unified_context_namespace_v1`\n- [x] `multi_graph_retrieval_v1`\n- [x] `adaptive_context_policy_v1`\n- [x] `context_reset_handoff_v1`\n- [ ] `memory_retrieval_v1` — current admission candidate\n- [ ] `epistemic_safety_v1`\n- [ ] `cache_provider_budget_v1`\n- [ ] `output_intelligence_v1`\n- [ ] `host_adapter_conformance_v1`\n- [ ] `observability_attribution_v1`\n- [ ] `signalbench_python_product_v1`\n\n'''
          text=text[:first]+ordered+text[wave:]
          checklist.write_text(text,encoding='utf-8')

          live=Path('docs/SYNTAVRA_PYTHON_FIRST_LIVE_CHECKPOINT.md')
          live.write_text('''# Syntavra Python-First Live Checkpoint\n\nUpdated: **2026-08-19**\n\nThis file is the volatile continuation authority. Historical milestones live in `SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt`; the capability registry is the machine-readable lifecycle authority.\n\n## Current admitted base\n\n- `main` before Memory work: `9838235404a834cfbc4882ebfb989cf1b40ef42e`\n- Context Reset / Handoff v1: admitted through PR #148.\n- Python feature authority: active.\n- Python COMPLETE: false.\n- Rust feature development: frozen.\n- Rust production promotion: 174/245.\n- Remaining Rust parity/promotion set: 71.\n\n## Current implementation\n\n### PR #151 — Memory Retrieval v1\n\n- Branch: `agent/memory-retrieval-v1`.\n- Pre-seal implementation head: `b5103c5ff821cf1a8e9062658c97039a0f289ad7`.\n- Existing `MemoryIntelligenceStore` SQLite authority is reused.\n- Existing `SessionMemory` exact hash-chain authority is reused.\n- No parallel persistent memory database is introduced.\n- Episodic, semantic, procedural, project, user and temporal memory scopes are represented.\n- Project/user/session isolation fails closed.\n- Provenance is mandatory.\n- Conflicts remain explicit; supersession is explicit.\n- Consolidation preserves parent lineage.\n- Forgetting is logical: inactive for retrieval but exact payload remains recoverable.\n- Hybrid BM25/vector retrieval uses deterministic query expansion and importance/confidence/validity/recency reranking.\n- Retrieval and cross-agent handoff emit deterministic content-addressed receipts.\n\n## Verification\n\n- Dedicated Memory Retrieval exact-head workflow passed on the pre-seal implementation head.\n- New Memory Retrieval regression suite passed 7/7 there.\n- Memory certifier reported `admission_ready=true`, exact recovery true, and no new persistent database.\n- Rust Freeze and the other Python-first gates passed on that head.\n- Release Main failed only at the expected stale `MANIFEST.sha256` check after all runtime/certifier checks passed.\n\n## Current lifecycle repair\n\n- `context_reset_handoff_v1` is advanced from stale `partial` metadata to `certified`.\n- `memory_retrieval_v1` is recorded as `implemented` pending final exact-head admission/merge.\n- Machine-readable milestone order now continues through Epistemic Safety, Cache/Provider/Budget, Output Intelligence, Host Adapter Conformance, Observability Attribution and SignalBench.\n- The capability certifier enforces that complete order so omitted future milestones cannot accidentally yield Python COMPLETE.\n\n## Next exact task\n\n1. Produce the exact permanent PR #151 tree and canonical `MANIFEST.sha256`.\n2. Run final exact-head Memory Retrieval, Capability Completeness, Context Reset, Rust Freeze, Release Main and Package Provenance gates.\n3. Merge PR #151 only after all load-bearing checks pass.\n4. Re-read fresh `main`.\n5. Begin `epistemic_safety_v1`; reuse existing security scan, trust/taint, claim governance, capability authorization and Adaptive Context Policy primitives instead of duplicating them.\n\n## Required continuation instruction\n\n```text\nContinue Syntavra in PYTHON-FIRST mode from docs/SYNTAVRA_PYTHON_FIRST_LIVE_CHECKPOINT.md.\nCross-check contracts/python/capability-completeness-registry-v1.json before choosing work.\nDo not resume Rust feature development or alter the 174/245 production-promotion boundary.\nDo not start a later milestone while the first non-admitted canonical milestone is still open.\nWhen CI is active, track the existing run instead of creating a duplicate; continue independent work while it runs.\n```\n''',encoding='utf-8')

          checkpoint=Path('docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt')
          text=checkpoint.read_text(encoding='utf-8')
          marker='APPENDED CURRENT CHECKPOINT — 2026-08-19 — MEMORY RETRIEVAL ACTIVE'
          if marker not in text:
              text += '''\n\n======================================================================\nAPPENDED CURRENT CHECKPOINT — 2026-08-19 — MEMORY RETRIEVAL ACTIVE\n======================================================================\n\nCURRENT ADMITTED MAIN BEFORE MEMORY:\n9838235404a834cfbc4882ebfb989cf1b40ef42e\n\nACTIVE IMPLEMENTATION BRANCH:\nagent/memory-retrieval-v1\n\nACTIVE PR:\n#151 — Add Memory Retrieval v1\n\nPYTHON STATUS:\nPYTHON-FIRST ACTIVE — Context Reset / Handoff v1 is admitted; memory_retrieval_v1 is the current milestone.\n\nRUST STATUS:\nFEATURE FROZEN AND CI-ENFORCED — production promotion 174/245; remaining parity/promotion 71; Rust resume false.\n\nCURRENT IMPLEMENTATION:\n- existing MemoryIntelligenceStore and SessionMemory authorities are reused.\n- no parallel persistent memory database was introduced.\n- scoped episodic/semantic/procedural/project/user/temporal memory records added.\n- provenance, conflict, supersession, consolidation, logical forgetting and exact recovery added.\n- BM25/vector retrieval extended with deterministic query expansion and importance/confidence/validity/recency reranking.\n- session retrieval remains hash-chain verified and exact recoverable.\n- deterministic retrieval and cross-agent handoff receipts added.\n- Memory contract, regression suite, certifier, exact-head workflow, Release Main binding and immutable action-pin coverage added.\n\nVERIFIED PRE-SEAL:\n- Memory Retrieval exact-head workflow PASS on b5103c5ff821cf1a8e9062658c97039a0f289ad7.\n- new Memory Retrieval regression PASS 7/7.\n- Memory certifier admission_ready=true; exact recovery=true; new_persistent_database=false.\n- Rust Freeze and supporting Python-first gates PASS.\n- Release Main reached the canonical manifest check after all runtime/certifier checks passed; failure was stale MANIFEST.sha256 only.\n\nLIFECYCLE REPAIR IN THIS ADMISSION:\n- context_reset_handoff_v1 stale partial metadata advances to certified.\n- memory_retrieval_v1 advances to implemented pending final exact-head admission and merge.\n- milestone order/certifier now covers every remaining Python-first milestone through SignalBench.\n\nNEXT EXACT TASK:\n- seal the permanent PR #151 tree and run final exact-head admission gates.\n- merge only after all load-bearing checks pass.\n- re-read fresh main and advance to epistemic_safety_v1.\n'''
              checkpoint.write_text(text,encoding='utf-8')
          PY

      - name: Remove one-shot finalizer and seal exact permanent tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/memory-retrieval-finalizer.yml
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_memory_retrieval_v1 -v
          python -m unittest tests.runtime.test_complete_competitive_features_v001 -v
          python -m unittest tests.runtime.test_context_reset_handoff -v
          python -m unittest tests.runtime.test_release_action_pins -v
          git diff --check

      - name: Commit permanent sealed tree locally
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256 \
            contracts/python/capability-completeness-registry-v1.json \
            tools/certify_python_capability_completeness.py \
            docs/SYNTAVRA_PYTHON_FIRST_CONTINUATION_CHECKLIST.md \
            docs/SYNTAVRA_PYTHON_FIRST_LIVE_CHECKPOINT.md \
            docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt
          git add -u .github/workflows/memory-retrieval-finalizer.yml
          git status --short
          git commit -m 'Seal Memory Retrieval v1 admission state'

      - name: Validate committed seal before publication
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py --check
          python tools/certify_python_capability_completeness.py --out /tmp/capability-final.json
          python tools/certify_context_reset_handoff.py --out /tmp/context-reset-final.json
          python tools/certify_memory_retrieval_v1.py --out /tmp/memory-final.json
          python tools/check_rust_feature_freeze.py --base "$BASE_MAIN" --head HEAD --out /tmp/rust-freeze-final.json
          python - <<'PY'
          import json
          from pathlib import Path
          cap=json.loads(Path('/tmp/capability-final.json').read_text(encoding='utf-8'))
          reset=json.loads(Path('/tmp/context-reset-final.json').read_text(encoding='utf-8'))
          memory=json.loads(Path('/tmp/memory-final.json').read_text(encoding='utf-8'))
          freeze=json.loads(Path('/tmp/rust-freeze-final.json').read_text(encoding='utf-8'))
          assert cap['ok'] is True, cap
          assert cap['current_milestone']['id'] == 'memory_retrieval_v1', cap['current_milestone']
          assert cap['current_milestone']['state'] == 'implemented', cap['current_milestone']
          assert cap['python_complete_ready'] is False
          assert cap['rust_resume_allowed'] is False
          assert reset['ok'] is True, reset
          assert memory['ok'] is True, memory
          assert memory['runtime']['new_persistent_database'] is False
          assert memory['runtime']['exact_recovery'] is True
          assert freeze['ok'] is True, freeze
          assert freeze['denied_change_count'] == 0, freeze
          PY
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish one permanent sealed target-head movement
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:"$TARGET_BRANCH"
