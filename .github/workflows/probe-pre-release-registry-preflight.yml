name: Probe Pre-Release Registry Availability

on:
  push:
    branches:
      - agent/pre-release-registry-preflight

permissions:
  contents: read

jobs:
  probe:
    if: github.event.head_commit.message == 'Probe public registry pre-release availability'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pre-release-registry-preflight
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe PyPI npm and crates.io anonymously
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          urls = {
              'pypi': 'https://pypi.org/pypi/syntavra-runtime/0.0.1/json',
              'npm_installer': 'https://registry.npmjs.org/%40syntavra%2Finstall/0.0.1',
              'npm_sdk': 'https://registry.npmjs.org/%40syntavra%2Fsdk/0.0.1',
              'crates_contracts_version': 'https://crates.io/api/v1/crates/syntavra-contracts/0.0.1',
              'crates_core_version': 'https://crates.io/api/v1/crates/syntavra-core/0.0.1',
              'crates_cli_version': 'https://crates.io/api/v1/crates/syntavra-cli/0.0.1',
              'crates_legacy_version': 'https://crates.io/api/v1/crates/syntavra-native/0.0.1',
              'crates_contracts': 'https://crates.io/api/v1/crates/syntavra-contracts',
              'crates_core': 'https://crates.io/api/v1/crates/syntavra-core',
              'crates_cli': 'https://crates.io/api/v1/crates/syntavra-cli',
              'crates_legacy': 'https://crates.io/api/v1/crates/syntavra-native',
          }
          headers = {'User-Agent': 'Syntavra pre-release registry probe/0.0.1'}
          out = {}
          for name, url in urls.items():
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read(4096).decode('utf-8', errors='replace')
                      out[name] = {'status': response.status, 'url': url, 'body_prefix': body}
              except urllib.error.HTTPError as exc:
                  body = exc.read(4096).decode('utf-8', errors='replace')
                  out[name] = {'status': exc.code, 'url': url, 'body_prefix': body}
              except Exception as exc:
                  out[name] = {'status': None, 'url': url, 'error': f'{type(exc).__name__}: {exc}'}
          Path('/tmp/registry-http-probe.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
      - name: Probe VS Code Marketplace through official vsce client
        shell: bash
        run: |
          set +e
          npx --yes @vscode/vsce show naveax.syntavra-vscode --json \
            > /tmp/vsce-show.json 2> /tmp/vsce-show.err
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/vsce-show.rc
          echo "vsce_rc=$rc"
          cat /tmp/vsce-show.err || true
          head -c 8192 /tmp/vsce-show.json || true
      - name: Record exact probe head
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/probe-head.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload registry probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-registry-probe-${{ github.sha }}
          path: |
            /tmp/registry-http-probe.json
            /tmp/vsce-show.json
            /tmp/vsce-show.err
            /tmp/vsce-show.rc
            /tmp/probe-head.txt
          if-no-files-found: error
          retention-days: 7
