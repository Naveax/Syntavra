name: Stage Validated Main Protection Workflow Blob

on:
  push:
    branches:
      - agent/release-main-protection-authority
    paths:
      - '.github/workflows/stage-release-main-protection-workflow-blob.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_WORKFLOW_BLOB: 51cad37c3b8ea2fd090da24a97299ccbcf12bd8f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-main-protection-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recreate the already validated workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          python tools/bootstrap_patch_release_main_protection.py
          actual="$(git hash-object .github/workflows/publish-pre-release.yml)"
          test "$actual" = "$EXPECTED_WORKFLOW_BLOB"
      - name: Create Git blob without moving any ref
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_WORKFLOW_BLOB']
          content = base64.b64encode(
              Path('.github/workflows/publish-pre-release.yml').read_bytes()
          ).decode('ascii')
          body = json.dumps({'content': content, 'encoding': 'base64'}).encode('utf-8')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/blobs',
              data=body,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              value = json.load(response)
          blob_sha = value['sha']
          assert blob_sha == expected, (blob_sha, expected)
          Path('/tmp/validated-workflow-blob.json').write_text(
              json.dumps({'workflow_sha': blob_sha, 'refs_moved': False}, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'workflow_sha': blob_sha, 'refs_moved': False}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validated-main-protection-workflow-blob-${{ github.sha }}
          path: /tmp/validated-workflow-blob.json
          if-no-files-found: error
          retention-days: 7
