name: Context Reset Seal PR Runner

on:
  pull_request:
    branches:
      - automation/context-reset-seal-base-148

permissions:
  contents: write

concurrency:
  group: context-reset-seal-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact helper head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Build and validate canonical sealed tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          dual = Path('contracts/engine/dual-engine-public-surface-v2.json')
          payload = json.loads(dual.read_text(encoding='utf-8'))
          current = payload['python_surface']['module_count']
          if current == 207:
              raise SystemExit('seal already applied unexpectedly before helper mutation')
          assert current == 206, f'unexpected Python module_count authority state: {current}'
          payload['python_surface']['module_count'] = 207
          dual.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')

          gate = Path('.github/workflows/release-main-merge-gate.yml')
          text = gate.read_text(encoding='utf-8')
          test_line = '          python -m unittest tests.runtime.test_adaptive_context_policy -v\n'
          assert text.count(test_line) == 1, 'adaptive test anchor drifted'
          text = text.replace(
              test_line,
              test_line + '          python -m unittest tests.runtime.test_context_reset_handoff -v\n',
              1,
          )
          cert_line = '          python tools/certify_adaptive_context_policy.py --out /tmp/adaptive-context-policy.json\n'
          assert text.count(cert_line) == 1, 'adaptive certifier anchor drifted'
          text = text.replace(
              cert_line,
              cert_line + '          python tools/certify_context_reset_handoff.py --out /tmp/context-reset-handoff.json\n',
              1,
          )
          gate.write_text(text, encoding='utf-8')

          pins = Path('tests/runtime/test_release_action_pins.py')
          text = pins.read_text(encoding='utf-8')
          pin_line = '    ".github/workflows/adaptive-context-policy.yml",\n'
          assert text.count(pin_line) == 1, 'release pin trust-chain anchor drifted'
          text = text.replace(
              pin_line,
              pin_line + '    ".github/workflows/context-reset-handoff.yml",\n',
              1,
          )
          pins.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/context-reset-seal-pr.yml .context-reset-seal-trigger
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          python -m unittest tests.runtime.test_release_action_pins -v
          python -m unittest tests.runtime.test_context_reset_handoff -v
          python -m unittest tests.runtime.test_dual_engine_promotion_boundary -v
          git diff --check

      - name: Commit canonical sealed tree to helper head only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256 \
            contracts/engine/dual-engine-public-surface-v2.json \
            .github/workflows/release-main-merge-gate.yml \
            tests/runtime/test_release_action_pins.py
          git status --short
          git commit -m 'Seal Context Reset Handoff admission boundaries'
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
