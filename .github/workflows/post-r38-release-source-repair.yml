name: Guarded Release Validator Source Repair

on:
  push:
    branches:
      - agent/post-r38-release-provenance

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply bounded validator repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one preimage, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          certifier = Path('tools/certify_python_provider_proxy_reference.py')
          replace_once(
              certifier,
              '"sk-abcdefghijklmnop1234"',
              '"sk-" + "abcdefghijklmnop1234"',
              'provider secret fixture',
          )

          hygiene = Path('tools/check_repository_hygiene.py')
          old_workflows = '''        ".github/workflows/codeql.yml",\n        ".github/workflows/dependency-review.yml",\n        ".github/workflows/validate.yml",\n        ".github/workflows/validate-fusion-runtime.yml",\n        ".github/workflows/portable-runtime.yml",\n        ".github/workflows/pre-release-artifacts.yml",\n'''
          new_workflows = '''        ".github/workflows/codex-integration-closure.yml",\n        ".github/workflows/dual-engine-promotion-boundary.yml",\n        ".github/workflows/phase2-rust-migration-matrix.yml",\n        ".github/workflows/remaining71-capability-differential.yml",\n        ".github/workflows/remaining71-inventory-observe.yml",\n        ".github/workflows/post-r38-release-provenance-diagnostic.yml",\n'''
          replace_once(hygiene, old_workflows, new_workflows, 'current authority workflows')

          required_anchor = '        "native/syntavra-native/Cargo.toml",\n'
          required_insert = '''        "crates/syntavra-contracts/Cargo.toml",\n        "crates/syntavra-core/Cargo.toml",\n        "crates/syntavra-cli/Cargo.toml",\n        "tests/runtime/test_release_publish_identity.py",\n''' + required_anchor
          replace_once(hygiene, required_anchor, required_insert, 'production release identity files')

          replace_once(
              hygiene,
              '    if "attest-build-provenance" not in workflow_text:\n        failures.append("artifact-provenance-not-enforced")\n',
              '    if "actions/attest@v4" not in workflow_text:\n        failures.append("artifact-provenance-not-enforced")\n',
              'current GitHub attestation action',
          )
          PY
          git diff --check
          git diff --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          printf '%s\n' \
            tools/certify_python_provider_proxy_reference.py \
            tools/check_repository_hygiene.py \
            | sort > /tmp/expected.txt
          sort /tmp/changed.txt -o /tmp/changed.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/post-r38-release-provenance | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/certify_python_provider_proxy_reference.py tools/check_repository_hygiene.py
          git commit -m "Align release validators with promoted authority"
          git push origin HEAD:agent/post-r38-release-provenance
