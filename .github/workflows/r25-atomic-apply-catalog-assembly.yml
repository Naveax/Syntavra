name: R25 Atomic Apply Catalog Assembly

on:
  push:
    branches:
      - feature/full-parity-r25-config-last-good-atomic-apply

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r25-config-last-good-atomic-apply
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Add exact R25 shadow feature
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('contracts/parity/python-rust-full-parity-v1.json')
          catalog = json.loads(path.read_text(encoding='utf-8'))
          features = catalog['features']
          feature_id = 'config.last-good.lifecycle.apply'
          if any(row['id'] == feature_id for row in features):
              raise SystemExit('R25 atomic apply catalog entry already exists')
          anchor = next(
              index for index, row in enumerate(features)
              if row['id'] == 'config.last-good.lifecycle.plan'
          )
          features.insert(anchor + 1, {
              'id': feature_id,
              'target_phase': 'R25',
              'category': 'config',
              'python_owner': 'syntavra_runtime.config_last_good_apply',
              'rust_owner': 'crates/syntavra-cli/src/config_last_good_apply.rs',
              'status': 'RUST_SHADOW',
              'mutation': 'write',
              'contract': 'contracts/config/config-last-good-atomic-apply-v1.json',
              'parity_tests': ['tools/verify_r25_config_last_good_apply.py'],
          })
          path.write_text(
              json.dumps(catalog, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python -m pytest -q tests/runtime/test_full_parity_catalog_v1.py
          python tools/verify_full_parity_catalog.py
          changed="$(git diff --name-only)"
          [ "$changed" = "contracts/parity/python-rust-full-parity-v1.json" ] || {
            echo "unexpected changed files: $changed" >&2
            exit 1
          }
      - name: Commit catalog entry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/parity/python-rust-full-parity-v1.json
          git commit -m "Catalog R25 atomic apply shadow parity"
          git push origin HEAD:feature/full-parity-r25-config-last-good-atomic-apply
