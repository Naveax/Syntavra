name: Context Reset Seal Export Runner

on:
  pull_request:
    branches:
      - automation/context-reset-seal-export-base-148

permissions:
  contents: write

concurrency:
  group: context-reset-seal-export-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  export-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact helper head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Build, validate, and export canonical manifest candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          dual = Path('contracts/engine/dual-engine-public-surface-v2.json')
          payload = json.loads(dual.read_text(encoding='utf-8'))
          assert payload['python_surface']['module_count'] == 206
          payload['python_surface']['module_count'] = 207
          dual.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')

          gate = Path('.github/workflows/release-main-merge-gate.yml')
          text = gate.read_text(encoding='utf-8')
          test_line = '          python -m unittest tests.runtime.test_adaptive_context_policy -v\n'
          cert_line = '          python tools/certify_adaptive_context_policy.py --out /tmp/adaptive-context-policy.json\n'
          assert text.count(test_line) == 1
          assert text.count(cert_line) == 1
          text = text.replace(test_line, test_line + '          python -m unittest tests.runtime.test_context_reset_handoff -v\n', 1)
          text = text.replace(cert_line, cert_line + '          python tools/certify_context_reset_handoff.py --out /tmp/context-reset-handoff.json\n', 1)
          gate.write_text(text, encoding='utf-8')

          pins = Path('tests/runtime/test_release_action_pins.py')
          text = pins.read_text(encoding='utf-8')
          pin_line = '    ".github/workflows/adaptive-context-policy.yml",\n'
          assert text.count(pin_line) == 1
          pins.write_text(text.replace(pin_line, pin_line + '    ".github/workflows/context-reset-handoff.yml",\n', 1), encoding='utf-8')
          PY

          git rm .github/workflows/context-reset-seal-export-pr.yml .context-reset-seal-export-trigger
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check

          test "$(sha256sum contracts/engine/dual-engine-public-surface-v2.json | cut -d' ' -f1)" = "8fad316b035f1a4722fc83cab654ac96a258adbc70fa3e3aef60aa859127c43d"
          test "$(sha256sum .github/workflows/release-main-merge-gate.yml | cut -d' ' -f1)" = "9dab71775e75830f94431e1621ebdd81ab52ada9233e3d1bb97bedab8859bea4"
          test "$(sha256sum tests/runtime/test_release_action_pins.py | cut -d' ' -f1)" = "b8dbb52400abcbb44ddc64d918db7a670b9ab4dac2b835ed50c696d0daa8b9f2"
          test "$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" = "be578182f9841922fa72b3597b807109092eb447bb7b8ab457e7cf114c17af2c"

          python -m unittest tests.runtime.test_release_action_pins -v
          python -m unittest tests.runtime.test_context_reset_handoff -v
          python -m unittest tests.runtime.test_dual_engine_promotion_boundary -v
          git diff --check

          cp MANIFEST.sha256 /tmp/candidate-MANIFEST.sealed.sha256
          git reset --hard HEAD
          cp /tmp/candidate-MANIFEST.sealed.sha256 candidate-MANIFEST.sealed.sha256
          test "$(sha256sum candidate-MANIFEST.sealed.sha256 | cut -d' ' -f1)" = "be578182f9841922fa72b3597b807109092eb447bb7b8ab457e7cf114c17af2c"

      - name: Publish only the sealed manifest candidate blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate-MANIFEST.sealed.sha256
          git commit -m 'Export Context Reset sealed manifest candidate'
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
