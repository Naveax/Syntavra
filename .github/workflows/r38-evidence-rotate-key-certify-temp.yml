name: R38 Evidence Rotate-Key Temporary Certifier

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write

concurrency:
  group: r38-evidence-rotate-key-temp-certifier
  cancel-in-progress: false

jobs:
  certify:
    if: >-
      github.event.pull_request.number == 107 &&
      github.event.pull_request.head.sha == '54e0e9daf95e1b163cb98bdf5c33195ef537d908' &&
      contains(github.event.pull_request.body, '<!-- r38-evidence-rotate-key-certify -->')
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      RUSTUP_TOOLCHAIN: 1.82.0
      EXPECTED_SHA: 54e0e9daf95e1b163cb98bdf5c33195ef537d908
      HEAD_BRANCH: agent/full-dual-engine-runtime
    steps:
      - name: Check out exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        id: exact_checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)" = "$EXPECTED_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up pinned Rust 1.82
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest

      - name: Apply route and inventory closure idempotently
        id: repair_inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/repair_r38_evidence_rotate_key_contract.py
          python tools/advance_r38_evidence_rotate_key_inventory.py
          cargo fmt --all
          cargo check --locked -p syntavra-cli --bin syntavra
          git diff --binary > /tmp/evidence-rotation-first.diff
          python tools/repair_r38_evidence_rotate_key_contract.py
          python tools/advance_r38_evidence_rotate_key_inventory.py
          cargo fmt --all
          git diff --binary > /tmp/evidence-rotation-second.diff
          cmp /tmp/evidence-rotation-first.diff /tmp/evidence-rotation-second.diff

      - name: Build exact selector
        id: build_selector
        run: cargo build --locked -p syntavra-cli --bin syntavra

      - name: Validate evidence and compression compatibility
        id: targeted_tests
        shell: bash
        run: |
          set -euo pipefail
          SYNTAVRA_R38_SELECTOR="$PWD/target/debug/syntavra" \
            python -m pytest -q \
              tests/runtime/test_native_compress_describe_r38.py \
              tests/runtime/test_native_compress_put_r38.py \
              tests/runtime/test_native_compress_get_r38.py \
              tests/runtime/test_native_compress_verify_r38.py \
              tests/runtime/test_native_evidence_get_r38.py \
              tests/runtime/test_native_evidence_rotate_key_r38.py

      - name: Validate full R38 regression closure
        id: full_validator
        run: python tools/validate_r38_regression_closure.py

      - name: Reproduce generated metadata twice
        id: metadata_reproduction
        shell: bash
        run: |
          set -euo pipefail
          reproduce() {
            python tools/repair_r38_selector_option_values.py
            python tools/repair_r38_windows_rollout_identity.py
            python tools/repair_r38_native_expansion_sync.py
            python tools/repair_r38_backup_create_contract.py
            python tools/repair_r38_backup_evidence_parity.py
            python tools/advance_r38_backup_create_inventory.py
            python tools/repair_r38_backup_verify_contract.py
            python tools/advance_r38_backup_verify_inventory.py
            python tools/repair_r38_backup_restore_contract.py
            python tools/advance_r38_backup_restore_inventory.py
            python tools/repair_r38_compress_describe_contract.py
            python tools/advance_r38_compress_describe_inventory.py
            python tools/repair_r38_compress_put_contract.py
            python tools/advance_r38_compress_put_inventory.py
            python tools/repair_r38_compress_get_contract.py
            python tools/advance_r38_compress_get_inventory.py
            python tools/repair_r38_compress_verify_contract.py
            python tools/advance_r38_compress_verify_inventory.py
            python tools/repair_r38_evidence_get_contract.py
            python tools/advance_r38_evidence_get_inventory.py
            python tools/repair_r38_evidence_rotate_key_contract.py
            python tools/advance_r38_evidence_rotate_key_inventory.py
            python tools/sync_r38_generated_metadata.py
            cargo fmt --all
          }
          reproduce
          git diff --binary > /tmp/generated-first.diff
          reproduce
          git diff --binary > /tmp/generated-second.diff
          cmp /tmp/generated-first.diff /tmp/generated-second.diff
          python tools/refresh_manifest.py

      - name: Verify certified inventory contract
        id: inventory_contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('contracts/engine/dual-engine-public-surface-v2.json').read_text(encoding='utf-8'))
          rust = contract['rust_surface']
          assert rust['native_public_command_count'] == 166, rust
          assert rust['missing_native_public_command_count'] == 79, rust
          assert rust['native_coverage_ppm'] == 677551, rust
          assert rust['python_launcher_bridge_command_count'] == 0, rust
          assert 'evidence rotate-key' in rust['native_public_commands'], rust
          missing = json.loads(Path('contracts/engine/r38-missing-native-commands-v1.json').read_text(encoding='utf-8'))
          assert missing['native_public_command_count'] == 166, missing
          assert missing['missing_native_public_command_count'] == 79, missing
          assert 'evidence rotate-key' not in missing['missing_native_public_commands'], missing
          selector = Path('crates/syntavra-cli/src/bin/syntavra.rs').read_text(encoding='utf-8')
          assert 'const NATIVE_COMMAND_COUNT: u64 = 166;' in selector
          print(json.dumps({'ok': True, 'native': 166, 'missing': 79, 'coverage_ppm': 677551, 'bridge': 0}, sort_keys=True))
          PY

      - name: Final locked compile
        id: final_compile
        run: cargo check --locked -p syntavra-cli --bin syntavra

      - name: Commit certified closure to PR branch
        id: atomic_commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "expected certified closure diff" >&2; exit 1; }
          git commit -m "R38: certify native evidence key rotation inventory"
          git push origin HEAD:$HEAD_BRANCH

      - name: Persist isolated failure diagnostics
        if: failure()
        shell: bash
        env:
          EXACT_OUTCOME: ${{ steps.exact_checkout.outcome }}
          REPAIR_OUTCOME: ${{ steps.repair_inventory.outcome }}
          BUILD_OUTCOME: ${{ steps.build_selector.outcome }}
          TARGETED_OUTCOME: ${{ steps.targeted_tests.outcome }}
          VALIDATOR_OUTCOME: ${{ steps.full_validator.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata_reproduction.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory_contract.outcome }}
          COMPILE_OUTCOME: ${{ steps.final_compile.outcome }}
          COMMIT_OUTCOME: ${{ steps.atomic_commit.outcome }}
        run: |
          set -euo pipefail
          git reset --hard "$EXPECTED_SHA"
          git clean -fdx
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'expected_sha': os.environ['EXPECTED_SHA'],
              'outcomes': {
                  'exact_checkout': os.environ.get('EXACT_OUTCOME', ''),
                  'repair_inventory': os.environ.get('REPAIR_OUTCOME', ''),
                  'build_selector': os.environ.get('BUILD_OUTCOME', ''),
                  'targeted_tests': os.environ.get('TARGETED_OUTCOME', ''),
                  'full_validator': os.environ.get('VALIDATOR_OUTCOME', ''),
                  'metadata_reproduction': os.environ.get('METADATA_OUTCOME', ''),
                  'inventory_contract': os.environ.get('INVENTORY_OUTCOME', ''),
                  'final_compile': os.environ.get('COMPILE_OUTCOME', ''),
                  'atomic_commit': os.environ.get('COMMIT_OUTCOME', ''),
              },
          }
          Path('tools/r38-evidence-rotate-key-failure.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/r38-evidence-rotate-key-failure.json
          git commit -m "R38: record evidence rotation certification failure"
          git push origin HEAD:$HEAD_BRANCH
