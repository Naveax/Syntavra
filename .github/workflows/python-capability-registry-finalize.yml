name: Python Capability Registry Finalize

on:
  push:
    branches:
      - agent/capability-completeness-registry-v1

permissions:
  contents: write

concurrency:
  group: python-capability-registry-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/capability-completeness-registry-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install -e .

      - name: Run pre-admission smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_python_authority -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python tools/certify_python_authority.py --out /tmp/python-authority.json
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness.json

      - name: Remove finalizer and refresh canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/python-capability-registry-finalize.yml
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git diff --check

      - name: Commit final registry tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 .github/workflows/python-capability-registry-finalize.yml
          git commit -m "Refresh capability completeness registry manifest"
          git push origin HEAD:agent/capability-completeness-registry-v1
