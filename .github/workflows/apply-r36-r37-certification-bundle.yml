name: Apply R36-R37 Certification Bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/full-parity-r25-r37-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r25-r37-completion
      - name: Apply final architecture bundle
        shell: bash
        run: |
          cat .finalbundle/part-* | base64 -d > /tmp/r25-r37-final.tar.xz
          tar -xJf /tmp/r25-r37-final.tar.xz
          rm -rf .finalbundle
          rm -f .github/workflows/apply-r36-r37-certification-bundle.yml
          python -m py_compile \
            tools/verify_full_parity_catalog.py \
            tools/run_engine_parity_r37.py \
            tools/verify_r36_standalone.py \
            tools/verify_r37_resilience.py
      - name: Commit final architecture bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R25-R37: add standalone and production certification" || exit 0
          git push origin HEAD:feature/full-parity-r25-r37-completion
