name: Capture R7 Git Tree

on:
  pull_request:
    branches: ["feature/dual-engine-r6-config-status"]
    paths:
      - ".github/workflows/r7-tree-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dual-engine-r7-state-receipts
          fetch-depth: 1
      - name: Capture branch commit and tree
        run: |
          git rev-parse HEAD > r7-commit-sha.txt
          git rev-parse 'HEAD^{tree}' > r7-tree-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: syntavra-r7-git-tree-${{ github.sha }}
          path: |
            r7-commit-sha.txt
            r7-tree-sha.txt
          if-no-files-found: error
          retention-days: 7
