name: Temporary Python Completion Report Reconciliation v3

on:
  push:
    branches:
      - agent/python-completion-report-reconciliation-v1
    paths:
      - .github/workflows/tmp-python-completion-report-reconciliation-v3.yml

permissions:
  contents: write

concurrency:
  group: tmp-python-completion-report-reconciliation-v3
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
      TARGET_BRANCH: agent/python-completion-report-reconciliation-v1
      SOURCE_HEAD: 1292e0d3f4cee4c156006e165052fd1165067fdd
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/python-completion-report-reconciliation-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install -e .

      - name: Build and validate helper-free reconciliation
        shell: bash
        run: bash tools/tmp_run_python_completion_reconciliation_v3.sh

      - name: Upload validated reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-completion-report-reconciliation-${{ github.sha }}
          path: |
            /tmp/reconciliation-final.json
            /tmp/reconciliation-final.patch
          if-no-files-found: warn
