name: Dispatch Canonical Immutable Action Dry Run

on:
  push:
    branches:
      - agent/pre-release-immutable-action-pins-finalizer
    paths:
      - '.github/workflows/dispatch-canonical-immutable-action-dry-run.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ab300e84d39c009b609b78324f7f6e7045408bff
    steps:
      - name: Verify canonical main exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$actual" = "$EXPECTED_HEAD"
      - name: Dispatch zero-write immutable-action dry-run
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg ref main \
            --arg head "$EXPECTED_HEAD" \
            '{ref:$ref,inputs:{exact_head:$head,mode:"dry-run",confirmation:"",publish_legacy_native:"false"}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-pre-release.yml/dispatches" --input -
