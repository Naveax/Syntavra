name: Temporary SignalBench Python Product v14r3 Executor

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - automation/signalbench-v14r3-clean-base

permissions:
  contents: write

concurrency:
  group: signalbench-python-product-v14r3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: agent/signalbench-python-product-v1
      TARGET_HEAD: 4878a2f72692be89682c24ea31da94e54a48d929
      MAIN_BASE: ac453b4b2b11f64dd7d4854b444c58aad93d1586
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout exact helper PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve closure runner and verify exact target guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          cp tools/tmp_signalbench_v14r3_runner.py /tmp/signalbench-v14r3-closure.py
          python -m py_compile /tmp/signalbench-v14r3-closure.py
          git fetch origin "$TARGET_BRANCH" main
          actual="$(git rev-parse "origin/$TARGET_BRANCH")"
          main_actual="$(git rev-parse origin/main)"
          printf 'target=%s actual=%s main=%s main_actual=%s helper=%s\n' "$TARGET_HEAD" "$actual" "$MAIN_BASE" "$main_actual" "${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$TARGET_HEAD"
          test "$main_actual" = "$MAIN_BASE"

      - name: Checkout exact canonical SignalBench target
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_HEAD"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Close frozen-arm fixture and manifest compatibility
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/signalbench-v14r3-closure.py
