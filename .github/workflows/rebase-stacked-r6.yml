name: Rebase stacked R6 and preserve ancestry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebase-stacked-r6.yml"

permissions:
  contents: write

jobs:
  rebase-r6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dual-engine-r6-config-status
          fetch-depth: 0
      - name: Rebuild R6 on merged R5 and preserve old stack ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feature/dual-engine-r6-config-status
          git checkout -B r6-rebased origin/main
          git diff --binary \
            8f5c3c4736c9d59c77fc3ddb85ab3d2889bd21ce \
            7582f12e7f8e9eaef6b751a733df7c001a111786 \
            -- . \
            ':(exclude).github/workflows/contract-drift.yml' \
            ':(exclude)MANIFEST.sha256' > /tmp/r6.patch
          git apply --index /tmp/r6.patch
          git config user.name "Syntavra Stack Rebase"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Rebase R6 config and status parity onto merged R5"
          git merge -s ours --no-ff 7582f12e7f8e9eaef6b751a733df7c001a111786 \
            -m "Preserve original R6 stack ancestry"
          git push origin HEAD:feature/dual-engine-r6-config-status --force
