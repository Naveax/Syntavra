name: Assemble R9 Broker Snapshot Parity

on:
  push:
    branches: ["feature/dual-engine-r9-broker-snapshot"]
    paths:
      - ".github/workflows/r9-assembly.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r9-broker-snapshot-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dual-engine-r9-broker-snapshot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - name: Assemble the verified R9 source tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/r9_wire_source_final.py
          cargo check --workspace
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python -m pip install -e . pytest
          python -m pytest -q tests/runtime/test_broker_snapshot_contract_r9.py
          python tools/verify_dual_engine_contract.py
          python tools/verify_broker_snapshot_parity.py
          python tools/run_engine_parity.py
      - name: Commit the verified R9 candidate atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore MANIFEST.sha256
          git add \
            Cargo.lock \
            contracts/state/broker-snapshot-v1.json \
            crates/syntavra-cli/src/broker_snapshot_contract.rs \
            crates/syntavra-cli/src/main.rs \
            syntavra_runtime/broker_snapshot_contract.py \
            tests/runtime/test_broker_snapshot_contract_r9.py \
            tools/run_engine_parity.py
          git diff --cached --check
          git commit -m "Wire R9 logical broker snapshot parity"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin feature/dual-engine-r9-broker-snapshot
            git rebase origin/feature/dual-engine-r9-broker-snapshot
            if git push origin HEAD:feature/dual-engine-r9-broker-snapshot; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
