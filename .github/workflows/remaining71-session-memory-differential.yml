name: Remaining 71 Session Memory Differential

# Exercises exact event-chain, summary, checkpoint, fork and merge parity.
on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: remaining71-session-memory-differential
  cancel-in-progress: false

jobs:
  differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pending parity repair
        run: |
          if [ -f tools/patch_remaining71_session_memory_parity.py ]; then
            python tools/patch_remaining71_session_memory_parity.py
          fi
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Build Rust selector
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
      - name: Run focused Rust JSON parity regression
        run: cargo +1.82.0 test --locked -p syntavra-cli python_json_dumps_sorted_matches_python_spacing
      - name: Run session memory differential
        run: |
          python tools/validate_remaining71_session_memory_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/session-memory-differential.json
      - name: Persist validated repair
        if: github.event_name == 'push'
        run: |
          rm -f tools/patch_remaining71_session_memory_parity.py
          git add crates/syntavra-cli/src/native_remaining71_memory.rs \
            tools/validate_remaining71_session_memory_differential.py \
            tools/patch_remaining71_session_memory_parity.py
          if ! git diff --cached --quiet; then
            git config user.name "syntavra-ci"
            git config user.email "syntavra-ci@users.noreply.github.com"
            git commit -m "Fix session-memory Python Rust parity"
            test -z "$(git status --porcelain --untracked-files=all)"
            git push origin HEAD:agent/r31-provider-capture-native
          fi
      - name: Show exact head and clean tree
        run: |
          echo "head=$(git rev-parse HEAD)"
          git status --porcelain --untracked-files=all
