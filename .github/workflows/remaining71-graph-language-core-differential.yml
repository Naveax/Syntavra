name: Remaining 71 Graph Language Core Differential

# Human trigger after workflow registration.
on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: remaining71-graph-language-core-differential
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - name: Apply bounded frozen-reference parity repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/syntavra-cli/src/native_remaining71_graph_core.rs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"inventory" => language_status(project_root, &database, false),':
                  '"inventory" => language_status(project_root, &database, true),',
              'let detection = detect_language(&project, &source, &data, false)?;':
                  'let detection = detect_language(&project, &source, &data, true)?;',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact replacement precondition failed: {old!r} count={count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/syntavra-cli/src/native_remaining71_graph_core.rs
          git commit -m "Align Graph Language with frozen Python reference"
          git push origin HEAD:agent/r31-provider-capture-native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Build repaired Rust selector
        run: |
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
      - name: Run graph-language core differential
        id: differential
        shell: bash
        run: |
          set +e
          python tools/validate_remaining71_graph_language_core_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/graph-language-core-differential.json \
            > /tmp/graph-language-core-differential.log 2>&1
          status=$?
          cat /tmp/graph-language-core-differential.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload differential diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-language-core-differential
          path: |
            /tmp/graph-language-core-differential.json
            /tmp/graph-language-core-differential.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail on parity mismatch
        if: steps.differential.outputs.exit_code != '0'
        run: exit 2
      - name: Require repaired clean tree
        run: |
          echo "head=$(git rev-parse HEAD)"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
