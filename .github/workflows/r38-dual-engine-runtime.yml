name: R38 Full Dual-Engine Runtime

on:
  push:
    branches:
      - "agent/r38-validation"
  workflow_dispatch:

concurrency:
  group: r38-dual-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  RUSTUP_TOOLCHAIN: "1.82.0"
  CARGO_INCREMENTAL: "0"

jobs:
  inventory-contract:
    name: Inventory and contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python engine
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify complete public-command inventory
        shell: bash
        run: |
          set -o pipefail
          python tools/verify_dual_engine_public_surface.py | tee dual-engine-coverage.json
      - name: Run canonical inventory and metadata regressions
        run: |
          python -m pytest -q \
            tests/runtime/test_dual_engine_public_surface_r38.py \
            tests/runtime/test_installed_python_surface_r38.py \
            tests/runtime/test_r38_generated_metadata_sync.py \
            tests/runtime/test_r38_rust_source_repairs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r38-inventory-contract
          path: dual-engine-coverage.json
          if-no-files-found: warn
          retention-days: 90

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: r38-rust-quality
          cache-on-failure: false
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Build complete Rust workspace
        shell: bash
        run: |
          set -o pipefail
          cargo build --workspace --all-targets --locked 2>&1 | tee rust-build.log
      - name: Run complete Rust workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --locked 2>&1 | tee rust-tests.log
      - name: Run strict Rust lint
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r38-rust-quality-diagnostics
          path: |
            rust-build.log
            rust-tests.log
            clippy.log
          if-no-files-found: warn
          retention-days: 90

  differential:
    name: Differential (${{ matrix.os }})
    needs: [inventory-contract, rust-quality]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extension: ""
          - os: windows-latest
            extension: ".exe"
          - os: macos-latest
            extension: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python engine
        run: python -m pip install --disable-pip-version-check -e . pytest
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: r38-differential-${{ matrix.os }}
          cache-on-failure: false
      - name: Build selector and sibling Rust binaries once
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked --bins 2>&1 | tee platform-build.log
          echo "SYNTAVRA_R38_SELECTOR=$PWD/target/debug/syntavra${{ matrix.extension }}" >> "$GITHUB_ENV"
      - name: Run Python evidence lifecycle regression
        run: python -m pytest -q tests/runtime/test_evidence_key_rotation_r38.py
      - name: Run native Python-Rust differential regressions
        shell: bash
        run: python -m pytest -q tests/runtime/test_native_*_r38.py
      - name: Verify explicit engine selection and fallback prohibition
        shell: bash
        run: |
          selector="target/debug/syntavra${{ matrix.extension }}"
          "$selector" --engine rust version > rust-version.json
          "$selector" --engine python version > python-version.json
          "$selector" engine status > engine-status.json
          grep -q '"fallback": "forbidden"' engine-status.json

          set +e
          "$selector" --engine rust run rewrite -- git status > rust-missing.json
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'RUST_PUBLIC_COMMAND_NOT_IMPLEMENTED' rust-missing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r38-differential-${{ matrix.os }}
          path: |
            platform-build.log
            rust-version.json
            rust-missing.json
            python-version.json
            engine-status.json
          if-no-files-found: warn
          retention-days: 90
