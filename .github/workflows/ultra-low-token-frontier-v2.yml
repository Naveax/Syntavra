name: Ultra-Low Token Frontier V2

on:
  pull_request:
    paths:
      - 'docs/plans/SYNTAVRA_ULTRA_LOW_TOKEN_FRONTIER_V2.md'
      - 'docs/plans/SYNTAVRA_TOKEN_ECONOMY_EXECUTION_BACKLOG_V3.md'
      - 'contracts/python/ultra-low-token-frontier-v2.json'
      - 'contracts/python/token-economy-execution-backlog-v3.json'
      - '.github/workflows/ultra-low-token-frontier-v2.yml'
  push:
    branches: [main]
    paths:
      - 'docs/plans/SYNTAVRA_ULTRA_LOW_TOKEN_FRONTIER_V2.md'
      - 'docs/plans/SYNTAVRA_TOKEN_ECONOMY_EXECUTION_BACKLOG_V3.md'
      - 'contracts/python/ultra-low-token-frontier-v2.json'
      - 'contracts/python/token-economy-execution-backlog-v3.json'
      - '.github/workflows/ultra-low-token-frontier-v2.yml'

permissions:
  contents: read

concurrency:
  group: ultra-low-token-frontier-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate frontier contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          frontier = json.loads(Path('contracts/python/ultra-low-token-frontier-v2.json').read_text(encoding='utf-8'))
          backlog = json.loads(Path('contracts/python/token-economy-execution-backlog-v3.json').read_text(encoding='utf-8'))

          assert frontier['schema_version'] == 2
          assert frontier['family'] == 'syntavra-ultra-low-token-frontier'
          assert frontier['no_new_capability_namespace'] is True
          assert len(frontier['mechanisms']) == 9
          assert len(frontier['waves']) == 7
          ft = frontier['targets']
          assert ft['verified_repeated_provider_tokens'] == 0
          assert ft['easy_warm_stretch_max_tokens'] == 250
          assert ft['easy_frontier_stretch_max_tokens'] == 1000
          assert ft['normal_scoped_coding_stretch_max_tokens'] == 3000
          assert ft['hard_scoped_stretch_max_tokens'] == 6000
          assert ft['eligible_easy_avoidable_reduction_stretch'] == 0.9975
          assert ft['normal_scoped_avoidable_reduction_stretch'] == 0.99
          assert ft['quality_non_inferior'] is True
          assert ft['unexplained_overflow'] == 0

          assert backlog['schema_version'] == 3
          assert backlog['family'] == 'syntavra-token-economy-execution-backlog'
          assert backlog['base_backlog_remains_authoritative'] is True
          assert backlog['no_new_capability_namespace'] is True
          assert len(backlog['new_items']) == 9
          assert backlog['waves'] == ['TE-U8','TE-U9','TE-U10','TE-U11','TE-U12','TE-U13','TE-U14']
          bt = backlog['research_stretch_targets']
          assert bt['verified_repeated_tokens'] == 0
          assert bt['easy_warm_max'] == 250
          assert bt['easy_frontier_max'] == 1000
          assert bt['normal_scoped_coding_max'] == 3000
          assert bt['hard_scoped_max'] == 6000

          frontier_ids = [item['id'] for item in frontier['mechanisms']]
          backlog_ids = [item['id'] for item in backlog['new_items']]
          assert frontier_ids == backlog_ids
          assert len(frontier_ids) == len(set(frontier_ids))
          PY

      - name: Enforce exact clean head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
