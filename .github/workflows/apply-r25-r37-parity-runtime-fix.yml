name: Apply R25-R37 Parity Runtime Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/full-parity-r25-r37-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r25-r37-completion
      - name: Fix Python resource lifetime and verifier transaction binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('syntavra_runtime/full_parity_runtime.py')
          runtime = runtime_path.read_text(encoding='utf-8')
          import_marker = 'import sys\n'
          if 'from contextlib import closing\n' not in runtime:
              if import_marker not in runtime:
                  raise SystemExit('runtime import marker not found')
              runtime = runtime.replace(import_marker, import_marker + 'from contextlib import closing\n', 1)
          replacements = {
              'with _broker_connection(state) as connection:': 'with closing(_broker_connection(state)) as connection:',
              'with _intelligence_connection(state) as connection:': 'with closing(_intelligence_connection(state)) as connection:',
          }
          for old, new in replacements.items():
              if old not in runtime:
                  raise SystemExit(f'missing runtime fragment: {old}')
              runtime = runtime.replace(old, new, 1)
          runtime_path.write_text(runtime, encoding='utf-8')

          verifier_path = Path('tools/verify_r25_r37_full_parity.py')
          verifier = verifier_path.read_text(encoding='utf-8')
          old = '''    invoke("R33", "setup.apply", host="codex")
          invoke("R33", "setup.verify", host="codex")
          invoke("R33", "setup.repair", host="codex")
          invoke("R33", "setup.rollback", host="codex")'''
          new = '''    invoke("R33", "setup.apply", host="codex")
          invoke("R33", "setup.verify", host="codex")
          repaired = invoke("R33", "setup.repair", host="codex")
          invoke(
              "R33",
              "setup.rollback",
              host="codex",
              transaction_id=repaired["result"]["transaction_id"],
          )'''
          if old not in verifier:
              raise SystemExit('verifier R33 sequence not found')
          verifier = verifier.replace(old, new, 1)
          verifier_path.write_text(verifier, encoding='utf-8')
          PY
          python -m py_compile syntavra_runtime/full_parity_runtime.py tools/verify_r25_r37_full_parity.py
          rm -f .github/workflows/apply-r25-r37-parity-runtime-fix.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R25-R37: bind rollback and close SQLite resources" || exit 0
          git push origin HEAD:feature/full-parity-r25-r37-completion
