name: R37 Production Parity Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "syntavra_runtime/full_parity_runtime.py"
      - "crates/syntavra-cli/src/full_parity_runtime.rs"
      - "crates/syntavra-cli/src/bin/syntavra-full-parity.rs"
      - "tools/verify_r25_r37_full_parity.py"
      - "tools/verify_r37_resilience.py"
      - "tools/verify_r25_config_last_good_apply.py"
      - "contracts/parity/**"
      - ".github/workflows/r37-production-certification.yml"
  push:
    branches: [main, "feature/full-parity-r25-r37-completion"]
    paths:
      - "syntavra_runtime/full_parity_runtime.py"
      - "crates/syntavra-cli/src/full_parity_runtime.rs"
      - "crates/syntavra-cli/src/bin/syntavra-full-parity.rs"
      - "tools/verify_r25_r37_full_parity.py"
      - "tools/verify_r37_resilience.py"
      - "tools/verify_r25_config_last_good_apply.py"
      - "contracts/parity/**"
      - ".github/workflows/r37-production-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience:
    name: R37 resilience (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      RUSTUP_TOOLCHAIN: "1.82.0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e . pytest
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          toolchain: 1.82.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: r37-production-certification
          cache-on-failure: false
      - name: Run bidirectional, negative and soak certification
        run: python tools/verify_r37_resilience.py | tee r37-resilience.json
      - name: Re-run R25 crash-recovery boundary
        run: python tools/verify_r25_config_last_good_apply.py | tee r25-crash-recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syntavra-r37-resilience-${{ matrix.os }}
          path: |
            r37-resilience.json
            r25-crash-recovery.json
          if-no-files-found: warn
          retention-days: 90
