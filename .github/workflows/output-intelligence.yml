name: Output Intelligence

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: output-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  output-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
      - name: Run Output Intelligence regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_output_intelligence_v1 -v
      - name: Generate exact-head Output Intelligence certificate
        shell: bash
        run: |
          set -euo pipefail
          python tools/certify_output_intelligence_v1.py --out /tmp/output-intelligence.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('/tmp/output-intelligence.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'OUTPUT_INTELLIGENCE_V1'
          assert report['exact_head'] == head
          assert report['runtime_ready'] is True
          assert report['python_complete_ready'] is False
          assert report['rust_resume_allowed'] is False
          assert report['runtime']['exact_output_store_reused'] is True
          assert report['runtime']['terminal_output_engine_reused'] is True
          assert report['runtime']['semantic_preservation_verifier'] is True
          assert report['runtime']['no_worse_guard'] is True
          assert report['runtime']['fail_closed_on_verification_failure'] is True
          assert report['runtime']['parallel_persistent_store'] is False
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          PY
      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"
      - name: Upload Output Intelligence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: output-intelligence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/output-intelligence.json
          if-no-files-found: error
