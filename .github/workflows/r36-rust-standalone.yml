name: R36 Rust Standalone Distribution

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "tools/verify_r36_standalone.py"
      - ".github/workflows/r36-rust-standalone.yml"
      - "README.md"
      - "LICENSE"
  push:
    branches: [main, "feature/full-parity-r25-r37-completion"]
    paths:
      - "crates/**"
      - "tools/verify_r36_standalone.py"
      - ".github/workflows/r36-rust-standalone.yml"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: R36 standalone (${{ matrix.platform }}-${{ matrix.architecture }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            architecture: x64
            extension: ""
          - os: windows-latest
            platform: windows
            architecture: x64
            extension: ".exe"
          - os: macos-15-intel
            platform: macos
            architecture: x64
            extension: ""
          - os: macos-14
            platform: macos
            architecture: arm64
            extension: ""
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          toolchain: 1.82.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: r36-rust-standalone
          cache-on-failure: false
      - name: Build release binary
        run: cargo build --release --locked --bin syntavra-full-parity
      - name: Assemble Python-free package
        shell: bash
        run: |
          package="dist/syntavra-0.0.1-${{ matrix.platform }}-${{ matrix.architecture }}"
          mkdir -p "$package"
          cp "target/release/syntavra-full-parity${{ matrix.extension }}" "$package/syntavra-full-parity${{ matrix.extension }}"
          cp README.md LICENSE "$package/"
          python tools/verify_r36_standalone.py \
            --binary "$package/syntavra-full-parity${{ matrix.extension }}" \
            --package-dir "$package" \
            --platform "${{ matrix.platform }}" \
            --architecture "${{ matrix.architecture }}" \
            --output "$package/standalone-manifest.json"
      - name: Verify no libpython dependency
        shell: bash
        run: |
          binary="dist/syntavra-0.0.1-${{ matrix.platform }}-${{ matrix.architecture }}/syntavra-full-parity${{ matrix.extension }}"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            ldd "$binary" | tee dependency-scan.txt
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            otool -L "$binary" | tee dependency-scan.txt
          else
            powershell -NoProfile -Command "Get-Item '$binary' | Format-List *" | tee dependency-scan.txt
          fi
          if grep -Eiq 'libpython|python[0-9]*\.dll|Python\.framework' dependency-scan.txt; then
            echo "Python runtime dependency detected" >&2
            exit 1
          fi
      - name: Archive package
        shell: bash
        run: |
          package="dist/syntavra-0.0.1-${{ matrix.platform }}-${{ matrix.architecture }}"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            7z a "${package}.zip" "$package/*"
          else
            tar -C dist -czf "${package}.tar.gz" "$(basename "$package")"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: syntavra-r36-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/syntavra-0.0.1-${{ matrix.platform }}-${{ matrix.architecture }}*
            dependency-scan.txt
          if-no-files-found: error
          retention-days: 90

  certify:
    name: Aggregate R36 standalone certification
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: syntavra-r36-*
          path: artifacts
      - name: Verify four-platform evidence
        shell: bash
        run: |
          count=$(find artifacts -name standalone-manifest.json -print | wc -l)
          test "$count" -eq 4
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(path.read_text()) for path in Path('artifacts').rglob('standalone-manifest.json')]
          assert len(rows) == 4, rows
          assert all(row['python_required'] is False for row in rows), rows
          assert all(row['forbidden_python_files'] == [] for row in rows), rows
          assert {(row['platform'], row['architecture']) for row in rows} == {
              ('linux','x64'), ('windows','x64'), ('macos','x64'), ('macos','arm64')
          }
          print(json.dumps({'ok': True, 'claim': 'RUST_STANDALONE_DISTRIBUTION_PROVEN_R36', 'platforms': 4}, sort_keys=True))
          PY
