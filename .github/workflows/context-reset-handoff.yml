name: Context Reset Handoff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: context-reset-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  context-reset-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Run Context Reset Handoff regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_context_reset_handoff -v

      - name: Certify exact-head Context Reset Handoff
        shell: bash
        run: |
          set -euo pipefail
          python tools/certify_context_reset_handoff.py --out /tmp/context-reset-handoff.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('/tmp/context-reset-handoff.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'CONTEXT_RESET_HANDOFF_V1'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['python_complete_ready'] is False
          assert report['rust_resume_allowed'] is False
          assert report['runtime']['session_memory_authority_reused'] is True
          assert report['runtime']['new_persistent_store'] is False
          assert report['runtime']['secret_material_allowed'] is False
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          PY

      - name: Render lifecycle certification seal candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/context-reset-handoff-lifecycle
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('contracts/python/capability-completeness-registry-v1.json')
          registry = json.loads(path.read_text(encoding='utf-8'))
          row = next(item for item in registry['capabilities'] if item['id'] == 'context_reset_handoff_v1')
          row['state'] = 'certified'
          row['implementation_evidence'] = [
              'syntavra_runtime/session_memory.py',
              'syntavra_runtime/autonomous_agent.py',
              'syntavra_runtime/context_reset_handoff.py',
              'contracts/python/context-reset-handoff-v1.json',
              'tools/certify_context_reset_handoff.py',
              'tests/runtime/test_context_reset_handoff.py',
              '.github/workflows/context-reset-handoff.yml',
          ]
          row['certification_evidence'] = [
              'contracts/python/context-reset-handoff-v1.json',
              'syntavra_runtime/context_reset_handoff.py',
              'tools/certify_context_reset_handoff.py',
              'tests/runtime/test_context_reset_handoff.py',
              '.github/workflows/context-reset-handoff.yml',
          ]
          path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY
          python tools/refresh_manifest.py
          cp contracts/python/capability-completeness-registry-v1.json /tmp/context-reset-handoff-lifecycle/capability-completeness-registry-v1.json
          cp MANIFEST.sha256 /tmp/context-reset-handoff-lifecycle/MANIFEST.sha256
          git checkout -- contracts/python/capability-completeness-registry-v1.json MANIFEST.sha256

      - name: Enforce exact clean pull request head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Context Reset Handoff evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-reset-handoff-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/context-reset-handoff.json
            /tmp/context-reset-handoff-lifecycle/capability-completeness-registry-v1.json
            /tmp/context-reset-handoff-lifecycle/MANIFEST.sha256
          if-no-files-found: error
