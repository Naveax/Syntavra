name: Context Reset Handoff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: context-reset-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  context-reset-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Run Context Reset Handoff regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_context_reset_handoff -v

      - name: Emit runtime surface evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from syntavra_runtime.context_reset_handoff import ContextResetHandoff

          report = ContextResetHandoff.status()
          assert report['claim'] == 'CONTEXT_RESET_HANDOFF_V1'
          assert set(report['decisions']) == {'CONTINUE', 'COMPACT', 'RESET', 'BRANCH'}
          assert report['session_memory_authority_reused'] is True
          assert report['new_persistent_store'] is False
          assert report['secret_material_allowed'] is False
          Path('/tmp/context-reset-handoff.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Enforce exact clean pull request head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Context Reset Handoff evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-reset-handoff-${{ github.event.pull_request.head.sha }}
          path: /tmp/context-reset-handoff.json
          if-no-files-found: error
