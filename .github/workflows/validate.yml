name: Validate Syntavra Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syntavra-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-lifecycle-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 67 &&
      github.event.pull_request.head.ref == 'agent/p0-p4-runtime-consolidation' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Windows-safe patch and SQLite lifecycle fixes
        shell: python
        run: |
          from pathlib import Path

          query = Path("syntavra_runtime/repository_query.py")
          text = query.read_text(encoding="utf-8")
          old_imports = "import sqlite3\nfrom pathlib import Path\nfrom typing import Any, Iterable\n"
          new_imports = "import sqlite3\nfrom contextlib import contextmanager\nfrom pathlib import Path\nfrom typing import Any, Iterable, Iterator\n"
          if text.count(old_imports) != 1:
              raise SystemExit("repository query import anchor mismatch")
          text = text.replace(old_imports, new_imports)
          old_connect = '''    def _connect(self) -> sqlite3.Connection:\n        db = sqlite3.connect(self.database_path, timeout=30.0)\n        db.row_factory = sqlite3.Row\n        db.execute("PRAGMA journal_mode=WAL")\n        return db\n'''
          new_connect = '''    @contextmanager\n    def _connect(self) -> Iterator[sqlite3.Connection]:\n        db = sqlite3.connect(self.database_path, timeout=30.0)\n        db.row_factory = sqlite3.Row\n        db.execute("PRAGMA journal_mode=WAL")\n        try:\n            yield db\n            db.commit()\n        finally:\n            db.close()\n'''
          if text.count(old_connect) != 1:
              raise SystemExit("repository query connection anchor mismatch")
          query.write_text(text.replace(old_connect, new_connect), encoding="utf-8", newline="\n")

          agent = Path("syntavra_runtime/agent_runtime.py")
          text = agent.read_text(encoding="utf-8")
          old_diff = '''            body = list(\n                difflib.unified_diff(\n                    before.splitlines(keepends=True),\n                    after.splitlines(keepends=True),\n                    fromfile=fromfile,\n                    tofile=tofile,\n                    lineterm="",\n                )\n            )\n            if not body:\n                continue\n            rendered = "\\n".join(line.rstrip("\\n") for line in [*header, *body]) + "\\n"\n'''
          new_diff = '''            before_diff = before.replace("\\r\\n", "\\n").replace("\\r", "\\n")\n            after_diff = after.replace("\\r\\n", "\\n").replace("\\r", "\\n")\n            body = list(\n                difflib.unified_diff(\n                    before_diff.splitlines(keepends=True),\n                    after_diff.splitlines(keepends=True),\n                    fromfile=fromfile,\n                    tofile=tofile,\n                    lineterm="",\n                )\n            )\n            if not body:\n                continue\n            rendered = "\\n".join(line.rstrip("\\n") for line in [*header, *body]) + "\\n"\n'''
          if text.count(old_diff) != 1:
              raise SystemExit("structured diff anchor mismatch")
          agent.write_text(text.replace(old_diff, new_diff), encoding="utf-8", newline="\n")

          tests = Path("tests/runtime/test_agent_product_completion.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace("import subprocess\n", "import sqlite3\nimport subprocess\n", 1)
          text = text.replace(
              "from syntavra_runtime.project_model import ProjectModel\n",
              "from syntavra_runtime.project_model import ProjectModel\nfrom syntavra_runtime.repository_query import RepositoryQueryEngine\n",
              1,
          )
          assertion = "    assert checked.returncode == 0, checked.stderr\n"
          if text.count(assertion) != 1:
              raise SystemExit("structured patch assertion anchor mismatch")
          text = text.replace(assertion, '    assert "\\r" not in patch\n' + assertion)
          marker = "\n\ndef test_gateway_structured_edit_and_event_stream"
          regression = '''\n\ndef test_repository_query_connection_is_closed(tmp_path: Path) -> None:\n    database = tmp_path / "graph.sqlite3"\n    with sqlite3.connect(database) as db:\n        db.executescript(\n            """\n            CREATE TABLE nodes (\n                node_id TEXT PRIMARY KEY, path TEXT NOT NULL, kind TEXT NOT NULL,\n                name TEXT NOT NULL, qualified_name TEXT NOT NULL, start_line INTEGER NOT NULL,\n                end_line INTEGER NOT NULL, language TEXT NOT NULL, evidence_ref TEXT NOT NULL,\n                metadata_json TEXT NOT NULL\n            );\n            CREATE TABLE edges (\n                source TEXT NOT NULL, target TEXT NOT NULL, edge_type TEXT NOT NULL,\n                confidence REAL NOT NULL, evidence_ref TEXT NOT NULL, metadata_json TEXT NOT NULL\n            );\n            """\n        )\n    engine = RepositoryQueryEngine(database)\n    with engine._connect() as connection:\n        connection.execute("SELECT 1").fetchone()\n    try:\n        connection.execute("SELECT 1")\n    except sqlite3.ProgrammingError:\n        pass\n    else:\n        raise AssertionError("repository query connection remained open")\n'''
          if text.count(marker) != 1:
              raise SystemExit("test insertion anchor mismatch")
          tests.write_text(text.replace(marker, regression + marker), encoding="utf-8", newline="\n")
      - name: Install runtime and tests
        run: python -m pip install --disable-pip-version-check -q -e . pytest
      - name: Refresh manifest and verify final tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python -m compileall -q syntavra_runtime tools tests
          python -m pytest -q tests/runtime/test_agent_product_completion.py tests/runtime/test_language_cli.py tests/runtime/test_syntavra_unified_platform.py
          python -m tools.validate
          python -m pytest -q
          git diff --check
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syntavra_runtime/repository_query.py syntavra_runtime/agent_runtime.py tests/runtime/test_agent_product_completion.py MANIFEST.sha256
          git diff --cached --check
          git commit -m "Fix Windows patch and SQLite connection lifecycle"
          git push origin HEAD:agent/p0-p4-runtime-consolidation

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Compile canonical package
        run: python -m compileall -q syntavra_runtime skills/syntavra/scripts tools tests benchmarks
      - name: Validate package and locked identity
        run: |
          python -m tools.validate
          python -m syntavra_runtime version
          python -m syntavra_runtime run platform-manifest
      - name: Run complete test suite
        id: package-tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .syntavra/ci
          python -m pytest tests -q > .syntavra/ci/package-tests.log 2>&1
      - name: Upload package test diagnostics
        if: steps.package-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: syntavra-package-tests-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .syntavra/ci/package-tests.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce package test success
        if: steps.package-tests.outcome == 'failure'
        shell: bash
        run: |
          cat .syntavra/ci/package-tests.log
          exit 1
      - name: Check platform registry
        run: python tools/install.py list --output platform-registry.json
      - name: Dry-run native adapters
        run: python tools/install.py install --platforms all-native --scope project --project . --dry-run --output native-dry-run.json
