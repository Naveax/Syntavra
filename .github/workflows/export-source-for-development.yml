name: Apply R25-R37 Development Bundle

on:
  push:
    branches:
      - feature/full-parity-r25-r37-completion
    paths:
      - ".github/workflows/export-source-for-development.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r25-r37-completion
      - name: Apply source bundle
        shell: bash
        run: |
          cat .bundle/part-* | base64 -d > /tmp/r25-r37-core.tar.xz
          tar -xJf /tmp/r25-r37-core.tar.xz
          rm -rf .bundle
          rm -f .github/workflows/export-source-for-development.yml
      - name: Commit source bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R25-R37: add full-parity runtime core" || exit 0
          git push origin HEAD:feature/full-parity-r25-r37-completion
