name: Upgrade Publication Registry Authority V2

on:
  push:
    branches:
      - agent/publication-registry-authority

permissions:
  contents: write

jobs:
  upgrade-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-registry-authority
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align publication authority with promoted native identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          fixture_path = Path('contracts/python/publication-registry-reference-v1.json')
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          fixture['publication_targets']['native'] = {
              'package': 'syntavra-cli',
              'binary': 'syntavra',
              'publish_order': ['syntavra-contracts', 'syntavra-core', 'syntavra-cli'],
              'published': False,
          }
          fixture['publication_targets']['legacy_native_companion'] = {
              'package': 'syntavra-native',
              'workspace_member': False,
              'production_selector': False,
              'published': False,
          }
          fixture['frozen_snapshots']['release_metadata_sha256'] = None
          fixture_path.write_text(json.dumps(fixture, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_once(
              'tools/certify_python_publication_registry_reference.py',
              '    target_names = ["python", "npm", "vscode", "native"]\n',
              '    target_names = ["python", "npm", "vscode", "native", "legacy_native_companion"]\n',
          )
          replace_once(
              'tools/certify_python_publication_registry_reference.py',
              '    expected_boundary = "Registry publication requires owner credentials and successful release receipts."\n',
              '''    native = readiness["native"]\n    legacy_native = readiness["legacy_native_companion"]\n    if native.get("package") != "syntavra-cli" or native.get("binary") != "syntavra":\n        raise AssertionError(f"production native publication identity drift: {native}")\n    if native.get("publish_order") != ["syntavra-contracts", "syntavra-core", "syntavra-cli"]:\n        raise AssertionError(f"production native publish order drift: {native}")\n    if legacy_native.get("package") != "syntavra-native":\n        raise AssertionError(f"legacy native companion identity drift: {legacy_native}")\n    if legacy_native.get("workspace_member") is not False or legacy_native.get("production_selector") is not False:\n        raise AssertionError(f"legacy native companion boundary drift: {legacy_native}")\n\n    expected_boundary = "Registry publication requires owner credentials and successful release receipts."\n''',
          )

          replace_once(
              'tests/runtime/test_python_publication_registry_reference.py',
              '        for target in ("python", "npm", "vscode", "native"):\n',
              '        for target in ("python", "npm", "vscode", "native", "legacy_native_companion"):\n',
          )
          replace_once(
              'tests/runtime/test_python_publication_registry_reference.py',
              '        self.assertEqual(len(release["snapshot_sha256"]), 64)\n',
              '''        native = release["publish_readiness"]["native"]\n        self.assertEqual(native["package"], "syntavra-cli")\n        self.assertEqual(native["binary"], "syntavra")\n        self.assertEqual(native["publish_order"], ["syntavra-contracts", "syntavra-core", "syntavra-cli"])\n        legacy_native = release["publish_readiness"]["legacy_native_companion"]\n        self.assertEqual(legacy_native["package"], "syntavra-native")\n        self.assertFalse(legacy_native["workspace_member"])\n        self.assertFalse(legacy_native["production_selector"])\n        self.assertEqual(len(release["snapshot_sha256"]), 64)\n''',
          )

          replace_once(
              '.github/workflows/python-publication-registry-reference.yml',
              '''on:\n  push:\n    branches:\n      - agent/r31-provider-capture-native\n  pull_request:\n    types: [synchronize]\n''',
              '''on:\n  push:\n    branches:\n      - main\n      - agent/publication-registry-authority\n  pull_request:\n  workflow_dispatch:\n''',
          )
          replace_once(
              '.github/workflows/python-publication-registry-reference.yml',
              "          for target in ('python', 'npm', 'vscode', 'native'):\n",
              "          for target in ('python', 'npm', 'vscode', 'native', 'legacy_native_companion'):\n",
          )
          replace_once(
              '.github/workflows/python-publication-registry-reference.yml',
              "          assert len(value['release']['snapshot_sha256']) == 64\n",
              '''          native = value['release']['publish_readiness']['native']\n          assert native['package'] == 'syntavra-cli'\n          assert native['binary'] == 'syntavra'\n          assert native['publish_order'] == ['syntavra-contracts', 'syntavra-core', 'syntavra-cli']\n          legacy_native = value['release']['publish_readiness']['legacy_native_companion']\n          assert legacy_native['package'] == 'syntavra-native'\n          assert legacy_native['workspace_member'] is False\n          assert legacy_native['production_selector'] is False\n          assert len(value['release']['snapshot_sha256']) == 64\n''',
          )
          PY

      - name: Install runtime and derive frozen release snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python tools/certify_python_publication_registry_reference.py \
            --output /tmp/publication-registry-unfrozen.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from syntavra_runtime.util import canonical_json

          report = json.loads(Path('/tmp/publication-registry-unfrozen.json').read_text(encoding='utf-8'))
          if report.get('ok') is not True:
              raise SystemExit(report)
          digest = report['release']['snapshot_sha256']
          if len(digest) != 64:
              raise SystemExit(f'invalid release snapshot digest: {digest!r}')

          fixture_path = Path('contracts/python/publication-registry-reference-v1.json')
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          fixture['frozen_snapshots']['release_metadata_sha256'] = digest
          fixture_path.write_text(json.dumps(fixture, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          catalog_path = Path('contracts/python/fixture-golden-catalog-v1.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          rows = [row for row in catalog['families'] if row.get('family') == 'publication-registry']
          if len(rows) != 1:
              raise SystemExit(f'publication-registry catalog row count drift: {len(rows)}')
          row = rows[0]
          projection = row['snapshot']['projection']
          projection['release_snapshot_sha256'] = digest
          row['snapshot']['sha256'] = hashlib.sha256(canonical_json(projection)).hexdigest()
          catalog_path.write_text(
              json.dumps(catalog, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          print(f'release_snapshot_sha256={digest}')
          print(f'catalog_publication_snapshot_sha256={row["snapshot"]["sha256"]}')
          PY

      - name: Prove updated publication registry authority
        shell: bash
        run: |
          set -euo pipefail
          python tools/certify_python_publication_registry_reference.py \
            --output /tmp/publication-registry-final.json
          python -m unittest tests.runtime.test_python_publication_registry_reference -v
          python tools/certify_python_fixture_golden_catalog.py \
            --output /tmp/fixture-golden-catalog.json
          python tools/validate_release.py --smoke --output /tmp/release-validation.json

      - name: Finalize clean tree and persisted manifest
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- release-smoke.json || true
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git rm .github/workflows/upgrade-publication-registry-authority.yml
          git rm .github/workflows/upgrade-publication-registry-authority-v2.yml
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git diff --check
          git status --short

      - name: Commit exact upgraded authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align publication registry authority with production native identity'
          git push origin HEAD:agent/publication-registry-authority
