name: Temporary Python Surface Collision Fix

on:
  push:
    branches:
      - agent/r31-provider-capture-native

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact fail-closed parser patch
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('syntavra_runtime/competitive_cli.py')
          source = source_path.read_text(encoding='utf-8')

          old = '    configured = getattr(args, "skill_root", None)\n'
          new = '    configured = getattr(args, "fabric_skill_root", None) or getattr(args, "skill_root", None)\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one _skill_root source, found {source.count(old)}')
          source = source.replace(old, new, 1)

          for parser_name in ('install', 'verify_install', 'rollback_install', 'installations'):
              old = f'    {parser_name}.add_argument("--skill-root")\n'
              new = f'    {parser_name}.add_argument("--skill-root", dest="fabric_skill_root")\n'
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one {parser_name} --skill-root action, found {source.count(old)}')
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/runtime/test_fabric_skill_root_namespace.py')
          if test_path.exists():
              raise SystemExit(f'unexpected pre-existing test file: {test_path}')
          lines = [
              'from __future__ import annotations',
              '',
              'import tempfile',
              'import unittest',
              'from pathlib import Path',
              '',
              'from syntavra_runtime.cli import build_parser',
              'from syntavra_runtime.competitive_cli import _skill_root',
              '',
              '',
              'class FabricSkillRootNamespaceTests(unittest.TestCase):',
              '    def setUp(self):',
              '        self.temp = tempfile.TemporaryDirectory()',
              '        self.root = Path(self.temp.name)',
              '        self.project = self.root / "project"',
              '        self.global_skill = self.root / "global-skill"',
              '        self.child_skill = self.root / "child-skill"',
              '        for path in (self.project, self.global_skill, self.child_skill):',
              '            path.mkdir()',
              '',
              '    def tearDown(self):',
              '        self.temp.cleanup()',
              '',
              '    def _parse(self, *tail: str):',
              '        return build_parser().parse_args([',
              '            "--project", str(self.project),',
              '            "--skill-root", str(self.global_skill),',
              '            *tail,',
              '        ])',
              '',
              '    def test_global_skill_root_survives_fabric_child_defaults(self):',
              '        args = self._parse("fabric", "install", "codex")',
              '        self.assertEqual(args.skill_root, str(self.global_skill))',
              '        self.assertIsNone(args.fabric_skill_root)',
              '        self.assertEqual(_skill_root(args), self.global_skill.resolve())',
              '',
              '    def test_fabric_skill_root_override_has_distinct_namespace(self):',
              '        args = self._parse(',
              '            "fabric", "verify-install", "codex",',
              '            "--skill-root", str(self.child_skill),',
              '        )',
              '        self.assertEqual(args.skill_root, str(self.global_skill))',
              '        self.assertEqual(args.fabric_skill_root, str(self.child_skill))',
              '        self.assertEqual(_skill_root(args), self.child_skill.resolve())',
              '',
              '',
              'if __name__ == "__main__":',
              '    unittest.main()',
              '',
          ]
          test_path.write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Prove parser namespace and host installation semantics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest discover -s tests -p 'test_python_public_surface_audit.py' -v
          python -m unittest discover -s tests/runtime -p 'test_fabric_skill_root_namespace.py' -v
          python -m unittest discover -s tests/runtime -p 'test_host_installation_cli_v4.py' -v
          python tools/report_missing_native_public_routes.py > /tmp/python-public-surface.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/python-public-surface.json').read_text(encoding='utf-8'))
          assert value['ok'] is True, value
          assert value['python']['derived_count'] == 245
          assert value['python']['duplicate_route_count'] == 0
          assert value['python']['namespace_collision_count'] == 0
          PY

      - name: Commit only the proven source and regression changes
        run: |
          git status --short
          git diff --check
          git diff --exit-code -- .github/workflows/tmp-python-surface-collision-fix.yml
          git add syntavra_runtime/competitive_cli.py tests/runtime/test_fabric_skill_root_namespace.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: isolate fabric skill-root parser namespace'
          git push origin HEAD:agent/r31-provider-capture-native
