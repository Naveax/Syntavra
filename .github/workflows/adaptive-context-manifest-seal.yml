name: Adaptive Context Manifest Seal

on:
  push:
    branches:
      - agent/adaptive-context-policy-v1

permissions:
  contents: write
  actions: read

concurrency:
  group: adaptive-context-manifest-seal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_HEAD: c673ceee73656dfa407d7849a44bc67b1bf91c9c
      EXPECTED_BASE_HEAD: ff9fe699b835889f326e2a8b0dfbb7ba334d3949
      PROTECTED_PATH: contracts/engine/dual-engine-public-surface-v2.json
      SEAL_WORKFLOW: .github/workflows/adaptive-context-manifest-seal.yml
      TARGET_BRANCH: agent/adaptive-context-policy-v1
    steps:
      - name: Checkout lifecycle seal commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact superseding boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_HEAD"
          test "$(git diff --name-only "$EXPECTED_SOURCE_HEAD"..HEAD)" = "$SEAL_WORKFLOW"
          test "$(git rev-parse "HEAD:$PROTECTED_PATH")" = "$(git rev-parse "$EXPECTED_BASE_HEAD:$PROTECTED_PATH")"

      - name: Make admitted certifiers lifecycle-stable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one lifecycle fragment, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace_exact(
              "tools/certify_multi_graph_retrieval.py",
              '''    _require(\n        completeness.get("current_milestone") == "multi_graph_retrieval_v1",\n        "registry has not advanced to multi_graph_retrieval_v1",\n    )''',
              '''    _require(\n        bool(completeness.get("current_milestone")),\n        "capability registry current milestone missing",\n    )''',
          )
          replace_exact(
              "tools/certify_multi_graph_retrieval.py",
              '''    _require(\n        (by_id.get("multi_graph_retrieval_v1") or {}).get("state")\n        in {"implemented", "verified"},\n        "Multi-Graph registry state must be pre-certification implemented/verified",\n    )''',
              '''    _require(\n        (by_id.get("multi_graph_retrieval_v1") or {}).get("state")\n        in {"implemented", "verified", "certified"},\n        "Multi-Graph registry state is not admissible",\n    )''',
          )
          replace_exact(
              "tools/certify_adaptive_context_policy.py",
              '''    _require(\n        completeness.get("current_milestone") == "adaptive_context_policy_v1",\n        "registry has not advanced to adaptive_context_policy_v1",\n    )''',
              '''    _require(\n        bool(completeness.get("current_milestone")),\n        "capability registry current milestone missing",\n    )''',
          )
          replace_exact(
              "tools/certify_adaptive_context_policy.py",
              '''    _require(\n        (by_id.get("adaptive_context_policy_v1") or {}).get("state") in {"implemented", "verified"},\n        "Adaptive Context Policy registry state must be pre-certification implemented/verified",\n    )''',
              '''    _require(\n        (by_id.get("adaptive_context_policy_v1") or {}).get("state")\n        in {"implemented", "verified", "certified"},\n        "Adaptive Context Policy registry state is not admissible",\n    )''',
          )
          PY

      - name: Verify lifecycle compatibility and seal manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.runtime.test_multi_graph_retrieval \
            tests.runtime.test_multi_graph_security_hardening \
            tests.runtime.test_adaptive_context_policy \
            -v
          python tools/certify_multi_graph_retrieval.py --out /tmp/multi-graph-retrieval.json
          python tools/certify_adaptive_context_policy.py --out /tmp/adaptive-context-policy.json
          git rm "$SEAL_WORKFLOW"
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git add MANIFEST.sha256 \
            tools/certify_multi_graph_retrieval.py \
            tools/certify_adaptive_context_policy.py
          git diff --check
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n%s\n%s\n' \
            "$SEAL_WORKFLOW" \
            MANIFEST.sha256 \
            tools/certify_adaptive_context_policy.py \
            tools/certify_multi_graph_retrieval.py | sort)"
          test "$staged" = "$expected"

      - name: Commit lifecycle-compatible exact manifest seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Seal Adaptive admission and stabilize admitted certifiers"
          git push origin "HEAD:${TARGET_BRANCH}"
