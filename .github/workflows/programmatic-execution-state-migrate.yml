name: Programmatic Execution State Migration

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: programmatic-execution-state-migrate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/programmatic-execution-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply non-workflow milestone transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('contracts/python/capability-completeness-registry-v1.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          rows = {row['id']: row for row in registry['capabilities']}

          typed = rows['typed_context_object_store_v1']
          assert typed['state'] == 'implemented', typed
          typed['state'] = 'certified'
          typed['certification_evidence'] = [
              'contracts/python/typed-context-object-store-v1.json',
              'syntavra_runtime/typed_context_objects.py',
              'tools/certify_typed_context_object_store.py',
              'tests/runtime/test_typed_context_object_store.py',
              '.github/workflows/typed-context-object-store.yml',
          ]

          programmatic = rows['programmatic_execution_v1']
          assert programmatic['state'] == 'partial', programmatic
          programmatic['state'] = 'implemented'
          programmatic['implementation_evidence'] = [
              'syntavra_runtime/autonomous_agent.py',
              'syntavra_runtime/execution_sandbox.py',
              'syntavra_runtime/programmatic_execution.py',
              'syntavra_runtime/artifacts.py',
              'contracts/python/programmatic-execution-v1.json',
              'tools/certify_programmatic_execution.py',
              'tests/runtime/test_programmatic_execution.py',
              '.github/workflows/programmatic-execution.yml',
          ]
          programmatic['certification_evidence'] = []
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          typed_cert_path = Path('tools/certify_typed_context_object_store.py')
          typed_cert = typed_cert_path.read_text(encoding='utf-8')
          old = '    _require(completeness.get("current_milestone") == "typed_context_object_store_v1", "registry has not advanced to typed_context_object_store_v1")\n'
          assert typed_cert.count(old) == 1, typed_cert.count(old)
          typed_cert = typed_cert.replace(old, '', 1)
          old = '    _require((by_id.get("typed_context_object_store_v1") or {}).get("state") in {"implemented", "verified"}, "Typed Context registry state must be pre-certification implemented/verified")\n'
          new = '''    typed_state = (by_id.get("typed_context_object_store_v1") or {}).get("state")\n    _require(typed_state in {"implemented", "verified", "certified"}, "Typed Context registry state is invalid")\n    if typed_state != "certified":\n        _require(completeness.get("current_milestone") == "typed_context_object_store_v1", "registry has not advanced to Typed Context Object Store v1")\n'''
          assert typed_cert.count(old) == 1, typed_cert.count(old)
          typed_cert_path.write_text(typed_cert.replace(old, new, 1), encoding='utf-8')

          pin_path = Path('tests/runtime/test_release_action_pins.py')
          pin = pin_path.read_text(encoding='utf-8')
          old = '    ".github/workflows/typed-context-object-store.yml",\n)'
          new = '    ".github/workflows/typed-context-object-store.yml",\n    ".github/workflows/programmatic-execution.yml",\n)'
          assert pin.count(old) == 1, pin.count(old)
          pin_path.write_text(pin.replace(old, new, 1), encoding='utf-8')

          validate_path = Path('tools/validate.py')
          validate = validate_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    ROOT / "contracts" / "python" / "typed-context-object-store-v1.json",\n    ROOT / "syntavra_runtime" / "universal_context_item.py",',
                  '    ROOT / "contracts" / "python" / "typed-context-object-store-v1.json",\n    ROOT / "contracts" / "python" / "programmatic-execution-v1.json",\n    ROOT / "syntavra_runtime" / "universal_context_item.py",',
              ),
              (
                  '    ROOT / "syntavra_runtime" / "typed_context_objects.py",\n    ROOT / "syntavra_runtime" / "release_identity.py",',
                  '    ROOT / "syntavra_runtime" / "typed_context_objects.py",\n    ROOT / "syntavra_runtime" / "programmatic_execution.py",\n    ROOT / "syntavra_runtime" / "release_identity.py",',
              ),
              (
                  '    ROOT / "tests" / "runtime" / "test_typed_context_object_store.py",\n    SKILL / "SKILL.md",',
                  '    ROOT / "tests" / "runtime" / "test_typed_context_object_store.py",\n    ROOT / "tests" / "runtime" / "test_programmatic_execution.py",\n    SKILL / "SKILL.md",',
              ),
              (
                  '    ROOT / "tools" / "certify_typed_context_object_store.py",\n    ROOT / ".github" / "workflows" / "universal-context-item.yml",',
                  '    ROOT / "tools" / "certify_typed_context_object_store.py",\n    ROOT / "tools" / "certify_programmatic_execution.py",\n    ROOT / ".github" / "workflows" / "universal-context-item.yml",',
              ),
              (
                  '    ROOT / ".github" / "workflows" / "typed-context-object-store.yml",\n]',
                  '    ROOT / ".github" / "workflows" / "typed-context-object-store.yml",\n    ROOT / ".github" / "workflows" / "programmatic-execution.yml",\n]',
              ),
              (
                  '\n\ndef main() -> int:\n',
                  '''\n\ndef _programmatic_execution_check() -> tuple[bool, str]:\n    try:\n        from tools.certify_programmatic_execution import certify\n        report = certify(ROOT)\n        summary = {\n            "claim": report.get("claim"),\n            "exact_head": report.get("exact_head"),\n            "admission_ready": report.get("admission_ready"),\n            "operations": (report.get("runtime") or {}).get("operations"),\n            "large_result_externalized": (report.get("runtime") or {}).get("large_result_externalized"),\n            "artifact_exact_recovery": (report.get("runtime") or {}).get("artifact_exact_recovery"),\n            "rust_promoted": (report.get("rust") or {}).get("production_promoted"),\n            "rust_resume_allowed": report.get("rust_resume_allowed"),\n        }\n        return bool(report.get("ok")), json.dumps(summary, sort_keys=True)\n    except Exception as exc:\n        return False, f"{type(exc).__name__}: {exc}"\n\n\ndef main() -> int:\n''',
              ),
              (
                  '    typed_ok, typed_detail = _typed_context_object_store_check()\n    checks.append(("typed_context_object_store", typed_ok, typed_detail))\n\n    result = {',
                  '    typed_ok, typed_detail = _typed_context_object_store_check()\n    checks.append(("typed_context_object_store", typed_ok, typed_detail))\n\n    programmatic_ok, programmatic_detail = _programmatic_execution_check()\n    checks.append(("programmatic_execution", programmatic_ok, programmatic_detail))\n\n    result = {',
              ),
          ]
          for old, new in replacements:
              count = validate.count(old)
              assert count == 1, (old[:120], count)
              validate = validate.replace(old, new, 1)
          validate_path.write_text(validate, encoding='utf-8')

          checkpoint_path = Path('docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt')
          checkpoint = checkpoint_path.read_text(encoding='utf-8')
          marker = 'APPENDED CURRENT CHECKPOINT — 2026-08-18 — PROGRAMMATIC EXECUTION ACTIVE'
          assert marker not in checkpoint
          checkpoint += '''\n\n======================================================================\nAPPENDED CURRENT CHECKPOINT — 2026-08-18 — PROGRAMMATIC EXECUTION ACTIVE\n======================================================================\n\nCURRENT ADMITTED MAIN:\n97546e8a9db34afc308a7a5fa2cc7d604b0b9048\n\nACTIVE IMPLEMENTATION BRANCH:\nagent/programmatic-execution-v1\n\nPYTHON STATUS:\nPYTHON-FIRST ACTIVE — typed_context_object_store_v1 is admitted; programmatic_execution_v1 is the current milestone.\n\nRUST STATUS:\nFEATURE FROZEN AND CI-ENFORCED — implementation coverage 245/245; production promotion 174/245; remaining parity/promotion set 71; Rust resume false.\n\nCURRENT IMPLEMENTATION:\n- explicit ProgrammaticFunctionRegistry added; no eval, dynamic import, or implicit callable discovery.\n- typed call/map/parallel/filter/reduce execution added.\n- parallel execution is ordered and requires a callable registered as pure.\n- canonical JSON result identity and content-addressed receipts added.\n- small results remain bounded inline; large results externalize to the existing ArtifactStore.\n- artifact references can feed later programmatic calls with exact recovery verification.\n- item, worker, inline-result, preview, and error-message bounds are explicit.\n- failure receipts redact secret-like values.\n- existing execution sandbox and autonomous agent surfaces remain intact.\n- Programmatic Execution contract, regression suite, certifier and exact-head workflow added.\n\nVERIFIED PRE-ADMISSION BOUNDARY:\n- Typed Context Object Store admitted through PR #140 at main 97546e8a9db34afc308a7a5fa2cc7d604b0b9048.\n- Typed Context registry state advances to certified on this milestone branch.\n- Programmatic Execution grants no Rust promotion credit and creates no parallel database.\n- Python COMPLETE remains false; Rust resume remains false.\n\nNEXT EXACT TASK:\n- run Programmatic Execution branch smoke and exact-head certifier.\n- seal MANIFEST.sha256 from the exact final tree.\n- pass Release Main, Package Provenance, Python Capability Completeness, Rust Freeze and Programmatic Execution exact-head gates.\n- merge, then advance to deferred_tool_discovery_v1.\n'''
          checkpoint_path.write_text(checkpoint, encoding='utf-8')
          PY
          python -m py_compile syntavra_runtime/programmatic_execution.py tools/certify_programmatic_execution.py tools/certify_typed_context_object_store.py tools/validate.py
          git diff --check

      - name: Commit non-workflow milestone transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            contracts/python/capability-completeness-registry-v1.json \
            tools/certify_typed_context_object_store.py \
            tests/runtime/test_release_action_pins.py \
            tools/validate.py \
            docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt
          git commit -m "Advance registry to Programmatic Execution milestone"
          git push origin HEAD:agent/programmatic-execution-v1
