name: Remaining 71 Benchmark CLI Differential

on:
  push:
    branches: [agent/r31-provider-capture-native]
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
      SYNTAVRA_BULK_PARITY_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prepare exact Rust 1.82 CLI
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra

      - name: Run benchmark public differential
        run: |
          python - <<'PY' > /tmp/benchmark-cli.log 2>&1
          import json, os, subprocess, sys, tempfile
          from dataclasses import asdict
          from pathlib import Path
          from syntavra_runtime.benchmark_harness import ArmResult, OBSERVED_BASELINE, TIER_CONFIGS

          repo=Path.cwd(); rust=(repo/'target/debug/syntavra').resolve()
          config={
              'schema_version':2,'tier':'1X','axes':TIER_CONFIGS['1X'],'observed_baseline':OBSERVED_BASELINE,
              'controls':{'same_prompt':True,'same_model':True,'same_reasoning':True,'same_repository':True,'same_verifier':True,'same_permissions':True,'same_timeout':True,'balanced_cache':True,'no_artificial_sleep':True,'no_meaningless_duplication':True},
          }
          common=dict(success=True,verified_work=1.0,model_turns=1,wait_calls=0,verifier_skips=0,security_regressions=0,repository_tree='repo-tree',model='fixture-model',reasoning='fixture-reasoning',prompt_hash='prompt-hash',verifier_hash='verifier-hash',cache_mode='cold',permissions_hash='permissions-hash',timeout_seconds=60.0,workload_hash='workload-hash',observed_axes=dict(OBSERVED_BASELINE))
          baseline=[asdict(ArmResult(arm='baseline',repetition=rep,quota_cost=2.0,fresh_input_tokens=1000,cached_input_tokens=0,output_tokens=100,reasoning_tokens=0,wall_seconds=10.0,order_index=rep,**common)) for rep in range(1,11)]
          candidate=[asdict(ArmResult(arm='syntavra',repetition=rep,quota_cost=1.0,fresh_input_tokens=100,cached_input_tokens=0,output_tokens=10,reasoning_tokens=0,wall_seconds=1.0,order_index=rep,**common)) for rep in range(1,11)]

          def norm(value,root,project,state):
              if isinstance(value,dict): return {k:norm(v,root,project,state) for k,v in value.items()}
              if isinstance(value,list): return [norm(v,root,project,state) for v in value]
              if isinstance(value,str): return value.replace(str(root),'<ROOT>').replace(str(project),'<PROJECT>').replace(str(state),'<STATE>')
              return value

          def invoke(engine,root,project,state,args):
              common_args=['--project',str(project),'--state-root',str(state),*args]
              cmd=[sys.executable,'-m','syntavra_runtime.engine_entry','--engine','python',*common_args] if engine=='python' else [str(rust),'--engine','rust',*common_args]
              env=os.environ.copy();env.update({'PYTHONPATH':str(repo),'PYTHONUTF8':'1','PYTHONIOENCODING':'utf-8','SYNTAVRA_BULK_PARITY_PROBE':'1'})
              done=subprocess.run(cmd,cwd=repo,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,encoding='utf-8',errors='replace',timeout=120,check=False)
              try:value=json.loads(done.stdout) if done.stdout.strip() else None
              except json.JSONDecodeError:value=None
              return {'exit':done.returncode,'value':norm(value,root,project,state),'stderr_nonempty':bool(done.stderr)}

          def run_engine(engine,root):
              project=root/'project';state=root/'state';project.mkdir(parents=True);state.mkdir(parents=True);(project/'.git').mkdir()
              seed_config=root/'seed-config.json';seed_config.write_text(json.dumps(config,separators=(',',':')),encoding='utf-8')
              base=root/'baseline.json';base.write_text(json.dumps({'results':baseline},separators=(',',':')),encoding='utf-8')
              cand=root/'candidate.json';cand.write_text(json.dumps({'results':candidate},separators=(',',':')),encoding='utf-8')
              generated_config=root/'generated-config.json';generated_repo=root/'generated-repo';comparison=root/'comparison.json'
              rows={}
              rows['benchmark_generate_config']=invoke(engine,root,project,state,['benchmark','generate-config','--tier','1X','--output',str(generated_config)])
              rows['benchmark_generate_config']['output_file']=norm(json.loads(generated_config.read_text()),root,project,state) if generated_config.is_file() else None
              rows['benchmark_generate_repo']=invoke(engine,root,project,state,['benchmark','generate-repo','--output',str(generated_repo),'--files','8','--depth','3','--fanout','2','--faults','2'])
              gt=generated_repo/'ground_truth.json';rows['benchmark_generate_repo']['ground_truth']=norm(json.loads(gt.read_text()),root,project,state) if gt.is_file() else None
              rows['benchmark_validate_config']=invoke(engine,root,project,state,['benchmark','validate-config','--config',str(seed_config)])
              rows['benchmark_compare']=invoke(engine,root,project,state,['benchmark','compare','--baseline',str(base),'--syntavra',str(cand),'--config',str(seed_config),'--tier','1X','--output',str(comparison)])
              rows['benchmark_compare']['output_file']=norm(json.loads(comparison.read_text()),root,project,state) if comparison.is_file() else None
              return rows

          with tempfile.TemporaryDirectory(prefix='syntavra-benchmark-cli-') as tmp:
              base=Path(tmp);py=run_engine('python',base/'python');rs=run_engine('rust',base/'rust')
          mismatches=[{'id':name,'python':py[name],'rust':rs.get(name)} for name in py if py[name]!=rs.get(name)]
          report={'ok':not mismatches,'head':os.environ.get('GITHUB_SHA'),'route_count':4,'mismatch_count':len(mismatches),'mismatches':mismatches,'python':py,'rust':rs,'claim_boundary':'offline deterministic public benchmark CLI differential only; synthetic fixture does not prove real superiority; native route count remains frozen'}
          Path('/tmp/benchmark-cli.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps({'ok':report['ok'],'route_count':4,'mismatch_count':len(mismatches)},sort_keys=True))
          for row in mismatches: print('BENCHMARK_MISMATCH '+row['id'])
          raise SystemExit(0 if report['ok'] else 1)
          PY

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-cli-differential
          path: |
            /tmp/benchmark-cli.json
            /tmp/benchmark-cli.log
          if-no-files-found: warn

      - name: Enforce clean exact-head tree
        if: always()
        run: |
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"
