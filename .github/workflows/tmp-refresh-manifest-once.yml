name: Temporary Manifest Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-manifest-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Refresh manifest and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-refresh-manifest-once.yml
          rm -f .syntavra/ci-trigger.txt
          python3 tools/refresh_manifest.py
          python3 tools/refresh_manifest.py --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh manifest after provenance hygiene fix"
          git push origin HEAD:agent/release-authority-action-pins
