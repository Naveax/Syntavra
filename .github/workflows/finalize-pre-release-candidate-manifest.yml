name: Finalize Pre-Release Candidate Manifest

on:
  push:
    branches:
      - agent/pre-release-candidate-authority

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Bootstrap final pre-release candidate manifest'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pre-release-candidate-authority
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove bootstrap-only workflow from candidate tree
        run: rm .github/workflows/finalize-pre-release-candidate-manifest.yml

      - name: Install runtime and verify release authority
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python tools/certify_python_publication_registry_reference.py --output /tmp/publication-registry.json
          python -m unittest tests.runtime.test_python_publication_registry_reference -v
          python -m unittest tests.runtime.test_pre_release_candidate_receipt_plan -v
          python tools/certify_python_fixture_golden_catalog.py --output /tmp/fixture-golden.json
          python tools/validate_release.py --smoke --output /tmp/release-validation.json

      - name: Refresh final manifest from bootstrap-free tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          rm -rf syntavra_runtime.egg-info
          rm -f release-smoke.json fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check

      - name: Persist only final manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only)" = "MANIFEST.sha256"
          git commit -m 'Refresh pre-release candidate manifest'
          git push origin HEAD:agent/pre-release-candidate-authority
