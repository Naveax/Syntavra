name: Temporary R38 Launcher Clippy Fix

on:
  push:
    branches: ["agent/full-dual-engine-runtime"]
    paths:
      - "tools/patch_r38_launcher_clippy.py"
      - ".github/workflows/temp-r38-launcher-clippy-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dual-engine-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Apply deterministic launcher refactor
        run: python tools/patch_r38_launcher_clippy.py
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Remove temporary patch machinery
        run: |
          rm tools/patch_r38_launcher_clippy.py
          rm .github/workflows/temp-r38-launcher-clippy-fix.yml
      - name: Commit exact result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/syntavra-cli/src/bin/syntavra.rs tools/patch_r38_launcher_clippy.py .github/workflows/temp-r38-launcher-clippy-fix.yml
          git commit -m "R38: satisfy strict launcher Clippy"
          git push origin HEAD:agent/full-dual-engine-runtime
