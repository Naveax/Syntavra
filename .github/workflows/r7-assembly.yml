name: Finalize R7 State Receipt Parity

on:
  push:
    branches: ["feature/dual-engine-r7-state-receipts"]
    paths:
      - ".github/workflows/r7-assembly.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7-state-receipt-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dual-engine-r7-state-receipts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - name: Reconstruct verified R7 source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/r7/chunk-{0..6}.b64 | base64 -d > /tmp/r7.tar.gz
          test "$(sha256sum /tmp/r7.tar.gz | cut -d' ' -f1)" = "cc22695a1d965a08269927464b3df5f37717e19a6e9e08a9d0522d97340a7347"
          tar -xzf /tmp/r7.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          import re

          def insert_before_once(text: str, pattern: str, prefix: str, label: str) -> str:
              matches = list(re.finditer(pattern, text, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one {label} marker, found {len(matches)}")
              match = matches[0]
              return text[:match.start()] + prefix + text[match.start():]

          core_path = Path("crates/syntavra-core/src/lib.rs")
          core = core_path.read_text(encoding="utf-8")
          core = insert_before_once(
              core,
              r"^pub fn normalize_repository_path\(",
              """/// Normalizes a repository-relative path without consulting the filesystem.
          ///
          /// # Errors
          ///
          /// Returns [`CanonicalPathError`] when the path is empty, absolute, drive-prefixed,
          /// contains parent traversal, or contains a NUL byte.
          """,
              "normalize_repository_path",
          )
          core = insert_before_once(
              core,
              r"^pub fn canonical_manifest_bytes\(",
              """/// Produces the canonical manifest byte representation for a repository path.
          ///
          /// # Errors
          ///
          /// Returns [`CanonicalPathError`] when `relative_path` violates the repository path
          /// contract.
          """,
              "canonical_manifest_bytes",
          )
          core = insert_before_once(
              core,
              r"^pub fn manifest_digest_hex\(",
              """/// Computes a lowercase SHA-256 digest over canonical manifest bytes.
          ///
          /// # Errors
          ///
          /// Returns [`CanonicalPathError`] when `relative_path` violates the repository path
          /// contract.
          """,
              "manifest_digest_hex",
          )
          core_path.write_text(core, encoding="utf-8")

          receipt_path = Path("crates/syntavra-cli/src/state_receipt_contract.rs")
          receipt = receipt_path.read_text(encoding="utf-8")
          receipt = insert_before_once(
              receipt,
              r"^struct Receipt\s*\{",
              """// Field names intentionally mirror the public receipt wire contract.
          #[allow(clippy::struct_field_names)]
          """,
              "Receipt struct",
          )
          receipt = insert_before_once(
              receipt,
              r"^fn parse_receipt\(",
              """// One ordered function keeps the fail-closed field sequence directly auditable.
          #[allow(clippy::too_many_lines)]
          """,
              "parse_receipt",
          )
          receipt_path.write_text(receipt, encoding="utf-8")
          PY
      - name: Revalidate verified R7 source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python -m pip install -e . pytest
          python -m pytest -q tests/runtime/test_state_receipt_contract_r7.py
          python tools/verify_dual_engine_contract.py
          python tools/verify_engine_selector.py
          python tools/verify_primitive_parity.py
          python tools/verify_config_status_parity.py
          python tools/verify_state_receipt_parity.py
          python tools/run_engine_parity.py
      - name: Commit workflow-independent R7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/contract-drift.yml MANIFEST.sha256
          rm -f .github/r7/last-error.txt
          git add \
            contracts/engine/descriptor.txt \
            contracts/receipts/common.schema.json \
            contracts/state/layout.json \
            crates/syntavra-cli/src/config_contract.rs \
            crates/syntavra-cli/src/main.rs \
            crates/syntavra-cli/src/state_receipt_contract.rs \
            crates/syntavra-contracts/src/lib.rs \
            crates/syntavra-core/src/lib.rs \
            docs/adr/0007-state-layout-receipt-parity.md \
            parity/fixtures/state-receipts-v1.json \
            syntavra_runtime/state_receipt_contract.py \
            tests/runtime/test_state_receipt_contract_r7.py \
            tools/run_engine_parity.py \
            tools/verify_state_receipt_parity.py
          git diff --cached --check
          git commit -m "Add R7 state layout and receipt parity"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin feature/dual-engine-r7-state-receipts
            git rebase origin/feature/dual-engine-r7-state-receipts
            if git push origin HEAD:feature/dual-engine-r7-state-receipts; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
