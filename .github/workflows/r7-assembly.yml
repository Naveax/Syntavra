name: Assemble R7 State Receipt Parity

on:
  push:
    branches: ["feature/dual-engine-r7-state-receipts"]
    paths:
      - ".github/workflows/r7-assembly.yml"
  pull_request:
    branches: ["feature/dual-engine-r6-config-status"]
    paths:
      - ".github/workflows/r7-assembly.yml"
      - ".github/r7/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7-state-receipt-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dual-engine-r7-state-receipts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - name: Extract and harden R7 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/r7/chunk-{0..6}.b64 | base64 -d > /tmp/r7.tar.gz
          test "$(sha256sum /tmp/r7.tar.gz | cut -d' ' -f1)" = "cc22695a1d965a08269927464b3df5f37717e19a6e9e08a9d0522d97340a7347"
          tar -xzf /tmp/r7.tar.gz -C .
          python - <<'PY'
          from pathlib import Path

          core_path = Path("crates/syntavra-core/src/lib.rs")
          core = core_path.read_text(encoding="utf-8")
          core_replacements = {
              "pub fn normalize_repository_path(input: &str) -> Result<String, CanonicalPathError> {": """/// Normalizes a repository-relative path without consulting the filesystem.
          ///
          /// # Errors
          ///
          /// Returns [`CanonicalPathError`] when the path is empty, absolute, drive-prefixed,
          /// contains parent traversal, or contains a NUL byte.
          pub fn normalize_repository_path(input: &str) -> Result<String, CanonicalPathError> {""",
              "pub fn canonical_manifest_bytes(\n    relative_path: &str,\n    input: &[u8],\n) -> Result<Vec<u8>, CanonicalPathError> {": """/// Produces the canonical manifest byte representation for a repository path.
          ///
          /// # Errors
          ///
          /// Returns [`CanonicalPathError`] when `relative_path` violates the repository path
          /// contract.
          pub fn canonical_manifest_bytes(
              relative_path: &str,
              input: &[u8],
          ) -> Result<Vec<u8>, CanonicalPathError> {""",
              "pub fn manifest_digest_hex(\n    relative_path: &str,\n    input: &[u8],\n) -> Result<String, CanonicalPathError> {": """/// Computes a lowercase SHA-256 digest over canonical manifest bytes.
          ///
          /// # Errors
          ///
          /// Returns [`CanonicalPathError`] when `relative_path` violates the repository path
          /// contract.
          pub fn manifest_digest_hex(
              relative_path: &str,
              input: &[u8],
          ) -> Result<String, CanonicalPathError> {""",
          }
          for old, new in core_replacements.items():
              if old not in core:
                  raise SystemExit(f"missing Rust documentation insertion marker: {old!r}")
              core = core.replace(old, new, 1)
          core_path.write_text(core, encoding="utf-8")

          receipt_path = Path("crates/syntavra-cli/src/state_receipt_contract.rs")
          receipt = receipt_path.read_text(encoding="utf-8")
          receipt_replacements = {
              "#[derive(Debug, Clone)]\nstruct Receipt {": """#[derive(Debug, Clone)]
          // The field names intentionally mirror the public receipt wire contract.
          #[allow(clippy::struct_field_names)]
          struct Receipt {""",
              "fn parse_receipt(data: &[u8], expected_project_id: &str) -> Result<Receipt, String> {": """// Keeping the ordered parser in one function makes the fail-closed field sequence auditable.
          #[allow(clippy::too_many_lines)]
          fn parse_receipt(data: &[u8], expected_project_id: &str) -> Result<Receipt, String> {""",
          }
          for old, new in receipt_replacements.items():
              if old not in receipt:
                  raise SystemExit(f"missing R7 lint-boundary insertion marker: {old!r}")
              receipt = receipt.replace(old, new, 1)
          receipt_path.write_text(receipt, encoding="utf-8")
          PY
      - name: Validate assembled R7 package
        id: validate
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            cargo fmt --all
            cargo fmt --all -- --check
            cargo test --workspace --all-targets --locked
            cargo clippy --workspace --all-targets --locked -- -D warnings
            python -m pip install -e .
            python -m pytest -q tests/runtime/test_state_receipt_contract_r7.py
            python tools/verify_dual_engine_contract.py
            python tools/verify_engine_selector.py
            python tools/verify_primitive_parity.py
            python tools/verify_config_status_parity.py
            python tools/verify_state_receipt_parity.py
            python tools/run_engine_parity.py
          ) > /tmp/r7-assembly.txt 2>&1
          status=$?
          cat /tmp/r7-assembly.txt
          cp /tmp/r7-assembly.txt .github/r7/last-error.txt
          exit "$status"
      - name: Upload R7 assembly diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: syntavra-r7-assembly-diagnostics-${{ github.sha }}
          path: .github/r7/last-error.txt
          if-no-files-found: error
          retention-days: 7
      - name: Commit R7 implementation and self-remove
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r7-assembly.yml
          git rm -r .github/r7
          git restore MANIFEST.sha256
          git add -A
          git diff --cached --check
          git commit -m "Add R7 state layout and receipt parity"
          git pull --rebase origin feature/dual-engine-r7-state-receipts
          python tools/refresh_manifest.py
          git add MANIFEST.sha256
          git commit -m "Refresh R7 repository manifest"
          git push origin HEAD:feature/dual-engine-r7-state-receipts
