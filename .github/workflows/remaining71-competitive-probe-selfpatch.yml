name: Remaining 71 Competitive Probe Self Patch

on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: remaining71-competitive-probe
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/r31-provider-capture-native
      - name: Install Rust 1.82.0
        run: rustup toolchain install 1.82.0 --profile minimal --component rustfmt
      - name: Normalize competitive source
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('crates/syntavra-cli/src/native_remaining71_competitive.rs')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r"capability\.replace\(\s*'-'\s*,\s*' '\s*\)",
              "capability.replace('-', \" \")",
              text,
          )
          if count != 1:
              raise SystemExit(f'competitive title normalization expected 1 match, found {count}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply probe integration
        run: python tools/apply_remaining71_competitive_probe.py
      - name: Canonical rustfmt
        run: cargo +1.82.0 fmt --all
      - name: Compile all Rust binaries
        run: cargo +1.82.0 check --locked -p syntavra-cli --bins
      - name: Remove one-shot machinery
        run: |
          rm tools/apply_remaining71_competitive_probe.py
          rm .github/workflows/remaining71-competitive-probe-selfpatch.yml
      - name: Commit probe integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire native competitive closure behind parity probe"
          git fetch origin agent/r31-provider-capture-native
          git rebase origin/agent/r31-provider-capture-native
          git push origin HEAD:agent/r31-provider-capture-native
