name: Remaining 71 Graph Probe Self Patch

on:
  push:
    branches:
      - agent/r31-provider-capture-native

permissions:
  contents: write

concurrency:
  group: remaining71-graph-probe
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/r31-provider-capture-native
      - name: Install Rust 1.82.0
        run: rustup toolchain install 1.82.0 --profile minimal --component rustfmt
      - name: Apply probe integration
        run: python tools/apply_remaining71_graph_probe.py
      - name: Canonical rustfmt
        run: cargo +1.82.0 fmt --all
      - name: Compile all Rust binaries
        run: cargo +1.82.0 check --locked -p syntavra-cli --bins
      - name: Remove one-shot machinery
        run: |
          rm tools/apply_remaining71_graph_probe.py
          rm .github/workflows/remaining71-graph-probe-selfpatch.yml
      - name: Commit probe integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire native graph language closure behind parity probe"
          git fetch origin agent/r31-provider-capture-native
          git rebase origin/agent/r31-provider-capture-native
          git push origin HEAD:agent/r31-provider-capture-native
