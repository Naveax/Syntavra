name: Apply R24 Rustfmt Correction

on:
  push:
    branches:
      - feature/full-parity-r24-read-only-cli-core
    paths:
      - tools/apply_r24_rustfmt_fix.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r24-read-only-cli-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/apply_r24_rustfmt_fix.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/syntavra-cli/src/main.rs
          git commit -m 'Apply R24 rustfmt correction'
          git push origin HEAD:feature/full-parity-r24-read-only-cli-core
