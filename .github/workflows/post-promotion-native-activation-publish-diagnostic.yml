name: Publish Certified Native Activation

on:
  push:
    branches:
      - agent/r31-provider-capture-native

permissions:
  contents: write

concurrency:
  group: publish-certified-native-activation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
      CERTIFIED_PREIMAGE: 20bfa000fa330ea4aff7e6018284bfca72e54705
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact certified product preimage
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code "$CERTIFIED_PREIMAGE" -- \
            crates/syntavra-cli/src/native_product.rs \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/bin/syntavra-remaining71-ownership.rs \
            tools/report_phase2_rust_migration_transition.py \
            tests/runtime/test_phase2_rust_migration_transition.py \
            .github/workflows/phase2-rust-migration-matrix.yml \
            .github/workflows/remaining71-capability-differential.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact already-certified activation patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_post_promotion_native_activation.py
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/syntavra-cli/src/bin/syntavra-remaining71-ownership.rs')
          text = path.read_text(encoding='utf-8')
          replacements = (
              ('            "run benchmark-gate",\n', '            "benchmark compare",\n'),
              ('            "run context evaluate",\n', '            "run context-compile",\n'),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ownership smoke fixture drift: expected one {old.strip()!r}, got {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python tools/apply_post_promotion_selector_ownership_fix.py
          git diff --check

      - name: Require exact product diff set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/publish-diagnostic
          git status --porcelain=v1 --untracked-files=all > /tmp/publish-diagnostic/status-after-patch.txt
          git diff --name-only | sort > /tmp/publish-diagnostic/product-diff-files.txt
          cat > /tmp/expected-product-files.txt <<'EOF'
          .github/workflows/phase2-rust-migration-matrix.yml
          .github/workflows/remaining71-capability-differential.yml
          crates/syntavra-cli/src/bin/syntavra-remaining71-ownership.rs
          crates/syntavra-cli/src/bin/syntavra.rs
          crates/syntavra-cli/src/native_product.rs
          tests/runtime/test_phase2_rust_migration_transition.py
          tools/report_phase2_rust_migration_transition.py
          EOF
          sed -i 's/^          //' /tmp/expected-product-files.txt
          sort /tmp/expected-product-files.txt -o /tmp/expected-product-files.txt
          diff -u /tmp/expected-product-files.txt /tmp/publish-diagnostic/product-diff-files.txt

      - name: Stage certified product and transient harness removal
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/post-promotion-native-activation-selfpatch.yml \
            .github/workflows/post-promotion-native-activation-diagnostic-artifact.yml \
            .github/workflows/post-promotion-native-activation-finalize.yml \
            .github/workflows/post-promotion-native-activation-finalize-v2.yml \
            .github/workflows/post-promotion-native-activation-publish-diagnostic.yml \
            tools/apply_post_promotion_native_activation.py \
            tools/apply_post_promotion_selector_ownership_fix.py

          git add \
            crates/syntavra-cli/src/native_product.rs \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/bin/syntavra-remaining71-ownership.rs \
            tools/report_phase2_rust_migration_transition.py \
            tests/runtime/test_phase2_rust_migration_transition.py \
            .github/workflows/phase2-rust-migration-matrix.yml \
            .github/workflows/remaining71-capability-differential.yml

          git diff --cached --name-status > /tmp/publish-diagnostic/staged-name-status.txt
          git diff --cached --name-only | sort > /tmp/publish-diagnostic/staged-files.txt
          git diff --cached --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit and push with captured diagnostics
        id: publish
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/publish-diagnostic
          remote_head="$(git ls-remote origin refs/heads/agent/r31-provider-capture-native | awk '{print $1}')"
          printf '%s\n' "$remote_head" > /tmp/publish-diagnostic/remote-head-before.txt
          printf '%s\n' "$GITHUB_SHA" > /tmp/publish-diagnostic/github-sha.txt
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "REMOTE_HEAD_MOVED" > /tmp/publish-diagnostic/failure-kind.txt
            echo "commit_rc=125" >> "$GITHUB_OUTPUT"
            echo "push_rc=125" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git commit -m "Activate promoted native surface in production selector" \
            > /tmp/publish-diagnostic/git-commit.out \
            2> /tmp/publish-diagnostic/git-commit.err
          commit_rc=$?
          set -e
          echo "commit_rc=$commit_rc" >> "$GITHUB_OUTPUT"
          if [ "$commit_rc" -ne 0 ]; then
            echo "COMMIT_FAILED" > /tmp/publish-diagnostic/failure-kind.txt
            echo "push_rc=125" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git rev-parse HEAD > /tmp/publish-diagnostic/local-commit-sha.txt
          git show --stat --oneline --decorate=short HEAD > /tmp/publish-diagnostic/local-commit-show.txt

          set +e
          git push origin HEAD:agent/r31-provider-capture-native \
            > /tmp/publish-diagnostic/git-push.out \
            2> /tmp/publish-diagnostic/git-push.err
          push_rc=$?
          set -e
          echo "push_rc=$push_rc" >> "$GITHUB_OUTPUT"
          if [ "$push_rc" -ne 0 ]; then
            echo "PUSH_FAILED" > /tmp/publish-diagnostic/failure-kind.txt
          else
            echo "SUCCESS" > /tmp/publish-diagnostic/failure-kind.txt
          fi

      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certified-activation-publish-${{ github.sha }}
          path: /tmp/publish-diagnostic
          if-no-files-found: error
          retention-days: 3

      - name: Preserve publish result
        if: always()
        shell: bash
        env:
          COMMIT_RC: ${{ steps.publish.outputs.commit_rc }}
          PUSH_RC: ${{ steps.publish.outputs.push_rc }}
        run: |
          set -euo pipefail
          test "${COMMIT_RC:-125}" = "0"
          test "${PUSH_RC:-125}" = "0"
