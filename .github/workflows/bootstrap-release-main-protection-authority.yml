name: Bootstrap Release Main Protection Authority

on:
  push:
    branches:
      - agent/release-main-protection-authority
    paths:
      - '.github/workflows/bootstrap-release-main-protection-authority.yml'
      - 'tools/bootstrap_patch_release_main_protection.py'

permissions:
  contents: read
  actions: read

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-main-protection-authority
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch guarded publish workflow from exact helper
        run: python tools/bootstrap_patch_release_main_protection.py

      - name: Remove bootstrap-only files from final candidate tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-release-main-protection-authority.yml
          rm tools/bootstrap_patch_release_main_protection.py

      - name: Install project runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify main-protection and publication contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_release_main_protection -v
          python -m unittest tests.runtime.test_pre_release_publish_credentials -v
          python -m unittest tests.runtime.test_pre_release_publish_workflow_contract -v
          python -m unittest tests.runtime.test_pre_release_registry_availability -v
          python -m unittest tests.runtime.test_pre_release_publisher_prerequisites -v
          python -m unittest tests.runtime.test_pre_release_candidate_receipt_plan -v
          python -m unittest tests.runtime.test_python_publication_registry_reference -v
          python tools/certify_python_publication_registry_reference.py --output /tmp/publication-registry.json
          python tools/certify_python_fixture_golden_catalog.py --output /tmp/fixture-golden.json
          python tools/validate_release.py --smoke --output /tmp/release-validation.json
          git diff --check

      - name: Observe current main protection without mutation
        shell: bash
        run: |
          set -euo pipefail
          main_head="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > /tmp/release-main-branch.json
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > /tmp/release-main-rules.json
          python tools/check_release_main_protection.py \
            --exact-head "$main_head" \
            --branch-json /tmp/release-main-branch.json \
            --rules-json /tmp/release-main-rules.json \
            --output /tmp/release-main-protection.json

      - name: Upload current main protection evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-main-protection-bootstrap-${{ github.sha }}
          path: /tmp/release-main-protection.json
          if-no-files-found: error
          retention-days: 30

      - name: Reconfirm public registry availability remains zero-write
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_pre_release_registry_availability.py \
            --require-production-available \
            --output /tmp/pre-release-registry-preflight.json

      - name: Refresh manifest from bootstrap-free final tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git checkout -- release-smoke.json 2>/dev/null || true
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check

      - name: Enforce exact final candidate diff
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git status --short | sed -E 's/^.. //')"
          printf '%s\n' "$actual"
          printf '%s\n' "$actual" | grep -Fx '.github/workflows/bootstrap-release-main-protection-authority.yml'
          printf '%s\n' "$actual" | grep -Fx '.github/workflows/publish-pre-release.yml'
          printf '%s\n' "$actual" | grep -Fx 'MANIFEST.sha256'
          printf '%s\n' "$actual" | grep -Fx 'tools/bootstrap_patch_release_main_protection.py'
          test "$(printf '%s\n' "$actual" | sed '/^$/d' | wc -l)" -eq 4

      - name: Stage validated permanent files for artifact export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/main-protection-authority/.github/workflows
          cp .github/workflows/publish-pre-release.yml /tmp/main-protection-authority/.github/workflows/publish-pre-release.yml
          cp MANIFEST.sha256 /tmp/main-protection-authority/MANIFEST.sha256

      - name: Upload validated main protection patch
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-main-protection-authority-${{ github.sha }}
          path: /tmp/main-protection-authority
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
