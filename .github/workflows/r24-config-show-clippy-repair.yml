name: Repair R24 Config Show Rust Clippy

on:
  push:
    branches:
      - feature/full-parity-r24-config-show-cli
    paths:
      - tools/patch_r24_config_show_clippy.py
  pull_request:
    branches:
      - main
    paths:
      - tools/patch_r24_config_show_clippy.py
      - .github/workflows/r24-config-show-clippy-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r24-config-show-cli
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: Apply assertion-locked refactor
        run: python tools/patch_r24_config_show_clippy.py
      - name: Verify pinned Rust workspace
        run: |
          cargo fmt --all
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit verified Rust refactor
        run: |
          if git diff --quiet; then
            echo 'R24 Rust refactor already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/syntavra-cli/src/main.rs
          git commit -m 'Refactor native config snapshot execution for Clippy'
          git push origin HEAD:feature/full-parity-r24-config-show-cli
