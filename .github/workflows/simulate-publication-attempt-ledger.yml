name: Simulate Publication Attempt Ledger

on:
  push:
    branches:
      - agent/pre-release-publication-attempt-ledger
    paths:
      - '.github/workflows/simulate-publication-attempt-ledger.yml'

permissions:
  contents: read
  actions: read

jobs:
  emit-visibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - rust_contracts
          - rust_core
          - rust_cli
          - npm
          - npm_sdk
          - python
          - vscode
    steps:
      - name: Build zero-write simulated visibility evidence
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = os.environ['TARGET']
          package = {
              'rust_contracts': 'syntavra-contracts',
              'rust_core': 'syntavra-core',
              'rust_cli': 'syntavra-cli',
              'npm': '@syntavra/install',
              'npm_sdk': '@syntavra/sdk',
              'python': 'syntavra-runtime',
              'vscode': 'syntavra-vscode',
          }[target]
          registry = {
              'rust_contracts': 'crates.io',
              'rust_core': 'crates.io',
              'rust_cli': 'crates.io',
              'npm': 'npm',
              'npm_sdk': 'npm',
              'python': 'pypi',
              'vscode': 'vscode-marketplace',
          }[target]
          value = {
              'schema_version': 1,
              'product': 'Syntavra',
              'version': '0.0.1',
              'channel': 'pre-release',
              'target': target,
              'registry': registry,
              'package': package,
              'visibility_verified': True,
              'publication_performed_by_checker': False,
              'canonical_readiness_mutated': False,
              'claim': 'PUBLIC_VERSION_VISIBLE',
              'simulation_only': True,
          }
          Path(f'/tmp/evidence/{target}.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pre-release-publication-visibility-sim-${{ matrix.target }}
          path: /tmp/evidence/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1

  aggregate:
    needs: emit-visibility
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical ledger builder
        uses: actions/checkout@v4
        with:
          ref: 51cbbe7abdc8161770ec8931e0dd54ba65aa9e24
          fetch-depth: 0
      - name: Download same-run simulated visibility artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pre-release-publication-visibility-sim-*
          path: /tmp/publication-visibility-artifacts
          merge-multiple: false
      - name: Build simulated job results
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/publication-job-results.json <<'JSON'
          {
            "authority": "success",
            "credential_preflight": "success",
            "legacy_native_companion": "skipped",
            "npm_installer": "success",
            "npm_sdk": "success",
            "pypi": "success",
            "rust_production": "success",
            "vscode": "success"
          }
          JSON
      - name: Build and enforce zero-write attempt ledger
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_pre_release_publication_attempt_ledger.py \
            --exact-head 51cbbe7abdc8161770ec8931e0dd54ba65aa9e24 \
            --visibility-root /tmp/publication-visibility-artifacts \
            --job-results-json /tmp/publication-job-results.json \
            --legacy-requested false \
            --output /tmp/publication-attempt-ledger.json
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path('/tmp/publication-attempt-ledger.json').read_text(encoding='utf-8'))
          assert value['exact_head'] == '51cbbe7abdc8161770ec8931e0dd54ba65aa9e24'
          assert value['observed_visibility_evidence_count'] == 7
          assert value['production_publication_fully_visible'] is True
          assert value['all_requested_visibility_verified'] is True
          assert value['partial_publication_observed'] is False
          assert value['integrity_errors'] == []
          assert value['canonical_readiness_mutated'] is False
          assert value['registry_receipts_admitted'] is False
          assert value['claim'] == 'REQUESTED_PUBLICATION_VISIBILITY_COMPLETE'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-publication-attempt-ledger-51cbbe7abdc8161770ec8931e0dd54ba65aa9e24
          path: /tmp/publication-attempt-ledger.json
          if-no-files-found: error
          retention-days: 1
