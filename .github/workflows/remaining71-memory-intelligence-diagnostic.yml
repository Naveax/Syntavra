name: Remaining 71 Memory Intelligence Diagnostic

# Human trigger after workflow registration.
on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: remaining71-memory-intelligence-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Reuse exact repair patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/remaining71-memory-intelligence-differential.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply memory-intelligence parity repair in workspace'
          start = workflow.index(marker)
          run_line = next(index for index in range(start + 1, len(workflow)) if workflow[index] == '        run: |')
          body = []
          for line in workflow[run_line + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          script = Path('/tmp/apply-memory-intelligence-repair.py')
          script.write_text('\n'.join(body) + '\n', encoding='utf-8')
          subprocess.run(['python', str(script)], check=True)
      - name: Repair validator external-extractor fixture in workspace
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/validate_remaining71_memory_intelligence_differential.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('def create_external_extractor(root: Path) -> tuple[Path, str]:')
          end = source.index('\n\ndef seed_missing_embedding', start)
          replacement = '''def create_external_extractor(root: Path) -> tuple[Path, str]:
              helper = root / "memory_extractor_fixture.py"
              helper.write_text(
                  "#!/usr/bin/env python3\\n"
                  "import json, sys\\n"
                  "request = json.load(open(sys.argv[1], encoding='utf-8'))\\n"
                  "assert 'transcript' in request\\n"
                  "payload = {'observations': [{'text': 'external extractor observation', 'kind': 'decision', 'importance': 0.61, 'confidence': 0.73, 'validity': 1.0, 'metadata': {'source': 'fixture'}}]}\\n"
                  "with open(sys.argv[2], 'w', encoding='utf-8') as handle: json.dump(payload, handle, ensure_ascii=False, sort_keys=True)\\n",
                  encoding="utf-8",
              )
              command = json.dumps([sys.executable, str(helper), "{request}", "{output}"])
              return helper, command
          '''
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')
          compile(source, str(path), 'exec')
      - name: Build repaired Rust selector
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 test --locked -p syntavra-cli python_casefold_matches_sharp_s_expansion -- --exact
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
      - name: Capture memory-intelligence differential
        id: differential
        shell: bash
        run: |
          set +e
          python tools/validate_remaining71_memory_intelligence_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/memory-intelligence-differential.json \
            > /tmp/memory-intelligence-differential.log 2>&1
          status=$?
          cat /tmp/memory-intelligence-differential.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact differential diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-intelligence-differential
          path: |
            /tmp/memory-intelligence-differential.log
            /tmp/memory-intelligence-differential.json
          if-no-files-found: warn
          retention-days: 1
      - name: Fail on parity mismatch
        if: steps.differential.outputs.exit_code != '0'
        run: exit 2
