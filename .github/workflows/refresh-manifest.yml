name: Validate Syntavra Repository Manifest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syntavra-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Normalize final maturity Clippy structure
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/syntavra-cli/src/native_proof_maturity.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "        reasons,\n"
                  "        &onboarding,\n",
                  "        &reasons,\n"
                  "        &onboarding,\n",
              ),
              (
                  "    reasons: Vec<String>,\n"
                  "    onboarding: &OnboardingAssessment,\n",
                  "    reasons: &[String],\n"
                  "    onboarding: &OnboardingAssessment,\n",
              ),
          ]
          for before, after in replacements:
              if text.count(before) == 1:
                  text = text.replace(before, after, 1)
              elif text.count(after) != 1:
                  raise SystemExit(f"unexpected maturity slice state: {before!r}")

          stats = (
              "struct ProviderPairStats {\n"
              "    ratios: Vec<f64>,\n"
              "    observed_pairs: Vec<Flag>,\n"
              "    invalid_pairs: Vec<Value>,\n"
              "    quality: BTreeMap<String, i64>,\n"
              "    total: BTreeMap<String, i64>,\n"
              "}\n"
          )
          summary = stats + (
              "\n"
              "struct ProviderBilledSummary {\n"
              "    confidence_interval: Option<[f64; 2]>,\n"
              "    median_ratio: Option<f64>,\n"
              "    pass_rates: BTreeMap<String, f64>,\n"
              "    observed_count: usize,\n"
              "    claimable: bool,\n"
              "}\n"
          )
          if summary not in text:
              if text.count(stats) != 1:
                  raise SystemExit("unexpected ProviderPairStats state")
              text = text.replace(stats, summary, 1)

          old_call = (
              "    Ok(provider_billed_value(\n"
              "        baseline,\n"
              "        candidate,\n"
              "        &rows,\n"
              "        stats,\n"
              "        ci,\n"
              "        ratio_median,\n"
              "        pass_rates,\n"
              "        observed_count,\n"
              "        claimable,\n"
              "    ))\n"
          )
          new_call = (
              "    let summary = ProviderBilledSummary {\n"
              "        confidence_interval: ci,\n"
              "        median_ratio: ratio_median,\n"
              "        pass_rates,\n"
              "        observed_count,\n"
              "        claimable,\n"
              "    };\n"
              "    Ok(provider_billed_value(\n"
              "        baseline,\n"
              "        candidate,\n"
              "        &rows,\n"
              "        &stats,\n"
              "        &summary,\n"
              "    ))\n"
          )
          if text.count(old_call) == 1:
              text = text.replace(old_call, new_call, 1)
          elif text.count(new_call) != 1:
              raise SystemExit("unexpected provider-billed call state")

          old_output = (
              "fn provider_billed_value(\n"
              "    baseline: &str,\n"
              "    candidate: &str,\n"
              "    rows: &[SignalRun],\n"
              "    stats: ProviderPairStats,\n"
              "    confidence_interval: Option<[f64; 2]>,\n"
              "    median_ratio: Option<f64>,\n"
              "    pass_rates: BTreeMap<String, f64>,\n"
              "    observed_count: usize,\n"
              "    claimable: bool,\n"
              ") -> Value {\n"
              "    json!({\n"
              "        \"baseline\": baseline,\n"
              "        \"candidate\": candidate,\n"
              "        \"valid_pairs\": stats.ratios.len(),\n"
              "        \"invalid_pairs\": stats.invalid_pairs,\n"
              "        \"provider_observed_pairs\": observed_count,\n"
              "        \"provider_unobserved_pairs\": stats.observed_pairs.len() - observed_count,\n"
              "        \"median_efficiency_ratio\": median_ratio,\n"
              "        \"confidence_interval_95\": confidence_interval,\n"
              "        \"pass_rates\": pass_rates,\n"
              "        \"claimable_superiority\": claimable,\n"
              "        \"claim\": if claimable { \"SUPERIORITY_PROVEN\" } else { \"NOT_PROVEN\" },\n"
          )
          new_output = (
              "fn provider_billed_value(\n"
              "    baseline: &str,\n"
              "    candidate: &str,\n"
              "    rows: &[SignalRun],\n"
              "    stats: &ProviderPairStats,\n"
              "    summary: &ProviderBilledSummary,\n"
              ") -> Value {\n"
              "    json!({\n"
              "        \"baseline\": baseline,\n"
              "        \"candidate\": candidate,\n"
              "        \"valid_pairs\": stats.ratios.len(),\n"
              "        \"invalid_pairs\": stats.invalid_pairs,\n"
              "        \"provider_observed_pairs\": summary.observed_count,\n"
              "        \"provider_unobserved_pairs\": stats.observed_pairs.len() - summary.observed_count,\n"
              "        \"median_efficiency_ratio\": summary.median_ratio,\n"
              "        \"confidence_interval_95\": summary.confidence_interval,\n"
              "        \"pass_rates\": summary.pass_rates,\n"
              "        \"claimable_superiority\": summary.claimable,\n"
              "        \"claim\": if summary.claimable { \"SUPERIORITY_PROVEN\" } else { \"NOT_PROVEN\" },\n"
          )
          if text.count(old_output) == 1:
              text = text.replace(old_output, new_output, 1)
          elif text.count(new_output) != 1:
              raise SystemExit("unexpected provider-billed output state")

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Refresh deterministic SHA-256 manifest
        run: python tools/refresh_manifest.py
      - name: Commit normalized source and manifest to same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Source and manifest are already current."
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              MANIFEST.sha256|crates/syntavra-cli/src/native_proof_maturity.rs) ;;
              *) echo "unexpected generated change: $path"; exit 1 ;;
            esac
          done
          remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${SOURCE_BRANCH}" --jq '.object.sha')"
          if [ "$remote_head" != "$SOURCE_SHA" ]; then
            echo "Branch advanced; refusing stale write."
            exit 0
          fi
          update_path() {
            local path="$1" encoded current_sha
            encoded="$(base64 -w0 "$path")"
            current_sha="$(git rev-parse "HEAD:${path}")"
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f "message=R38: normalize final maturity source: ${path}" \
              -f "content=${encoded}" \
              -f "branch=${SOURCE_BRANCH}" \
              -f "sha=${current_sha}" \
              --silent
          }
          update_path crates/syntavra-cli/src/native_proof_maturity.rs
          update_path MANIFEST.sha256
      - name: Verify repository hardening contract
        run: python tools/check_repository_hygiene.py
      - name: Verify deterministic SHA-256 manifest
        run: python tools/refresh_manifest.py --check