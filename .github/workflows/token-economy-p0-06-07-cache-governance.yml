name: Token Economy P0-06 P0-07 Cache Governance

on:
  pull_request:
    paths:
      - 'syntavra_runtime/prompt_cache_optimizer.py'
      - 'syntavra_runtime/cache_provider_budget.py'
      - 'tests/runtime/test_cache_provider_budget_v1.py'
      - 'tests/runtime/test_cache_eviction_governor.py'
      - 'tools/certify_cache_provider_budget_v1.py'
      - 'tools/certify_token_economy_p0_07_cache_eviction_governor.py'
      - 'contracts/python/cache-provider-budget-v1.json'
      - 'contracts/python/token-economy-p0-07-cache-eviction-governor-v1.json'
      - 'docs/TE_P0_06_PROMPT_CACHE_BREAK_DETECTOR.md'
      - 'docs/TE_P0_07_CACHE_BREAK_EVEN_EVICTION_GOVERNOR.md'
      - '.github/workflows/token-economy-p0-06-07-cache-governance.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'syntavra_runtime/prompt_cache_optimizer.py'
      - 'syntavra_runtime/cache_provider_budget.py'
      - 'tests/runtime/test_cache_provider_budget_v1.py'
      - 'tests/runtime/test_cache_eviction_governor.py'
      - 'tools/certify_cache_provider_budget_v1.py'
      - 'tools/certify_token_economy_p0_07_cache_eviction_governor.py'
      - 'contracts/python/cache-provider-budget-v1.json'
      - 'contracts/python/token-economy-p0-07-cache-eviction-governor-v1.json'
      - 'docs/TE_P0_06_PROMPT_CACHE_BREAK_DETECTOR.md'
      - 'docs/TE_P0_07_CACHE_BREAK_EVEN_EVICTION_GOVERNOR.md'
      - '.github/workflows/token-economy-p0-06-07-cache-governance.yml'

permissions:
  contents: read

concurrency:
  group: token-economy-p0-06-07-cache-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: '1'
  SYN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  cache-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Compile cache governance surfaces
        run: |
          set -euo pipefail
          python -m compileall -q \
            syntavra_runtime/prompt_cache_optimizer.py \
            tests/runtime/test_cache_eviction_governor.py \
            tools/certify_token_economy_p0_07_cache_eviction_governor.py

      - name: Revalidate TE-P0-06 cache break attribution
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_cache_provider_budget_v1 -v
          python tools/certify_cache_provider_budget_v1.py --repo . --out /tmp/te-p0-06-cache-break.json

      - name: Prove TE-P0-07 eviction governor
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_cache_eviction_governor -v
          python tools/certify_token_economy_p0_07_cache_eviction_governor.py --repo . --out /tmp/te-p0-07-cache-governor.json

      - name: Enforce clean exact head
        if: always()
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info .pytest_cache
          test "$(git rev-parse HEAD)" = "$SYN_EXPECTED_HEAD"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload cache governance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: token-economy-p0-06-07-cache-governance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/te-p0-06-cache-break.json
            /tmp/te-p0-07-cache-governor.json
          if-no-files-found: error
