name: Bootstrap Pre-Publish Credential Authority

on:
  push:
    branches:
      - agent/pre-publish-credential-authority
    paths:
      - '.github/workflows/bootstrap-pre-publish-credential-authority.yml'
      - 'tools/bootstrap_patch_pre_publish_credential_authority.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pre-publish-credential-authority
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch guarded publish workflow from exact helper
        run: python tools/bootstrap_patch_pre_publish_credential_authority.py

      - name: Remove bootstrap-only files from final candidate tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-pre-publish-credential-authority.yml
          rm tools/bootstrap_patch_pre_publish_credential_authority.py

      - name: Install project runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify credential and publication contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_pre_release_publish_credentials -v
          python -m unittest tests.runtime.test_pre_release_publish_workflow_contract -v
          python -m unittest tests.runtime.test_pre_release_registry_availability -v
          python -m unittest tests.runtime.test_pre_release_publisher_prerequisites -v
          python -m unittest tests.runtime.test_pre_release_candidate_receipt_plan -v
          python -m unittest tests.runtime.test_python_publication_registry_reference -v
          python tools/certify_python_publication_registry_reference.py --output /tmp/publication-registry.json
          python tools/certify_python_fixture_golden_catalog.py --output /tmp/fixture-golden.json
          python tools/validate_release.py --smoke --output /tmp/release-validation.json
          git diff --check

      - name: Reconfirm public registry availability remains zero-write
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_pre_release_registry_availability.py \
            --require-production-available \
            --output /tmp/pre-release-registry-preflight.json

      - name: Refresh manifest from bootstrap-free final tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git checkout -- release-smoke.json 2>/dev/null || true
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check

      - name: Persist credential authority and final manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/bootstrap-pre-publish-credential-authority.yml'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/publish-pre-release.yml'
          printf '%s\n' "$changed" | grep -Fx 'MANIFEST.sha256'
          printf '%s\n' "$changed" | grep -Fx 'tools/bootstrap_patch_pre_publish_credential_authority.py'
          git commit -m 'Add zero-write pre-publish credential authority'
          git push origin HEAD:agent/pre-publish-credential-authority
