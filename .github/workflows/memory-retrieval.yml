name: Memory Retrieval

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: memory-retrieval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  memory-retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Run Memory Retrieval regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_memory_retrieval_v1 -v

      - name: Certify exact-head Memory Retrieval
        shell: bash
        run: |
          set -euo pipefail
          python tools/certify_memory_retrieval_v1.py --out /tmp/memory-retrieval.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('/tmp/memory-retrieval.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'MEMORY_RETRIEVAL_V1'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['python_complete_ready'] is False
          assert report['rust_resume_allowed'] is False
          assert report['runtime']['memory_intelligence_store_reused'] is True
          assert report['runtime']['session_memory_authority_reused'] is True
          assert report['runtime']['new_persistent_database'] is False
          assert report['runtime']['exact_recovery'] is True
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          PY

      - name: Enforce exact clean pull request head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Memory Retrieval evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-retrieval-${{ github.event.pull_request.head.sha }}
          path: /tmp/memory-retrieval.json
          if-no-files-found: error
