name: U5-P0-01 Zero-Token Memory Engine

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'syntavra_runtime/memory.py'
      - 'syntavra_runtime/zero_token_memory.py'
      - 'tests/runtime/test_zero_token_memory_engine.py'
      - 'contracts/python/u5-p0-01-zero-token-memory-engine-v1.json'
      - 'tools/validate_u5_p0_01_zero_token_memory_engine.py'
      - 'docs/U5_P0_01_ZERO_TOKEN_MEMORY_ENGINE.md'
      - '.github/workflows/u5-p0-01-zero-token-memory-engine.yml'
  push:
    branches:
      - main
    paths:
      - 'syntavra_runtime/memory.py'
      - 'syntavra_runtime/zero_token_memory.py'
      - 'tests/runtime/test_zero_token_memory_engine.py'
      - 'contracts/python/u5-p0-01-zero-token-memory-engine-v1.json'
      - 'tools/validate_u5_p0_01_zero_token_memory_engine.py'
      - 'docs/U5_P0_01_ZERO_TOKEN_MEMORY_ENGINE.md'
      - '.github/workflows/u5-p0-01-zero-token-memory-engine.yml'

permissions:
  contents: read

concurrency:
  group: u5-p0-01-zero-token-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run zero-token memory regressions
        run: python -m unittest tests.runtime.test_zero_token_memory_engine -v

      - name: Generate exact-head U5-P0-01 certificate
        run: |
          python tools/validate_u5_p0_01_zero_token_memory_engine.py --out /tmp/u5-p0-01-zero-token-memory-engine.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('/tmp/u5-p0-01-zero-token-memory-engine.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'U5_P0_01_ZERO_TOKEN_MEMORY_ENGINE'
          assert report['mechanism_id'] == 'U5-P0-01'
          assert report['wave'] == 'TE-U30'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['provider_calls'] == 0
          assert report['provider_tokens'] == 0
          runtime = report['runtime']
          assert runtime['raw_exact_authority'] is True
          assert runtime['exact_dedup_idempotent'] is True
          assert runtime['raw_distinct_preserved'] is True
          assert runtime['deterministic_local_retrieval'] is True
          assert runtime['content_addressed_evidence_dedup'] is True
          assert runtime['reference_aware_ttl_gc'] is True
          assert runtime['expired_supersession_reactivation'] is True
          assert runtime['local_reindex'] is True
          assert runtime['project_scope_enforced'] is True
          assert runtime['provider_calls'] == 0
          assert runtime['provider_tokens'] == 0
          PY

      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload U5-P0-01 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u5-p0-01-zero-token-memory-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/u5-p0-01-zero-token-memory-engine.json
          if-no-files-found: error
