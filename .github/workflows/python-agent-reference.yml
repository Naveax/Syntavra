name: Python Agent Reference Contract

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'syntavra_runtime/agent_runtime.py'
      - 'syntavra_runtime/agent_context_runtime.py'
      - 'syntavra_runtime/agent_retrieval.py'
      - 'syntavra_runtime/provider_call_observation.py'
      - 'syntavra_runtime/unified_cli.py'
      - 'tools/certify_python_agent_reference.py'
      - 'tests/runtime/test_python_agent_reference.py'
      - '.github/workflows/python-agent-reference.yml'
  pull_request:
    paths:
      - 'syntavra_runtime/agent_runtime.py'
      - 'syntavra_runtime/agent_context_runtime.py'
      - 'syntavra_runtime/agent_retrieval.py'
      - 'syntavra_runtime/provider_call_observation.py'
      - 'syntavra_runtime/unified_cli.py'
      - 'tools/certify_python_agent_reference.py'
      - 'tests/runtime/test_python_agent_reference.py'
      - '.github/workflows/python-agent-reference.yml'

permissions:
  contents: read

concurrency:
  group: python-agent-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: '1'
  SYN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  python-agent-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Record exact-head identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['SYN_EXPECTED_HEAD']
          value = {'schema_version': 1, 'expected_head': expected, 'actual_head': actual, 'exact_head': actual == expected}
          Path('/tmp/python-agent-reference-head.json').write_text(json.dumps(value, sort_keys=True) + '\n', encoding='utf-8')
          assert actual == expected, value
          PY

      - name: Install runtime dependencies
        run: python -m pip install -e .

      - name: Compile reference surfaces
        run: |
          set -euo pipefail
          python -m compileall -q \
            syntavra_runtime/agent_runtime.py \
            syntavra_runtime/agent_context_runtime.py \
            tools/certify_python_agent_reference.py \
            tests/runtime/test_python_agent_reference.py

      - name: Run Python agent reference regression tests
        run: python -m unittest tests.runtime.test_python_agent_reference -v

      - name: Generate exact-head Python agent reference evidence
        if: always()
        run: |
          set +e
          python tools/certify_python_agent_reference.py \
            --output /tmp/python-agent-reference.json \
            > /tmp/python-agent-reference.log 2>&1
          report_exit=$?
          set -e
          cat /tmp/python-agent-reference.log
          test -f /tmp/python-agent-reference.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/python-agent-reference.json').read_text(encoding='utf-8'))
          if value.get('ok') is not True:
              raise AssertionError(value)
          assert value['engine'] == 'python'
          assert value['routes'] == ['agent run', 'agent replay']
          assert value['transport_protocol'] == 'openai-compatible-chat-json-action'
          assert value['context_transport'] == 'constant-active-evidence-v2'
          assert value['exit_policy'] == {
              'success': 0,
              'application_or_gateway_error': 4,
              'argument_parser_error': 2,
          }
          assert value['api_tool_calling'] == {
              'tools_present': False,
              'tool_choice_present': False,
              'tool_result_transport': 'constant-active-evidence-user-packet',
          }
          run = value['cases']['agent_run_happy']
          assert run['request_rounds'] == 2
          assert run['tool_trace_actions'] == ['search', 'patch']
          assert run['first_message_roles'] == ['system', 'user']
          assert run['second_message_roles'] == ['system', 'user']
          assert run['raw_history_replayed'] is False
          assert 'repo.search' in run['second_active_evidence_tools']
          assert isinstance(run['provider_observation_keys'], list)
          for name in (
              'replay_malformed_json',
              'model_response_not_json_action',
              'model_unknown_action',
              'model_malformed_action_arguments',
              'model_empty_chat_output',
              'model_http_500',
              'model_invalid_http_json',
              'model_endpoint_unavailable',
              'model_endpoint_timeout',
          ):
              assert value['cases'][name]['exit'] == 4, (name, value['cases'][name])
              assert value['cases'][name]['error_code'] == 'PYTHON_PUBLIC_COMMAND_FAILED', (name, value['cases'][name])
          assert value['cases']['replay_missing_required_arguments']['exit'] == 2
          PY
          exit "$report_exit"

      - name: Upload Python agent reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-agent-reference-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/python-agent-reference-head.json
            /tmp/python-agent-reference.json
            /tmp/python-agent-reference.log
          if-no-files-found: error

      - name: Enforce clean exact head
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SYN_EXPECTED_HEAD"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"
