name: R24 Read-Only Completion Assembly

on:
  push:
    branches:
      - feature/full-parity-r24-read-only-completion-certification
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r24-read-only-completion-certification
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Promote and repair completion catalog entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("contracts/parity/python-rust-full-parity-v1.json")
          catalog = json.loads(path.read_text(encoding="utf-8"))
          rows = catalog.get("features")
          if not isinstance(rows, list):
              raise SystemExit("catalog features must be a list")

          by_id = {
              row.get("id"): row
              for row in rows
              if isinstance(row, dict) and isinstance(row.get("id"), str)
          }

          completion = by_id.get("cli.read-only.complete")
          if completion is None:
              raise SystemExit("missing cli.read-only.complete catalog row")

          expected_old = {
              "target_phase": "R24",
              "category": "cli",
              "python_owner": "syntavra_runtime",
              "rust_owner": None,
              "status": "PYTHON_ONLY",
              "mutation": "read-only",
              "contract": None,
              "parity_tests": [],
          }
          desired = {
              "target_phase": "R24",
              "category": "cli",
              "python_owner": "syntavra_runtime",
              "rust_owner": "tools/verify_r24_read_only_completion.py",
              "status": "PARITY_PROVEN",
              "mutation": "read-only",
              "contract": "contracts/parity/r24-read-only-cli-completion-v1.json",
              "parity_tests": ["tools/verify_r24_read_only_completion.py"],
          }
          current = {key: completion.get(key) for key in desired}
          if current == expected_old:
              completion.update(desired)
          elif current != desired:
              raise SystemExit(f"completion catalog row drifted: {current!r}")

          r22_ids = {
              "route.version",
              "route.status",
              "route.config.resolve",
              "route.state.layout",
              "route.state.inspect",
              "route.receipt.inspect",
              "route.state.broker-snapshot",
              "route.state.broker-live-snapshot",
          }
          old_contract = "contracts/engine/auto-routing-v1.json"
          canonical_contract = "contracts/engine/read-only-routing-v11.json"
          for identifier in sorted(r22_ids):
              row = by_id.get(identifier)
              if row is None:
                  raise SystemExit(f"missing R22 catalog row: {identifier}")
              contract = row.get("contract")
              if contract == old_contract:
                  row["contract"] = canonical_contract
              elif contract != canonical_contract:
                  raise SystemExit(
                      f"unexpected R22 contract for {identifier}: {contract!r}"
                  )

          path.write_text(
              json.dumps(catalog, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print("completion row and R22 contract paths are canonical")
          PY

      - name: Remove one-time assembly workflow
        run: git rm .github/workflows/r24-read-only-completion-assembly.yml

      - name: Refresh exact repository manifest
        run: python -m tools.refresh_manifest

      - name: Verify structural completion gate
        run: python tools/verify_r24_read_only_completion.py

      - name: Commit assembled tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/parity/python-rust-full-parity-v1.json MANIFEST.sha256
          git diff --cached --check
          git commit -m "Finalize R24 read-only CLI completion catalog"
          git push origin HEAD:feature/full-parity-r24-read-only-completion-certification
