name: Temporary Headless Engine Error Envelope Repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/r31-provider-capture-native'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
      SYNTAVRA_BULK_PARITY_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply narrow Python engine public-failure envelope
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('syntavra_runtime/engine_entry.py')
          text = path.read_text(encoding='utf-8')
          old = '''    from .unified_cli import main as python_main\n\n    return int(python_main(values))\n'''
          new = '''    from .unified_cli import main as python_main\n\n    try:\n        return int(python_main(values))\n    except (ValueError, KeyError) as exc:\n        _emit(\n            {\n                "ok": False,\n                "error": {\n                    "code": "PYTHON_PUBLIC_COMMAND_FAILED",\n                    "message": "The selected Python engine failed while executing the public command.",\n                    "details": {\n                        "command": command or "<missing>",\n                        "error": f"{type(exc).__name__}: {exc}",\n                        "fallback": "forbidden",\n                    },\n                },\n            }\n        )\n        return 4\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'engine public-failure anchor count: {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Syntax-check candidate
        run: |
          python -m compileall -q syntavra_runtime/engine_entry.py
          git diff --check

      - name: Prepare exact Rust 1.82 toolchain
        run: |
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt

      - name: Build exact Rust selector
        run: |
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra

      - name: Require full headless differential parity
        run: |
          python tools/validate_remaining71_headless_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/headless-engine-envelope.json \
            > /tmp/headless-engine-envelope.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/headless-engine-envelope.json').read_text(encoding='utf-8'))
          assert report['ok'] is True, report['differential']['mismatches']
          assert report['differential']['mismatch_count'] == 0, report['differential']
          print('HEADLESS_ENGINE_ERROR_ENVELOPE_PARITY=PASS')
          PY

      - name: Prove domain-error envelope and unexpected-error boundary
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          repo = Path.cwd()
          with tempfile.TemporaryDirectory(prefix='syntavra-headless-envelope-') as td:
              state = Path(td) / 'state'
              base = [
                  sys.executable, '-m', 'syntavra_runtime.engine_entry',
                  '--engine', 'python', '--project', str(repo), '--state-root', str(state),
              ]
              submitted = subprocess.run(
                  base + ['run', 'headless-submit', '["/bin/sh","-c","true"]'],
                  cwd=repo, text=True, capture_output=True, check=True,
              )
              job = json.loads(submitted.stdout)
              failed = subprocess.run(
                  base + ['run', 'headless-resume', job['job_id']],
                  cwd=repo, text=True, capture_output=True, check=False,
              )
              assert failed.returncode == 4, (failed.returncode, failed.stdout, failed.stderr)
              payload = json.loads(failed.stdout)
              assert payload['ok'] is False, payload
              assert payload['error']['code'] == 'PYTHON_PUBLIC_COMMAND_FAILED', payload
              assert 'job cannot be resumed from queued' in payload['error']['details']['error'], payload
              assert failed.stderr == '', failed.stderr
              print('PYTHON_PUBLIC_DOMAIN_ERROR_ENVELOPE=PASS')
          PY

      - name: Commit proven engine envelope repair
        run: |
          extras="$(git status --porcelain --untracked-files=all | grep -vE ' syntavra_runtime/engine_entry.py$' || true)"
          printf '%s\n' "$extras"
          test -z "$extras"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syntavra_runtime/engine_entry.py
          git diff --cached --check
          git commit -m "fix: align Python public error envelope"
          git push origin HEAD:agent/r31-provider-capture-native
