name: Release Package Provenance

on:
  push:
    branches:
      - main
      - agent/post-r38-release-provenance
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  package-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0

      - name: Verify exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            sdk/typescript/package-lock.json

      - name: Install Python build/runtime tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . build twine

      - name: Install locked npm installer dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Install pinned Rust 1.82
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal
          rustc +1.82.0 --version
          cargo +1.82.0 --version

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p /tmp/release-provenance/{python,npm-installer,npm-sdk,vscode,rust-production,rust-legacy,logs}

      - name: Generate candidate manifest and run release validators
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py 2>&1 | tee /tmp/release-provenance/logs/manifest-refresh.log
          cp MANIFEST.sha256 /tmp/release-provenance/candidate-MANIFEST.sha256
          python tools/refresh_manifest.py --check 2>&1 | tee /tmp/release-provenance/logs/manifest-check.log
          python tools/validate.py 2>&1 | tee /tmp/release-provenance/logs/validate.log
          python tools/validate_release.py --smoke --output /tmp/release-provenance/release-validation.json \
            2>&1 | tee /tmp/release-provenance/logs/validate-release.log
          python -m pytest -q tests/runtime/test_release_publish_identity.py \
            2>&1 | tee /tmp/release-provenance/logs/release-identity-test.log

      - name: Build and inspect Python wheel and sdist
        id: python_package
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m build --outdir /tmp/release-provenance/python 2>&1 | tee /tmp/release-provenance/logs/python-build.log
          python -m twine check /tmp/release-provenance/python/* 2>&1 | tee /tmp/release-provenance/logs/twine-check.log
          python - <<'PY' | tee /tmp/release-provenance/logs/python-artifacts.log
          from pathlib import Path
          root = Path('/tmp/release-provenance/python')
          files = sorted(p.name for p in root.iterdir() if p.is_file())
          assert any(name.endswith('.whl') for name in files), files
          assert any(name.endswith('.tar.gz') for name in files), files
          assert all('0.0.1' in name for name in files), files
          print('\n'.join(files))
          PY

      - name: Test and pack npm installer without publishing
        id: npm_installer
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/release-provenance/logs/npm-installer-test.log
          npm pack --json --pack-destination /tmp/release-provenance/npm-installer \
            > /tmp/release-provenance/npm-installer/pack.json
          cat /tmp/release-provenance/npm-installer/pack.json | tee /tmp/release-provenance/logs/npm-installer-pack.log

      - name: Build test and pack TypeScript SDK without publishing
        id: npm_sdk
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd sdk/typescript
          npm ci 2>&1 | tee /tmp/release-provenance/logs/npm-sdk-install.log
          npm run check 2>&1 | tee /tmp/release-provenance/logs/npm-sdk-check.log
          npm test 2>&1 | tee /tmp/release-provenance/logs/npm-sdk-test.log
          npm pack --json --pack-destination /tmp/release-provenance/npm-sdk \
            > /tmp/release-provenance/npm-sdk/pack.json
          cat /tmp/release-provenance/npm-sdk/pack.json | tee /tmp/release-provenance/logs/npm-sdk-pack.log

      - name: Test and package VS Code extension without publishing
        id: vscode_package
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd integrations/vscode-syntavra
          npm test 2>&1 | tee /tmp/release-provenance/logs/vscode-test.log
          npx --yes @vscode/vsce ls 2>&1 | tee /tmp/release-provenance/logs/vscode-ls.log
          npx --yes @vscode/vsce package \
            --out /tmp/release-provenance/vscode/syntavra-vscode-0.0.1.vsix \
            2>&1 | tee /tmp/release-provenance/logs/vscode-package.log

      - name: Prove production Rust publication graph without publishing
        id: rust_production
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for crate in syntavra-contracts syntavra-core; do
            cargo +1.82.0 package --locked -p "$crate" --allow-dirty --no-verify \
              2>&1 | tee "/tmp/release-provenance/logs/rust-${crate}-package.log"
            test -f "target/package/${crate}-0.0.1.crate"
            cp "target/package/${crate}-0.0.1.crate" /tmp/release-provenance/rust-production/
          done

          cargo +1.82.0 check --locked -p syntavra-cli --bins \
            2>&1 | tee /tmp/release-provenance/logs/rust-syntavra-cli-check.log

          set +e
          cargo +1.82.0 package --locked -p syntavra-cli --allow-dirty --no-verify \
            > /tmp/release-provenance/logs/rust-syntavra-cli-package.log 2>&1
          cli_package_rc=$?
          set -e
          cat /tmp/release-provenance/logs/rust-syntavra-cli-package.log

          python - "$cli_package_rc" <<'PY'
          import json
          import sys
          from pathlib import Path

          rc = int(sys.argv[1])
          log = Path('/tmp/release-provenance/logs/rust-syntavra-cli-package.log').read_text(encoding='utf-8', errors='replace')
          crate = Path('target/package/syntavra-cli-0.0.1.crate')
          if rc == 0:
              if not crate.is_file():
                  raise SystemExit('cargo package succeeded but syntavra-cli crate artifact is missing')
              target = Path('/tmp/release-provenance/rust-production') / crate.name
              target.write_bytes(crate.read_bytes())
              state = 'package-ready'
              dependency = None
          else:
              missing = None
              for name in ('syntavra-contracts', 'syntavra-core'):
                  if f'no matching package named `{name}` found' in log:
                      missing = name
                      break
              if missing is None:
                  raise SystemExit(f'unexpected syntavra-cli cargo package failure rc={rc}')
              state = 'registry-dependency-publication-required'
              dependency = missing
          value = {
              'ok': True,
              'package': 'syntavra-cli',
              'version': '0.0.1',
              'local_build_check': 'passed',
              'package_state': state,
              'blocking_registry_dependency': dependency,
              'publish_order': ['syntavra-contracts', 'syntavra-core', 'syntavra-cli'],
              'registry_publication_performed': False,
          }
          Path('/tmp/release-provenance/rust-production-state.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(value, indent=2, sort_keys=True))
          PY

      - name: Package legacy native companion without publishing
        id: rust_legacy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.82.0 package \
            --manifest-path native/syntavra-native/Cargo.toml \
            --allow-dirty --no-verify \
            2>&1 | tee /tmp/release-provenance/logs/rust-legacy-package.log
          find native/syntavra-native/target/package -maxdepth 1 -type f -name 'syntavra-native-0.0.1.crate' -exec cp {} /tmp/release-provenance/rust-legacy/ \;
          test -f /tmp/release-provenance/rust-legacy/syntavra-native-0.0.1.crate

      - name: Prove release identity mapping
        id: identity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          readiness = json.loads(Path('release/publish-readiness.json').read_text(encoding='utf-8'))
          workspace = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))
          cli = tomllib.loads(Path('crates/syntavra-cli/Cargo.toml').read_text(encoding='utf-8'))
          legacy = tomllib.loads(Path('native/syntavra-native/Cargo.toml').read_text(encoding='utf-8'))

          native = readiness['native']
          legacy_ready = readiness['legacy_native_companion']
          out = {
              'target_head': '${{ env.TARGET_HEAD }}',
              'publish_readiness_native': native,
              'production_selector_crate': cli['package']['name'],
              'production_selector_binary': 'syntavra',
              'legacy_native_crate': legacy['package']['name'],
              'workspace_excludes_legacy_native': 'native/syntavra-native' in workspace['workspace']['exclude'],
              'identity_ambiguity': native['package'] != cli['package']['name'] or legacy_ready['production_selector'] is not False,
          }
          Path('/tmp/release-provenance/release-identity-mapping.json').write_text(
              json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(out, indent=2, sort_keys=True))
          assert native['package'] == 'syntavra-cli', out
          assert native['binary'] == 'syntavra', out
          assert native['publish_order'] == ['syntavra-contracts', 'syntavra-core', 'syntavra-cli'], out
          assert native['published'] is False, out
          assert legacy_ready['package'] == 'syntavra-native', out
          assert legacy_ready['production_selector'] is False, out
          assert out['workspace_excludes_legacy_native'] is True, out
          assert out['identity_ambiguity'] is False, out
          PY

      - name: Restore tracked manifest and enforce clean repository
        id: clean_tree
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- MANIFEST.sha256
          rm -rf syntavra_runtime.egg-info
          rm -f release-smoke.json fusion-release-smoke.json platform-registry.json native-dry-run.json
          git status --porcelain --untracked-files=all | tee /tmp/release-provenance/logs/clean-tree-status.log
          test ! -s /tmp/release-provenance/logs/clean-tree-status.log

      - name: Attest non-published package artifacts
        id: attestation
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            /tmp/release-provenance/python/*
            /tmp/release-provenance/npm-installer/*.tgz
            /tmp/release-provenance/npm-sdk/*.tgz
            /tmp/release-provenance/vscode/*.vsix
            /tmp/release-provenance/rust-production/*.crate
            /tmp/release-provenance/rust-legacy/*.crate
            /tmp/release-provenance/candidate-MANIFEST.sha256
            /tmp/release-provenance/release-identity-mapping.json
            /tmp/release-provenance/rust-production-state.json

      - name: Upload package provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-package-provenance-${{ env.TARGET_HEAD }}
          path: /tmp/release-provenance
          if-no-files-found: error
          retention-days: 7

      - name: Enforce non-publishing release readiness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "baseline=${{ steps.baseline.outcome }}" \
            "python_package=${{ steps.python_package.outcome }}" \
            "npm_installer=${{ steps.npm_installer.outcome }}" \
            "npm_sdk=${{ steps.npm_sdk.outcome }}" \
            "vscode_package=${{ steps.vscode_package.outcome }}" \
            "rust_production=${{ steps.rust_production.outcome }}" \
            "rust_legacy=${{ steps.rust_legacy.outcome }}" \
            "identity=${{ steps.identity.outcome }}" \
            "clean_tree=${{ steps.clean_tree.outcome }}" \
            "attestation=${{ steps.attestation.outcome }}"
          test "${{ steps.baseline.outcome }}" = success
          test "${{ steps.python_package.outcome }}" = success
          test "${{ steps.npm_installer.outcome }}" = success
          test "${{ steps.npm_sdk.outcome }}" = success
          test "${{ steps.vscode_package.outcome }}" = success
          test "${{ steps.rust_production.outcome }}" = success
          test "${{ steps.rust_legacy.outcome }}" = success
          test "${{ steps.identity.outcome }}" = success
          test "${{ steps.clean_tree.outcome }}" = success
          if [ "${{ github.event_name }}" = "push" ]; then
            test "${{ steps.attestation.outcome }}" = success
          fi
