name: Unified Context Namespace

on:
  push:
    branches:
      - main
      - agent/unified-context-namespace-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unified-context-namespace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unified-context-namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Run Unified Context Namespace regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_context_namespace -v

      - name: Generate exact-head Unified Context Namespace certificate
        shell: bash
        run: |
          set -euo pipefail
          python tools/certify_context_namespace.py --out /tmp/unified-context-namespace.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('/tmp/unified-context-namespace.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'UNIFIED_CONTEXT_NAMESPACE_V1'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['python_complete_ready'] is True
          assert report['rust_resume_allowed'] is False
          assert report['runtime']['syntavra_scheme'] is True
          assert report['runtime']['progressive_repo_directory_file_symbol_lines'] is True
          assert report['runtime']['l0_identity_only'] is True
          assert report['runtime']['l2_structural_without_scalar_payload'] is True
          assert report['runtime']['l3_integrity_checked_exact_reveal'] is True
          assert report['runtime']['retrieval_trajectory'] is True
          assert report['runtime']['parallel_persistent_store'] is False
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          PY

      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Unified Context Namespace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-context-namespace-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/unified-context-namespace.json
          if-no-files-found: error
