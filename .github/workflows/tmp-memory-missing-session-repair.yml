name: Temporary Memory Missing Session Repair

on:
  push:
    branches:
      - agent/r31-provider-capture-native
    paths:
      - .github/workflows/tmp-memory-missing-session-repair.yml

permissions:
  contents: write

concurrency:
  group: tmp-memory-missing-session-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - name: Require branch did not move before repair
        run: |
          git fetch origin agent/r31-provider-capture-native
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/r31-provider-capture-native)"
      - name: Apply narrow frozen memory session repair
        run: |
          python - <<'PY'
          from pathlib import Path

          memory = Path("crates/syntavra-cli/src/native_remaining71_memory.rs")
          text = memory.read_text(encoding="utf-8")

          old_events = (
              "fn session_events(path: &Path, session_id: &str) -> Result<Vec<Value>, String> {\n"
              "    let db = init_session(path)?;\n"
              "    let mut statement = db\n"
          )
          new_events = (
              "fn session_events(path: &Path, session_id: &str) -> Result<Vec<Value>, String> {\n"
              "    let db = init_session(path)?;\n"
              "    let exists: Option<i64> = db\n"
              "        .query_row(\n"
              "            \"SELECT 1 FROM sessions WHERE session_id=?1\",\n"
              "            [session_id],\n"
              "            |row| row.get(0),\n"
              "        )\n"
              "        .optional()\n"
              "        .map_err(|error| format!(\"SESSION_EVENTS_SESSION_QUERY:{error}\"))?;\n"
              "    if exists.is_none() {\n"
              "        return Err(format!(\"KeyError: '{session_id}'\"));\n"
              "    }\n"
              "    let mut statement = db\n"
          )
          if text.count(old_events) != 1:
              raise SystemExit(f"session_events precondition failed: {text.count(old_events)}")
          text = text.replace(old_events, new_events, 1)

          old_checkpoint = (
              "fn checkpoint_session(path: &Path, session_id: &str, label: &str) -> Result<Value, String> {\n"
              "    let db = init_session(path)?;\n"
              "    let last = db\n"
          )
          new_checkpoint = (
              "fn checkpoint_session(path: &Path, session_id: &str, label: &str) -> Result<Value, String> {\n"
              "    let db = init_session(path)?;\n"
              "    let exists: Option<i64> = db\n"
              "        .query_row(\n"
              "            \"SELECT 1 FROM sessions WHERE session_id=?1\",\n"
              "            [session_id],\n"
              "            |row| row.get(0),\n"
              "        )\n"
              "        .optional()\n"
              "        .map_err(|error| format!(\"SESSION_CHECKPOINT_SESSION_QUERY:{error}\"))?;\n"
              "    if exists.is_none() {\n"
              "        return Err(format!(\"KeyError: '{session_id}'\"));\n"
              "    }\n"
              "    let last = db\n"
          )
          if text.count(old_checkpoint) != 1:
              raise SystemExit(f"checkpoint precondition failed: {text.count(old_checkpoint)}")
          text = text.replace(old_checkpoint, new_checkpoint, 1)
          memory.write_text(text, encoding="utf-8")

          product = Path("crates/syntavra-cli/src/native_product.rs")
          text = product.read_text(encoding="utf-8")
          old_boundary = (
              "    if bulk_parity_probe_enabled() && native_remaining71_memory::supports(command) {\n"
              "        return native_remaining71_memory::execute(command, &arguments, project_root, state_root);\n"
              "    }\n"
          )
          new_boundary = (
              "    if bulk_parity_probe_enabled() && native_remaining71_memory::supports(command) {\n"
              "        return match native_remaining71_memory::execute(command, &arguments, project_root, state_root) {\n"
              "            Ok(value) => Ok(value),\n"
              "            Err(error) => emit_failed_decision(\n"
              "                &serde_json::json!({\n"
              "                    \"ok\": false,\n"
              "                    \"error\": {\n"
              "                        \"code\": \"PYTHON_PUBLIC_COMMAND_FAILED\",\n"
              "                        \"message\": \"The selected Python engine failed while executing the public command.\",\n"
              "                        \"details\": {\n"
              "                            \"command\": command.first().map(String::as_str).unwrap_or(\"\"),\n"
              "                            \"error\": error,\n"
              "                            \"fallback\": \"forbidden\"\n"
              "                        }\n"
              "                    }\n"
              "                }),\n"
              "                4,\n"
              "            ),\n"
              "        };\n"
              "    }\n"
          )
          if text.count(old_boundary) != 1:
              raise SystemExit(f"memory boundary precondition failed: {text.count(old_boundary)}")
          product.write_text(text.replace(old_boundary, new_boundary, 1), encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'crates/syntavra-cli/src/native_product.rs\ncrates/syntavra-cli/src/native_remaining71_memory.rs'
      - name: Build exact repair
        run: |
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
      - name: Verify frozen missing-session boundary
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          binary = Path("target/debug/syntavra").resolve(strict=True)
          env = os.environ.copy()
          env["SYNTAVRA_BULK_PARITY_PROBE"] = "1"

          with tempfile.TemporaryDirectory(prefix="syntavra-memory-missing-repair-") as directory:
              root = Path(directory)
              project = root / "project"
              project.mkdir()
              (project / ".git").mkdir()
              state = root / "state"

              def call(*parts):
                  completed = subprocess.run(
                      [str(binary), "--engine", "rust", "--project", str(project), "--state-root", str(state), *parts],
                      env=env,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      encoding="utf-8",
                      errors="replace",
                      check=False,
                  )
                  value = json.loads(completed.stdout) if completed.stdout.strip() else None
                  return completed.returncode, value, completed.stderr

              code, value, stderr = call("run", "memory-open", "--session-id", "existing")
              assert code == 0 and stderr == "" and value.get("restored") is False, (code, value, stderr)
              code, value, stderr = call("run", "memory-verify", "existing")
              assert code == 0 and stderr == "" and value.get("ok") is True and value.get("events") == 0, (code, value, stderr)

              for parts in [
                  ("run", "memory-verify", "missing-session"),
                  ("run", "memory-retrieve", "missing-session", "query"),
                  ("run", "memory-checkpoint", "missing-session"),
              ]:
                  code, value, stderr = call(*parts)
                  assert code == 4 and stderr == "", (parts, code, value, stderr)
                  error = value.get("error") or {}
                  details = error.get("details") or {}
                  assert error.get("code") == "PYTHON_PUBLIC_COMMAND_FAILED", (parts, value)
                  assert details.get("error") == "KeyError: 'missing-session'", (parts, value)
          PY
      - name: Commit exact repair only if branch stayed fixed
        run: |
          git fetch origin agent/r31-provider-capture-native
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/r31-provider-capture-native)"
          test "$(git diff --name-only | sort)" = $'crates/syntavra-cli/src/native_product.rs\ncrates/syntavra-cli/src/native_remaining71_memory.rs'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/syntavra-cli/src/native_product.rs crates/syntavra-cli/src/native_remaining71_memory.rs
          git commit -m "Align missing session memory errors with Python"
          git push origin HEAD:agent/r31-provider-capture-native
