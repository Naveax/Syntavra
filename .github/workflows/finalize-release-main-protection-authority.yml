name: Finalize Release Main Protection Authority

on:
  push:
    branches:
      - agent/release-main-protection-authority
    paths:
      - '.github/workflows/finalize-release-main-protection-authority.yml'

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-main-protection-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove finalizer from final candidate tree
        shell: bash
        run: rm .github/workflows/finalize-release-main-protection-authority.yml
      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify final main-protection publication authority
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_release_main_protection -v
          python -m unittest tests.runtime.test_pre_release_publish_credentials -v
          python -m unittest tests.runtime.test_pre_release_publish_workflow_contract -v
          python -m unittest tests.runtime.test_pre_release_registry_availability -v
          python -m unittest tests.runtime.test_pre_release_publisher_prerequisites -v
          python -m unittest tests.runtime.test_pre_release_candidate_receipt_plan -v
          python -m unittest tests.runtime.test_python_publication_registry_reference -v
          python tools/certify_python_publication_registry_reference.py --output /tmp/publication-registry.json
          python tools/certify_python_fixture_golden_catalog.py --output /tmp/fixture-golden.json
          python tools/validate_release.py --smoke --output /tmp/release-validation.json
      - name: Observe current main protection without mutation
        shell: bash
        run: |
          set -euo pipefail
          main_head="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > /tmp/release-main-branch.json
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > /tmp/release-main-rules.json
          python tools/check_release_main_protection.py \
            --exact-head "$main_head" \
            --branch-json /tmp/release-main-branch.json \
            --rules-json /tmp/release-main-rules.json \
            --output /tmp/release-main-protection.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-main-protection-final-${{ github.sha }}
          path: /tmp/release-main-protection.json
          if-no-files-found: error
          retention-days: 30
      - name: Reconfirm zero-write registry availability
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_pre_release_registry_availability.py \
            --require-production-available \
            --output /tmp/pre-release-registry-preflight.json
      - name: Refresh bootstrap-free final manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git checkout -- release-smoke.json 2>/dev/null || true
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check
      - name: Persist only final manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256
          test "$(git diff --cached --name-only)" = 'MANIFEST.sha256'
          git commit -m 'Refresh release main protection authority manifest'
          git push origin HEAD:agent/release-main-protection-authority
