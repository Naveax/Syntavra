name: Deferred Tool Discovery Checkpoint Append

on:
  push:
    branches:
      - agent/deferred-tool-discovery-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deferred-checkpoint-append-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# one-shot append workflow; connector removes it after the checkpoint commit
jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/deferred-tool-discovery-v1
          fetch-depth: 0

      - name: Append immutable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          file='docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt'
          marker='APPENDED CURRENT CHECKPOINT — 2026-08-18 — DEFERRED TOOL DISCOVERY ACTIVE'
          if grep -Fq "$marker" "$file"; then
            echo 'checkpoint already appended'
            exit 0
          fi
          cat >> "$file" <<'EOF'

======================================================================
APPENDED CURRENT CHECKPOINT — 2026-08-18 — DEFERRED TOOL DISCOVERY ACTIVE
======================================================================

CURRENT ADMITTED MAIN:
60354a5e2c09757492e4e8c97f4135de7dd0e6d7

ACTIVE IMPLEMENTATION BRANCH:
agent/deferred-tool-discovery-v1

ACTIVE PR:
#142 — Add Deferred Tool Discovery v1

PYTHON STATUS:
PYTHON-FIRST ACTIVE — programmatic_execution_v1 is admitted; deferred_tool_discovery_v1 is the current milestone.

RUST STATUS:
FEATURE FROZEN AND CI-ENFORCED — implementation coverage 245/245; production promotion 174/245; remaining parity/promotion set 71; Rust resume false.

COMPLETED / ADMITTED BEFORE THIS MILESTONE:
- typed_context_object_store_v1 admitted through PR #140.
- programmatic_execution_v1 admitted through PR #141 and main 60354a5e2c09757492e4e8c97f4135de7dd0e6d7.
- capability registry now records programmatic_execution_v1 as certified.

CURRENT IMPLEMENTATION:
- DeferredToolDiscoveryEngine added over the existing MCPToolPolicy and ToolSchemaCompiler authorities.
- Stage 1 exposes semantic families, namespace tree, risk labels, health/compatibility state and capability fingerprints without full input schemas.
- Stage 2 requires an explicit selector and expands only selected schemas under negotiated profile/host token budget and max-tool limits.
- host risk capabilities and namespace prefixes constrain visibility and expansion.
- unavailable/incompatible tools are excluded before discovery expansion.
- deterministic bounded discovery cache is bound to query, catalog hash, profile, host fingerprint and health fingerprint.
- explicit no-tool-needed classification added.
- unknown semantic query, unknown selector and equal-top family ambiguity fail closed.
- additive MCP discover_tools/discovery_status APIs added while existing tools/list behavior remains intact.
- internal family virtualization does not create synthetic executable tools or a parallel registry.
- Deferred Tool Discovery contract, 19-test regression suite, certifier and exact-head workflow added.
- Release Main gate, repository validator and immutable action-pin policy are bound to Deferred Tool Discovery.

VERIFIED:
- Deferred Tool Discovery regression suite PASS 19/19 on GitHub runner.
- Programmatic Execution regression suite PASS 15/15 after admitted-state migration.
- immutable action-pin regression PASS 6/6 after adding Deferred workflow coverage.
- Programmatic Execution post-admission certificate PASS.
- Deferred Tool Discovery pre-seal certificate PASS with admission_ready=true.
- Stage 1 schema deferral, Stage 2 explicit expansion, host negotiation, health filtering, schema token budgeting, no-tool-needed classification and fail-closed unknown behavior verified.
- Python COMPLETE remains false.
- Rust production authority remains 174/245 and Rust resume remains false.

BLOCKERS:
- canonical MANIFEST.sha256 still needs exact final-tree seal after this checkpoint and temporary workflow cleanup.
- final exact-head Deferred Tool Discovery, Programmatic Execution, Capability Completeness, Rust Freeze, Python Authority, Release Main and Package Provenance gates must pass before merge.

NEXT EXACT TASK:
- remove this temporary checkpoint workflow after the append commit.
- generate canonical exact-tree candidate MANIFEST.sha256 and apply it byte-for-byte.
- run final exact-head admission gates for PR #142.
- merge only after all load-bearing gates pass.
- after admission advance to unified_context_namespace_v1.
EOF
          git diff --check -- "$file"

      - name: Commit checkpoint only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt; then
            echo 'no checkpoint change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt
          git diff --cached --check
          git commit -m 'Append Deferred Tool Discovery checkpoint'
          git push origin HEAD:agent/deferred-tool-discovery-v1
