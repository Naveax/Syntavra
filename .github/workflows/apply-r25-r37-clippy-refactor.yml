name: Apply R25-R37 Clippy Refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/full-parity-r25-r37-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r25-r37-completion
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Refactor native runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/syntavra-cli/src/full_parity_runtime.rs')
          source = path.read_text(encoding='utf-8')

          old = '''fn mutation(
              database: bool,
              filesystem: bool,
              host: bool,
              network: bool,
              process: bool,
          ) -> Mutation {
              BTreeMap::from([
                  ("database", database),
                  ("filesystem", filesystem),
                  ("host", host),
                  ("network", network),
                  ("process", process),
              ])
          }'''
          new = '''fn mutation(flags: [bool; 5]) -> Mutation {
              let [database, filesystem, host, network, process] = flags;
              BTreeMap::from([
                  ("database", database),
                  ("filesystem", filesystem),
                  ("host", host),
                  ("network", network),
                  ("process", process),
              ])
          }'''
          if old not in source:
              raise SystemExit('mutation helper block not found')
          source = source.replace(old, new, 1)

          # Wrap every five-argument mutation call in an array without touching the definition.
          cursor = 0
          pieces = []
          while True:
              index = source.find('mutation(', cursor)
              if index < 0:
                  pieces.append(source[cursor:])
                  break
              pieces.append(source[cursor:index])
              start = index + len('mutation(')
              depth = 1
              position = start
              in_string = False
              escaped = False
              while position < len(source) and depth:
                  char = source[position]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == '"':
                          in_string = False
                  else:
                      if char == '"':
                          in_string = True
                      elif char == '(':
                          depth += 1
                      elif char == ')':
                          depth -= 1
                  position += 1
              if depth != 0:
                  raise SystemExit('unbalanced mutation call')
              arguments = source[start:position - 1]
              top_level_commas = 0
              nested = 0
              in_string = False
              escaped = False
              for char in arguments:
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == '"':
                          in_string = False
                  else:
                      if char == '"':
                          in_string = True
                      elif char in '([{':
                          nested += 1
                      elif char in ')]}':
                          nested -= 1
                      elif char == ',' and nested == 0:
                          top_level_commas += 1
              if top_level_commas == 4:
                  pieces.append(f'mutation([{arguments}])')
              else:
                  pieces.append(source[index:position])
              cursor = position
          source = ''.join(pieces)

          replacements = {
              '''fn set_private_mode(path: &Path) {
              #[cfg(unix)]
              {
                  use std::os::unix::fs::PermissionsExt;
                  if let Ok(metadata) = fs::metadata(path) {
                      let mut permissions = metadata.permissions();
                      permissions.set_mode(0o600);
                      let _ = fs::set_permissions(path, permissions);
                  }
              }
          }''': '''fn set_private_mode(path: &Path) {
              #[cfg(unix)]
              {
                  use std::os::unix::fs::PermissionsExt;
                  if let Ok(metadata) = fs::metadata(path) {
                      let mut permissions = metadata.permissions();
                      permissions.set_mode(0o600);
                      let _ = fs::set_permissions(path, permissions);
                  }
              }
              #[cfg(not(unix))]
              let _ = path;
          }''',
              '''    result: Value,
              mutation: Mutation,
          ) -> Result<String> {''': '''    result: &Value,
              mutation: &Mutation,
          ) -> Result<String> {''',
              '''        "receipt": receipt(phase, operation, project_id, request, &result)?,''': '''        "receipt": receipt(phase, operation, project_id, request, result)?,''',
              '''        result,
              mutation_value,
          )''': '''        &result,
              &mutation_value,
          )''',
              '''    Ok(json!({
                  "bytes_delta": text.len() as i64 - normalized.len() as i64,
                  "rewritten": normalized,
                  "sha256": digest(normalized.as_bytes()),
              }))''': '''    let original_bytes = i64::try_from(text.len())
                  .map_err(|_| FullParityFailure::new("CONTEXT_INPUT_TOO_LARGE"))?;
              let rewritten_bytes = i64::try_from(normalized.len())
                  .map_err(|_| FullParityFailure::new("CONTEXT_INPUT_TOO_LARGE"))?;
              Ok(json!({
                  "bytes_delta": original_bytes - rewritten_bytes,
                  "rewritten": normalized,
                  "sha256": digest(normalized.as_bytes()),
              }))''',
              '''    match std::str::from_utf8(&raw[..end]) {
                  Ok(value) => value,
                  Err(_) => "",
              }''': '''    std::str::from_utf8(&raw[..end]).unwrap_or_default()''',
              '''    match std::str::from_utf8(&raw[start..]) {
                  Ok(value) => value,
                  Err(_) => "",
              }''': '''    std::str::from_utf8(&raw[start..]).unwrap_or_default()''',
              '''            (None, Some(Value::Null)) | (None, None) => true,''': '''            (None, Some(Value::Null) | None) => true,''',
              '''            item.ends_with(".py")
                  || item.contains("site-packages")
                  || item.to_ascii_lowercase().ends_with("python.exe")''': '''            Path::new(item)
                  .extension()
                  .is_some_and(|extension| extension.eq_ignore_ascii_case("py"))
                  || item.contains("site-packages")
                  || item.to_ascii_lowercase().ends_with("python.exe")''',
          }
          for old_fragment, new_fragment in replacements.items():
              if old_fragment not in source:
                  raise SystemExit(f'missing expected source fragment:\n{old_fragment}')
              source = source.replace(old_fragment, new_fragment, 1)

          path.write_text(source, encoding='utf-8')
          PY
          cargo fmt --all
          rm -f .github/workflows/apply-r25-r37-clippy-refactor.yml
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R25-R37: satisfy strict native quality contract" || exit 0
          git push origin HEAD:feature/full-parity-r25-r37-completion
