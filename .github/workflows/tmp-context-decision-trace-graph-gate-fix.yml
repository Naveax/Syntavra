name: Temporary Context Decision Trace Graph Gate Fix

on:
  push:
    branches:
      - automation/context-decision-trace-v1-graph-gate-fix-20260827
    paths:
      - ".github/workflows/tmp-context-decision-trace-graph-gate-fix.yml"

permissions:
  contents: write

concurrency:
  group: tmp-context-decision-trace-v1-graph-gate-fix-20260827
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: agent/context-decision-trace-v1-post-completion-final
      TARGET_HEAD: f926ef33ba3063d184d47cc11151f512f221337d
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Switch to immutable PR head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          observed="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$observed" = "$TARGET_HEAD"
          git checkout -B graph-gate-fix "$TARGET_HEAD"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"

      - name: Make post-completion cursor assertion future-proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/runtime-contract-version-graph.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old = "\n".join([
              "          if report['lifecycle_state'] == 'certified':",
              "              assert report['post_completion_current_milestone'] == 'post_completion_complete'",
              "          else:",
              "              assert report['lifecycle_state'] in {'implemented', 'verified'}",
              "              assert report['post_completion_current_milestone'] == 'runtime_contract_version_graph_v1'",
          ]) + "\n"
          new = "\n".join([
              "          registry = json.loads(Path('contracts/python/capability-completeness-registry-v1.json').read_text(encoding='utf-8'))",
              "          by_id = {row.get('id'): row for row in registry.get('capabilities', []) if isinstance(row, dict)}",
              "          order = registry.get('post_completion_milestone_order') or []",
              "          expected_current = next(",
              "              (milestone for milestone in order if (by_id.get(milestone) or {}).get('state') != 'certified'),",
              "              'post_completion_complete',",
              "          )",
              "          assert report['post_completion_current_milestone'] == expected_current",
              "          assert (by_id.get('runtime_contract_version_graph_v1') or {}).get('state') == report['lifecycle_state']",
              "          if report['lifecycle_state'] == 'certified':",
              "              assert expected_current != 'runtime_contract_version_graph_v1'",
              "          else:",
              "              assert report['lifecycle_state'] in {'implemented', 'verified'}",
              "              assert expected_current == 'runtime_contract_version_graph_v1'",
          ]) + "\n"
          if workflow.count(old) != 1:
              raise SystemExit(f'runtime graph workflow lifecycle anchor drift: {workflow.count(old)}')
          workflow_path.write_text(workflow.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/runtime/test_runtime_contract_version_graph_v1.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = 'CONTRACT = ROOT / "contracts/python/runtime-contract-version-graph-v1.json"\n'
          addition = 'WORKFLOW = ROOT / ".github/workflows/runtime-contract-version-graph.yml"\n'
          if tests.count(anchor) != 1 or addition in tests:
              raise SystemExit('runtime graph test constant anchor drift')
          tests = tests.replace(anchor, anchor + addition, 1)
          marker = '    def test_exact_head_certifier_passes_without_resuming_rust(self) -> None:\n'
          regression = "\n".join([
              '    def test_exact_head_workflow_derives_post_completion_cursor_from_registry(self) -> None:',
              '        workflow = WORKFLOW.read_text(encoding="utf-8")',
              '        self.assertIn("registry = json.loads(Path(\'contracts/python/capability-completeness-registry-v1.json\')", workflow)',
              '        self.assertIn("expected_current = next(", workflow)',
              '        self.assertIn("assert report[\'post_completion_current_milestone\'] == expected_current", workflow)',
              '        self.assertNotIn("assert report[\'post_completion_current_milestone\'] == \'post_completion_complete\'", workflow)',
              '',
          ]) + "\n"
          if tests.count(marker) != 1:
              raise SystemExit('runtime graph test insertion anchor drift')
          test_path.write_text(tests.replace(marker, regression + marker, 1), encoding='utf-8')
          PY
          python tools/refresh_manifest.py
          git diff --check

      - name: Validate candidate before exact-head commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v
          python -m unittest tests.runtime.test_context_decision_trace_v1 -v
          python tools/certify_runtime_contract_version_graph_v1.py --out /tmp/runtime-contract-version-graph-precommit.json
          python tools/certify_context_decision_trace_v1.py --out /tmp/context-decision-trace-precommit.json
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness-precommit.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-guard-precommit.json
          python - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('/tmp/runtime-contract-version-graph-precommit.json').read_text(encoding='utf-8'))
          trace = json.loads(Path('/tmp/context-decision-trace-precommit.json').read_text(encoding='utf-8'))
          completeness = json.loads(Path('/tmp/python-capability-completeness-precommit.json').read_text(encoding='utf-8'))
          rust = json.loads(Path('/tmp/rust-feature-freeze-guard-precommit.json').read_text(encoding='utf-8'))
          assert graph['ok'] is True and graph['lifecycle_state'] == 'certified', graph
          assert graph['post_completion_current_milestone'] == 'context_decision_trace_v1', graph
          assert trace['ok'] is True and trace['admission_ready'] is True, trace
          assert completeness['ok'] is True and completeness['post_completion_current_milestone'] == 'context_decision_trace_v1', completeness
          assert rust['ok'] is True and rust['rust_resume_allowed'] is False, rust
          PY
          rm -rf syntavra_runtime.egg-info
          git diff --check

      - name: Commit and revalidate exact full candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-only "$TARGET_HEAD" | sort > /tmp/actual-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/runtime-contract-version-graph.yml
          MANIFEST.sha256
          tests/runtime/test_runtime_contract_version_graph_v1.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git config user.name syntavra-ci
          git config user.email syntavra-ci@users.noreply.github.com
          git commit -m "ci: derive contract graph cursor from canonical registry"
          full_commit="$(git rev-parse HEAD)"
          full_tree="$(git rev-parse 'HEAD^{tree}')"

          python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v
          python -m unittest tests.runtime.test_context_decision_trace_v1 -v
          python tools/certify_runtime_contract_version_graph_v1.py --out /tmp/runtime-contract-version-graph.json
          python tools/certify_context_decision_trace_v1.py --out /tmp/context-decision-trace.json
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-guard.json
          python tools/certify_python_completion_certificate_v1.py --out /tmp/python-completion-certificate.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          graph = json.loads(Path('/tmp/runtime-contract-version-graph.json').read_text(encoding='utf-8'))
          trace = json.loads(Path('/tmp/context-decision-trace.json').read_text(encoding='utf-8'))
          completeness = json.loads(Path('/tmp/python-capability-completeness.json').read_text(encoding='utf-8'))
          rust = json.loads(Path('/tmp/rust-feature-freeze-guard.json').read_text(encoding='utf-8'))
          completion = json.loads(Path('/tmp/python-completion-certificate.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert graph['ok'] is True and graph['exact_head'] == head and graph['lifecycle_state'] == 'certified', graph
          assert graph['post_completion_current_milestone'] == 'context_decision_trace_v1', graph
          assert trace['ok'] is True and trace['exact_head'] == head and trace['admission_ready'] is True, trace
          assert completeness['ok'] is True and completeness['exact_head'] == head and completeness['post_completion_current_milestone'] == 'context_decision_trace_v1', completeness
          assert rust['ok'] is True and rust['exact_head'] == head and rust['rust_resume_allowed'] is False, rust
          assert completion['ok'] is True and completion['python_complete_ready'] is True and completion['rust_resume_allowed'] is False, completion
          PY
          python tools/validate.py
          python tools/validate_release.py --smoke --output /tmp/release-validation.json
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py --check
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

          cp .github/workflows/runtime-contract-version-graph.yml /tmp/runtime-contract-version-graph.yml
          printf '%s\n' "$full_tree" > /tmp/FULL_TREE.txt
          printf '%s\n' "$TARGET_HEAD" > /tmp/PARENT_SHA.txt

          git reset --hard "$TARGET_HEAD"
          git checkout "$full_commit" -- MANIFEST.sha256 tests/runtime/test_runtime_contract_version_graph_v1.py
          git add MANIFEST.sha256 tests/runtime/test_runtime_contract_version_graph_v1.py
          git commit -m "test: make contract graph cursor lifecycle-aware"

      - name: Push non-workflow fix only if PR head stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          observed="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$observed" = "$TARGET_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Upload exact workflow handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-decision-trace-graph-gate-fix-${{ github.sha }}
          path: |
            /tmp/runtime-contract-version-graph.yml
            /tmp/FULL_TREE.txt
            /tmp/PARENT_SHA.txt
          if-no-files-found: error
