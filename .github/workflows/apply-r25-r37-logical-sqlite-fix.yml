name: Apply R25-R37 Logical SQLite Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/full-parity-r25-r37-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r25-r37-completion
      - name: Compare SQLite state logically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/verify_r25_r37_full_parity.py')
          source = path.read_text(encoding='utf-8')
          marker = 'SQLITE_RELATIVE = Path(".syntavra/pre-release/full-parity/broker.sqlite3")\n'
          if 'INTELLIGENCE_RELATIVE' not in source:
              if marker not in source:
                  raise SystemExit('SQLite constant marker not found')
              source = source.replace(
                  marker,
                  marker + 'INTELLIGENCE_RELATIVE = Path(".syntavra/pre-release/full-parity/intelligence.sqlite3")\n',
                  1,
              )

          start = source.index('def logical_state(project: Path) -> dict[str, Any]:')
          end = source.index('\n\ndef verify() -> dict[str, Any]:', start)
          lines = [
              'def logical_state(project: Path) -> dict[str, Any]:',
              '    files: dict[str, str] = {}',
              '    for path in sorted(project.rglob("*")):',
              '        if not path.is_file():',
              '            continue',
              '        relative = path.relative_to(project)',
              '        if relative.name.endswith((".sqlite3", ".sqlite3-wal", ".sqlite3-shm")):',
              '            continue',
              '        files[relative.as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()',
              '',
              '    def query_rows(database: Path, statement: str) -> list[list[Any]]:',
              '        if not database.exists():',
              '            return []',
              '        connection = sqlite3.connect(database)',
              '        try:',
              '            return [list(row) for row in connection.execute(statement)]',
              '        finally:',
              '            connection.close()',
              '',
              '    broker_rows = query_rows(',
              '        project / SQLITE_RELATIVE,',
              '        "SELECT job_id, argv_json, priority, state, worker, exit_code, stdout_hash "',
              '        "FROM jobs ORDER BY job_id",',
              '    )',
              '    memory_rows = query_rows(',
              '        project / INTELLIGENCE_RELATIVE,',
              '        "SELECT memory_id, text, tokens_json, tags_json FROM memories ORDER BY memory_id",',
              '    )',
              '    repository_rows = query_rows(',
              '        project / INTELLIGENCE_RELATIVE,',
              '        "SELECT path, content_sha256, tokens_json, language "',
              '        "FROM repository_files ORDER BY path",',
              '    )',
              '    return {',
              '        "files": files,',
              '        "jobs": broker_rows,',
              '        "memories": memory_rows,',
              '        "repository_files": repository_rows,',
              '    }',
          ]
          source = source[:start] + '\n'.join(lines) + source[end:]
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile tools/verify_r25_r37_full_parity.py
          rm -f .github/workflows/apply-r25-r37-logical-sqlite-fix.yml
      - name: Commit logical comparison
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R25-R37: compare SQLite stores by canonical rows" || exit 0
          git push origin HEAD:feature/full-parity-r25-r37-completion
