name: Temporary Context Decision Trace Fresh Main Materializer

on:
  push:
    branches:
      - automation/context-decision-trace-v1-fresh-main-sealer-20260827
    paths:
      - ".github/workflows/tmp-context-decision-trace-v1-fresh-main-sealer.yml"

permissions:
  contents: write

concurrency:
  group: tmp-context-decision-trace-v1-fresh-main-materializer-20260827
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: agent/context-decision-trace-v1-post-completion-final
      TARGET_PRE_HEAD: 151939bf9c275ddab10275bdac4c0e77112030aa
      EXPECTED_FINAL_TREE: bca04b590e0f6d6287b51fd12d255fad9da8fbdf
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact materializer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Switch to immutable validated target pre-head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          observed="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$observed" = "$TARGET_PRE_HEAD"
          git checkout -B context-decision-trace-materialize "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$TARGET_PRE_HEAD"

      - name: Rebuild exact previously validated final tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          upstream_id = "runtime_contract_version_graph_v1"
          capability_id = "context_decision_trace_v1"

          registry_path = Path("contracts/python/capability-completeness-registry-v1.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if registry.get("post_completion_milestone_order") != [upstream_id]:
              raise SystemExit("unexpected post-completion order")
          rows = registry.get("capabilities") or []
          ids = [row.get("id") for row in rows if isinstance(row, dict)]
          by_id = {row.get("id"): row for row in rows if isinstance(row, dict)}
          if (by_id.get(upstream_id) or {}).get("state") != "certified":
              raise SystemExit("capability 240 is not certified")
          if capability_id in by_id:
              raise SystemExit("capability 241 already exists")
          phase = registry.get("python_complete") or {}
          if phase.get("ready") is not True or phase.get("rust_resume_allowed") is not False or phase.get("rust_retired") is not True:
              raise SystemExit("post-completion authority drift")

          row = {
              "id": capability_id,
              "group": "post-completion-context-policy",
              "state": "implemented",
              "classification": "NEW",
              "required_for_python_complete": False,
              "implementation_evidence": [
                  "contracts/python/context-decision-trace-v1.json",
                  "syntavra_runtime/context_decision_trace.py",
                  "syntavra_runtime/adaptive_context_policy.py",
                  "contracts/python/adaptive-context-policy-v1.json",
                  "contracts/python/runtime-contract-version-graph-v1.json",
                  "tools/certify_context_decision_trace_v1.py",
                  "tests/runtime/test_context_decision_trace_v1.py",
                  ".github/workflows/context-decision-trace.yml",
                  ".github/workflows/release-main-merge-gate.yml",
                  "tests/runtime/test_release_action_pins.py"
              ],
              "certification_evidence": [],
              "acceptance": "Deterministic reference-only trace of include/omit/compress/retrieve/reset/abstain decisions from verified policy receipts, with recommended/effective separation, deterministic replay and fail-closed tamper detection. Policy snapshot and evidence-journal ownership stay with later capabilities; Python COMPLETE remains sealed and Rust stays retired/frozen."
          }
          rows.insert(ids.index(upstream_id) + 1, row)
          registry["capabilities"] = rows
          registry["post_completion_milestone_order"] = [upstream_id, capability_id]
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          test_path = Path("tests/runtime/test_python_capability_completeness.py")
          text = test_path.read_text(encoding="utf-8")
          anchor = 'CONTRACT = ROOT / "contracts/python/capability-completeness-registry-v1.json"\n'
          addition = '\nEXPECTED_POST_COMPLETION_PREFIX = [\n    "runtime_contract_version_graph_v1",\n    "context_decision_trace_v1",\n]\n'
          if text.count(anchor) != 1:
              raise SystemExit("completeness constant anchor drift")
          text = text.replace(anchor, anchor + addition, 1)
          old = '        self.assertEqual(contract["post_completion_milestone_order"], ["runtime_contract_version_graph_v1"])\n'
          new = '        self.assertEqual(\n            contract["post_completion_milestone_order"][: len(EXPECTED_POST_COMPLETION_PREFIX)],\n            EXPECTED_POST_COMPLETION_PREFIX,\n        )\n'
          if text.count(old) != 1:
              raise SystemExit("completeness order anchor drift")
          text = text.replace(old, new, 1)
          old = '        self.assertEqual(report["post_completion_current_milestone"], "post_completion_complete")\n'
          new = '        self.assertEqual(report["post_completion_current_milestone"], "context_decision_trace_v1")\n'
          if text.count(old) != 1:
              raise SystemExit("completeness current anchor drift")
          text = text.replace(old, new, 1)
          old = '        self.assertEqual(report["post_completion_milestone_order"], ["runtime_contract_version_graph_v1"])\n'
          new = '        self.assertEqual(report["post_completion_milestone_order"], EXPECTED_POST_COMPLETION_PREFIX)\n'
          if text.count(old) != 1:
              raise SystemExit("completeness report order anchor drift")
          text = text.replace(old, new, 1)
          test_path.write_text(text, encoding="utf-8")

          release_path = Path(".github/workflows/release-main-merge-gate.yml")
          release = release_path.read_text(encoding="utf-8")
          test_anchor = "          python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v\n"
          cert_anchor = "          python tools/certify_runtime_contract_version_graph_v1.py --out /tmp/runtime-contract-version-graph.json\n"
          if release.count(test_anchor) != 1 or release.count(cert_anchor) != 1:
              raise SystemExit("release-main capability-240 anchor drift")
          release = release.replace(test_anchor, test_anchor + "          python -m unittest tests.runtime.test_context_decision_trace_v1 -v\n", 1)
          release = release.replace(cert_anchor, cert_anchor + "          python tools/certify_context_decision_trace_v1.py --out /tmp/context-decision-trace.json\n", 1)
          release_path.write_text(release, encoding="utf-8")

          pins_path = Path("tests/runtime/test_release_action_pins.py")
          pins = pins_path.read_text(encoding="utf-8")
          pin_anchor = '    ".github/workflows/runtime-contract-version-graph.yml",\n'
          if pins.count(pin_anchor) != 1:
              raise SystemExit("release pin anchor drift")
          pins_path.write_text(pins.replace(pin_anchor, pin_anchor + '    ".github/workflows/context-decision-trace.yml",\n', 1), encoding="utf-8")
          PY

          python tools/refresh_manifest.py
          git add -A
          actual_tree="$(git write-tree)"
          printf 'validated tree: %s\n' "$actual_tree"
          test "$actual_tree" = "$EXPECTED_FINAL_TREE"
          cp .github/workflows/release-main-merge-gate.yml /tmp/release-main-merge-gate.final.yml

      - name: Commit only non-workflow seal files
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$TARGET_PRE_HEAD" -- .github/workflows/release-main-merge-gate.yml
          git add -A
          git diff --cached --name-only "$TARGET_PRE_HEAD" | sort > /tmp/actual-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          MANIFEST.sha256
          contracts/python/capability-completeness-registry-v1.json
          tests/runtime/test_python_capability_completeness.py
          tests/runtime/test_release_action_pins.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git config user.name syntavra-ci
          git config user.email syntavra-ci@users.noreply.github.com
          git commit -m "python: materialize Context Decision Trace v1 seal"

      - name: Push four-file seal only if target stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          observed="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$observed" = "$TARGET_PRE_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload exact validated workflow payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-decision-trace-release-gate-final-${{ github.sha }}
          path: /tmp/release-main-merge-gate.final.yml
          if-no-files-found: error
