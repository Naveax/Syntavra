name: Temporary Context Decision Trace Fresh Main Sealer

on:
  push:
    branches:
      - automation/context-decision-trace-v1-fresh-main-sealer-20260827
    paths:
      - ".github/workflows/tmp-context-decision-trace-v1-fresh-main-sealer.yml"

permissions:
  contents: write

concurrency:
  group: tmp-context-decision-trace-v1-fresh-main-sealer-20260827
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_BRANCH: agent/context-decision-trace-v1-post-completion-final
      TARGET_PRE_HEAD: 151939bf9c275ddab10275bdac4c0e77112030aa
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact sealer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Switch to immutable target pre-head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          observed="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$observed" = "$TARGET_PRE_HEAD"
          git checkout -B context-decision-trace-final "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$TARGET_PRE_HEAD"

      - name: Reconcile capability 241 onto certified capability 240
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          UPSTREAM = "runtime_contract_version_graph_v1"
          CAPABILITY = "context_decision_trace_v1"

          registry_path = Path("contracts/python/capability-completeness-registry-v1.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if registry.get("post_completion_milestone_order") != [UPSTREAM]:
              raise SystemExit(f"unexpected fresh-main post-completion order: {registry.get('post_completion_milestone_order')}")
          rows = registry.get("capabilities") or []
          by_id = {row.get("id"): row for row in rows if isinstance(row, dict)}
          upstream = by_id.get(UPSTREAM) or {}
          if upstream.get("state") != "certified":
              raise SystemExit(f"capability 240 must already be certified: {upstream.get('state')}")
          if CAPABILITY in by_id:
              raise SystemExit("capability 241 already exists on target pre-head")
          python_complete = registry.get("python_complete") or {}
          if python_complete.get("ready") is not True or python_complete.get("rust_resume_allowed") is not False or python_complete.get("rust_retired") is not True:
              raise SystemExit(f"post-completion authority drift: {python_complete}")

          ids = [row.get("id") for row in rows if isinstance(row, dict)]
          upstream_index = ids.index(UPSTREAM)
          row = {
              "id": CAPABILITY,
              "group": "post-completion-context-policy",
              "state": "implemented",
              "classification": "NEW",
              "required_for_python_complete": False,
              "implementation_evidence": [
                  "contracts/python/context-decision-trace-v1.json",
                  "syntavra_runtime/context_decision_trace.py",
                  "syntavra_runtime/adaptive_context_policy.py",
                  "contracts/python/adaptive-context-policy-v1.json",
                  "contracts/python/runtime-contract-version-graph-v1.json",
                  "tools/certify_context_decision_trace_v1.py",
                  "tests/runtime/test_context_decision_trace_v1.py",
                  ".github/workflows/context-decision-trace.yml",
                  ".github/workflows/release-main-merge-gate.yml",
                  "tests/runtime/test_release_action_pins.py"
              ],
              "certification_evidence": [],
              "acceptance": "Deterministic reference-only trace of include/omit/compress/retrieve/reset/abstain decisions from verified policy receipts, with recommended/effective separation, deterministic replay and fail-closed tamper detection. Policy snapshot and evidence-journal ownership stay with later capabilities; Python COMPLETE remains sealed and Rust stays retired/frozen."
          }
          rows.insert(upstream_index + 1, row)
          registry["capabilities"] = rows
          registry["post_completion_milestone_order"] = [UPSTREAM, CAPABILITY]
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          test_path = Path("tests/runtime/test_python_capability_completeness.py")
          text = test_path.read_text(encoding="utf-8")
          constant_anchor = 'CONTRACT = ROOT / "contracts/python/capability-completeness-registry-v1.json"\n'
          constant = (
              '\nEXPECTED_POST_COMPLETION_PREFIX = [\n'
              '    "runtime_contract_version_graph_v1",\n'
              '    "context_decision_trace_v1",\n'
              ']\n'
          )
          if text.count(constant_anchor) != 1:
              raise SystemExit("completeness test constant anchor drift")
          text = text.replace(constant_anchor, constant_anchor + constant, 1)
          old_order = '        self.assertEqual(contract["post_completion_milestone_order"], ["runtime_contract_version_graph_v1"])\n'
          new_order = (
              '        self.assertEqual(\n'
              '            contract["post_completion_milestone_order"][: len(EXPECTED_POST_COMPLETION_PREFIX)],\n'
              '            EXPECTED_POST_COMPLETION_PREFIX,\n'
              '        )\n'
          )
          if text.count(old_order) != 1:
              raise SystemExit("completeness registry-order assertion drift")
          text = text.replace(old_order, new_order, 1)
          old_current = '        self.assertEqual(report["post_completion_current_milestone"], "post_completion_complete")\n'
          new_current = '        self.assertEqual(report["post_completion_current_milestone"], "context_decision_trace_v1")\n'
          if text.count(old_current) != 1:
              raise SystemExit("completeness current-milestone assertion drift")
          text = text.replace(old_current, new_current, 1)
          old_report_order = '        self.assertEqual(report["post_completion_milestone_order"], ["runtime_contract_version_graph_v1"])\n'
          new_report_order = '        self.assertEqual(report["post_completion_milestone_order"], EXPECTED_POST_COMPLETION_PREFIX)\n'
          if text.count(old_report_order) != 1:
              raise SystemExit("completeness report-order assertion drift")
          text = text.replace(old_report_order, new_report_order, 1)
          test_path.write_text(text, encoding="utf-8")

          release_path = Path(".github/workflows/release-main-merge-gate.yml")
          release = release_path.read_text(encoding="utf-8")
          test_anchor = "          python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v\n"
          cert_anchor = "          python tools/certify_runtime_contract_version_graph_v1.py --out /tmp/runtime-contract-version-graph.json\n"
          if release.count(test_anchor) != 1 or release.count(cert_anchor) != 1:
              raise SystemExit("release-main capability-240 anchors drifted")
          release = release.replace(test_anchor, test_anchor + "          python -m unittest tests.runtime.test_context_decision_trace_v1 -v\n", 1)
          release = release.replace(cert_anchor, cert_anchor + "          python tools/certify_context_decision_trace_v1.py --out /tmp/context-decision-trace.json\n", 1)
          release_path.write_text(release, encoding="utf-8")

          pins_path = Path("tests/runtime/test_release_action_pins.py")
          pins = pins_path.read_text(encoding="utf-8")
          pin_anchor = '    ".github/workflows/runtime-contract-version-graph.yml",\n'
          if pins.count(pin_anchor) != 1:
              raise SystemExit("release action-pin capability-240 anchor drifted")
          pins = pins.replace(pin_anchor, pin_anchor + '    ".github/workflows/context-decision-trace.yml",\n', 1)
          pins_path.write_text(pins, encoding="utf-8")
          PY

          python tools/refresh_manifest.py
          git diff --check

      - name: Install runtime and validate candidate tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m unittest tests.runtime.test_context_decision_trace_v1 -v
          python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python -m unittest tests.runtime.test_python_completion_certificate_v1 -v
          python tools/certify_context_decision_trace_v1.py --out /tmp/context-decision-trace.json
          python tools/certify_runtime_contract_version_graph_v1.py --out /tmp/runtime-contract-version-graph.json
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-guard.json
          python tools/certify_python_completion_certificate_v1.py --out /tmp/python-completion-certificate.json
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path(name).read_text(encoding="utf-8"))

          trace = load('/tmp/context-decision-trace.json')
          graph = load('/tmp/runtime-contract-version-graph.json')
          completeness = load('/tmp/python-capability-completeness.json')
          rust = load('/tmp/rust-feature-freeze-guard.json')
          completion = load('/tmp/python-completion-certificate.json')

          assert trace['ok'] is True and trace['implementation_ready'] is True and trace['admission_ready'] is True, trace
          assert trace['upstream_runtime_contract_graph_state'] == 'certified', trace
          assert trace['lifecycle_state'] == 'implemented', trace
          assert trace['post_completion_current_milestone'] == 'context_decision_trace_v1', trace
          assert trace['python_complete_ready'] is True and trace['rust_resume_allowed'] is False, trace
          assert trace['rust']['production_promoted'] == 174 and trace['rust']['remaining_parity_promotion'] == 71, trace

          assert graph['ok'] is True and graph['admission_ready'] is True, graph
          assert completeness['ok'] is True, completeness
          assert completeness['post_completion_milestone_order'] == ['runtime_contract_version_graph_v1', 'context_decision_trace_v1'], completeness
          assert completeness['post_completion_current_milestone'] == 'context_decision_trace_v1', completeness
          assert completeness['python_complete_ready'] is True and completeness['rust_resume_allowed'] is False, completeness
          assert rust['ok'] is True and rust['rust_resume_allowed'] is False, rust
          assert rust['rust']['production_promoted'] == 174 and rust['rust']['remaining_parity_promotion'] == 71, rust
          assert completion['ok'] is True and completion['python_complete_ready'] is True and completion['rust_resume_allowed'] is False, completion
          PY
          python tools/validate.py
          python tools/validate_release.py --smoke --output /tmp/context-decision-trace-release-validation.json
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py --check
          git diff --check

      - name: Commit exact validated final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name syntavra-ci
          git config user.email syntavra-ci@users.noreply.github.com
          git add -A
          git status --short
          git commit -m "python: implement Context Decision Trace v1"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"

      - name: Revalidate exact committed head
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py --check
          python tools/certify_context_decision_trace_v1.py --out /tmp/context-decision-trace-postcommit.json
          python tools/certify_runtime_contract_version_graph_v1.py --out /tmp/runtime-contract-version-graph-postcommit.json
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness-postcommit.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-guard-postcommit.json
          python tools/certify_python_completion_certificate_v1.py --out /tmp/python-completion-certificate-postcommit.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          trace = json.loads(Path('/tmp/context-decision-trace-postcommit.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert trace['ok'] is True and trace['exact_head'] == head, trace
          assert trace['admission_ready'] is True, trace
          assert trace['upstream_runtime_contract_graph_state'] == 'certified', trace
          assert trace['post_completion_current_milestone'] == 'context_decision_trace_v1', trace
          assert trace['rust_resume_allowed'] is False, trace
          PY
          python tools/validate.py
          rm -rf syntavra_runtime.egg-info
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push only if target remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          observed="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$observed" = "$TARGET_PRE_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
          printf 'FINAL_COMMIT=%s\nFINAL_TREE=%s\n' "$FINAL_COMMIT" "$FINAL_TREE"
