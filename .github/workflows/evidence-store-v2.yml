name: Evidence Store v2

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evidence-store-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-store-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run Evidence Store regression tests
        run: python -m unittest tests.runtime.test_evidence_store_v2 -v

      - name: Generate exact-head Evidence Store certificate
        run: |
          python tools/certify_evidence_store_v2.py --out /tmp/evidence-store-v2.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('/tmp/evidence-store-v2.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'EVIDENCE_STORE_V2'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['python_complete_ready'] is True
          assert report['rust_resume_allowed'] is False
          assert report['runtime']['content_addressed_roundtrip'] is True
          assert report['runtime']['evaluation_update_journaled'] is True
          assert report['runtime']['lineage'] is True
          assert report['runtime']['secret_reject_default'] is True
          assert report['runtime']['retention_gc'] is True
          assert report['runtime']['journal_chain'] is True
          assert report['runtime']['journal_tamper_detected'] is True
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          PY

      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Evidence Store evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-store-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/evidence-store-v2.json
          if-no-files-found: error
