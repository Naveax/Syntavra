name: Token Economy Competitive Gap

on:
  pull_request:
    paths:
      - 'syntavra_runtime/tool_registry.py'
      - 'contracts/python/token-economy-competitive-gap-v1.json'
      - 'docs/plans/SYNTAVRA_TOKEN_ECONOMY_COMPETITIVE_GAP_V1.md'
      - 'tests/runtime/test_token_economy_competitive_gap.py'
      - 'tests/runtime/test_tool_schema_cache_stability.py'
      - 'tools/certify_token_economy_competitive_gap.py'
      - '.github/workflows/token-economy-competitive-gap.yml'
  push:
    branches: [main]
    paths:
      - 'syntavra_runtime/tool_registry.py'
      - 'contracts/python/token-economy-competitive-gap-v1.json'
      - 'docs/plans/SYNTAVRA_TOKEN_ECONOMY_COMPETITIVE_GAP_V1.md'
      - 'tests/runtime/test_token_economy_competitive_gap.py'
      - 'tests/runtime/test_tool_schema_cache_stability.py'
      - 'tools/certify_token_economy_competitive_gap.py'
      - '.github/workflows/token-economy-competitive-gap.yml'

permissions:
  contents: read

concurrency:
  group: token-economy-competitive-gap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Compile contract surfaces
        run: |
          set -euo pipefail
          python -m compileall -q \
            syntavra_runtime/tool_registry.py \
            tests/runtime/test_token_economy_competitive_gap.py \
            tests/runtime/test_tool_schema_cache_stability.py \
            tools/certify_token_economy_competitive_gap.py

      - name: Run competitive gap contract
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_token_economy_competitive_gap -v
          python -m unittest tests.runtime.test_tool_schema_cache_stability -v

      - name: Emit certification receipt
        run: python tools/certify_token_economy_competitive_gap.py

      - name: Enforce clean exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
