name: Apply R24 Config Show Source Sync

on:
  push:
    branches:
      - feature/full-parity-r24-config-show-cli
    paths:
      - tools/apply_r24_config_show_patch.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r24-config-show-cli
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Apply assertion-locked patch
        run: python tools/apply_r24_config_show_patch.py
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit synchronized sources
        run: |
          if git diff --quiet; then
            echo 'R24 config show sources already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            contracts/engine/descriptor.txt \
            contracts/parity/python-rust-full-parity-v1.json \
            crates/syntavra-cli/src/main.rs \
            crates/syntavra-contracts/src/lib.rs \
            syntavra_runtime/engine_selector.py \
            syntavra_runtime/unified_cli.py \
            tests/runtime/test_engine_selector_r4.py \
            tools/run_engine_parity.py \
            tools/run_engine_parity_r24.py
          git commit -m 'Apply native R24 config show source sync'
          git push origin HEAD:feature/full-parity-r24-config-show-cli
