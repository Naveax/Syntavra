name: Memory Retrieval Seal Helper

on:
  push:
    branches:
      - automation/memory-retrieval-seal-151

permissions:
  contents: write

concurrency:
  group: memory-retrieval-seal-helper-151
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
      TARGET_BRANCH: agent/memory-retrieval-v1
      EXPECTED_TARGET_HEAD: b5103c5ff821cf1a8e9062658c97039a0f289ad7
      BASE_MAIN: 9838235404a834cfbc4882ebfb989cf1b40ef42e
    steps:
      - name: Checkout exact Memory Retrieval target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/memory-retrieval-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify target has not moved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply canonical lifecycle advancement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('contracts/python/capability-completeness-registry-v1.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          expected_old_order = [
              'python_authority_v1',
              'capability_completeness_registry_v1',
              'rust_feature_freeze_guard_v1',
              'universal_context_item_v1',
              'evidence_store_v2',
              'typed_context_object_store_v1',
              'programmatic_execution_v1',
              'deferred_tool_discovery_v1',
              'unified_context_namespace_v1',
              'multi_graph_retrieval_v1',
              'adaptive_context_policy_v1',
              'context_reset_handoff_v1',
          ]
          expected_full_order = expected_old_order + [
              'memory_retrieval_v1',
              'epistemic_safety_v1',
              'cache_provider_budget_v1',
              'output_intelligence_v1',
              'host_adapter_conformance_v1',
              'observability_attribution_v1',
              'signalbench_python_product_v1',
          ]
          assert registry['milestone_order'] == expected_old_order, registry['milestone_order']
          registry['milestone_order'] = expected_full_order

          capabilities = {item['id']: item for item in registry['capabilities']}
          context_reset = capabilities['context_reset_handoff_v1']
          assert context_reset['state'] == 'partial', context_reset['state']
          context_reset['state'] = 'certified'
          context_reset['implementation_evidence'] = [
              'syntavra_runtime/session_memory.py',
              'syntavra_runtime/autonomous_agent.py',
              'syntavra_runtime/context_reset_handoff.py',
              'contracts/python/context-reset-handoff-v1.json',
              'tools/certify_context_reset_handoff.py',
              'tests/runtime/test_context_reset_handoff.py',
              '.github/workflows/context-reset-handoff.yml',
          ]
          context_reset['certification_evidence'] = [
              'contracts/python/context-reset-handoff-v1.json',
              'syntavra_runtime/context_reset_handoff.py',
              'tools/certify_context_reset_handoff.py',
              'tests/runtime/test_context_reset_handoff.py',
              '.github/workflows/context-reset-handoff.yml',
          ]

          memory = capabilities['memory_retrieval_v1']
          assert memory['state'] == 'partial', memory['state']
          memory['state'] = 'implemented'
          memory['implementation_evidence'] = [
              'syntavra_runtime/memory_intelligence.py',
              'syntavra_runtime/session_memory.py',
              'contracts/python/memory-retrieval-v1.json',
              'tools/certify_memory_retrieval_v1.py',
              'tests/runtime/test_memory_retrieval_v1.py',
              '.github/workflows/memory-retrieval.yml',
          ]
          memory['certification_evidence'] = []
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          certifier_path = Path('tools/certify_python_capability_completeness.py')
          text = certifier_path.read_text(encoding='utf-8')
          old = '''EXPECTED_MILESTONE_PREFIX = [
              "python_authority_v1",
              "capability_completeness_registry_v1",
              "rust_feature_freeze_guard_v1",
              "universal_context_item_v1",
              "evidence_store_v2",
              "typed_context_object_store_v1",
              "programmatic_execution_v1",
              "deferred_tool_discovery_v1",
              "unified_context_namespace_v1",
              "multi_graph_retrieval_v1",
              "adaptive_context_policy_v1",
          ]
          '''.replace('          ', '')
          new = '''EXPECTED_MILESTONE_PREFIX = [
              "python_authority_v1",
              "capability_completeness_registry_v1",
              "rust_feature_freeze_guard_v1",
              "universal_context_item_v1",
              "evidence_store_v2",
              "typed_context_object_store_v1",
              "programmatic_execution_v1",
              "deferred_tool_discovery_v1",
              "unified_context_namespace_v1",
              "multi_graph_retrieval_v1",
              "adaptive_context_policy_v1",
              "context_reset_handoff_v1",
              "memory_retrieval_v1",
              "epistemic_safety_v1",
              "cache_provider_budget_v1",
              "output_intelligence_v1",
              "host_adapter_conformance_v1",
              "observability_attribution_v1",
              "signalbench_python_product_v1",
          ]
          '''.replace('          ', '')
          assert text.count(old) == 1, 'canonical milestone certifier anchor drifted'
          certifier_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Refresh canonical manifest and pre-commit validation
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_memory_retrieval_v1 -v
          python -m unittest tests.runtime.test_complete_competitive_features_v001 -v
          python -m unittest tests.runtime.test_context_reset_handoff -v
          git diff --check

      - name: Commit sealed tree locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256 \
            contracts/python/capability-completeness-registry-v1.json \
            tools/certify_python_capability_completeness.py
          git status --short
          git commit -m 'Seal Memory Retrieval v1 lifecycle'

      - name: Validate exact sealed commit before publication
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py --check
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness.json
          python tools/certify_context_reset_handoff.py --out /tmp/context-reset-handoff.json
          python tools/certify_memory_retrieval_v1.py --out /tmp/memory-retrieval.json
          python tools/check_rust_feature_freeze.py --base "$BASE_MAIN" --head HEAD --out /tmp/rust-feature-freeze-diff.json
          python - <<'PY'
          import json
          from pathlib import Path
          capability = json.loads(Path('/tmp/python-capability-completeness.json').read_text(encoding='utf-8'))
          context_reset = json.loads(Path('/tmp/context-reset-handoff.json').read_text(encoding='utf-8'))
          memory = json.loads(Path('/tmp/memory-retrieval.json').read_text(encoding='utf-8'))
          freeze = json.loads(Path('/tmp/rust-feature-freeze-diff.json').read_text(encoding='utf-8'))
          assert capability['ok'] is True, capability
          assert capability['current_milestone']['id'] == 'memory_retrieval_v1', capability['current_milestone']
          assert capability['current_milestone']['state'] == 'implemented', capability['current_milestone']
          assert capability['python_complete_ready'] is False
          assert capability['rust_resume_allowed'] is False
          assert context_reset['ok'] is True, context_reset
          assert memory['ok'] is True, memory
          assert memory['runtime']['new_persistent_database'] is False
          assert memory['runtime']['exact_recovery'] is True
          assert freeze['ok'] is True, freeze
          assert freeze['denied_change_count'] == 0, freeze
          PY
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish one sealed target-head movement
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:"$TARGET_BRANCH"
