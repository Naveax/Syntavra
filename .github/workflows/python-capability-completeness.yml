name: Python Capability Completeness

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-capability-completeness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capability-completeness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run capability completeness regression tests
        run: python -m unittest tests.runtime.test_python_capability_completeness -v

      - name: Generate exact-head capability completeness certificate
        run: |
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('/tmp/python-capability-completeness.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'PYTHON_CAPABILITY_COMPLETENESS_TRACKED'
          assert report['exact_head'] == head, (report['exact_head'], head)
          if report['python_complete_ready']:
              assert report['current_milestone'] == 'python_complete'
              assert report['uncertified_required'] == []
          else:
              assert report['current_milestone'] in report['uncertified_required'], report
          assert report['registry_admission_ready'] is True
          assert report['python_complete_ready'] is True
          assert report['rust_resume_allowed'] is False
          assert report['rust']['implementation_coverage'] == 245
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          assert report['rust']['feature_development_frozen'] is True
          PY

      - name: Enforce clean exact-head repository
        if: always()
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload capability completeness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-capability-completeness-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/python-capability-completeness.json
          if-no-files-found: error
