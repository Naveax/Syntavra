name: Temporary Python Capability 240 Executor

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

concurrency:
  group: temporary-python-capability-240-executor
  cancel-in-progress: false

jobs:
  materialize-240:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
      TARGET_BRANCH: agent/runtime-contract-version-graph-v1
      EXPECTED_PRE_HEAD: 8a2049fc7670d66bc95333c7fb17823a93a0ef26
      BASE_MAIN: e2ead74f70aef8cbf4da333bf19698231b45327b
    steps:
      - name: Checkout exact Python capability branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/runtime-contract-version-graph-v1
          fetch-depth: 0

      - name: Require unchanged target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRE_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Materialize registry and continuation authorities
        run: python tools/tmp_materialize_runtime_contract_version_graph_v1.py

      - name: Remove temporary Python materializer and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/tmp_materialize_runtime_contract_version_graph_v1.py
          python tools/refresh_manifest.py
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py --check
          git diff --check

      - name: Enforce permanent materialization scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 | sed 's/^...//')"
          printf '%s\n' "$changed"
          test -n "$changed"
          ! printf '%s\n' "$changed" | grep -E '^(crates/|contracts/engine/|parity/)'
          ! printf '%s\n' "$changed" | grep -F '.github/workflows/tmp-'
          test ! -e tools/tmp_materialize_runtime_contract_version_graph_v1.py

      - name: Commit and push permanent capability 240 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: materialize Python capability 240 authority"
          git push origin "HEAD:${TARGET_BRANCH}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate focused Python capability 240 boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_python_completion_certificate_v1 -v
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python tools/certify_runtime_contract_version_graph_v1.py --repo . --out /tmp/runtime-contract-version-graph.json
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness.json
          python tools/certify_python_completion_certificate_v1.py --repo . --out /tmp/python-completion.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-freeze.json
          python tools/check_rust_feature_freeze.py --base "$BASE_MAIN" --head "$(git rev-parse HEAD)" --out /tmp/rust-freeze-diff.json

      - name: Validate full repository and release smoke
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate.py
          python tools/validate_release.py --smoke --output /tmp/release-smoke.json

      - name: Assert Python-active Rust-retired state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          graph = json.loads(Path('/tmp/runtime-contract-version-graph.json').read_text(encoding='utf-8'))
          completeness = json.loads(Path('/tmp/python-capability-completeness.json').read_text(encoding='utf-8'))
          completion = json.loads(Path('/tmp/python-completion.json').read_text(encoding='utf-8'))
          rust = json.loads(Path('/tmp/rust-freeze.json').read_text(encoding='utf-8'))
          rust_diff = json.loads(Path('/tmp/rust-freeze-diff.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('contracts/python/capability-completeness-registry-v1.json').read_text(encoding='utf-8'))

          row = next(item for item in registry['capabilities'] if item['id'] == 'runtime_contract_version_graph_v1')
          completion_row = next(item for item in registry['capabilities'] if item['id'] == 'python_completion_certificate_v1')
          policy = registry['policy']

          assert row['state'] == 'implemented', row
          assert row['required_for_python_complete'] is False, row
          assert completion_row['state'] == 'partial', completion_row
          assert registry['python_complete']['ready'] is False
          assert registry['python_complete']['rust_resume_allowed'] is False
          assert policy['python_hardening_may_continue_after_completion_certificate_implementation'] is True
          assert policy['rust_reactivation_requires_explicit_owner_decision'] is True
          assert policy['rust_transition_capabilities_deferred_while_rust_retired'] is True

          assert graph['ok'] is True, graph
          assert graph['exact_head'] == head, (graph['exact_head'], head)
          assert graph['admission_ready'] is True
          assert graph['graph']['metadata_leaf_count'] >= 0
          assert graph['runtime']['external_contracts_are_metadata_only_leaves'] is True
          assert graph['runtime']['external_leaf_recursive_expansion_forbidden'] is True
          assert graph['rust_resume_allowed'] is False

          assert completeness['ok'] is True, completeness
          assert completeness['python_complete_ready'] is False
          assert completeness['rust_resume_allowed'] is False
          assert completion['ok'] is True, completion
          assert completion['lifecycle_state'] == 'partial'
          assert completion['python_complete_ready'] is False
          assert completion['rust_resume_allowed'] is False
          assert rust['ok'] is True, rust
          assert rust['rust_resume_allowed'] is False
          assert rust['rust']['production_promoted'] == 174
          assert rust['rust']['remaining_parity_promotion'] == 71
          assert rust_diff['ok'] is True, rust_diff

          live = Path('docs/SYNTAVRA_PYTHON_FIRST_LIVE_CHECKPOINT.md').read_text(encoding='utf-8')
          assert 'runtime_contract_version_graph_v1' in live
          assert 'context_decision_trace_v1' in live
          assert 'Rust feature/parity development: **retired/frozen**' in live
          assert '`rust_resume_allowed`: false' in live
          PY

      - name: Enforce exact clean permanent tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          python tools/refresh_manifest.py --check
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload materialization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-capability-240-materialization-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/runtime-contract-version-graph.json
            /tmp/python-capability-completeness.json
            /tmp/python-completion.json
            /tmp/rust-freeze.json
            /tmp/rust-freeze-diff.json
            /tmp/release-smoke.json
          if-no-files-found: warn
