name: Guarded Post-Promotion Native Activation Repair

on:
  push:
    branches:
      - agent/r31-provider-capture-native

permissions:
  contents: write

concurrency:
  group: post-promotion-native-activation-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact current authority lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b15a5c5a7a69de42324fa103dc38e1a93c504759"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply extracted fail-closed repair
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_post_promotion_native_activation.py

          # The extracted patcher predates the exact one-component selector roots in
          # syntavra.rs::command_path(). Repair the generated ownership probe so the
          # audit mirrors the production selector grammar exactly, not approximately.
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/syntavra-cli/src/bin/syntavra-remaining71-ownership.rs')
          text = path.read_text(encoding='utf-8')
          start = text.index('fn selector_path(route: &str) -> Vec<String> {')
          end = text.index('\nfn remaining71_owner_modules', start)
          replacement = '''fn selector_path(route: &str) -> Vec<String> {
              let mut positional = route
                  .split_whitespace()
                  .map(str::to_owned)
                  .collect::<Vec<_>>();
              if matches!(
                  positional.first().map(String::as_str),
                  Some("rollout-tail" | "context-stress" | "claim" | "context" | "init" | "hook" | "mcp")
              ) {
                  positional.truncate(1);
              } else if positional.first().map(String::as_str) == Some("engine")
                  && positional.get(1).map(String::as_str) == Some("route")
              {
                  positional.truncate(3);
              } else {
                  positional.truncate(2);
              }
              positional
          }
          '''
          text = text[:start] + replacement + text[end:]
          anchor = '''        assert_eq!(
              selector_path("engine route config.show"),
              vec!["engine", "route", "config.show"]
          );
          '''
          if text.count(anchor) != 1:
              raise SystemExit('ownership selector test anchor drift')
          text = text.replace(
              anchor,
              anchor + '        assert_eq!(selector_path("context evaluate"), vec!["context"]);\n',
              1,
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Install runtime and pinned Rust 1.82
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          rustc +1.82.0 --version
          cargo +1.82.0 --version

      - name: Format compile and unit-test repaired selector
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.82.0 fmt --all
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra --bin syntavra-remaining71-ownership
          cargo +1.82.0 test --locked -p syntavra-cli --bin syntavra --bin syntavra-remaining71-ownership

      - name: Prove all canonical routes are production-selector-owned without probe flag
        shell: bash
        run: |
          set -euo pipefail
          unset SYNTAVRA_BULK_PARITY_PROBE || true
          python tools/report_missing_native_public_routes.py > /tmp/native-inventory.json
          target/debug/syntavra-remaining71-ownership /tmp/native-inventory.json > /tmp/native-ownership.json
          target/debug/syntavra --engine rust engine status > /tmp/engine-status.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/native-inventory.json').read_text(encoding='utf-8'))
          ownership = json.loads(Path('/tmp/native-ownership.json').read_text(encoding='utf-8'))
          status = json.loads(Path('/tmp/engine-status.json').read_text(encoding='utf-8'))

          assert inventory['ok'] is True, inventory
          assert inventory['python']['derived_count'] == 245, inventory
          assert inventory['rust']['native_count'] == 245, inventory
          assert inventory['rust']['missing_count'] == 0, inventory
          assert inventory['missing_routes'] == [], inventory

          assert ownership['ok'] is True, ownership
          assert ownership['inventory_state'] == 'promoted-245-0', ownership
          assert ownership['owned_count'] == 245, ownership
          assert ownership['unowned_count'] == 0, ownership
          assert ownership['unowned_routes'] == [], ownership
          assert len(ownership['selector_paths']) == 245, ownership
          manifest_routes = {row['route'] for row in inventory['python']['manifest']}
          assert set(ownership['selector_paths']) == manifest_routes, ownership
          assert ownership['probe_environment'] == 'production selector; no activation probe flag', ownership

          rust = status['engines']['rust']
          assert rust['native_public_commands'] == 245, status
          assert rust['missing_public_commands'] == 0, status

          print(json.dumps({
              'ok': True,
              'canonical_public_routes': 245,
              'production_selector_owned': ownership['owned_count'],
              'production_selector_unowned': ownership['unowned_count'],
              'engine_status_native': rust['native_public_commands'],
              'engine_status_missing': rust['missing_public_commands'],
          }, sort_keys=True))
          PY

      - name: Run promotion and transition regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.runtime.test_dual_engine_promotion_boundary \
            tests.runtime.test_phase2_rust_migration_matrix \
            tests.runtime.test_phase2_rust_migration_transition \
            -v
          python tools/verify_dual_engine_public_surface.py --require-full > /tmp/dual-engine-full.json
          git diff --check

      - name: Commit only after every proof passes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b15a5c5a7a69de42324fa103dc38e1a93c504759"
          remote_head="$(git ls-remote origin refs/heads/agent/r31-provider-capture-native | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

          git rm \
            .github/workflows/post-promotion-native-activation-selfpatch.yml \
            tools/apply_post_promotion_native_activation.py
          git add \
            crates/syntavra-cli/src/native_product.rs \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/bin/syntavra-remaining71-ownership.rs \
            tools/report_phase2_rust_migration_transition.py \
            .github/workflows/phase2-rust-migration-matrix.yml \
            .github/workflows/remaining71-capability-differential.yml \
            tests/runtime/test_phase2_rust_migration_transition.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Activate promoted native surface in production selector"
          git push origin HEAD:agent/r31-provider-capture-native
