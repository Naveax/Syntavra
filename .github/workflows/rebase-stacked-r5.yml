name: Rebase stacked R5 and preserve ancestry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebase-stacked-r5.yml"

permissions:
  contents: write

jobs:
  rebase-r5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dual-engine-r5-primitives
          fetch-depth: 0
      - name: Rebuild R5 on merged R4 and preserve old stack ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feature/dual-engine-r5-primitives
          git checkout -B r5-rebased origin/main
          git diff --binary \
            f799e6e0e72a40013fbc68da7d2421736c131173 \
            8f5c3c4736c9d59c77fc3ddb85ab3d2889bd21ce \
            -- . \
            ':(exclude).github/workflows/contract-drift.yml' \
            ':(exclude).github/workflows/rust-build.yml' \
            ':(exclude)MANIFEST.sha256' > /tmp/r5.patch
          git apply --index /tmp/r5.patch
          git config user.name "Syntavra Stack Rebase"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Rebase R5 primitive parity onto merged R4"
          git merge -s ours --no-ff 8f5c3c4736c9d59c77fc3ddb85ab3d2889bd21ce \
            -m "Preserve original R5 stack ancestry"
          git push origin HEAD:feature/dual-engine-r5-primitives --force
