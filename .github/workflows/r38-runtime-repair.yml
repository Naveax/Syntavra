name: R38 Runtime Regression Repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/r38-runtime-repair"
      - ".github/workflows/r38-runtime-repair.yml"
      - "tools/repair_r38_ci_closure.py"
      - "tools/repair_r38_runtime_regressions.py"
      - "tests/runtime/test_r38_runtime_regression_repair.py"
  workflow_dispatch:

concurrency:
  group: r38-runtime-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect one-shot repair marker
        id: marker
        shell: bash
        run: |
          if [ -f .github/r38-runtime-repair ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.marker.outputs.present == 'true'
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        if: steps.marker.outputs.present == 'true'
        with:
          components: rustfmt
      - name: Repair CI closure and malformed native runtime state
        if: steps.marker.outputs.present == 'true'
        run: |
          python tools/repair_r38_ci_closure.py
          python tools/repair_r38_runtime_regressions.py
          cargo fmt --all
          python tools/repair_r38_runtime_regressions.py --check
          python -m pytest -q tests/runtime/test_r38_runtime_regression_repair.py
      - name: Reproduce generated metadata
        if: steps.marker.outputs.present == 'true'
        run: |
          python tools/repair_r38_selector_option_values.py
          python tools/repair_r38_windows_rollout_identity.py
          python tools/sync_r38_generated_metadata.py
          cargo fmt --all
          python tools/sync_r38_generated_metadata.py
          rm .github/r38-runtime-repair
          python tools/refresh_manifest.py
          test ! -e .github/r38-runtime-repair
      - name: Compile repaired selector
        if: steps.marker.outputs.present == 'true'
        run: cargo check --locked -p syntavra-cli --bin syntavra
      - name: Commit atomic runtime repair
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "R38: repair CI closure and runtime regressions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
