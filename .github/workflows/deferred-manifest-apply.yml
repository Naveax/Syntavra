name: Deferred Tool Discovery Manifest Apply

on:
  push:
    branches:
      - agent/deferred-tool-discovery-v1

permissions:
  contents: write
  actions: read

concurrency:
  group: deferred-manifest-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/deferred-tool-discovery-v1
          fetch-depth: 0

      - name: Download exact provenance candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9342176447/zip" \
            -o /tmp/provenance.zip
          unzip -q /tmp/provenance.zip -d /tmp/provenance
          test -f /tmp/provenance/candidate-MANIFEST.sha256
          echo '4481b23def3ccbb6380e125a1124880da864a327a5124f97bbbe0cfd763ac09e  /tmp/provenance/candidate-MANIFEST.sha256' | sha256sum -c -
          test "$(wc -l < /tmp/provenance/candidate-MANIFEST.sha256)" = "1202"
          test "$(wc -c < /tmp/provenance/candidate-MANIFEST.sha256)" = "131982"

      - name: Apply candidate manifest only
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/provenance/candidate-MANIFEST.sha256 MANIFEST.sha256
          git diff --check -- MANIFEST.sha256
          git status --short

      - name: Commit manifest only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256
          test "$(git diff --cached --name-only)" = "MANIFEST.sha256"
          git commit -m 'Seal Deferred Tool Discovery manifest'
          git push origin HEAD:agent/deferred-tool-discovery-v1
