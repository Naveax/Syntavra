name: OpenAI Prompt Cache Modernization

on:
  push:
    paths:
      - 'syntavra_runtime/openai_prompt_cache.py'
      - 'syntavra_runtime/provider_gateway.py'
      - 'syntavra_runtime/prompt_cache_optimizer.py'
      - 'syntavra_runtime/provider_call_observation.py'
      - 'tests/runtime/test_openai_prompt_cache_modernization.py'
      - 'tests/runtime/test_provider_gateway_v4.py'
      - 'tests/runtime/test_provider_native_context_editing.py'
      - 'contracts/python/openai-prompt-cache-modernization-v1.json'
      - 'docs/TE_P0_14_OPENAI_PROMPT_CACHE_MODERNIZATION.md'
      - '.github/workflows/openai-prompt-cache-modernization.yml'
  pull_request:
    paths:
      - 'syntavra_runtime/openai_prompt_cache.py'
      - 'syntavra_runtime/provider_gateway.py'
      - 'syntavra_runtime/prompt_cache_optimizer.py'
      - 'syntavra_runtime/provider_call_observation.py'
      - 'tests/runtime/test_openai_prompt_cache_modernization.py'
      - 'tests/runtime/test_provider_gateway_v4.py'
      - 'tests/runtime/test_provider_native_context_editing.py'
      - 'contracts/python/openai-prompt-cache-modernization-v1.json'
      - 'docs/TE_P0_14_OPENAI_PROMPT_CACHE_MODERNIZATION.md'
      - '.github/workflows/openai-prompt-cache-modernization.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openai-prompt-cache-modernization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Compile modernization owners
        run: |
          python -m compileall -q \
            syntavra_runtime/openai_prompt_cache.py \
            syntavra_runtime/provider_gateway.py \
            syntavra_runtime/prompt_cache_optimizer.py \
            syntavra_runtime/provider_call_observation.py \
            tests/runtime/test_openai_prompt_cache_modernization.py

      - name: Run modernization and compatibility regressions
        run: |
          python -m unittest tests.runtime.test_openai_prompt_cache_modernization -v
          python -m unittest tests.runtime.test_provider_gateway_v4 -v
          python -m unittest tests.runtime.test_provider_native_context_editing -v

      - name: Validate contract and exact-head receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path('contracts/python/openai-prompt-cache-modernization-v1.json').read_text(encoding='utf-8'))
          assert contract['claim'] == 'OPENAI_PROMPT_CACHE_MODERNIZATION_V1'
          assert contract['authority']['rust_resume_allowed'] is False
          assert contract['authority']['rust_changes_required'] is False
          assert contract['claim_boundary']['provider_billed_savings_proven'] is False
          receipt = {
              'schema_version': 1,
              'claim': 'OPENAI_PROMPT_CACHE_MODERNIZATION_V1_TESTED',
              'exact_head': os.environ['GITHUB_SHA'],
              'request_control_profiles_tested': True,
              'stable_prefix_profile_isolation_tested': True,
              'cache_write_diagnostic_tested': True,
              'provider_billed_savings_proven': False,
              'rust_resume_allowed': False,
          }
          Path('/tmp/openai-prompt-cache-modernization.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Enforce clean exact-head repository
        run: |
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload modernization evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openai-prompt-cache-modernization-${{ github.sha }}
          path: /tmp/openai-prompt-cache-modernization.json
          if-no-files-found: error
