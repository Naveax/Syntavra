name: Temporary Runtime Contract Version Graph Certification v1

on:
  push:
    branches:
      - automation/runtime-contract-version-graph-certify-v1

permissions:
  contents: write

concurrency:
  group: temporary-runtime-contract-version-graph-certify-v1
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
      FINAL_BRANCH: agent/runtime-contract-version-graph-certification-v1
      HELPER_PATH: .github/workflows/tmp-runtime-contract-version-graph-certify-v1.yml
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Build certification seal working tree
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD^)"
          test "$BASE_SHA" = "768b4b57087134968d345088e90d56e00d8800cf"
          printf '%s\n' "$BASE_SHA" > /tmp/base-sha.txt

          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('contracts/python/capability-completeness-registry-v1.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          rows = [row for row in registry['capabilities'] if row.get('id') == 'runtime_contract_version_graph_v1']
          assert len(rows) == 1, rows
          row = rows[0]
          assert row['state'] == 'implemented', row
          assert row['required_for_python_complete'] is False, row
          assert row['implementation_evidence'], row
          assert row['certification_evidence'] == [], row
          assert registry['python_complete']['ready'] is True
          assert registry['python_complete']['rust_resume_allowed'] is False
          assert registry['python_complete']['rust_retired'] is True
          assert registry['post_completion_milestone_order'] == ['runtime_contract_version_graph_v1']
          row['state'] = 'certified'
          row['certification_evidence'] = list(row['implementation_evidence'])
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/runtime/test_python_capability_completeness.py')
          source = test_path.read_text(encoding='utf-8')
          old = '        self.assertEqual(report["post_completion_current_milestone"], "runtime_contract_version_graph_v1")'
          new = '        self.assertEqual(report["post_completion_current_milestone"], "post_completion_complete")'
          assert source.count(old) == 1, source.count(old)
          test_path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          rm -f "$HELPER_PATH"
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          rm -rf syntavra_runtime.egg-info
          git diff --check

      - name: Validate certification seal before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.runtime.test_runtime_contract_version_graph_v1 \
            tests.runtime.test_python_capability_completeness \
            tests.runtime.test_python_completion_certificate_v1 \
            tests.runtime.test_release_action_pins -v
          python tools/certify_runtime_contract_version_graph_v1.py --repo . --out /tmp/runtime-contract-version-graph-precommit.json
          python tools/certify_python_capability_completeness.py --repo . --out /tmp/python-capability-completeness-precommit.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-precommit.json
          python tools/refresh_manifest.py --check
          python tools/validate.py

      - name: Create one clean final commit directly on merged main
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(cat /tmp/base-sha.txt)"
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          rm -rf syntavra_runtime.egg-info
          git add -A

          python - <<'PY'
          import subprocess
          expected = {
              'MANIFEST.sha256',
              'contracts/python/capability-completeness-registry-v1.json',
              'tests/runtime/test_python_capability_completeness.py',
              '.github/workflows/tmp-runtime-contract-version-graph-certify-v1.yml',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == expected, {'actual': sorted(actual), 'expected': sorted(expected)}
          PY

          TREE_SHA="$(git write-tree)"
          FINAL_SHA="$(printf '%s\n' 'Certify Runtime Contract Version Graph v1 lifecycle' | git commit-tree "$TREE_SHA" -p "$BASE_SHA")"
          printf '%s\n' "$FINAL_SHA" > /tmp/final-sha.txt
          printf '%s\n' "$TREE_SHA" > /tmp/final-tree.txt
          git checkout --detach "$FINAL_SHA"

          test ! -e "$HELPER_PATH"
          python tools/refresh_manifest.py --check
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Certify exact final head
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="$(cat /tmp/final-sha.txt)"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"

          python tools/certify_runtime_contract_version_graph_v1.py --repo . --out /tmp/runtime-contract-version-graph.json
          python tools/certify_python_capability_completeness.py --repo . --out /tmp/python-capability-completeness.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze.json

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          graph = json.loads(Path('/tmp/runtime-contract-version-graph.json').read_text(encoding='utf-8'))
          completeness = json.loads(Path('/tmp/python-capability-completeness.json').read_text(encoding='utf-8'))
          rust = json.loads(Path('/tmp/rust-feature-freeze.json').read_text(encoding='utf-8'))

          assert graph['ok'] is True, graph
          assert graph['exact_head'] == head
          assert graph['lifecycle_state'] == 'certified'
          assert graph['post_completion_current_milestone'] == 'post_completion_complete'
          assert graph['python_complete_ready'] is True
          assert graph['rust_resume_allowed'] is False

          assert completeness['ok'] is True, completeness
          assert completeness['exact_head'] == head
          assert completeness['current_milestone'] == 'python_complete'
          assert completeness['post_completion_current_milestone'] == 'post_completion_complete'
          assert completeness['python_complete_ready'] is True
          assert completeness['rust_resume_allowed'] is False
          assert completeness['rust']['production_promoted'] == 174
          assert completeness['rust']['remaining_parity_promotion'] == 71

          assert rust['ok'] is True, rust
          assert rust['exact_head'] == head
          assert rust['python_complete_ready'] is True
          assert rust['rust_resume_allowed'] is False
          assert rust['rust']['feature_development_frozen'] is True
          assert rust['rust']['production_promotion_frozen'] is True
          assert rust['rust']['production_promoted'] == 174
          assert rust['rust']['remaining_parity_promotion'] == 71
          PY

      - name: Push clean certification branch once
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="$(cat /tmp/final-sha.txt)"
          git push origin "$FINAL_SHA:refs/heads/$FINAL_BRANCH"

      - name: Write helper receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def read(path):
              p = Path(path)
              return p.read_text(encoding='utf-8').strip() if p.exists() else None
          payload = {
              'schema_version': 1,
              'claim': 'RUNTIME_CONTRACT_VERSION_GRAPH_V1_LIFECYCLE_CERTIFICATION_HELPER',
              'base_sha': read('/tmp/base-sha.txt'),
              'final_sha': read('/tmp/final-sha.txt'),
              'final_tree': read('/tmp/final-tree.txt'),
              'final_branch': 'agent/runtime-contract-version-graph-certification-v1',
              'python_complete_expected': True,
              'rust_resume_allowed_expected': False,
              'rust_production_promoted_expected': 174,
              'rust_remaining_expected': 71,
          }
          Path('/tmp/runtime-contract-version-graph-certification-helper.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload helper receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-contract-version-graph-certification-helper-${{ github.sha }}
          path: |
            /tmp/runtime-contract-version-graph-certification-helper.json
            /tmp/runtime-contract-version-graph.json
            /tmp/python-capability-completeness.json
            /tmp/rust-feature-freeze.json
          if-no-files-found: warn
