name: R25 Atomic Apply Format Repair

on:
  push:
    branches:
      - feature/full-parity-r25-config-last-good-atomic-apply

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r25-config-last-good-atomic-apply
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Format and constrain diff
        shell: bash
        run: |
          cargo fmt --all
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              crates/syntavra-cli/src/config_last_good_apply.rs|crates/syntavra-cli/src/bin/syntavra-config-last-good-apply.rs) ;;
              *) echo "unexpected formatted path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/syntavra-cli/src/config_last_good_apply.rs crates/syntavra-cli/src/bin/syntavra-config-last-good-apply.rs
          git commit -m "Format R25 atomic apply Rust sources"
          git push origin HEAD:feature/full-parity-r25-config-last-good-atomic-apply
