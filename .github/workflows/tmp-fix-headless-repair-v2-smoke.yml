name: Temporary Fix Headless Repair V2 Smoke

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/r31-provider-capture-native'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Remove unsupported smoke flag once
        run: |
          path=.github/workflows/tmp-headless-parity-repair-v2.yml
          if grep -q '^            --json \\$' "$path"; then
            sed -i '/^            --json \\$/d' "$path"
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$path"
            git commit -m "ci: fix headless repair smoke invocation"
            git push origin HEAD:agent/r31-provider-capture-native
          else
            echo 'HEADLESS_REPAIR_SMOKE_ALREADY_FIXED=1'
          fi
