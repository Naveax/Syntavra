name: Codex Integration Closure

on:
  push:
    branches:
      - agent/codex-integration-savings-closure
  pull_request:
    paths:
      - "syntavra_runtime/**"
      - "skills/syntavra/**"
      - "tests/**"
      - "tools/repair_codex_integration.py"
      - "tools/validate_codex_integration_closure.py"
      - ".github/workflows/codex-integration-closure.yml"
      - "README.md"
      - "COMPATIBILITY.md"
      - "docs/CODEX_INTEGRATION_SAVINGS_CLOSURE.md"

permissions:
  contents: read

jobs:
  exact-head-closure:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime
        run: python -m pip install -e .

      - name: Validate Codex closure at exact head
        run: python tools/validate_codex_integration_closure.py --expected-head ${{ github.sha }} --full-runtime
