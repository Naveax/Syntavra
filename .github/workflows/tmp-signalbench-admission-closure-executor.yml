name: Temporary SignalBench Admission Closure Executor

on:
  push:
    branches:
      - agent/signalbench-admission-closure-executor-20260826
    paths:
      - .github/workflows/tmp-signalbench-admission-closure-executor.yml

permissions:
  contents: write

concurrency:
  group: tmp-signalbench-admission-closure-executor-20260826
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/signalbench-admission-closure-executor-20260826
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Remove helper before regenerating manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-signalbench-admission-closure-executor.yml
          python tools/refresh_manifest.py
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py --check
          git diff --check

      - name: Reconfirm closure invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_signalbench_python_product_v1 -v
          python -m unittest tests.runtime.test_dual_engine_promotion_boundary -v
          python tools/verify_dual_engine_public_surface.py > /tmp/dual-engine-boundary.json
          python - <<'PY'
          import json
          from pathlib import Path
          boundary = json.loads(Path("/tmp/dual-engine-boundary.json").read_text(encoding="utf-8"))
          assert boundary["ok"] is True, boundary
          assert boundary["python"]["module_count"] == 212, boundary["python"]
          contract = json.loads(Path("contracts/python/core-legacy-route-reference-v1.json").read_text(encoding="utf-8"))
          assert contract["expected_side_effect_sha256"] == "e7b6a2166f6f515be5de34883a4c20f49346917dba600b37edba5ea627c9a493"
          text = Path("syntavra_runtime/prerelease_cli.py").read_text(encoding="utf-8")
          assert "compatibility = {" in text
          assert '"provider_observed_pairs"' in text
          PY

      - name: Require manifest-only cleanup plus helper deletion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/tmp-signalbench-admission-closure-executor.yml",
              "MANIFEST.sha256",
          }
          rows = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True).splitlines()
          actual = {row[3:] for row in rows}
          print("\n".join(rows))
          assert actual == expected, (actual, expected)
          PY

      - name: Commit final clean manifest tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize SignalBench closure manifest"
          git push origin HEAD:agent/signalbench-admission-closure-executor-20260826
