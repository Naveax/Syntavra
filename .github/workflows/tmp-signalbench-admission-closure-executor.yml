name: Temporary SignalBench Admission Closure Executor

on:
  push:
    branches:
      - agent/signalbench-admission-closure-executor-20260826
    paths:
      - .github/workflows/tmp-signalbench-admission-closure-executor.yml

permissions:
  contents: write

concurrency:
  group: tmp-signalbench-admission-closure-executor-20260826
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/signalbench-admission-closure-executor-20260826
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Apply exact admission closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "contracts/engine/dual-engine-public-surface-v2.json",
              '    "module_count": 211,',
              '    "module_count": 212,',
              "dual-engine Python module count",
          )
          replace_once(
              "contracts/python/core-legacy-route-reference-v1.json",
              '"expected_side_effect_sha256": "40b3a28c7aa24233662735c5d096a762d55f5bfa4fdfda3d18cc835da506f0af"',
              '"expected_side_effect_sha256": "e7b6a2166f6f515be5de34883a4c20f49346917dba600b37edba5ea627c9a493"',
              "core legacy side-effect freeze",
          )

          provider_old = "\n".join([
              '    if args.action == "provider-billed":',
              '        rows = load_results(Path(args.path))',
              '        value = SignalBenchRunner.compare(rows, baseline_arm=args.baseline, candidate_arm=args.candidate)',
              '        value["provider_observed_runs"] = sum(bool(row.provider_observed) for row in rows)',
              '        value["total_runs"] = len(rows)',
              '        value["fail_closed"] = True',
              '        _emit(value)',
              '        return 0 if value["claimable_superiority"] else 4',
          ]) + "\n"
          provider_new = "\n".join([
              '    if args.action == "provider-billed":',
              '        rows = load_results(Path(args.path))',
              '        value = SignalBenchRunner.compare(rows, baseline_arm=args.baseline, candidate_arm=args.candidate)',
              '        value["provider_observed_runs"] = sum(bool(row.provider_observed) for row in rows)',
              '        value["total_runs"] = len(rows)',
              '        value["fail_closed"] = True',
              '        compatibility = {',
              '            key: value[key]',
              '            for key in (',
              '                "baseline",',
              '                "candidate",',
              '                "claim",',
              '                "claimable_superiority",',
              '                "confidence_interval_95",',
              '                "fail_closed",',
              '                "invalid_pairs",',
              '                "median_efficiency_ratio",',
              '                "pass_rates",',
              '                "provider_observed_pairs",',
              '                "provider_observed_runs",',
              '                "provider_unobserved_pairs",',
              '                "total_runs",',
              '                "valid_pairs",',
              '            )',
              '        }',
              '        _emit(compatibility)',
              '        return 0 if value["claimable_superiority"] else 4',
          ]) + "\n"
          replace_once(
              "syntavra_runtime/prerelease_cli.py",
              provider_old,
              provider_new,
              "provider-billed public compatibility projection",
          )
          PY

          python tools/refresh_manifest.py

      - name: Run focused SignalBench product regression
        run: python -m unittest tests.runtime.test_signalbench_python_product_v1 -v

      - name: Verify frozen provider-billed public shape
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from tools.certify_python_benchmark_proof_reference import _provider_runs

          expected = {
              "baseline", "candidate", "claim", "claimable_superiority",
              "confidence_interval_95", "fail_closed", "invalid_pairs",
              "median_efficiency_ratio", "pass_rates", "provider_observed_pairs",
              "provider_observed_runs", "provider_unobserved_pairs", "total_runs",
              "valid_pairs",
          }
          with tempfile.TemporaryDirectory(prefix="syntavra-provider-billed-compat-") as tmp:
              root = Path(tmp)
              project = root / "project"
              state = root / "state"
              project.mkdir()
              state.mkdir()
              (project / ".git").mkdir()
              billed = root / "provider-billed.json"
              billed.write_text(json.dumps({"results": _provider_runs()}, separators=(",", ":")), encoding="utf-8")
              done = subprocess.run(
                  [
                      sys.executable, "-m", "syntavra_runtime.engine_entry", "--engine", "python",
                      "--project", str(project), "--state-root", str(state), "prove", "provider-billed",
                      str(billed), "--baseline", "plain-host", "--candidate", "syntavra-minimal",
                  ],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              assert done.stderr == "", done.stderr
              value = json.loads(done.stdout)
              assert set(value) == expected, (sorted(value), sorted(expected))
              assert "comparison_authority" not in value
              assert done.returncode in {0, 4}, done.returncode
              print(json.dumps({"ok": True, "keys": sorted(value), "exit": done.returncode}, sort_keys=True))
          PY

      - name: Run dual-engine promotion boundary checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_dual_engine_promotion_boundary -v
          python tools/verify_dual_engine_public_surface.py > /tmp/dual-engine-boundary.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("/tmp/dual-engine-boundary.json").read_text(encoding="utf-8"))
          assert value["ok"] is True, value
          assert value["python"]["module_count"] == 212, value["python"]
          PY

      - name: Run core legacy reference checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_python_core_legacy_reference -v
          python tools/certify_python_core_legacy_reference.py --output /tmp/python-core-legacy-route-reference.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("/tmp/python-core-legacy-route-reference.json").read_text(encoding="utf-8"))
          assert value["ok"] is True, value
          assert value["failure_count"] == 0, value.get("failures")
          assert value["derived_hashes"]["side_effect_sha256"] == "e7b6a2166f6f515be5de34883a4c20f49346917dba600b37edba5ea627c9a493"
          PY

      - name: Verify exact manifest and staged scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py --check
          git diff --check
          git rm .github/workflows/tmp-signalbench-admission-closure-executor.yml
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/tmp-signalbench-admission-closure-executor.yml",
              "MANIFEST.sha256",
              "contracts/engine/dual-engine-public-surface-v2.json",
              "contracts/python/core-legacy-route-reference-v1.json",
              "syntavra_runtime/prerelease_cli.py",
          }
          rows = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True).splitlines()
          actual = {row[3:] for row in rows}
          print("\n".join(rows))
          assert actual == expected, (actual, expected)
          PY

      - name: Commit validated closure tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: close SignalBench admission drift"
          git push origin HEAD:agent/signalbench-admission-closure-executor-20260826
