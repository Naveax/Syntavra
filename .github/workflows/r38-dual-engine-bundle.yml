name: R38 Dual-Engine Bundle

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "syntavra_runtime/**"
      - "crates/**"
      - "contracts/engine/dual-engine-public-surface-v2.json"
      - "tools/verify_dual_engine_bundle.py"
      - ".github/workflows/r38-dual-engine-bundle.yml"
  push:
    branches: [main, "agent/full-dual-engine-runtime"]
    paths:
      - "pyproject.toml"
      - "syntavra_runtime/**"
      - "crates/**"
      - "contracts/engine/dual-engine-public-surface-v2.json"
      - "tools/verify_dual_engine_bundle.py"
      - ".github/workflows/r38-dual-engine-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Dual bundle (${{ matrix.platform }}-${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            architecture: x64
            extension: ""
          - os: windows-latest
            platform: windows
            architecture: x64
            extension: ".exe"
          - os: macos-15-intel
            platform: macos
            architecture: x64
            extension: ""
          - os: macos-14
            platform: macos
            architecture: arm64
            extension: ""
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
      CARGO_INCREMENTAL: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and install Python engine
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          python -m pip install --disable-pip-version-check build
          python -m pip install --disable-pip-version-check -e .
          python -m build --wheel
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: r38-dual-bundle
          cache-on-failure: false
      - name: Build selector and Rust runtimes
        run: cargo build --release --locked --bin syntavra --bin syntavra-rs --bin syntavra-full-parity
      - name: Exercise both selected engines
        shell: bash
        run: |
          selector="target/release/syntavra${{ matrix.extension }}"
          "$selector" --engine python version > selected-python.json
          "$selector" --engine rust version > selected-rust.json
          "$selector" engine verify > selected-engines.json
      - name: Assemble one-install dual-engine bundle
        shell: bash
        run: |
          bundle="dist/syntavra-dual-0.0.1-${{ matrix.platform }}-${{ matrix.architecture }}"
          mkdir -p "$bundle/bin" "$bundle/python" "$bundle/contracts"
          cp "target/release/syntavra${{ matrix.extension }}" "$bundle/bin/"
          cp "target/release/syntavra-rs${{ matrix.extension }}" "$bundle/bin/"
          cp "target/release/syntavra-full-parity${{ matrix.extension }}" "$bundle/bin/"
          cp dist/syntavra_runtime-0.0.1-*.whl "$bundle/python/"
          cp contracts/engine/dual-engine-public-surface-v2.json "$bundle/contracts/"
          cp README.md LICENSE "$bundle/"
          python tools/verify_dual_engine_bundle.py \
            --bundle-dir "$bundle" \
            --platform "${{ matrix.platform }}" \
            --architecture "${{ matrix.architecture }}" \
            --extension "${{ matrix.extension }}" \
            --output "$bundle/bundle-manifest.json"
      - name: Archive bundle
        shell: bash
        run: |
          bundle="dist/syntavra-dual-0.0.1-${{ matrix.platform }}-${{ matrix.architecture }}"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            7z a "${bundle}.zip" "$bundle/*"
          else
            tar -C dist -czf "${bundle}.tar.gz" "$(basename "$bundle")"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: syntavra-dual-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/syntavra-dual-0.0.1-${{ matrix.platform }}-${{ matrix.architecture }}*
            selected-python.json
            selected-rust.json
            selected-engines.json
          if-no-files-found: error
          retention-days: 90

  certify:
    name: Aggregate dual-engine bundle certification
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: syntavra-dual-*
          path: artifacts
      - name: Verify four complete dual-engine bundles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(path.read_text()) for path in Path('artifacts').rglob('bundle-manifest.json')]
          assert len(rows) == 4, rows
          assert all(row['contains_python_engine'] for row in rows), rows
          assert all(row['contains_rust_engine'] for row in rows), rows
          assert all(row['contains_native_selector'] for row in rows), rows
          assert all(row['hidden_fallback'] is False for row in rows), rows
          assert {(row['platform'], row['architecture']) for row in rows} == {
              ('linux', 'x64'), ('windows', 'x64'), ('macos', 'x64'), ('macos', 'arm64')
          }
          print(json.dumps({
              'ok': True,
              'claim': 'ONE_INSTALL_CONTAINS_BOTH_ENGINES_R38',
              'full_dual_engine_parity': all(row['full_dual_engine_parity'] for row in rows),
              'platforms': 4,
          }, sort_keys=True))
          PY