name: Query Pushdown Gateway Reduction

on:
  pull_request:
    paths:
      - 'syntavra_runtime/agent_runtime.py'
      - 'syntavra_runtime/agent_retrieval.py'
      - 'tests/runtime/test_query_pushdown_gateway.py'
      - 'tests/runtime/test_query_pushdown_reduction.py'
      - 'docs/TE_P0_08_QUERY_PUSHDOWN_GATEWAY.md'
      - '.github/workflows/query-pushdown-gateway.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'syntavra_runtime/agent_runtime.py'
      - 'syntavra_runtime/agent_retrieval.py'
      - 'tests/runtime/test_query_pushdown_gateway.py'
      - 'tests/runtime/test_query_pushdown_reduction.py'
      - 'docs/TE_P0_08_QUERY_PUSHDOWN_GATEWAY.md'
      - '.github/workflows/query-pushdown-gateway.yml'

permissions:
  contents: read

concurrency:
  group: query-pushdown-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: '1'
  SYN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  query-pushdown-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Compile gateway reduction surfaces
        run: |
          set -euo pipefail
          python -m compileall -q \
            syntavra_runtime/agent_runtime.py \
            syntavra_runtime/agent_retrieval.py \
            tests/runtime/test_query_pushdown_gateway.py \
            tests/runtime/test_query_pushdown_reduction.py

      - name: Prove gateway exact-before-lossy reduction
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_agent_retrieval -v
          python -m unittest tests.runtime.test_query_pushdown_reduction -v
          python -m unittest tests.runtime.test_query_pushdown_gateway -v

      - name: Record exact-head gateway reduction receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['SYN_EXPECTED_HEAD']
          receipt = {
              'schema_version': 1,
              'claim': 'TE_P0_08_QUERY_PUSHDOWN_GATEWAY',
              'exact_head': actual,
              'expected_head': expected,
              'head_match': actual == expected,
              'gateway_integration_complete': True,
              'exact_before_lossy': True,
              'raw_candidate_window_provider_visible': False,
              'bounded_window_completeness_explicit': True,
              'fail_closed_without_externalizer': True,
              'provider_proof': False,
              'claim_boundary': 'GATEWAY_MECHANICS_NOT_PROVIDER_BILLED_PROOF',
          }
          Path('/tmp/query-pushdown-gateway.json').write_text(
              json.dumps(receipt, sort_keys=True) + '\n', encoding='utf-8'
          )
          assert receipt['head_match'], receipt
          PY

      - name: Enforce clean exact head
        if: always()
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info .pytest_cache
          test "$(git rev-parse HEAD)" = "$SYN_EXPECTED_HEAD"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload gateway reduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: query-pushdown-gateway-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/query-pushdown-gateway.json
          if-no-files-found: warn
