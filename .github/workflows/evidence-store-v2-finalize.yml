name: Evidence Store v2 Finalize

on:
  push:
    branches:
      - agent/evidence-store-v2

permissions:
  contents: write

concurrency:
  group: evidence-store-v2-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/evidence-store-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install -e .

      - name: Run Evidence Store pre-admission smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_evidence_store_v2 -v
          python -m unittest tests.runtime.test_universal_context_item -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-guard.json
          python tools/certify_universal_context_item.py --out /tmp/universal-context-item.json
          python tools/certify_evidence_store_v2.py --out /tmp/evidence-store-v2.json

      - name: Append current Evidence Store checkpoint once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt')
          marker = 'APPENDED CURRENT CHECKPOINT — 2026-08-18 — EVIDENCE STORE V2 ACTIVE'
          text = path.read_text(encoding='utf-8')
          assert marker not in text, 'Evidence Store checkpoint already appended'
          appendix = '''

======================================================================
APPENDED CURRENT CHECKPOINT — 2026-08-18 — EVIDENCE STORE V2 ACTIVE
======================================================================

CURRENT ADMITTED MAIN:
dece5dfd99f831e1046ecedf885bed0e9a0f3bca

ACTIVE IMPLEMENTATION BRANCH:
agent/evidence-store-v2

PYTHON STATUS:
PYTHON-FIRST ACTIVE — evidence_store_v2 is the current milestone.

RUST STATUS:
FEATURE FROZEN AND CI-ENFORCED — implementation coverage 245/245; production promotion 174/245; remaining parity/promotion set 71; Rust resume false.

COMPLETED:
- universal_context_item_v1 exact-head Universal Context Item PASS on PR #138.
- Python Capability Completeness PASS on PR #138.
- Rust Feature Freeze Guard PASS on PR #138.
- Python Authority PASS on PR #138.
- Release Main Merge Gate PASS on PR #138.
- Release Package Provenance PASS on PR #138.
- exact candidate MANIFEST.sha256 matched tracked Git blob byte-for-byte before merge.
- PR #138 merged as dece5dfd99f831e1046ecedf885bed0e9a0f3bca.
- capability registry records universal_context_item_v1 as certified.

CURRENT IMPLEMENTATION:
- EvidenceStoreV2 SQLite/WAL/FULL-sync store added using the existing platform database primitive.
- UniversalContextItem is the canonical storage identity and envelope.
- stable evidence payload is immutable; trust/freshness are journaled evaluation layers.
- first-class DERIVED_FROM lineage added with external-parent support.
- hash-chained mutation journal added.
- explicit expiry, pin/unpin and expired-unpinned GC added.
- recovery handle integrity proof surface added.
- SecretRedactor-backed default reject policy added; silent at-rest redaction is forbidden and constructor flags cannot weaken the policy.
- Evidence Store v2 contract, regression suite, certifier and exact-head workflow added.
- Release Main, repository validator and immutable action-pin policy are bound to Evidence Store v2.
- legacy RuntimeEvidenceGraph node/edge field schemas remain unchanged.

VERIFIED DESIGN BOUNDARY:
- trust/freshness updates do not create a new stable evidence identity.
- content/provenance/recovery mutation requires a new UniversalContextItem identity.
- secret-bearing exact evidence is rejected before persistence by default.
- pruning is explicit, only expired+unpinned, and tombstoned in the journal before deletion.
- Python COMPLETE remains false.
- Rust resume remains false.

BLOCKERS:
- Evidence Store v2 still requires exact-head PR CI and merge before certification is admitted.

NEXT EXACT TASK:
- Finish and certify evidence_store_v2.
- After admission, advance to typed_context_object_store_v1.
'''
          path.write_text(text + appendix, encoding='utf-8')
          PY

      - name: Remove finalizer and refresh canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/evidence-store-v2-finalize.yml
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          python tools/validate.py > /tmp/repository-validation.json
          git diff --check

      - name: Commit final Evidence Store tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            MANIFEST.sha256 \
            docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt \
            .github/workflows/evidence-store-v2-finalize.yml
          git commit -m "Seal Evidence Store v2 milestone"
          git push origin HEAD:agent/evidence-store-v2
