name: Host Adapter Conformance Diagnostic

on:
  push:
    branches:
      - automation/host-adapter-conformance-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'Record host adapter staging diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 1c7afd63648ba3df642bdc74d471a3cf667f11b0
      DIAG_BRANCH: automation/host-adapter-conformance-diagnostic
      PYTHONUTF8: '1'
    steps:
      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/host-adapter-conformance-v1
          path: target
          fetch-depth: 0

      - name: Checkout diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: automation/host-adapter-conformance-diagnostic
          path: diag
          fetch-depth: 0

      - name: Prepare candidate without mutating target branch
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/prepare.log 2>&1
          from pathlib import Path
          import textwrap

          source = Path('diag/.github/workflows/host-adapter-conformance-staging-builder.yml').read_text(encoding='utf-8')

          def extract(path: str, token: str) -> str:
              lines = source.splitlines()
              needle = f"cat > {path} <<'{token}'"
              starts = [i for i, line in enumerate(lines) if line.strip() == needle]
              assert len(starts) == 1, (path, starts)
              start = starts[0] + 1
              end = next(i for i in range(start, len(lines)) if lines[i].strip() == token)
              return textwrap.dedent('\n'.join(lines[start:end])) + '\n'

          for relative, token in (
              ('contracts/python/host-adapter-conformance-v1.json', 'EOF'),
              ('tests/runtime/test_host_adapter_conformance_v1.py', 'PY'),
              ('tools/certify_host_adapter_conformance_v1.py', 'PY'),
              ('.github/workflows/host-adapter-conformance.yml', 'EOF'),
          ):
              destination = Path('target') / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(extract(relative, token), encoding='utf-8')
          (Path('target') / 'tools/certify_host_adapter_conformance_v1.py').chmod(0o755)

          path = Path('target/syntavra_runtime/host_adapters.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '    "aider": HostCapabilities('
          start = text.index(start_marker)
          end = text.index('\n    ),', start) + len('\n    ),')
          old = text[start:end]
          new = '''    "aider": HostCapabilities(
              "aider", "Aider",
              supports_native_skill=True,
              project_markers=(".aider.conf.yml",),
              skill_path="AGENTS.md",
              integration_notes=("instruction-only",),
          )'''
          assert '"instruction-only"' in old and '"Aider"' in old, old
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')

          release = Path('target/.github/workflows/release-main-merge-gate.yml')
          text = release.read_text(encoding='utf-8')
          test_marker = '          python -m unittest tests.runtime.test_output_intelligence_v1 -v\n'
          cert_marker = '          python tools/certify_output_intelligence_v1.py --out /tmp/output-intelligence.json\n'
          assert text.count(test_marker) == 1, ('release test marker', text.count(test_marker))
          assert text.count(cert_marker) == 1, ('release cert marker', text.count(cert_marker))
          text = text.replace(test_marker, test_marker + '          python -m unittest tests.runtime.test_host_adapter_conformance_v1 -v\n', 1)
          text = text.replace(cert_marker, cert_marker + '          python tools/certify_host_adapter_conformance_v1.py --out /tmp/host-adapter-conformance.json\n', 1)
          release.write_text(text, encoding='utf-8')

          pins = Path('target/tests/runtime/test_release_action_pins.py')
          text = pins.read_text(encoding='utf-8')
          marker = '    ".github/workflows/output-intelligence.yml",\n'
          assert text.count(marker) == 1, ('pin marker', text.count(marker))
          pins.write_text(text.replace(marker, marker + '    ".github/workflows/host-adapter-conformance.yml",\n', 1), encoding='utf-8')
          print('PREPARE_OK')
          PY
          echo $? > /tmp/prepare.rc
          exit 0

      - name: Run candidate verification and capture output
        shell: bash
        run: |
          set +e
          : > /tmp/verify.log
          if [ "$(cat /tmp/prepare.rc)" != "0" ]; then
            echo "SKIPPED_VERIFY_PREPARE_FAILED" >> /tmp/verify.log
            echo 99 > /tmp/verify.rc
            exit 0
          fi
          cd target
          export PYTHONPATH="$GITHUB_WORKSPACE/target"
          rc=0
          python -m pip install -e . >> /tmp/verify.log 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            python -m unittest tests.runtime.test_host_adapter_conformance_v1 -v >> /tmp/verify.log 2>&1 || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python tools/certify_host_adapter_conformance_v1.py --out /tmp/host-adapter-conformance.json >> /tmp/verify.log 2>&1 || rc=$?
          fi
          if [ -f /tmp/host-adapter-conformance.json ]; then
            echo '--- CERTIFICATE ---' >> /tmp/verify.log
            cat /tmp/host-adapter-conformance.json >> /tmp/verify.log
          fi
          echo "$rc" > /tmp/verify.rc
          exit 0

      - name: Persist diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag/diagnostics
          {
            echo "HOST_ADAPTER_STAGING_DIAGNOSTIC"
            echo "expected_target=$EXPECTED_HEAD"
            echo "actual_target=$(git -C target rev-parse HEAD)"
            echo "prepare_rc=$(cat /tmp/prepare.rc)"
            echo "verify_rc=$(cat /tmp/verify.rc)"
            echo
            echo "=== PREPARE ==="
            cat /tmp/prepare.log
            echo
            echo "=== VERIFY ==="
            cat /tmp/verify.log
            echo
            echo "=== DIFF STAT ==="
            git -C target diff --stat || true
            echo
            echo "=== STATUS ==="
            git -C target status --porcelain --untracked-files=all || true
          } > diag/diagnostics/host-adapter-staging.txt
          cd diag
          git config user.name "Syntavra Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/host-adapter-staging.txt
          git commit -m "Record host adapter staging diagnostic"
          git push origin "HEAD:refs/heads/$DIAG_BRANCH"
