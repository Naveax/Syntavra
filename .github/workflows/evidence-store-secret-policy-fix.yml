name: Evidence Store Secret Policy Hardening

on:
  push:
    branches:
      - agent/evidence-store-v2

permissions:
  contents: write

concurrency:
  group: evidence-store-secret-policy-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/evidence-store-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply exact secret policy hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('syntavra_runtime/evidence_store.py')
          text = runtime.read_text(encoding='utf-8')
          old = '''    def __init__(self, path: Path, *, secret_policy: str = "reject"):\n        if secret_policy not in {"reject", "allow-pre-redacted"}:\n            raise ValueError(f"unsupported secret policy: {secret_policy!r}")\n        self.path = path\n        self.secret_policy = secret_policy\n'''
          new = '''    def __init__(self, path: Path, *, secret_policy: str = "reject"):\n        if secret_policy != "reject":\n            raise ValueError(f"unsupported secret policy: {secret_policy!r}")\n        self.path = path\n        self.secret_policy = secret_policy\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old = '''        if receipt["redacted"] and self.secret_policy == "reject":\n            raise ValueError(\n                "evidence item contains secret-like material; create an explicit sanitized UniversalContextItem before storage"\n            )\n'''
          new = '''        if receipt["redacted"]:\n            raise ValueError(\n                "evidence item contains secret-like material; create an explicit sanitized UniversalContextItem before storage"\n            )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          runtime.write_text(text, encoding='utf-8')

          tests_path = Path('tests/runtime/test_evidence_store_v2.py')
          tests = tests_path.read_text(encoding='utf-8')
          anchor = '''    def test_pre_redacted_item_may_be_stored_without_silent_mutation(self) -> None:\n        item = make_item(content={"token": "<redacted:openai-key:0123456789ab>"})\n        receipt = self.store.put(item)\n        self.assertTrue(receipt["ok"])\n        self.assertEqual(self.store.require(item.item_id).content, item.content)\n\n'''
          replacement = anchor + '''    def test_secret_policy_cannot_be_weakened_by_constructor_flag(self) -> None:\n        with self.assertRaisesRegex(ValueError, "unsupported secret policy"):\n            EvidenceStoreV2(self.path, secret_policy="allow-pre-redacted")\n\n'''
          assert tests.count(anchor) == 1, tests.count(anchor)
          tests = tests.replace(anchor, replacement, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY
          rm .github/workflows/evidence-store-secret-policy-fix.yml
          python -m py_compile syntavra_runtime/evidence_store.py tests/runtime/test_evidence_store_v2.py
          git diff --check

      - name: Commit hardened Evidence Store policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syntavra_runtime/evidence_store.py tests/runtime/test_evidence_store_v2.py .github/workflows/evidence-store-secret-policy-fix.yml
          git commit -m "Harden Evidence Store secret policy"
          git push origin HEAD:agent/evidence-store-v2
