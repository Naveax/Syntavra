name: Add R24 Scheduler Exhaustive Match Arm

on:
  push:
    branches:
      - feature/full-parity-r24-scheduler-read-only-cli

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r24-scheduler-read-only-cli
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt
      - name: Add exhaustive scheduler arm
        run: python tools/add_r24_scheduler_exhaustive_arm.py
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Remove temporary repair files
        run: |
          git rm tools/add_r24_scheduler_exhaustive_arm.py
          git rm .github/workflows/add-r24-scheduler-exhaustive-arm.yml
      - name: Commit exhaustive match repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/syntavra-cli/src/main.rs
          git commit -m 'Complete R24 scheduler command match coverage'
          git push origin HEAD:feature/full-parity-r24-scheduler-read-only-cli
