name: U5-P0-05 Global Token Budget Auction

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'syntavra_runtime/context_governor.py'
      - 'syntavra_runtime/provider_token_envelope.py'
      - 'syntavra_runtime/output_governor.py'
      - 'syntavra_runtime/observability_attribution.py'
      - 'tests/runtime/test_token_budget_allocator.py'
      - 'contracts/python/u5-p0-05-global-token-budget-auction-v1.json'
      - 'contracts/engine/dual-engine-public-surface-v2.json'
      - 'tools/validate_u5_p0_05_global_token_budget_auction.py'
      - 'tools/verify_dual_engine_public_surface.py'
      - 'docs/U5_P0_05_GLOBAL_TOKEN_BUDGET_AUCTION.md'
      - '.github/workflows/u5-p0-05-global-token-budget-auction.yml'
  push:
    branches:
      - main
    paths:
      - 'syntavra_runtime/context_governor.py'
      - 'syntavra_runtime/provider_token_envelope.py'
      - 'syntavra_runtime/output_governor.py'
      - 'syntavra_runtime/observability_attribution.py'
      - 'tests/runtime/test_token_budget_allocator.py'
      - 'contracts/python/u5-p0-05-global-token-budget-auction-v1.json'
      - 'contracts/engine/dual-engine-public-surface-v2.json'
      - 'tools/validate_u5_p0_05_global_token_budget_auction.py'
      - 'tools/verify_dual_engine_public_surface.py'
      - 'docs/U5_P0_05_GLOBAL_TOKEN_BUDGET_AUCTION.md'
      - '.github/workflows/u5-p0-05-global-token-budget-auction.yml'

permissions:
  contents: read

concurrency:
  group: u5-p0-05-global-token-budget-auction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run U5-P0-05 regressions
        run: python -m unittest tests.runtime.test_token_budget_allocator -v

      - name: Verify synchronized Python public surface
        run: python tools/verify_dual_engine_public_surface.py > /tmp/u5-p0-05-dual-engine-public-surface.json

      - name: Generate exact-head U5-P0-05 certificate
        run: |
          python tools/validate_u5_p0_05_global_token_budget_auction.py --out /tmp/u5-p0-05-global-token-budget-auction.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('/tmp/u5-p0-05-global-token-budget-auction.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'U5_P0_05_GLOBAL_TOKEN_BUDGET_AUCTION'
          assert report['mechanism_id'] == 'U5-P0-05'
          assert report['wave'] == 'TE-U33'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['provider_savings_claim'] is False
          assert report['public_surface']['module_count'] == 234
          assert report['public_surface']['public_command_count'] == 245
          runtime = report['runtime']
          assert runtime['provider_envelope_authority_preserved'] is True
          assert runtime['five_lane_auction'] is True
          assert runtime['hard_minima_preserved'] is True
          assert runtime['fixed_baseline_exact_partition'] is True
          assert runtime['shadow_effective_is_fixed'] is True
          assert runtime['offline_effective_is_recommended'] is True
          assert runtime['live_reallocation_rejected'] is True
          assert runtime['envelope_rejection_preserved'] is True
          assert runtime['recommended_estimated_verified_gain'] >= runtime['fixed_estimated_verified_gain']
          assert runtime['overhead_provider_visible_tokens'] == 10
          assert runtime['provider_verified_overhead_tokens'] == 10
          assert runtime['paired_execution_evidence_complete'] is True
          assert runtime['provider_savings_claim'] is False
          PY

      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info .pytest_cache
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload U5-P0-05 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u5-p0-05-global-token-budget-auction-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/u5-p0-05-global-token-budget-auction.json
            /tmp/u5-p0-05-dual-engine-public-surface.json
          if-no-files-found: error
