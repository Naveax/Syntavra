name: Multi-Graph Manifest Seal

on:
  push:
    branches:
      - agent/multi-graph-retrieval-v1

permissions:
  contents: write
  actions: read

concurrency:
  group: multi-graph-manifest-seal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_HEAD: 255169de04f29ccd4b97d67b860f94ce80704c62
      ARTIFACT_ID: '9347809230'
      EXPECTED_CANDIDATE_SHA256: 1ea38850c13835c9d8b8f4f1ebad15999ed769e9bbfee60643407a828e44f83a
      SEAL_WORKFLOW: .github/workflows/multi-graph-manifest-seal.yml
      TARGET_BRANCH: agent/multi-graph-retrieval-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout seal commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify seal-only parent boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_HEAD"
          test "$(git diff --name-only "$EXPECTED_SOURCE_HEAD"..HEAD)" = "$SEAL_WORKFLOW"

      - name: Download canonical provenance artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/provenance.zip
          rm -rf /tmp/provenance
          mkdir -p /tmp/provenance
          unzip -q /tmp/provenance.zip -d /tmp/provenance
          test -f /tmp/provenance/candidate-MANIFEST.sha256
          printf '%s  %s\n' "$EXPECTED_CANDIDATE_SHA256" /tmp/provenance/candidate-MANIFEST.sha256 | sha256sum -c -

      - name: Apply canonical manifest and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/provenance/candidate-MANIFEST.sha256 MANIFEST.sha256
          git rm "$SEAL_WORKFLOW"
          git add MANIFEST.sha256
          python tools/refresh_manifest.py --check
          git diff --check
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$SEAL_WORKFLOW" MANIFEST.sha256 | sort)"
          test "$staged" = "$expected"

      - name: Commit exact manifest seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Seal Multi-Graph manifest from provenance candidate"
          git push origin "HEAD:${TARGET_BRANCH}"
