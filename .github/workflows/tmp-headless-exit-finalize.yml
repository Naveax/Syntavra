name: Temporary Headless Exit Finalize

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/r31-provider-capture-native'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
      SYNTAVRA_BULK_PARITY_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prepare exact Rust 1.82 toolchain
        run: |
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt

      - name: Apply headless-only native error exit parity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/syntavra-cli/src/bin/syntavra.rs')
          text = path.read_text(encoding='utf-8')
          old = '''                    Err(error) => fail(\n                        "RUST_PUBLIC_COMMAND_FAILED",\n                        "The selected Rust engine failed while executing the public command.",\n                        json!({"command_path": path, "error": error, "fallback": "forbidden"}),\n                    ),\n'''
          new = '''                    Err(error)\n                        if matches!(\n                            path.as_slice(),\n                            [root, action] if root == "run" && action.starts_with("headless-")\n                        ) =>\n                    {\n                        emit(&json!({\n                            "ok": false,\n                            "error": {\n                                "code": "RUST_PUBLIC_COMMAND_FAILED",\n                                "message": "The selected Rust engine failed while executing the public command.",\n                                "details": {\n                                    "command_path": path,\n                                    "error": error,\n                                    "fallback": "forbidden",\n                                },\n                            }\n                        }));\n                        ExitCode::from(1)\n                    }\n                    Err(error) => fail(\n                        "RUST_PUBLIC_COMMAND_FAILED",\n                        "The selected Rust engine failed while executing the public command.",\n                        json!({"command_path": path, "error": error, "fallback": "forbidden"}),\n                    ),\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'headless selector exit anchor count={count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format compile and prove exact candidate
        run: |
          cargo +1.82.0 fmt --all
          git diff --check
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
          python -m compileall -q tools/validate_remaining71_headless_differential.py syntavra_runtime/platform_cli.py

      - name: Require zero headless mismatches
        run: |
          python tools/validate_remaining71_headless_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/headless-final.json \
            > /tmp/headless-final.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/headless-final.json').read_text(encoding='utf-8'))
          differential = report['differential']
          assert report['ok'] is True, differential['mismatches']
          assert differential['mismatch_count'] == 0, differential['mismatches']
          assert report['python']['resume_queued_error']['exit'] == 1, report['python']['resume_queued_error']
          assert report['rust']['resume_queued_error']['exit'] == 1, report['rust']['resume_queued_error']
          assert report['python']['resume_queued_error']['reason'] == 'job cannot be resumed from queued'
          assert report['rust']['resume_queued_error']['reason'] == 'job cannot be resumed from queued'
          print('HEADLESS_DIFFERENTIAL=PASS')
          print('HEADLESS_MISMATCH_COUNT=0')
          print('HEADLESS_ERROR_EXIT_PARITY=1')
          PY

      - name: Commit proven selector repair and remove temporary workflows
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/tmp-headless-exit-finalize.yml \
            .github/workflows/tmp-headless-parity-repair-v3.yml
          extras="$(git status --porcelain --untracked-files=all | grep -vE ' (crates/syntavra-cli/src/bin/syntavra.rs|\.github/workflows/tmp-headless-exit-finalize.yml|\.github/workflows/tmp-headless-parity-repair-v3.yml)$' || true)"
          printf '%s\n' "$extras"
          test -z "$extras"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/syntavra-cli/src/bin/syntavra.rs
          git diff --cached --check
          git commit -m "fix(headless): align native error exit semantics"
          git push origin HEAD:agent/r31-provider-capture-native

      - name: Upload finalizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-exit-finalizer
          path: |
            /tmp/headless-final.json
            /tmp/headless-final.log
          if-no-files-found: warn
