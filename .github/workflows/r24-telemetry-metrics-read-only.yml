name: R24 Telemetry Metrics Read-Only Parity

on:
  pull_request:
    paths:
      - "contracts/cli/telemetry-metrics-read-only-v1.json"
      - "contracts/engine/**"
      - "contracts/parity/python-rust-full-parity-v1.json"
      - "syntavra_runtime/engine_cli.py"
      - "syntavra_runtime/engine_entry.py"
      - "syntavra_runtime/engine_selector.py"
      - "syntavra_runtime/telemetry_metrics_contract.py"
      - "syntavra_runtime/telemetry_metrics_router_r24.py"
      - "syntavra_runtime/unified_cli.py"
      - "crates/syntavra-cli/src/main.rs"
      - "crates/syntavra-cli/src/telemetry_metrics_contract.rs"
      - "crates/syntavra-contracts/src/lib.rs"
      - "tests/runtime/test_telemetry_metrics_read_only_r24.py"
      - "tools/verify_r24_telemetry_metrics.py"
      - "tools/run_engine_parity.py"
      - "tools/run_engine_parity_r24.py"
      - ".github/workflows/r24-telemetry-metrics-read-only.yml"
      - "docs/adr/0030-telemetry-metrics-read-only-cli-parity.md"
  push:
    branches:
      - main
      - feature/full-parity-r24-telemetry-metrics-cli

permissions:
  contents: read

jobs:
  telemetry-metrics-parity:
    name: R24 Telemetry Metrics Read-Only Parity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest

      - name: Run telemetry metrics regressions
        run: python -m pytest -q tests/runtime/test_telemetry_metrics_read_only_r24.py

      - name: Set up pinned Rust 1.82
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Cargo-backed telemetry metrics parity
        run: python tools/verify_r24_telemetry_metrics.py | tee r24-telemetry-metrics-parity.json

      - name: Upload parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r24-telemetry-metrics-parity
          path: r24-telemetry-metrics-parity.json
          if-no-files-found: warn
