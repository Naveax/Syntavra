name: Typed Context Manifest Finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: typed-context-manifest-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/typed-context-object-store-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Seal manifest from final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/typed-context-manifest-finalizer.yml
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git diff --check

      - name: Commit exact-tree manifest seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 .github/workflows/typed-context-manifest-finalizer.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Seal Typed Context exact-tree manifest"
          git push origin HEAD:agent/typed-context-object-store-v1
