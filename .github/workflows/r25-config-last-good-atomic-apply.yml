name: R25 Config Last-Good Atomic Apply

on:
  push:
    branches:
      - feature/full-parity-r25-config-last-good-atomic-apply
  pull_request:
    paths:
      - "contracts/config/config-last-good-atomic-apply-v1.json"
      - "crates/syntavra-cli/**"
      - "syntavra_runtime/config_last_good_apply.py"
      - "syntavra_runtime/config_last_good_plan.py"
      - "tools/verify_r25_config_last_good_apply.py"
      - "tools/run_engine_parity_r25_apply.py"
      - "tests/runtime/test_config_last_good_apply_r25.py"
      - "docs/adr/0033-r25-config-last-good-atomic-apply.md"
      - ".github/workflows/r25-config-last-good-atomic-apply.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  config-last-good-atomic-apply:
    name: R25 atomic apply parity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest
          python -m pip install -e .

      - name: Set up pinned Rust 1.82
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: r25-config-last-good-atomic-apply-${{ matrix.os }}

      - name: Run R25 Python regressions
        run: python -m pytest -q tests/runtime/test_config_last_good_apply_r25.py

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust workspace tests
        run: cargo test --workspace --locked

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Cargo-backed Python/Rust atomic apply parity
        run: |
          mkdir -p artifacts/r25-config-last-good-atomic-apply
          python tools/verify_r25_config_last_good_apply.py > artifacts/r25-config-last-good-atomic-apply/parity.json

      - name: Run aggregate R0-R25 atomic apply parity
        if: matrix.os == 'ubuntu-latest'
        run: |
          python tools/run_engine_parity_r25_apply.py > artifacts/r25-config-last-good-atomic-apply/aggregate-r0-r25.json

      - name: Upload R25 atomic apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-config-last-good-atomic-apply-${{ matrix.os }}
          path: artifacts/r25-config-last-good-atomic-apply
          if-no-files-found: warn
