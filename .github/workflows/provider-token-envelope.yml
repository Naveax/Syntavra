name: Provider Token Envelope

on:
  pull_request:
    paths:
      - 'syntavra_runtime/provider_token_envelope.py'
      - 'syntavra_runtime/context_governor.py'
      - 'syntavra_runtime/model_gateway.py'
      - 'contracts/python/provider-token-envelope-v1.json'
      - 'docs/plans/SYNTAVRA_PROVIDER_TOKEN_ENVELOPE_V1.md'
      - 'tests/runtime/test_provider_token_envelope.py'
      - 'tests/runtime/test_model_gateway_token_envelope.py'
      - 'tools/certify_provider_token_envelope.py'
      - '.github/workflows/provider-token-envelope.yml'
  push:
    branches:
      - main
    paths:
      - 'syntavra_runtime/provider_token_envelope.py'
      - 'syntavra_runtime/context_governor.py'
      - 'syntavra_runtime/model_gateway.py'
      - 'contracts/python/provider-token-envelope-v1.json'
      - 'docs/plans/SYNTAVRA_PROVIDER_TOKEN_ENVELOPE_V1.md'
      - 'tests/runtime/test_provider_token_envelope.py'
      - 'tests/runtime/test_model_gateway_token_envelope.py'
      - 'tools/certify_provider_token_envelope.py'
      - '.github/workflows/provider-token-envelope.yml'

permissions:
  contents: read

concurrency:
  group: provider-token-envelope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Compile policy surface
        run: >-
          python -m compileall -q
          syntavra_runtime/provider_token_envelope.py
          syntavra_runtime/context_governor.py
          syntavra_runtime/model_gateway.py
          tools/certify_provider_token_envelope.py
          tests/runtime/test_provider_token_envelope.py
          tests/runtime/test_model_gateway_token_envelope.py
      - name: Run provider envelope unit contract
        run: python -m unittest tests.runtime.test_provider_token_envelope -v
      - name: Run gateway enforcement contract
        run: python -m unittest tests.runtime.test_model_gateway_token_envelope -v
      - name: Run certification receipt
        run: python tools/certify_provider_token_envelope.py
      - name: Enforce clean exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
