name: R38 Parent Exact-Head Probe

on:
  push:
    branches:
      - agent/r38-parent-probe-from-codex-closure

permissions:
  contents: read

jobs:
  parent-probe:
    name: ${{ matrix.os }} / Python 3.11 / Rust 1.82.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout certified Codex closure head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dff03c079a3826a0e178f996fbbac977db6d390e

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Install canonical Rust toolchain
        run: rustup toolchain install 1.82.0 --profile minimal --component clippy --component rustfmt

      - name: Verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "dff03c079a3826a0e178f996fbbac977db6d390e"

      - name: Product runtime validator
        run: python tools/validate_runtime.py

      - name: R25-R37 Python/Rust differential parity
        run: python tools/verify_r25_r37_full_parity.py

      - name: Native selector cargo check
        run: cargo +1.82.0 check --locked -p syntavra-cli --bin syntavra

      - name: Rustfmt check
        run: cargo +1.82.0 fmt --all -- --check

      - name: Clippy deny warnings
        run: cargo +1.82.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Working tree integrity
        shell: bash
        run: |
          git status --porcelain=v1 --untracked-files=all
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
