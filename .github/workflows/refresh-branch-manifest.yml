name: Prepare Syntavra Branch Manifest

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syntavra-branch-manifest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Rebuild committed TypeScript SDK output
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          node --check dist/index.js
      - name: Refresh Roblox profile integrity manifest
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          profile=Path('skills/syntavra/profiles/roblox_studio')
          manifest=profile/'MANIFEST.sha256'
          rows=[]
          for path in sorted(profile.rglob('*'), key=lambda item: item.relative_to(profile).as_posix()):
              if not path.is_file() or path == manifest or '__pycache__' in path.parts:
                  continue
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(profile).as_posix()}")
          manifest.write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
      - name: Validate regenerated profile and tests
        run: |
          python -m unittest discover -s tests/roblox_profile -q
          python tools/validate_roblox_profile.py
      - name: Refresh deterministic Roblox claim evidence
        shell: bash
        run: |
          source_commit="$(python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('docs/claims/claims.json').read_text(encoding='utf-8'))
          print(value['source_commit'])
          PY
          )"
          python benchmarks/roblox_profile_benchmark.py \
            --cases 50 \
            --mode simulated \
            --seed 1337 \
            --source-commit "$source_commit" \
            --output benchmarks/results/roblox-profile/simulated-50.json
          SOURCE_COMMIT="$source_commit" python - <<'PY'
          import json
          import os
          import unittest
          from pathlib import Path

          root=Path('.')
          claims_path=root/'docs/claims/claims.json'
          tests_path=root/'benchmarks/results/roblox-profile/profile-tests.json'
          benchmark_path=root/'benchmarks/results/roblox-profile/simulated-50.json'
          claims=json.loads(claims_path.read_text(encoding='utf-8'))
          benchmark=json.loads(benchmark_path.read_text(encoding='utf-8'))
          source_commit=os.environ['SOURCE_COMMIT']
          tests_run=unittest.TestLoader().discover(str(root/'tests/roblox_profile')).countTestCases()

          benchmark['measurement_scope']='DETERMINISTIC_SIMULATED_CORRECTNESS_ONLY'
          benchmark['hardware']='not-recorded'
          benchmark['operating_system']='not-recorded'
          benchmark['python_version']='not-recorded'
          benchmark['latency_p50']=None
          benchmark['latency_p95']=None
          limitation='Deterministic committed receipt omits volatile latency and environment measurements'
          if limitation not in benchmark['limitations']:
              benchmark['limitations'].append(limitation)
          benchmark_path.write_text(json.dumps(benchmark, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          tests_path.write_text(json.dumps({
              'duration_ms': 0.0,
              'errors': 0,
              'failures': 0,
              'maturity': 'INTERNALLY_VERIFIED',
              'skipped': 0,
              'source_commit': source_commit,
              'source_tree_hash': benchmark['source_tree_hash'],
              'status': 'PASS',
              'tests_run': tests_run,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          claims['source_commit']=source_commit
          claims['source_tree_hash']=benchmark['source_tree_hash']
          for claim in claims['claims']:
              if claim['claim_id'] == 'roblox.tests':
                  claim['value']=tests_run
          claims_path.write_text(json.dumps(claims, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
          python tools/verify_claims.py
      - name: Normalize final maturity Clippy structure
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/syntavra-cli/src/native_proof_maturity.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('        reasons,\n        &onboarding,', '        &reasons,\n        &onboarding,'),
              ('    reasons: Vec<String>,\n    onboarding: &OnboardingAssessment,', '    reasons: &[String],\n    onboarding: &OnboardingAssessment,'),
          ]
          for before, after in replacements:
              if text.count(before) == 1:
                  text = text.replace(before, after, 1)
              elif text.count(after) != 1:
                  raise SystemExit(f'unexpected maturity slice state: {before!r}')

          stats = '''struct ProviderPairStats {
              ratios: Vec<f64>,
              observed_pairs: Vec<Flag>,
              invalid_pairs: Vec<Value>,
              quality: BTreeMap<String, i64>,
              total: BTreeMap<String, i64>,
          }
          '''
          summary = stats + '''
          struct ProviderBilledSummary {
              confidence_interval: Option<[f64; 2]>,
              median_ratio: Option<f64>,
              pass_rates: BTreeMap<String, f64>,
              observed_count: usize,
              claimable: bool,
          }
          '''
          if summary not in text:
              if text.count(stats) != 1:
                  raise SystemExit('unexpected ProviderPairStats state')
              text = text.replace(stats, summary, 1)

          old_call = '''    Ok(provider_billed_value(
              baseline,
              candidate,
              &rows,
              stats,
              ci,
              ratio_median,
              pass_rates,
              observed_count,
              claimable,
          ))
          '''
          new_call = '''    let summary = ProviderBilledSummary {
              confidence_interval: ci,
              median_ratio: ratio_median,
              pass_rates,
              observed_count,
              claimable,
          };
          Ok(provider_billed_value(
              baseline,
              candidate,
              &rows,
              &stats,
              &summary,
          ))
          '''
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('unexpected provider-billed call state')

          old_signature = '''fn provider_billed_value(
              baseline: &str,
              candidate: &str,
              rows: &[SignalRun],
              stats: ProviderPairStats,
              confidence_interval: Option<[f64; 2]>,
              median_ratio: Option<f64>,
              pass_rates: BTreeMap<String, f64>,
              observed_count: usize,
              claimable: bool,
          ) -> Value {
              json!({
                  "baseline": baseline,
                  "candidate": candidate,
                  "valid_pairs": stats.ratios.len(),
                  "invalid_pairs": stats.invalid_pairs,
                  "provider_observed_pairs": observed_count,
                  "provider_unobserved_pairs": stats.observed_pairs.len() - observed_count,
                  "median_efficiency_ratio": median_ratio,
                  "confidence_interval_95": confidence_interval,
                  "pass_rates": pass_rates,
                  "claimable_superiority": claimable,
                  "claim": if claimable { "SUPERIORITY_PROVEN" } else { "NOT_PROVEN" },
          '''
          new_signature = '''fn provider_billed_value(
              baseline: &str,
              candidate: &str,
              rows: &[SignalRun],
              stats: &ProviderPairStats,
              summary: &ProviderBilledSummary,
          ) -> Value {
              json!({
                  "baseline": baseline,
                  "candidate": candidate,
                  "valid_pairs": stats.ratios.len(),
                  "invalid_pairs": stats.invalid_pairs,
                  "provider_observed_pairs": summary.observed_count,
                  "provider_unobserved_pairs": stats.observed_pairs.len() - summary.observed_count,
                  "median_efficiency_ratio": summary.median_ratio,
                  "confidence_interval_95": summary.confidence_interval,
                  "pass_rates": summary.pass_rates,
                  "claimable_superiority": summary.claimable,
                  "claim": if summary.claimable { "SUPERIORITY_PROVEN" } else { "NOT_PROVEN" },
          '''
          if old_signature in text:
              text = text.replace(old_signature, new_signature, 1)
          elif new_signature not in text:
              raise SystemExit('unexpected provider-billed output state')

          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Remove transient dependency trees
        shell: bash
        run: rm -rf sdk/typescript/node_modules
      - name: Generate deterministic root SHA-256 manifest
        run: python tools/refresh_manifest.py
      - name: Capture generated integrity diagnostics
        shell: bash
        run: |
          git rev-parse 'HEAD^{tree}' > source-tree.txt
          git rev-parse HEAD > source-commit.txt
          git diff --name-only > generated-changes.txt
      - name: Upload generated integrity candidate
        uses: actions/upload-artifact@v4
        with:
          name: syntavra-generated-root-manifest-${{ github.sha }}
          path: |
            MANIFEST.sha256
            source-tree.txt
            source-commit.txt
            generated-changes.txt
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated outputs to source branch
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          allowed='^(MANIFEST\.sha256|crates/syntavra-cli/src/native_proof_maturity\.rs|docs/claims/claims\.json|benchmarks/results/roblox-profile/(profile-tests|simulated-50)\.json|sdk/typescript/dist/(index\.js|index\.d\.ts|receipts\.js|receipts\.d\.ts)|skills/syntavra/profiles/roblox_studio/MANIFEST\.sha256)$'
          mapfile -t changed < <(git diff --name-only)

          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Generated integrity outputs are already current."
            exit 0
          fi

          for path in "${changed[@]}"; do
            echo "$path" | grep -Eq "$allowed" || {
              echo "unexpected generated change: $path"
              exit 1
            }
          done

          remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${SOURCE_BRANCH}" --jq '.object.sha')"
          if [ "$remote_head" != "$SOURCE_SHA" ]; then
            echo "Branch advanced from $SOURCE_SHA to $remote_head; stale generated output will not be written."
            exit 0
          fi

          update_path() {
            local path="$1"
            local encoded current_sha
            encoded="$(base64 -w0 "$path")"
            current_sha="$(git rev-parse "HEAD:${path}" 2>/dev/null || true)"

            args=(
              --method PUT
              -H "Accept: application/vnd.github+json"
              "repos/${GITHUB_REPOSITORY}/contents/${path}"
              -f "message=prepare Syntavra generated integrity output: ${path}"
              -f "content=${encoded}"
              -f "branch=${SOURCE_BRANCH}"
            )
            if [ -n "$current_sha" ]; then
              args+=( -f "sha=${current_sha}" )
            fi
            gh api "${args[@]}" --silent
          }

          for path in "${changed[@]}"; do
            if [ "$path" != "MANIFEST.sha256" ]; then
              update_path "$path"
            fi
          done

          for path in "${changed[@]}"; do
            if [ "$path" = "MANIFEST.sha256" ]; then
              update_path "$path"
            fi
          done
      - name: Confirm prepared source metadata
        if: always()
        shell: bash
        run: |
          printf '%s\n' "${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}" > prepared-branch.txt
          git rev-parse 'HEAD^{tree}' > prepared-tree.txt
          git rev-parse HEAD > prepared-commit.txt
          cp MANIFEST.sha256 prepared-MANIFEST.sha256
      - name: Upload prepared integrity tree metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syntavra-prepared-manifest-tree-${{ github.sha }}
          path: |
            prepared-MANIFEST.sha256
            prepared-tree.txt
            prepared-commit.txt
            prepared-branch.txt
          if-no-files-found: warn
          retention-days: 7