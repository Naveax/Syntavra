name: Remaining 71 Context Edge Differential

on:
  push:
    branches: [agent/r31-provider-capture-native]
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
      SYNTAVRA_BULK_PARITY_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prepare exact Rust 1.82 CLI
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra

      - name: Run context edge differential
        run: |
          python - <<'PY' > /tmp/context-edge.log 2>&1
          import json, os, subprocess, sys, tempfile
          from pathlib import Path

          repo=Path.cwd(); rust=(repo/'target/debug/syntavra').resolve()

          def invoke(engine, project, state, args):
              common=['--project',str(project),'--state-root',str(state),*args]
              cmd=[sys.executable,'-m','syntavra_runtime.engine_entry','--engine','python',*common] if engine=='python' else [str(rust),'--engine','rust',*common]
              env=os.environ.copy(); env.update({'PYTHONPATH':str(repo),'PYTHONUTF8':'1','PYTHONIOENCODING':'utf-8','SYNTAVRA_BULK_PARITY_PROBE':'1'})
              done=subprocess.run(cmd,cwd=repo,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,encoding='utf-8',errors='replace',timeout=120,check=False)
              try: value=json.loads(done.stdout) if done.stdout.strip() else None
              except json.JSONDecodeError: value=None
              return {'exit':done.returncode,'stderr_nonempty':bool(done.stderr),'value':value}

          def write_json(path,value): path.write_text(json.dumps(value,separators=(',',':')),encoding='utf-8')

          def run_engine(engine, root):
              project=root/'project'; state=root/'state'; project.mkdir(parents=True); state.mkdir(parents=True); (project/'.git').mkdir()

              previous_lines=[f'line-{i:03d}: stable payload for delta fixture' for i in range(60)]
              current_lines=list(previous_lines); current_lines[30]='line-030: CHANGED payload for delta fixture'
              previous='\n'.join(previous_lines); current='\n'.join(current_lines)
              delta_path=project/'delta-beneficial.json'
              write_json(delta_path,[{'item_id':'delta-beneficial','layer':'task','kind':'text','source':'delta-beneficial','content':current,'priority':0.8,'stable':False,'exact_required':True,'metadata':{'edge':'delta'}}])

              repeated='repeated firewall payload abcdefghijklmnopqrstuvwxyz 0123456789'
              multiline='\n'.join([repeated]*220)+'\n'
              external_path=project/'external-multiline.json'
              write_json(external_path,[{'item_id':'external-multiline','layer':'repository','kind':'text','source':'fixture-log','content':multiline,'priority':0.9,'stable':True,'exact_required':True,'metadata':{'edge':'external'}}])

              return {
                  'delta_beneficial':invoke(engine,project,state,['run','context-compile',str(delta_path),'--provider','openai','--model','fixture-model','--budget','10000','--previous',json.dumps({'delta-beneficial':previous},separators=(',',':'))]),
                  'external_multiline':invoke(engine,project,state,['run','context-compile',str(external_path),'--provider','openai','--model','fixture-model','--budget','10000','--previous','{}']),
              }

          with tempfile.TemporaryDirectory(prefix='syntavra-context-edge-') as tmp:
              base=Path(tmp); py=run_engine('python',base/'python'); rs=run_engine('rust',base/'rust')
          mismatches=[]
          for name in py:
              if py[name]!=rs.get(name): mismatches.append({'id':name,'python':py[name],'rust':rs.get(name)})
          report={'ok':not mismatches,'head':os.environ.get('GITHUB_SHA'),'route_count':1,'case_count':2,'mismatch_count':len(mismatches),'mismatches':mismatches,'python':py,'rust':rs,'claim_boundary':'context-compile edge parity for compact-beneficial previous delta and multi-line over-8KiB OutputFirewall externalization; native route count remains frozen'}
          Path('/tmp/context-edge.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps({'ok':report['ok'],'case_count':2,'mismatch_count':len(mismatches)},sort_keys=True))
          for row in mismatches: print('CONTEXT_EDGE_MISMATCH '+row['id'])
          raise SystemExit(0 if report['ok'] else 1)
          PY

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-edge-differential
          path: |
            /tmp/context-edge.json
            /tmp/context-edge.log
          if-no-files-found: warn

      - name: Enforce clean exact-head tree
        if: always()
        run: |
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"
