name: Temporary Runtime Contract Version Graph Rebuild v2

on:
  push:
    branches:
      - automation/runtime-contract-version-graph-rebuild-v2-20260827
    paths:
      - ".github/workflows/tmp-runtime-contract-version-graph-rebuild-v2.yml"

permissions:
  contents: write

concurrency:
  group: tmp-runtime-contract-version-graph-rebuild-v2
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
      BASE_SHA: c0dc3c7689aaad08f0f7d92fe9544b32f76cbacf
      OLD_BASE_SHA: 1292e0d3f4cee4c156006e165052fd1165067fdd
      OLD_HEAD_SHA: 5844faa70501c792b70b2334ad2c82bd7adeae3d
      TARGET_BRANCH: automation/runtime-contract-version-graph-rebuild-v2-20260827
      HELPER_PATH: .github/workflows/tmp-runtime-contract-version-graph-rebuild-v2.yml
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Rebuild capability 240 on reconciled completion head
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git fetch --no-tags origin \
            refs/heads/agent/runtime-contract-version-graph-v1-post-completion-prep:refs/remotes/origin/runtime-contract-version-graph-v1-post-completion-prep
          test "$(git rev-parse refs/remotes/origin/runtime-contract-version-graph-v1-post-completion-prep)" = "$OLD_HEAD_SHA"
          test "$(git rev-parse ${OLD_HEAD_SHA}^)" = "$OLD_BASE_SHA"

          git diff --binary "$OLD_BASE_SHA" "$OLD_HEAD_SHA" -- . ':(exclude)MANIFEST.sha256' > /tmp/runtime-contract-version-graph-v1.patch
          test -s /tmp/runtime-contract-version-graph-v1.patch
          git apply --3way --index /tmp/runtime-contract-version-graph-v1.patch

          conflicts="$(git diff --name-only --diff-filter=U)"
          printf 'conflicts=%s\n' "$conflicts"
          test -z "$conflicts"

          git rm -f "$HELPER_PATH"
          python tools/refresh_manifest.py
          git add -A

          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/release-main-merge-gate.yml
          .github/workflows/runtime-contract-version-graph.yml
          MANIFEST.sha256
          contracts/python/capability-completeness-registry-v1.json
          contracts/python/runtime-contract-version-graph-v1.json
          syntavra_runtime/contract_version_graph.py
          tests/runtime/test_python_capability_completeness.py
          tests/runtime/test_release_action_pins.py
          tests/runtime/test_runtime_contract_version_graph_v1.py
          tools/certify_python_capability_completeness.py
          tools/certify_runtime_contract_version_graph_v1.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-paths.txt
          printf '%s\n' '--- expected permanent paths ---'
          cat /tmp/expected-paths.txt
          printf '%s\n' '--- actual permanent paths ---'
          cat /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          test "$(wc -l < /tmp/actual-paths.txt)" -eq 11
          ! grep -q 'tmp-runtime-contract-version-graph-rebuild-v2.yml' /tmp/actual-paths.txt

          python -m pip install -e .
          python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v
          python tools/certify_runtime_contract_version_graph_v1.py --repo . --out /tmp/runtime-contract-version-graph.json
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness.json
          python -m unittest tests.runtime.test_release_action_pins -v
          python -m unittest tests.runtime.test_python_completion_certificate_v1 -v
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-guard.json

          python - <<'PY'
          import json
          from pathlib import Path

          graph = json.loads(Path('/tmp/runtime-contract-version-graph.json').read_text(encoding='utf-8'))
          completeness = json.loads(Path('/tmp/python-capability-completeness.json').read_text(encoding='utf-8'))
          rust = json.loads(Path('/tmp/rust-feature-freeze-guard.json').read_text(encoding='utf-8'))

          assert graph['ok'] is True, graph
          assert graph['claim'] == 'RUNTIME_CONTRACT_VERSION_GRAPH_V1', graph
          assert graph['admission_ready'] is True, graph
          assert graph['lifecycle_state'] == 'implemented', graph
          assert graph['python_complete_ready'] is True, graph
          assert graph['post_completion_current_milestone'] == 'runtime_contract_version_graph_v1', graph
          assert graph['rust_resume_allowed'] is False, graph
          assert graph['graph']['node_count'] >= 20, graph
          assert graph['graph']['edge_count'] > 0, graph
          assert graph['runtime']['transitive_reverse_dependency_invalidation'] is True, graph
          assert graph['runtime']['external_contracts_are_metadata_only_leaves'] is True, graph

          assert completeness['ok'] is True, completeness
          assert completeness['current_milestone'] == 'python_complete', completeness
          assert completeness['post_completion_current_milestone'] == 'runtime_contract_version_graph_v1', completeness
          assert completeness['post_completion_milestone_order'] == ['runtime_contract_version_graph_v1'], completeness
          assert completeness['python_complete_ready'] is True, completeness
          assert completeness['rust_resume_allowed'] is False, completeness
          assert completeness['uncertified_required_count'] == 0, completeness
          consistency = completeness.get('current_state_report_consistency') or {}
          assert consistency.get('stale_surfaces') == [], completeness

          assert rust['ok'] is True, rust
          assert rust['python_complete_ready'] is True, rust
          assert rust['rust_resume_allowed'] is False, rust
          assert rust['rust']['feature_development_frozen'] is True, rust
          assert rust['rust']['production_promotion_frozen'] is True, rust
          assert rust['rust']['production_promoted'] == 174, rust
          assert rust['rust']['remaining_parity_promotion'] == 71, rust
          PY

          python tools/validate.py
          python tools/validate_release.py --smoke --output /tmp/runtime-contract-version-graph-release-validation.json
          python tools/refresh_manifest.py --check

          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"

          git config user.name Naveax
          git config user.email Omersevik095@gmail.com
          git commit -m 'python: rebuild runtime contract version graph v1 after completion'

          python tools/refresh_manifest.py --check
          python tools/certify_runtime_contract_version_graph_v1.py --repo . --out /tmp/runtime-contract-version-graph-postcommit.json
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness-postcommit.json
          rm -rf syntavra_runtime.egg-info
          test -z "$(git status --porcelain --untracked-files=all)"

          final_commit="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          printf 'FINAL_COMMIT=%s\nFINAL_TREE=%s\n' "$final_commit" "$final_tree"
          printf '{"base_sha":"%s","final_commit":"%s","final_tree":"%s"}\n' "$BASE_SHA" "$final_commit" "$final_tree" > /tmp/runtime-contract-version-graph-rebuild-v2.json
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Upload rebuild receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-contract-version-graph-rebuild-v2-${{ github.sha }}
          path: |
            /tmp/runtime-contract-version-graph-rebuild-v2.json
            /tmp/runtime-contract-version-graph.json
            /tmp/python-capability-completeness.json
            /tmp/rust-feature-freeze-guard.json
            /tmp/runtime-contract-version-graph-release-validation.json
          if-no-files-found: warn
