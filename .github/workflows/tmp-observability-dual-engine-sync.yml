name: Temporary Observability Dual Engine Sync

on:
  push:
    branches:
      - automation/observability-dual-engine-sync-162

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: agent/observability-attribution-v1
      TARGET_HEAD: 63fde1cf6e99c284ee4a6c98d82693f6defafe1b
      BASE_HEAD: 1a1be4f53d37abe307982bc298c274ce528fe360
      PYTHONUTF8: '1'
    steps:
      - name: Checkout helper history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify target branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          actual="$(git rev-parse "origin/$TARGET_BRANCH")"
          printf 'target=%s actual=%s\n' "$TARGET_HEAD" "$actual"
          test "$actual" = "$TARGET_HEAD"

      - name: Checkout exact target head
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_HEAD"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Synchronize Python public surface authority only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tools.export_python_surface import export_surface

          path = Path('contracts/engine/dual-engine-public-surface-v2.json')
          text = path.read_text(encoding='utf-8')
          old = '    "module_count": 207,\n'
          new = '    "module_count": 211,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale Python module_count=207, found {text.count(old)}')
          surface = export_surface()
          if surface.get('module_count') != 211:
              raise SystemExit(f'canonical Python module_count is not 211: {surface.get("module_count")!r}')
          commands = list(surface.get('cli_commands') or [])
          if len(commands) != 245:
              raise SystemExit(f'public command count drifted: {len(commands)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify dual-engine boundary before sealing
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_dual_engine_promotion_boundary -v
          python tools/verify_dual_engine_public_surface.py

      - name: Refresh canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check

      - name: Guard exact repair scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' MANIFEST.sha256 contracts/engine/dual-engine-public-surface-v2.json | sort)"
          test "$changed" = "$expected"
          python -m unittest tests.runtime.test_dual_engine_promotion_boundary -v
          python tools/refresh_manifest.py --check

      - name: Commit and push guarded repair
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$TARGET_HEAD"
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -- contracts/engine/dual-engine-public-surface-v2.json MANIFEST.sha256
          git commit -m "Sync Python public surface authority for Observability"
          git push origin HEAD:"$TARGET_BRANCH"
