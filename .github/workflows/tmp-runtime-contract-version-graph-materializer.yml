name: Temporary Runtime Contract Version Graph Materializer

on:
  push:
    branches:
      - agent/runtime-contract-version-graph-v1
    paths:
      - .github/workflows/tmp-runtime-contract-version-graph-materializer.yml

permissions:
  contents: write

concurrency:
  group: tmp-runtime-contract-version-graph-materializer-v1
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
      TARGET_BRANCH: agent/runtime-contract-version-graph-v1
    steps:
      - name: Checkout exact Python branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/runtime-contract-version-graph-v1
          fetch-depth: 0

      - name: Require exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f tools/tmp_materialize_runtime_contract_version_graph_v1.py
          test -f .github/workflows/tmp-runtime-contract-version-graph-materializer.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install -e .

      - name: Materialize capability 240 authority
        run: python tools/tmp_materialize_runtime_contract_version_graph_v1.py

      - name: Remove temporary surfaces and seal manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/tmp_materialize_runtime_contract_version_graph_v1.py
          git rm .github/workflows/tmp-runtime-contract-version-graph-materializer.yml
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git diff --check

          python - <<'PY'
          import subprocess
          allowed = {
              'MANIFEST.sha256',
              '.github/workflows/tmp-runtime-contract-version-graph-materializer.yml',
              'contracts/python/capability-completeness-registry-v1.json',
              'contracts/python/python-completion-certificate-v1.json',
              'docs/SYNTAVRA_PYTHON_FIRST_CONTINUATION_CHECKLIST.md',
              'docs/SYNTAVRA_PYTHON_FIRST_LIVE_CHECKPOINT.md',
              'docs/SYNTAVRA_PYTHON_FIRST_ROADMAP_APPENDIX.md',
              'tools/tmp_materialize_runtime_contract_version_graph_v1.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          assert not unexpected, unexpected
          assert 'contracts/engine/dual-engine-public-surface-v2.json' not in changed
          assert not any(path.startswith('crates/') for path in changed)
          PY

      - name: Validate helper-free candidate before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python -m unittest tests.runtime.test_python_completion_certificate_v1 -v
          python tools/certify_runtime_contract_version_graph_v1.py --repo . --out /tmp/runtime-contract-version-graph-precommit.json
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness-precommit.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-precommit.json
          python tools/certify_python_completion_certificate_v1.py --repo . --out /tmp/python-completion-precommit.json
          python tools/validate.py
          python tools/validate_release.py --smoke --output /tmp/release-smoke-precommit.json

      - name: Commit permanent capability 240 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement runtime contract version graph v1"

      - name: Validate exact final local commit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/tmp_materialize_runtime_contract_version_graph_v1.py
          test ! -e .github/workflows/tmp-runtime-contract-version-graph-materializer.yml
          python tools/refresh_manifest.py --check
          python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python -m unittest tests.runtime.test_python_completion_certificate_v1 -v
          python tools/certify_runtime_contract_version_graph_v1.py --repo . --out /tmp/runtime-contract-version-graph-final.json
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness-final.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-final.json
          python tools/certify_python_completion_certificate_v1.py --repo . --out /tmp/python-completion-final.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          graph = json.loads(Path('/tmp/runtime-contract-version-graph-final.json').read_text(encoding='utf-8'))
          completeness = json.loads(Path('/tmp/python-capability-completeness-final.json').read_text(encoding='utf-8'))
          rust = json.loads(Path('/tmp/rust-feature-freeze-final.json').read_text(encoding='utf-8'))
          completion = json.loads(Path('/tmp/python-completion-final.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('contracts/python/capability-completeness-registry-v1.json').read_text(encoding='utf-8'))
          row = next(item for item in registry['capabilities'] if item['id'] == 'runtime_contract_version_graph_v1')
          completion_row = next(item for item in registry['capabilities'] if item['id'] == 'python_completion_certificate_v1')

          assert graph['ok'] is True and graph['exact_head'] == head, graph
          assert graph['admission_ready'] is True
          assert graph['rust_resume_allowed'] is False
          assert graph['runtime']['external_contracts_are_metadata_only_leaves'] is True
          assert graph['runtime']['external_leaf_recursive_expansion_forbidden'] is True
          assert completeness['ok'] is True
          assert completeness['python_complete_ready'] is False
          assert completeness['rust_resume_allowed'] is False
          assert rust['ok'] is True
          assert rust['rust_resume_allowed'] is False
          assert rust['rust']['production_promoted'] == 174
          assert rust['rust']['remaining_parity_promotion'] == 71
          assert completion['ok'] is True
          assert completion['lifecycle_state'] == 'partial'
          assert completion['python_complete_ready'] is False
          assert completion['rust_resume_allowed'] is False
          assert row['state'] == 'implemented'
          assert row['required_for_python_complete'] is False
          assert completion_row['state'] == 'partial'
          PY
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push only if target did not move
        shell: bash
        run: |
          set -euo pipefail
          final_head="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "$final_head:refs/heads/$TARGET_BRANCH"
