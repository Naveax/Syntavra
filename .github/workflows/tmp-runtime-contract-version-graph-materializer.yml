name: Temporary Runtime Contract Version Graph Materializer

on:
  push:
    branches:
      - agent/runtime-contract-version-graph-v1
    paths:
      - .github/workflows/tmp-runtime-contract-version-graph-materializer.yml

permissions:
  contents: write

concurrency:
  group: tmp-runtime-contract-version-graph-materializer-v1
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact Python branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/runtime-contract-version-graph-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install -e .

      - name: Materialize capability 240 registry and continuity
        run: python tools/tmp_materialize_runtime_contract_version_graph_v1.py

      - name: Remove temporary materializer and refresh permanent manifest
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/tmp-runtime-contract-version-graph-materializer.yml
          cp "$helper" /tmp/tmp-runtime-contract-version-graph-materializer.yml
          git rm tools/tmp_materialize_runtime_contract_version_graph_v1.py
          rm "$helper"
          python tools/refresh_manifest.py
          mv /tmp/tmp-runtime-contract-version-graph-materializer.yml "$helper"
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py --check
          git diff --check

      - name: Commit permanent capability 240 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -A
          git reset .github/workflows/tmp-runtime-contract-version-graph-materializer.yml
          git diff --cached --check
          git commit -m "feat: implement runtime contract version graph v1"
          git push origin HEAD:agent/runtime-contract-version-graph-v1

      - name: Hide temporary helper for exact validation
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/tmp-runtime-contract-version-graph-materializer.yml
          git update-index --skip-worktree "$helper"
          rm "$helper"
          test -z "$(git status --porcelain --untracked-files=all)"
          python tools/refresh_manifest.py --check

      - name: Validate capability 240 Python boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python -m unittest tests.runtime.test_python_completion_certificate_v1 -v
          python tools/certify_runtime_contract_version_graph_v1.py --repo . --out /tmp/runtime-contract-version-graph.json
          python tools/certify_python_capability_completeness.py --out /tmp/python-capability-completeness.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze.json
          python tools/certify_python_completion_certificate_v1.py --repo . --out /tmp/python-completion.json
          python tools/validate.py
          python tools/validate_release.py --smoke --output /tmp/release-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          graph = json.loads(Path('/tmp/runtime-contract-version-graph.json').read_text(encoding='utf-8'))
          completeness = json.loads(Path('/tmp/python-capability-completeness.json').read_text(encoding='utf-8'))
          rust = json.loads(Path('/tmp/rust-feature-freeze.json').read_text(encoding='utf-8'))
          completion = json.loads(Path('/tmp/python-completion.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('contracts/python/capability-completeness-registry-v1.json').read_text(encoding='utf-8'))

          row = next(item for item in registry['capabilities'] if item['id'] == 'runtime_contract_version_graph_v1')
          assert row['state'] == 'implemented', row
          assert row['required_for_python_complete'] is False, row
          assert graph['ok'] is True, graph
          assert graph['admission_ready'] is True, graph
          assert graph['rust_resume_allowed'] is False, graph
          assert graph['graph']['node_count'] >= 20, graph
          assert graph['graph']['edge_count'] > 0, graph
          assert completeness['ok'] is True, completeness
          assert completeness['python_complete_ready'] is False, completeness
          assert completeness['rust_resume_allowed'] is False, completeness
          assert rust['ok'] is True, rust
          assert rust['rust_resume_allowed'] is False, rust
          assert rust['rust']['production_promoted'] == 174, rust
          assert rust['rust']['remaining_parity_promotion'] == 71, rust
          assert completion['ok'] is True, completion
          assert completion['lifecycle_state'] == 'partial', completion
          assert completion['python_complete_ready'] is False, completion
          assert completion['rust_resume_allowed'] is False, completion
          PY
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
