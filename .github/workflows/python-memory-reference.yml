name: Python Memory Reference Contract

on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: python-memory-reference
  cancel-in-progress: true

jobs:
  python-memory-reference:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run Python memory reference regression tests
        run: python -m unittest tests.runtime.test_python_memory_reference -v

      - name: Generate exact-head Python memory reference evidence
        run: |
          set +e
          python tools/certify_python_memory_reference.py \
            --output /tmp/python-memory-reference.json \
            > /tmp/python-memory-reference.log 2>&1
          report_exit=$?
          set -e
          cat /tmp/python-memory-reference.log
          test -f /tmp/python-memory-reference.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          value = json.loads(Path('/tmp/python-memory-reference.json').read_text(encoding='utf-8'))
          checkout_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert value['ok'] is True, value
          assert value['engine'] == 'python'
          assert value['family'] == 'memory-intelligence'
          assert value['exact_head'] == checkout_head, (value['exact_head'], checkout_head)
          assert len(value['routes']) == 15, value['routes']
          assert value['exit_policy']['success'] == 0
          assert value['exit_policy']['application_error'] == 4
          assert value['exit_policy']['argument_parser_error'] == 2

          session = value['session_memory']
          assert session['verified_before']['ok'] is True
          assert session['verified_before']['events'] == 3
          assert session['checkpoint_idempotent'] is True
          assert session['restore']['exact_recovery'] is True
          assert len(session['restore']['events']) == 3
          assert session['verified_after']['events'] == 4
          assert session['child_verify']['ok'] is True
          assert session['merged_verify']['ok'] is True
          assert session['tampered_verify']['ok'] is False
          assert session['tampered_verify']['failures'] == ['hash:1']
          for name in (
              'missing_verify',
              'missing_retrieve',
              'missing_checkpoint',
              'unsupported_view',
              'duplicate_merge_parent',
              'malformed_payload',
          ):
              assert session['missing_and_malformed'][name]['exit'] == 4, (name, session['missing_and_malformed'][name])
          assert session['missing_and_malformed']['missing_append_argument']['exit'] == 2

          memory = value['memory_intelligence']
          assert memory['empty_status']['stats']['observations'] == 0
          assert memory['duplicate_upsert']['same_observation_id'] is True
          assert memory['backfill'] == {'embedded': 1, 'remaining': 0}
          assert memory['status']['stats'] == {'observations': 8, 'valid': 8, 'missing_embeddings': 0}
          assert len(memory['notifications']) == 1
          assert memory['notifications'][0]['severity'] == 'critical'
          assert memory['export']['sha256_matches_file'] is True
          assert memory['export']['rank_order_matches_status'] is True
          assert memory['malformed_state']['exit'] == 4
          for name in ('empty_text', 'invalid_extractor_config'):
              assert memory['negative'][name]['exit'] == 4, (name, memory['negative'][name])
          assert memory['negative']['invalid_search_limit']['exit'] == 2
          assert memory['negative']['missing_search_query']['exit'] == 2
          PY
          exit "$report_exit"

      - name: Upload Python memory reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-memory-reference
          path: |
            /tmp/python-memory-reference.json
            /tmp/python-memory-reference.log
          if-no-files-found: error

      - name: Show exact head and enforce clean repository tree
        if: always()
        run: |
          echo "head=$(git rev-parse HEAD)"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"
