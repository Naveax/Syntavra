name: Temporary Observability Attribution Builder

on:
  push:
    branches:
      - automation/observability-attribution-builder-20260821

permissions:
  contents: write

concurrency:
  group: observability-attribution-builder-20260821
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_BASE: 1a1be4f53d37abe307982bc298c274ce528fe360
      TARGET_BRANCH: agent/observability-attribution-v1
      HELPER_BRANCH: automation/observability-attribution-builder-20260821
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact admitted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_BASE }}
          fetch-depth: 0

      - name: Guard exact base and target vacancy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain --untracked-files=all)"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch already exists: $TARGET_BRANCH" >&2
            exit 1
          fi
          git checkout -b "$TARGET_BRANCH"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Write Observability Attribution implementation
        shell: bash
        run: |
          mkdir -p contracts/python
          base64 -d > contracts/python/observability-attribution-v1.json <<'B64_827e21e7'
          
          B64_827e21e7
          mkdir -p syntavra_runtime
          base64 -d > syntavra_runtime/observability_attribution.py <<'B64_99882950'
          
          B64_99882950
          mkdir -p tests/runtime
          base64 -d > tests/runtime/test_observability_attribution_v1.py <<'B64_67749805'
          
          B64_67749805
          mkdir -p tools
          base64 -d > tools/certify_observability_attribution_v1.py <<'B64_b628add7'
          
          B64_b628add7
          mkdir -p .github/workflows
          base64 -d > .github/workflows/observability-attribution.yml <<'B64_64ab56c0'
          
          B64_64ab56c0

      - name: Integrate registry and release enforcement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          registry_path = Path("contracts/python/capability-completeness-registry-v1.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          by_id = {item["id"]: item for item in registry["capabilities"]}
          assert by_id["host_adapter_conformance_v1"]["state"] == "certified"
          row = by_id["observability_attribution_v1"]
          assert row["state"] == "partial", row
          assert row["classification"] == "HARDEN"
          row["state"] = "implemented"
          row["implementation_evidence"] = [
              "contracts/python/observability-attribution-v1.json",
              "syntavra_runtime/observability_attribution.py",
              "syntavra_runtime/runtime_evidence.py",
              "syntavra_runtime/usage_receipt_ledger.py",
              "syntavra_runtime/token_attribution.py",
              "syntavra_runtime/cache_provider_budget.py",
              "syntavra_runtime/signalbench_hardened.py",
              "tools/certify_observability_attribution_v1.py",
              "tests/runtime/test_observability_attribution_v1.py",
              ".github/workflows/observability-attribution.yml",
          ]
          row["certification_evidence"] = []
          assert registry["python_complete"]["ready"] is False
          assert registry["python_complete"]["rust_resume_allowed"] is False
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          release_path = Path(".github/workflows/release-main-merge-gate.yml")
          release = release_path.read_text(encoding="utf-8")
          test_anchor = "          python -m unittest tests.runtime.test_host_adapter_conformance_v1 -v\n"
          test_insert = test_anchor + "          python -m unittest tests.runtime.test_observability_attribution_v1 -v\n"
          assert release.count(test_anchor) == 1
          release = release.replace(test_anchor, test_insert, 1)
          cert_anchor = "          python tools/certify_host_adapter_conformance_v1.py --out /tmp/host-adapter-conformance.json\n"
          cert_insert = cert_anchor + "          python tools/certify_observability_attribution_v1.py --out /tmp/observability-attribution.json\n"
          assert release.count(cert_anchor) == 1
          release = release.replace(cert_anchor, cert_insert, 1)
          release_path.write_text(release, encoding="utf-8")

          pins_path = Path("tests/runtime/test_release_action_pins.py")
          pins = pins_path.read_text(encoding="utf-8")
          pin_anchor = '    ".github/workflows/host-adapter-conformance.yml",\n'
          pin_insert = pin_anchor + '    ".github/workflows/observability-attribution.yml",\n'
          assert pins.count(pin_anchor) == 1
          pins = pins.replace(pin_anchor, pin_insert, 1)
          pins_path.write_text(pins, encoding="utf-8")
          PY

      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Run focused implementation validation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.runtime.test_observability_attribution_v1 \
            tests.runtime.test_token_saver_unification_v001 \
            tests.runtime.test_release_action_pins \
            tests.runtime.test_python_capability_completeness -v
          python tools/certify_observability_attribution_v1.py --out /tmp/observability-attribution-preseal.json
          python tools/certify_python_capability_completeness.py --out /tmp/completeness-preseal.json
          python - <<'PY'
          import json
          from pathlib import Path
          obs = json.loads(Path('/tmp/observability-attribution-preseal.json').read_text(encoding='utf-8'))
          complete = json.loads(Path('/tmp/completeness-preseal.json').read_text(encoding='utf-8'))
          assert obs['ok'] is True, obs
          assert obs['lifecycle_state'] == 'implemented', obs
          assert obs['admission_ready'] is True, obs
          assert complete['ok'] is True, complete
          assert complete['current_milestone'] == 'observability_attribution_v1', complete
          assert complete['python_complete_ready'] is False, complete
          assert complete['rust_resume_allowed'] is False, complete
          PY

      - name: Refresh permanent manifest authority
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check

      - name: Verify sealed implementation candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_observability_attribution_v1 tests.runtime.test_release_action_pins -v
          python tools/certify_observability_attribution_v1.py --out /tmp/observability-attribution-final.json
          python tools/certify_python_capability_completeness.py --out /tmp/completeness-final.json
          python tools/refresh_manifest.py --check
          rm -rf syntavra_runtime.egg-info
          git diff --check
          python - <<'PY'
          import subprocess
          expected = [
              ".github/workflows/observability-attribution.yml",
              ".github/workflows/release-main-merge-gate.yml",
              "MANIFEST.sha256",
              "contracts/python/capability-completeness-registry-v1.json",
              "contracts/python/observability-attribution-v1.json",
              "syntavra_runtime/observability_attribution.py",
              "tests/runtime/test_observability_attribution_v1.py",
              "tests/runtime/test_release_action_pins.py",
              "tools/certify_observability_attribution_v1.py",
          ]
          actual = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert sorted(actual) == sorted(expected), {'actual': actual, 'expected': expected}
          PY

      - name: Commit and publish exact implementation candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Naveax"
          git config user.email "79841922+Naveax@users.noreply.github.com"
          git add -- \
            .github/workflows/observability-attribution.yml \
            .github/workflows/release-main-merge-gate.yml \
            MANIFEST.sha256 \
            contracts/python/capability-completeness-registry-v1.json \
            contracts/python/observability-attribution-v1.json \
            syntavra_runtime/observability_attribution.py \
            tests/runtime/test_observability_attribution_v1.py \
            tests/runtime/test_release_action_pins.py \
            tools/certify_observability_attribution_v1.py
          git commit -m "Implement Observability Attribution v1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "published_head=$(git rev-parse HEAD)"

      - name: Remove one-shot helper branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "$HELPER_BRANCH"
