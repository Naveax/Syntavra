name: Rust Freeze Registry State Migration

on:
  push:
    branches:
      - agent/rust-feature-freeze-guard-v1

permissions:
  contents: write

concurrency:
  group: rust-freeze-registry-state-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/rust-feature-freeze-guard-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply exact registry/certifier transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('contracts/python/capability-completeness-registry-v1.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          rows = {row['id']: row for row in registry['capabilities']}
          reg = rows['capability_completeness_registry_v1']
          assert reg['state'] == 'implemented', reg
          reg['state'] = 'certified'
          reg['certification_evidence'] = [
              'contracts/python/capability-completeness-registry-v1.json',
              '.github/workflows/python-capability-completeness.yml',
              'tools/certify_python_capability_completeness.py',
              'tests/runtime/test_python_capability_completeness.py',
          ]
          guard = rows['rust_feature_freeze_guard_v1']
          assert guard['state'] == 'partial', guard
          guard['state'] = 'implemented'
          guard['classification'] = 'HARDEN'
          guard['implementation_evidence'] = [
              'contracts/python/python-authority-v1.json',
              'contracts/engine/phase2-rust-migration-matrix-v1.json',
              'contracts/python/rust-feature-freeze-guard-v1.json',
              'tools/check_rust_feature_freeze.py',
              'tools/certify_rust_feature_freeze_guard.py',
              'tests/runtime/test_rust_feature_freeze_guard.py',
              '.github/workflows/rust-feature-freeze-guard.yml',
          ]
          guard['certification_evidence'] = []
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cert_path = Path('tools/certify_python_capability_completeness.py')
          text = cert_path.read_text(encoding='utf-8')
          replacements = [
              (
                  'by_id["capability_completeness_registry_v1"]["state"] in {"implemented", "verified"},\n        "registry self-state must remain pre-certification until exact-head admission",',
                  'by_id["capability_completeness_registry_v1"]["state"] in {"implemented", "verified", "certified"},\n        "registry self-state is invalid",',
              ),
              (
                  '    _require(computed_python_complete is False, "registry milestone unexpectedly claims Python COMPLETE")\n\n',
                  '',
              ),
              (
                  '    registry_entry = next(item for item in capabilities if item["id"] == "capability_completeness_registry_v1")\n    return {\n',
                  '    by_id = {item["id"]: item for item in capabilities}\n    current_milestone = next(\n        (milestone for milestone in milestone_order if (by_id.get(milestone) or {}).get("state") != "certified"),\n        "python_complete",\n    )\n    registry_entry = by_id["capability_completeness_registry_v1"]\n    return {\n',
              ),
              (
                  '        "current_milestone": "capability_completeness_registry_v1",\n        "registry_persisted_state": registry_entry["state"],\n        "registry_admission_ready": True,\n',
                  '        "current_milestone": current_milestone,\n        "registry_persisted_state": registry_entry["state"],\n        "registry_certified": registry_entry["state"] == "certified",\n        "registry_admission_ready": registry_entry["state"] in {"implemented", "verified", "certified"},\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              assert count == 1, (old[:80], count)
              text = text.replace(old, new, 1)
          cert_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/runtime/test_python_capability_completeness.py')
          tests = test_path.read_text(encoding='utf-8')
          old = '''    def test_registry_self_state_is_not_preemptively_certified(self) -> None:\n        contract = self._contract()\n        row = next(item for item in contract["capabilities"] if item["id"] == "capability_completeness_registry_v1")\n        self.assertIn(row["state"], {"implemented", "verified"})\n        self.assertEqual(row["certification_evidence"], [])\n'''
          new = '''    def test_registry_records_prior_exact_head_admission(self) -> None:\n        contract = self._contract()\n        row = next(item for item in contract["capabilities"] if item["id"] == "capability_completeness_registry_v1")\n        self.assertEqual(row["state"], "certified")\n        self.assertTrue(row["certification_evidence"])\n'''
          assert tests.count(old) == 1
          tests = tests.replace(old, new, 1)
          old = '''        self.assertEqual(report["current_milestone"], "capability_completeness_registry_v1")\n        self.assertTrue(report["registry_admission_ready"])\n'''
          new = '''        self.assertEqual(report["current_milestone"], "rust_feature_freeze_guard_v1")\n        self.assertTrue(report["registry_admission_ready"])\n        self.assertTrue(report["registry_certified"])\n'''
          assert tests.count(old) == 1
          tests = tests.replace(old, new, 1)
          old = '''        self.assertIn("capability_completeness_registry_v1", report["uncertified_required"])\n        self.assertIn("rust_feature_freeze_guard_v1", report["uncertified_required"])\n'''
          new = '''        self.assertNotIn("capability_completeness_registry_v1", report["uncertified_required"])\n        self.assertIn("rust_feature_freeze_guard_v1", report["uncertified_required"])\n'''
          assert tests.count(old) == 1
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          rm .github/workflows/rust-freeze-registry-state-migrate.yml
          python -m py_compile tools/certify_python_capability_completeness.py tools/check_rust_feature_freeze.py tools/certify_rust_feature_freeze_guard.py
          git diff --check

      - name: Commit migrated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/python/capability-completeness-registry-v1.json tools/certify_python_capability_completeness.py tests/runtime/test_python_capability_completeness.py .github/workflows/rust-freeze-registry-state-migrate.yml
          git commit -m "Advance registry to Rust freeze guard milestone"
          git push origin HEAD:agent/rust-feature-freeze-guard-v1
