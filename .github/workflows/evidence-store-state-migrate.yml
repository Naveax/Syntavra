name: Evidence Store State Migration

on:
  push:
    branches:
      - agent/evidence-store-v2

permissions:
  contents: write

concurrency:
  group: evidence-store-state-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/evidence-store-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply exact Evidence Store transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('contracts/python/capability-completeness-registry-v1.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          rows = {row['id']: row for row in registry['capabilities']}

          universal = rows['universal_context_item_v1']
          assert universal['state'] == 'implemented', universal
          universal['state'] = 'certified'
          universal['certification_evidence'] = [
              'contracts/python/universal-context-item-v1.json',
              'syntavra_runtime/universal_context_item.py',
              'tools/certify_universal_context_item.py',
              'tests/runtime/test_universal_context_item.py',
              '.github/workflows/universal-context-item.yml',
          ]

          store = rows['evidence_store_v2']
          assert store['state'] == 'partial', store
          store['state'] = 'implemented'
          store['implementation_evidence'] = [
              'syntavra_runtime/runtime_evidence.py',
              'syntavra_runtime/universal_context_item.py',
              'syntavra_runtime/evidence_store.py',
              'contracts/python/evidence-store-v2.json',
              'tools/certify_evidence_store_v2.py',
              'tests/runtime/test_evidence_store_v2.py',
              '.github/workflows/evidence-store-v2.yml',
          ]
          store['certification_evidence'] = []
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          universal_cert_path = Path('tools/certify_universal_context_item.py')
          text = universal_cert_path.read_text(encoding='utf-8')
          old = '''    _require(completeness.get("current_milestone") == "universal_context_item_v1", "registry has not advanced to universal_context_item_v1")\n    _require(completeness.get("python_complete_ready") is False, "Python COMPLETE unexpectedly true")\n'''
          new = '''    _require(completeness.get("python_complete_ready") is False, "Python COMPLETE unexpectedly true")\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old = '''    _require((by_id.get("universal_context_item_v1") or {}).get("state") in {"implemented", "verified"}, "Universal Context Item registry state must be pre-certification implemented/verified")\n'''
          new = '''    universal_state = (by_id.get("universal_context_item_v1") or {}).get("state")\n    _require(universal_state in {"implemented", "verified", "certified"}, "Universal Context Item registry state is invalid")\n    if universal_state != "certified":\n        _require(completeness.get("current_milestone") == "universal_context_item_v1", "registry has not advanced to Universal Context Item")\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          universal_cert_path.write_text(text, encoding='utf-8')

          completeness_test = Path('tests/runtime/test_python_capability_completeness.py')
          tests = completeness_test.read_text(encoding='utf-8')
          old = '''        self.assertNotIn("capability_completeness_registry_v1", report["uncertified_required"])\n        self.assertNotIn("rust_feature_freeze_guard_v1", report["uncertified_required"])\n        self.assertIn("universal_context_item_v1", report["uncertified_required"])\n'''
          new = '''        self.assertNotIn("capability_completeness_registry_v1", report["uncertified_required"])\n        self.assertNotIn("rust_feature_freeze_guard_v1", report["uncertified_required"])\n        self.assertIn(report["current_milestone"], report["uncertified_required"])\n'''
          assert tests.count(old) == 1, tests.count(old)
          tests = tests.replace(old, new, 1)
          completeness_test.write_text(tests, encoding='utf-8')

          validate_path = Path('tools/validate.py')
          validate = validate_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    ROOT / "contracts" / "python" / "universal-context-item-v1.json",\n    ROOT / "syntavra_runtime" / "universal_context_item.py",',
                  '    ROOT / "contracts" / "python" / "universal-context-item-v1.json",\n    ROOT / "contracts" / "python" / "evidence-store-v2.json",\n    ROOT / "syntavra_runtime" / "universal_context_item.py",\n    ROOT / "syntavra_runtime" / "evidence_store.py",',
              ),
              (
                  '    ROOT / "tests" / "runtime" / "test_universal_context_item.py",\n    SKILL / "SKILL.md",',
                  '    ROOT / "tests" / "runtime" / "test_universal_context_item.py",\n    ROOT / "tests" / "runtime" / "test_evidence_store_v2.py",\n    SKILL / "SKILL.md",',
              ),
              (
                  '    ROOT / "tools" / "certify_universal_context_item.py",\n    ROOT / ".github" / "workflows" / "universal-context-item.yml",\n]',
                  '    ROOT / "tools" / "certify_universal_context_item.py",\n    ROOT / "tools" / "certify_evidence_store_v2.py",\n    ROOT / ".github" / "workflows" / "universal-context-item.yml",\n    ROOT / ".github" / "workflows" / "evidence-store-v2.yml",\n]',
              ),
              (
                  '\n\ndef main() -> int:\n',
                  '''\n\ndef _evidence_store_v2_check() -> tuple[bool, str]:\n    try:\n        from tools.certify_evidence_store_v2 import certify\n\n        report = certify(ROOT)\n        summary = {\n            "claim": report.get("claim"),\n            "exact_head": report.get("exact_head"),\n            "admission_ready": report.get("admission_ready"),\n            "content_addressed_roundtrip": (report.get("runtime") or {}).get("content_addressed_roundtrip"),\n            "journal_chain": (report.get("runtime") or {}).get("journal_chain"),\n            "secret_reject_default": (report.get("runtime") or {}).get("secret_reject_default"),\n            "rust_promoted": (report.get("rust") or {}).get("production_promoted"),\n            "rust_resume_allowed": report.get("rust_resume_allowed"),\n        }\n        return bool(report.get("ok")), json.dumps(summary, sort_keys=True)\n    except Exception as exc:\n        return False, f"{type(exc).__name__}: {exc}"\n\n\ndef main() -> int:\n''',
              ),
              (
                  '    universal_ok, universal_detail = _universal_context_item_check()\n    checks.append(("universal_context_item", universal_ok, universal_detail))\n\n    result = {',
                  '    universal_ok, universal_detail = _universal_context_item_check()\n    checks.append(("universal_context_item", universal_ok, universal_detail))\n\n    evidence_ok, evidence_detail = _evidence_store_v2_check()\n    checks.append(("evidence_store_v2", evidence_ok, evidence_detail))\n\n    result = {',
              ),
          ]
          for old, new in replacements:
              count = validate.count(old)
              assert count == 1, (old[:100], count)
              validate = validate.replace(old, new, 1)
          validate_path.write_text(validate, encoding='utf-8')
          PY

          rm .github/workflows/evidence-store-state-migrate.yml
          python -m py_compile \
            syntavra_runtime/evidence_store.py \
            tools/certify_evidence_store_v2.py \
            tools/certify_universal_context_item.py \
            tools/validate.py
          git diff --check

      - name: Commit Evidence Store state transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            contracts/python/capability-completeness-registry-v1.json \
            tools/certify_universal_context_item.py \
            tests/runtime/test_python_capability_completeness.py \
            tools/validate.py \
            .github/workflows/evidence-store-state-migrate.yml
          git commit -m "Advance registry to Evidence Store v2 milestone"
          git push origin HEAD:agent/evidence-store-v2
