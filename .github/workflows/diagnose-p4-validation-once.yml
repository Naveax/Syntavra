name: Diagnose P4 Validation Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-p4-validation-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-p4-runtime-consolidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -q -e . pytest
      - name: Capture failed validation checks only
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path

          result = subprocess.run(
              [sys.executable, "-m", "tools.validate"],
              text=True,
              capture_output=True,
              check=False,
          )
          try:
              payload = json.loads(result.stdout)
          except Exception as exc:
              payload = {
                  "ok": False,
                  "parse_error": f"{type(exc).__name__}: {exc}",
                  "stdout_tail": result.stdout[-4000:],
              }
          failures = [row for row in payload.get("checks", []) if not row.get("passed")]
          report = {
              "returncode": result.returncode,
              "failures": failures,
              "stderr_tail": result.stderr[-4000:],
          }
          Path("p4-validation-failures.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
      - name: Publish isolated diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B diagnostics/p4-validation
          git add p4-validation-failures.json
          git commit -m "Capture P4 validation failure diagnostics"
          git push --force origin HEAD:diagnostics/p4-validation
