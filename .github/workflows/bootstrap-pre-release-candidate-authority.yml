name: Bootstrap Pre-Release Candidate Authority

on:
  push:
    branches:
      - agent/pre-release-candidate-authority

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap TypeScript SDK release target authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pre-release-candidate-authority
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add missing TypeScript SDK release target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          readiness_path = Path('release/publish-readiness.json')
          readiness = json.loads(readiness_path.read_text(encoding='utf-8'))
          if 'npm_sdk' in readiness:
              raise SystemExit('npm_sdk already present; bootstrap no longer applicable')
          ordered = {
              'version': readiness['version'],
              'channel': readiness['channel'],
              'python': readiness['python'],
              'npm': readiness['npm'],
              'npm_sdk': {
                  'package': '@syntavra/sdk',
                  'tag': 'next',
                  'published': False,
              },
              'vscode': readiness['vscode'],
              'native': readiness['native'],
              'legacy_native_companion': readiness['legacy_native_companion'],
              'claim_boundary': readiness['claim_boundary'],
          }
          readiness_path.write_text(json.dumps(ordered, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          fixture_path = Path('contracts/python/publication-registry-reference-v1.json')
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          targets = fixture['publication_targets']
          if 'npm_sdk' in targets:
              raise SystemExit('fixture npm_sdk already present; bootstrap no longer applicable')
          fixture['publication_targets'] = {
              'python': targets['python'],
              'npm': targets['npm'],
              'npm_sdk': {
                  'package': '@syntavra/sdk',
                  'tag': 'next',
                  'published': False,
              },
              'vscode': targets['vscode'],
              'native': targets['native'],
              'legacy_native_companion': targets['legacy_native_companion'],
          }
          fixture['frozen_snapshots']['release_metadata_sha256'] = None
          fixture_path.write_text(json.dumps(fixture, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'tools/certify_python_publication_registry_reference.py',
              '    target_names = ["python", "npm", "vscode", "native", "legacy_native_companion"]\n',
              '    target_names = ["python", "npm", "npm_sdk", "vscode", "native", "legacy_native_companion"]\n',
          )
          replace_once(
              'tools/certify_python_publication_registry_reference.py',
              '    native = readiness["native"]\n',
              '''    npm_sdk = readiness["npm_sdk"]\n    if npm_sdk.get("package") != "@syntavra/sdk" or npm_sdk.get("tag") != "next":\n        raise AssertionError(f"TypeScript SDK publication identity drift: {npm_sdk}")\n\n    native = readiness["native"]\n''',
          )
          replace_once(
              'tests/runtime/test_python_publication_registry_reference.py',
              '        for target in ("python", "npm", "vscode", "native", "legacy_native_companion"):\n',
              '        for target in ("python", "npm", "npm_sdk", "vscode", "native", "legacy_native_companion"):\n',
          )
          replace_once(
              'tests/runtime/test_python_publication_registry_reference.py',
              '        native = release["publish_readiness"]["native"]\n',
              '''        npm_sdk = release["publish_readiness"]["npm_sdk"]\n        self.assertEqual(npm_sdk["package"], "@syntavra/sdk")\n        self.assertEqual(npm_sdk["tag"], "next")\n        self.assertFalse(npm_sdk["published"])\n        native = release["publish_readiness"]["native"]\n''',
          )
          PY

      - name: Derive and freeze exact release metadata snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python tools/certify_python_publication_registry_reference.py --output /tmp/unfrozen.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from syntavra_runtime.util import canonical_json

          report = json.loads(Path('/tmp/unfrozen.json').read_text(encoding='utf-8'))
          if report.get('ok') is not True:
              raise SystemExit(report)
          digest = report['release']['snapshot_sha256']
          if len(digest) != 64:
              raise SystemExit(f'invalid release snapshot digest: {digest!r}')

          fixture_path = Path('contracts/python/publication-registry-reference-v1.json')
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          fixture['frozen_snapshots']['release_metadata_sha256'] = digest
          fixture_path.write_text(json.dumps(fixture, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          catalog_path = Path('contracts/python/fixture-golden-catalog-v1.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          rows = [row for row in catalog['families'] if row.get('family') == 'publication-registry']
          if len(rows) != 1:
              raise SystemExit(f'publication-registry catalog row count drift: {len(rows)}')
          row = rows[0]
          row['snapshot']['projection']['release_snapshot_sha256'] = digest
          row['snapshot']['sha256'] = hashlib.sha256(canonical_json(row['snapshot']['projection'])).hexdigest()
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print(f'release_snapshot_sha256={digest}')
          print(f'publication_catalog_sha256={row["snapshot"]["sha256"]}')
          PY

      - name: Certify updated target authority
        shell: bash
        run: |
          set -euo pipefail
          python tools/certify_python_publication_registry_reference.py --output /tmp/final.json
          python -m unittest tests.runtime.test_python_publication_registry_reference -v
          python tools/certify_python_fixture_golden_catalog.py --output /tmp/catalog.json
          python tools/validate_release.py --smoke --output /tmp/release-validation.json

      - name: Persist non-workflow authority files
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- MANIFEST.sha256 release-smoke.json || true
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/publish-readiness.json \
                  contracts/python/publication-registry-reference-v1.json \
                  contracts/python/fixture-golden-catalog-v1.json \
                  tools/certify_python_publication_registry_reference.py \
                  tests/runtime/test_python_publication_registry_reference.py
          git commit -m 'Add TypeScript SDK release target authority'
          git push origin HEAD:agent/pre-release-candidate-authority
