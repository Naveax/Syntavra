name: Temporary Rust 1.82 Tree-sitter Grammar Probe

on:
  push:
    branches:
      - agent/r31-provider-capture-native
    paths:
      - .github/workflows/tmp-tree-sitter-rust182-probe.yml
  pull_request:
    branches:
      - agent/r31-provider-prepare-native
    types: [synchronize]
    paths:
      - .github/workflows/tmp-tree-sitter-rust182-probe.yml

permissions:
  contents: read

jobs:
  probe-uncommon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clean Rust 1.82
        run: |
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal
      - name: Probe uncommon grammars against tree-sitter 0.25
        shell: bash
        run: |
          set -u
          probe() {
            name="$1"
            dep="$2"
            version="$3"
            root="/tmp/probe-${name}"
            rm -rf "$root"
            cargo +1.82.0 new --bin --edition 2021 "$root" >/dev/null
            cat >> "$root/Cargo.toml" <<EOF
          indexmap = "=2.7.1"
          tree-sitter = "0.25"
          ${dep} = "${version}"
          EOF
            echo "=== PROBE ${name}: ${dep} ${version} ==="
            (cd "$root" && cargo +1.82.0 check) && echo "RESULT ${name}=PASS" || echo "RESULT ${name}=FAIL"
          }

          probe kotlin_ng tree-sitter-kotlin-ng 1.1.0
          probe powershell tree-sitter-powershell 0.26.4
          probe svelte_old tree-sitter-svelte 0.10.2
          probe svelte_ng tree-sitter-svelte-ng 1.0.2
          probe svelte_next tree-sitter-svelte-next 0.1.1
          probe vue_old tree-sitter-vue 0.0.3
          probe vue_updated tree-sitter-vue-updated 0.1.0
          probe vue_next tree-sitter-vue-next 0.1.0
          probe vue3 tree-sitter-vue3 0.0.4
