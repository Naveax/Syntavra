name: Temporary Rust 1.82 Tree-sitter Grammar Probe

on:
  push:
    branches:
      - agent/r31-provider-capture-native
    paths:
      - .github/workflows/tmp-tree-sitter-rust182-probe.yml
  pull_request:
    branches:
      - agent/r31-provider-prepare-native
    types: [synchronize]
    paths:
      - .github/workflows/tmp-tree-sitter-rust182-probe.yml

permissions:
  contents: read

jobs:
  certify-parsers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clean Rust 1.82
        run: |
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal
      - name: Build and initialize complete grammar pack
        shell: bash
        run: |
          rm -rf /tmp/ts182
          cargo +1.82.0 new --bin --edition 2021 /tmp/ts182
          cat >> /tmp/ts182/Cargo.toml <<'EOF'
          indexmap = "=2.7.1"
          tree-sitter = "0.25"
          tree-sitter-bash = "0.25.1"
          tree-sitter-c = "0.24"
          tree-sitter-c-sharp = "0.23.1"
          tree-sitter-cpp = "0.23.4"
          tree-sitter-dart-orchard = "0.3.0"
          tree-sitter-elixir = "0.3.4"
          tree-sitter-erlang = "0.20.0"
          tree-sitter-fish = "3.6.0"
          tree-sitter-fsharp = "0.3.0"
          tree-sitter-go = "0.25.0"
          tree-sitter-haskell = "0.23.1"
          tree-sitter-java = "0.23.5"
          tree-sitter-javascript = "0.25.0"
          tree-sitter-julia = "0.23.1"
          tree-sitter-kotlin-ng = "1.1.0"
          tree-sitter-lua = "0.2.0"
          tree-sitter-ocaml = "0.24.0"
          tree-sitter-php = "0.24.0"
          tree-sitter-powershell = "0.26.4"
          tree-sitter-r = "1.2.0"
          tree-sitter-ruby = "0.23.1"
          tree-sitter-rust = "0.24.0"
          tree-sitter-scala = "0.24.0"
          tree-sitter-solidity = "1.2.13"
          tree-sitter-svelte-ng = "1.0.2"
          tree-sitter-swift = "0.7.1"
          tree-sitter-typescript = "0.23.2"
          tree-sitter-vue-next = "0.1.0"
          tree-sitter-zig = "1.1.2"
          EOF
          cat > /tmp/ts182/src/main.rs <<'EOF'
          use tree_sitter::{Language, Parser};

          fn probe(name: &str, language: Language) {
              let mut parser = Parser::new();
              parser.set_language(&language).unwrap_or_else(|error| panic!("{name}: set_language failed: {error}"));
              assert!(parser.parse("\n", None).is_some(), "{name}: parse returned None");
              println!("PARSER {name}=PASS");
          }

          fn main() {
              probe("bash", tree_sitter_bash::LANGUAGE.into());
              probe("c", tree_sitter_c::LANGUAGE.into());
              probe("c_sharp", tree_sitter_c_sharp::LANGUAGE.into());
              probe("cpp", tree_sitter_cpp::LANGUAGE.into());
              probe("dart", tree_sitter_dart_orchard::LANGUAGE.into());
              probe("elixir", tree_sitter_elixir::LANGUAGE.into());
              probe("erlang", tree_sitter_erlang::LANGUAGE.into());
              probe("fish", tree_sitter_fish::language());
              probe("fsharp", tree_sitter_fsharp::LANGUAGE_FSHARP.into());
              probe("go", tree_sitter_go::LANGUAGE.into());
              probe("haskell", tree_sitter_haskell::LANGUAGE.into());
              probe("java", tree_sitter_java::LANGUAGE.into());
              probe("javascript", tree_sitter_javascript::LANGUAGE.into());
              probe("julia", tree_sitter_julia::LANGUAGE.into());
              probe("kotlin", tree_sitter_kotlin_ng::LANGUAGE.into());
              probe("lua", tree_sitter_lua::LANGUAGE.into());
              probe("ocaml", tree_sitter_ocaml::LANGUAGE_OCAML.into());
              probe("php", tree_sitter_php::LANGUAGE_PHP.into());
              probe("powershell", tree_sitter_powershell::LANGUAGE.into());
              probe("r", tree_sitter_r::LANGUAGE.into());
              probe("ruby", tree_sitter_ruby::LANGUAGE.into());
              probe("rust", tree_sitter_rust::LANGUAGE.into());
              probe("scala", tree_sitter_scala::LANGUAGE.into());
              probe("solidity", tree_sitter_solidity::LANGUAGE.into());
              probe("svelte", tree_sitter_svelte_ng::LANGUAGE.into());
              probe("swift", tree_sitter_swift::LANGUAGE.into());
              probe("typescript", tree_sitter_typescript::LANGUAGE_TYPESCRIPT.into());
              probe("vue", tree_sitter_vue_next::LANGUAGE.into());
              probe("zig", tree_sitter_zig::LANGUAGE.into());
          }
          EOF
          cd /tmp/ts182
          cargo +1.82.0 run
