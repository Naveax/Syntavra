name: R11 selector capability synchronization

on:
  push:
    branches: [feature/dual-engine-r11-read-only-routing]
    paths:
      - ".github/workflows/r11-selector-capability-sync.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r11-selector-capability-sync.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dual-engine-r11-read-only-routing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize selector capability contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("syntavra_runtime/engine_selector.py")
          text = path.read_text(encoding="utf-8")
          old = '''RUST_CAPABILITIES = (
              "engine.capabilities",
              "engine.contract-hash",
              "version",
          )
          RUST_CAPABILITY_ROWS = {
              "engine.capabilities": ("preview", "read-only"),
              "engine.contract-hash": ("preview", "read-only"),
              "version": ("preview", "read-only"),
          }
          ENGINE_CONTRACT_DESCRIPTOR = (
              "product=Syntavra\\n"
              "product_version=0.0.1\\n"
              "release_channel=pre-release\\n"
              "contract_version=1\\n"
              "engine=rust\\n"
              "engine_stability=experimental\\n"
              "capability=engine.capabilities|preview|read-only\\n"
              "capability=engine.contract-hash|preview|read-only\\n"
              "capability=version|preview|read-only\\n"
          )
          '''
          new = '''RUST_CAPABILITIES = (
              "config.resolve",
              "engine.capabilities",
              "engine.contract-hash",
              "receipt.inspect",
              "state.broker-live-snapshot",
              "state.broker-snapshot",
              "state.inspect",
              "state.layout",
              "status",
              "version",
          )
          RUST_CAPABILITY_ROWS = {
              name: ("preview", "read-only") for name in RUST_CAPABILITIES
          }
          ENGINE_CONTRACT_DESCRIPTOR = (
              "product=Syntavra\\n"
              "product_version=0.0.1\\n"
              "release_channel=pre-release\\n"
              "contract_version=1\\n"
              "engine=rust\\n"
              "engine_stability=experimental\\n"
              "capability=config.resolve|preview|read-only\\n"
              "capability=engine.capabilities|preview|read-only\\n"
              "capability=engine.contract-hash|preview|read-only\\n"
              "capability=receipt.inspect|preview|read-only\\n"
              "capability=state.broker-live-snapshot|preview|read-only\\n"
              "capability=state.broker-snapshot|preview|read-only\\n"
              "capability=state.inspect|preview|read-only\\n"
              "capability=state.layout|preview|read-only\\n"
              "capability=status|preview|read-only\\n"
              "capability=version|preview|read-only\\n"
          )
          '''
          if old not in text:
              raise SystemExit("selector capability/descriptor block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          git rm .github/workflows/r11-selector-capability-sync.yml
      - name: Validate focused Python contracts
        run: |
          python -m pip install --disable-pip-version-check -e . pytest
          python -m pytest tests/runtime/test_engine_selector_r4.py tests/runtime/test_read_only_router_r11.py -q
      - name: Commit synchronized selector
        run: |
          git config user.name "Naveax"
          git config user.email "79841922+Naveax@users.noreply.github.com"
          git add syntavra_runtime/engine_selector.py tests/runtime/test_engine_selector_r4.py
          git commit -m "Synchronize R11 selector capability inventory"
          git push origin HEAD:feature/dual-engine-r11-read-only-routing
