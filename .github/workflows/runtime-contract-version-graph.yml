name: Runtime Contract Version Graph

on:
  pull_request:
    branches:
      - main
    paths:
      - "contracts/**"
      - "syntavra_runtime/contract_version_graph.py"
      - "tools/certify_runtime_contract_version_graph_v1.py"
      - "tests/runtime/test_runtime_contract_version_graph_v1.py"
      - ".github/workflows/runtime-contract-version-graph.yml"
      - ".github/workflows/release-main-merge-gate.yml"
      - "tests/runtime/test_release_action_pins.py"
      - "MANIFEST.sha256"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runtime-contract-version-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  runtime-contract-version-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run Runtime Contract Version Graph regression suite
        run: python -m unittest tests.runtime.test_runtime_contract_version_graph_v1 -v

      - name: Generate exact-head Runtime Contract Version Graph certificate
        run: |
          python tools/certify_runtime_contract_version_graph_v1.py --repo . --out /tmp/runtime-contract-version-graph.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('/tmp/runtime-contract-version-graph.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'RUNTIME_CONTRACT_VERSION_GRAPH_V1'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['graph']['node_count'] >= 20
          assert report['graph']['edge_count'] > 0
          assert report['graph']['metadata_leaf_count'] >= 0
          assert len(report['graph']['graph_sha256']) == 64
          assert report['runtime']['transitive_reverse_dependency_invalidation'] is True
          assert report['runtime']['external_contracts_are_metadata_only_leaves'] is True
          assert report['runtime']['external_leaf_recursive_expansion_forbidden'] is True
          assert report['runtime']['external_dependency_opt_out_fails_closed'] is True
          assert report['rust_resume_allowed'] is False
          PY

      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Runtime Contract Version Graph evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-contract-version-graph-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/runtime-contract-version-graph.json
          if-no-files-found: error
