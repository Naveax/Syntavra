name: Python Authority

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run Python authority regression tests
        run: python -m unittest tests.runtime.test_python_authority -v

      - name: Generate exact-head Python authority certificate
        run: |
          python tools/certify_python_authority.py --out /tmp/python-authority.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('/tmp/python-authority.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'PYTHON_FEATURE_DEVELOPMENT_AUTHORITY'
          assert report['exact_head'] == head, (report['exact_head'], head)
          assert report['enforcement']['repository_validator'] == 'tools/validate.py'
          assert report['enforcement']['exact_head_workflow'] == '.github/workflows/python-authority.yml'
          assert report['enforcement']['release_main_gate'] == '.github/workflows/release-main-merge-gate.yml'
          assert report['enforcement']['immutable_action_pin_policy'] == 'tests/runtime/test_release_action_pins.py'
          assert report['python']['feature_development_authority'] is True
          assert report['python']['product_behavior_authority'] is True
          assert report['python']['public_route_count'] == 245
          assert report['python']['execution_owner_count'] == 245
          assert report['python_complete_ready'] is report['rust']['resume_allowed']
          assert report['rust']['feature_development_frozen'] is (not report['rust']['resume_allowed'])
          assert report['rust']['implemented_native_routes'] == 245
          assert report['rust']['implementation_missing_routes'] == 0
          assert report['rust']['production_promoted_routes'] == 174
          assert report['rust']['remaining_routes'] == 71
          assert report['rust']['remaining_owned_routes'] == 71
          assert report['rust']['unowned_routes'] == 0
          assert report['rust']['atomic_promotion_target'] == 245
          assert report['rust']['resume_claim'] == 'PYTHON_COMPLETE'
          PY

      - name: Enforce clean exact-head repository
        if: always()
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Python authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-authority-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/python-authority.json
          if-no-files-found: error
