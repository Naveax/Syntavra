name: Remaining 71 Memory Intelligence Differential

# Temporary fail-closed repair gate. The source patch is persisted only after
# Rust compile, focused regression and both memory differential suites pass.
on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: remaining71-memory-intelligence-differential
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Apply memory-intelligence parity repair in workspace
        shell: python
        run: |
          from pathlib import Path
          import json
          import sys

          path = Path("crates/syntavra-cli/src/native_remaining71_memory.rs")
          source = path.read_text(encoding="utf-8")
          marker = 'include!("native_python_casefold.rs");'

          if marker not in source:
              old_imports = """use std::io::Write as _;
          use std::path::{Path, PathBuf};
          use std::time::{SystemTime, UNIX_EPOCH};
          """
              new_imports = """use std::io::Write as _;
          use std::path::{Path, PathBuf};
          use std::process::{Command, Stdio};
          use std::thread;
          use std::time::{Duration, Instant, SystemTime, UNIX_EPOCH};

          include!(\"native_python_casefold.rs\");
          """
              if source.count(old_imports) != 1:
                  raise SystemExit("memory import anchor drifted")
              source = source.replace(old_imports, new_imports, 1)

              old_tokens = """fn tokens(text: &str) -> Result<Vec<String>, String> {
              let regex = token_regex()?;
              Ok(regex
                  .find_iter(text)
                  .map(|item| item.as_str().to_lowercase())
                  .collect())
          }
          """
              new_tokens = """fn tokens(text: &str) -> Result<Vec<String>, String> {
              let regex = token_regex()?;
              Ok(regex
                  .find_iter(text)
                  .map(|item| python_casefold(item.as_str()))
                  .collect())
          }
          """
              if source.count(old_tokens) != 1:
                  raise SystemExit("memory token anchor drifted")
              source = source.replace(old_tokens, new_tokens, 1)

              metadata_anchor = """fn metadata_json(value: &Value) -> Result<String, String> {
              serde_json::to_string(&sorted(value))
                  .map_err(|error| format!(\"MEMORY_METADATA_SERIALIZE_FAILED:{error}\"))
          }
          """
              helpers = r'''

          fn record_memory_notification(
              state_root: &Path,
              kind: &str,
              text: &str,
          ) -> Result<(), String> {
              let path = state_root.join("notifications").join("events.jsonl");
              if let Some(parent) = path.parent() {
                  fs::create_dir_all(parent)
                      .map_err(|error| format!("MEMORY_NOTIFICATION_PARENT_FAILED:{error}"))?;
              }
              let created_at = now_seconds()?;
              let base = json!({
                  "channel": "memory",
                  "severity": "critical",
                  "title": format!("Critical {kind}"),
                  "body": text.chars().take(1000).collect::<String>(),
                  "created_at": created_at,
              });
              let event_hash = sha256_bytes(&canonical_json(&base)?);
              let mut item = base;
              item.as_object_mut()
                  .expect("notification object")
                  .insert("event_hash".to_owned(), Value::String(event_hash));
              let mut line = canonical_json(&item)?;
              line.push(b'\n');
              let mut output = OpenOptions::new()
                  .create(true)
                  .append(true)
                  .open(&path)
                  .map_err(|error| format!("MEMORY_NOTIFICATION_OPEN_FAILED:{error}"))?;
              output
                  .write_all(&line)
                  .map_err(|error| format!("MEMORY_NOTIFICATION_WRITE_FAILED:{error}"))?;
              output
                  .flush()
                  .map_err(|error| format!("MEMORY_NOTIFICATION_FLUSH_FAILED:{error}"))?;
              Ok(())
          }

          fn external_extract_rows(transcript: &str) -> Result<Option<Vec<Value>>, String> {
              let raw = std::env::var("SYNTAVRA_MEMORY_EXTRACTOR_COMMAND_JSON").unwrap_or_default();
              if raw.is_empty() {
                  return Ok(None);
              }
              let parsed: Value = serde_json::from_str(&raw)
                  .map_err(|error| format!("memory extractor command must be a non-empty JSON argv array: {error}"))?;
              let argv = parsed
                  .as_array()
                  .ok_or_else(|| "memory extractor command must be a non-empty JSON argv array".to_owned())?;
              if argv.is_empty()
                  || argv
                      .iter()
                      .any(|item| item.as_str().is_none_or(str::is_empty))
              {
                  return Err("memory extractor command must be a non-empty JSON argv array".to_owned());
              }
              let argv = argv
                  .iter()
                  .map(|item| item.as_str().expect("validated string").to_owned())
                  .collect::<Vec<_>>();

              let mut random = [0u8; 12];
              OsRng.fill_bytes(&mut random);
              let suffix = random.iter().map(|byte| format!("{byte:02x}")).collect::<String>();
              let root = std::env::temp_dir().join(format!("syntavra-memory-{suffix}"));
              fs::create_dir_all(&root)
                  .map_err(|error| format!("MEMORY_EXTRACTOR_TEMP_FAILED:{error}"))?;
              let request = root.join("request.json");
              let output = root.join("result.json");
              fs::write(
                  &request,
                  serde_json::to_vec(&json!({"transcript": transcript}))
                      .map_err(|error| format!("MEMORY_EXTRACTOR_REQUEST_JSON:{error}"))?,
              )
              .map_err(|error| format!("MEMORY_EXTRACTOR_REQUEST_WRITE:{error}"))?;

              let request_text = request.to_string_lossy().into_owned();
              let output_text = output.to_string_lossy().into_owned();
              let command = argv
                  .iter()
                  .map(|item| {
                      item.replace("{request}", &request_text)
                          .replace("{output}", &output_text)
                  })
                  .collect::<Vec<_>>();
              let mut child = Command::new(&command[0])
                  .args(&command[1..])
                  .stdin(Stdio::null())
                  .stdout(Stdio::null())
                  .stderr(Stdio::piped())
                  .spawn()
                  .map_err(|error| format!("MEMORY_EXTRACTOR_SPAWN_FAILED:{error}"))?;
              let started = Instant::now();
              let status = loop {
                  if let Some(status) = child
                      .try_wait()
                      .map_err(|error| format!("MEMORY_EXTRACTOR_WAIT_FAILED:{error}"))?
                  {
                      break status;
                  }
                  if started.elapsed() >= Duration::from_secs(120) {
                      let _ = child.kill();
                      let _ = child.wait();
                      let _ = fs::remove_dir_all(&root);
                      return Err("memory extractor failed: timeout".to_owned());
                  }
                  thread::sleep(Duration::from_millis(10));
              };
              if !status.success() {
                  let code = status.code().unwrap_or(-1);
                  let _ = fs::remove_dir_all(&root);
                  return Err(format!("memory extractor failed: {code}"));
              }
              let raw_output = fs::read_to_string(&output)
                  .map_err(|error| format!("MEMORY_EXTRACTOR_OUTPUT_READ:{error}"))?;
              let value: Value = serde_json::from_str(&raw_output)
                  .map_err(|error| format!("MEMORY_EXTRACTOR_OUTPUT_JSON:{error}"))?;
              let rows = match value {
                  Value::Object(mut map) => map.remove("observations").unwrap_or(Value::Object(map)),
                  other => other,
              };
              let rows = rows
                  .as_array()
                  .ok_or_else(|| "memory extractor result must be a list".to_owned())?
                  .iter()
                  .filter(|row| row.is_object())
                  .cloned()
                  .collect::<Vec<_>>();
              let _ = fs::remove_dir_all(&root);
              Ok(Some(rows))
          }
          '''
              if source.count(metadata_anchor) != 1:
                  raise SystemExit("memory metadata anchor drifted")
              source = source.replace(metadata_anchor, metadata_anchor + helpers, 1)

              old_readback = """    db.query_row(
                  \"SELECT * FROM observations WHERE observation_id=?1\",
                  [observation_id],
                  observation_from_row,
              )
              .map_err(|error| format!(\"MEMORY_INTELLIGENCE_READ_FAILED:{error}\"))
          }
          """
              new_readback = """    let item = db
                  .query_row(
                      \"SELECT * FROM observations WHERE observation_id=?1\",
                      [observation_id],
                      observation_from_row,
                  )
                  .map_err(|error| format!(\"MEMORY_INTELLIGENCE_READ_FAILED:{error}\"))?;
              if item.importance >= 0.9 {
                  if let Some(state_root) = path.parent() {
                      record_memory_notification(state_root, kind, text)?;
                  }
              }
              Ok(item)
          }
          """
              if source.count(old_readback) != 1:
                  raise SystemExit("memory readback anchor drifted")
              source = source.replace(old_readback, new_readback, 1)

              start = source.index('        "memory-extract" => {')
              end = source.index('        "memory-search" => {', start)
              replacement = r'''        "memory-extract" => {
              let positional = positional_after_action(arguments, action)?;
              let source = positional
                  .first()
                  .ok_or_else(|| "MEMORY_SOURCE_REQUIRED".to_owned())?;
              let text = read_text_or_path(source)?;
              let mut observations = Vec::new();
              if let Some(rows) = external_extract_rows(&text)? {
                  for row in rows {
                      let Some(map) = row.as_object() else {
                          continue;
                      };
                      let value = map.get("text").and_then(Value::as_str).unwrap_or("").trim();
                      if value.is_empty() {
                          continue;
                      }
                      let kind = map
                          .get("kind")
                          .and_then(Value::as_str)
                          .unwrap_or("observation");
                      let importance = map
                          .get("importance")
                          .and_then(Value::as_f64)
                          .unwrap_or(0.5);
                      let confidence = map
                          .get("confidence")
                          .and_then(Value::as_f64)
                          .unwrap_or(0.7);
                      let validity = map
                          .get("validity")
                          .and_then(Value::as_f64)
                          .unwrap_or(1.0);
                      let metadata = map
                          .get("metadata")
                          .filter(|value| value.is_object())
                          .cloned()
                          .unwrap_or_else(|| json!({}));
                      observations.push(
                          add_observation(
                              &db_path,
                              value,
                              kind,
                              importance,
                              confidence,
                              validity,
                              &metadata,
                              true,
                          )?
                          .value(false),
                      );
                  }
              } else {
                  let patterns = [
                      (
                          "decision",
                          r"(?im)^\s*(?:decision|decided|we will|keep|use)\s*[:-]?\s*(.+)$",
                          0.8,
                      ),
                      (
                          "failure",
                          r"(?im)^\s*(?:root cause|failure|error cause)\s*[:-]?\s*(.+)$",
                          0.75,
                      ),
                      (
                          "constraint",
                          r"(?im)^\s*(?:constraint|must|never)\s*[:-]?\s*(.+)$",
                          0.85,
                      ),
                      (
                          "preference",
                          r"(?im)^\s*(?:preference|prefer)\s*[:-]?\s*(.+)$",
                          0.65,
                      ),
                  ];
                  for (kind, pattern, importance) in patterns {
                      let regex = Regex::new(pattern)
                          .map_err(|error| format!("MEMORY_EXTRACT_REGEX:{error}"))?;
                      for capture in regex.captures_iter(&text) {
                          let Some(found) = capture.get(1) else {
                              continue;
                          };
                          let value = found.as_str().trim();
                          if value.is_empty() {
                              continue;
                          }
                          observations.push(
                              add_observation(
                                  &db_path,
                                  value,
                                  kind,
                                  importance,
                                  0.65,
                                  1.0,
                                  &json!({"extraction": "heuristic"}),
                                  true,
                              )?
                              .value(false),
                          );
                      }
                  }
              }
              Ok(json!({"observations": observations}))
          }
          '''
              source = source[:start] + replacement + source[end:]

              test_anchor = """    #[test]
              fn python_json_dumps_sorted_matches_python_spacing() {
          """
              test = """    #[test]
              fn python_casefold_matches_sharp_s_expansion() {
                  assert_eq!(python_casefold(\"Straße\"), \"strasse\");
                  assert_eq!(python_casefold(\"STRASSE\"), \"strasse\");
              }

          """
              if source.count(test_anchor) != 1:
                  raise SystemExit("memory test anchor drifted")
              source = source.replace(test_anchor, test + test_anchor, 1)
              path.write_text(source, encoding="utf-8")

          casefold_path = Path("crates/syntavra-cli/src/native_python_casefold.rs")
          if not casefold_path.exists():
              rows = []
              for codepoint in range(sys.maxunicode + 1):
                  char = chr(codepoint)
                  folded = char.casefold()
                  if folded == char:
                      continue
                  rendered = json.dumps(folded, ensure_ascii=False)
                  rows.append(f"        '\\u{{{codepoint:X}}}' => output.push_str({rendered}),")
              generated = """// Generated from CPython 3.12 str.casefold() mappings by the exact-head parity gate.
          // Runtime behavior is fully native Rust; Python is not invoked by this module.
          fn python_casefold(text: &str) -> String {
              let mut output = String::with_capacity(text.len());
              for character in text.chars() {
                  match character {
          """ + "\n".join(rows) + """
                      _ => output.push(character),
                  }
              }
              output
          }
          """
              casefold_path.write_text(generated, encoding="utf-8")
      - name: Build Rust selector and focused regressions
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 test --locked -p syntavra-cli python_casefold_matches_sharp_s_expansion -- --exact
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
      - name: Run memory-intelligence differential
        run: |
          python tools/validate_remaining71_memory_intelligence_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/memory-intelligence-differential.json
      - name: Run session-memory regression differential
        run: |
          python tools/validate_remaining71_session_memory_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/session-memory-differential.json
      - name: Validate patch hygiene
        run: |
          git diff --check
          test -n "$(git status --porcelain --untracked-files=all)" || echo "repair already persisted"
      - name: Persist validated memory-intelligence repair
        if: github.event_name == 'push'
        run: |
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/syntavra-cli/src/native_remaining71_memory.rs crates/syntavra-cli/src/native_python_casefold.rs
            git commit -m "Fix native memory intelligence parity"
            git push origin HEAD:agent/r31-provider-capture-native
          fi
      - name: Show exact head and clean tree
        run: |
          echo "head=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=all)"
