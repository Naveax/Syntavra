# Exact-head cross-engine certification gate for R31 provider prepare.
name: R31 Provider Prepare Parity

on:
  push:
    branches:
      - agent/r31-provider-prepare-native
  pull_request:
    branches:
      - agent/r31-provider-replay-native
    paths:
      - "crates/syntavra-cli/src/native_provider_gateway_prepare.rs"
      - "crates/syntavra-cli/src/native_product_legacy.rs"
      - "contracts/engine/dual-engine-public-surface-v2.json"
      - "tools/report_missing_native_public_routes.py"
      - "tools/verify_r31_provider_prepare_parity.py"
      - ".github/workflows/r31-provider-prepare-parity.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    name: ${{ matrix.os }} / Python 3.11 / Rust 1.82.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Install canonical Rust toolchain
        run: rustup toolchain install 1.82.0 --profile minimal --component rustfmt

      - name: Rustfmt check
        run: cargo +1.82.0 fmt --all -- --check

      - name: Cargo check native selector
        run: cargo +1.82.0 check --locked -p syntavra-cli --bin syntavra

      - name: Build native selector
        run: cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra

      - name: Provider prepare differential
        id: differential
        continue-on-error: true
        shell: bash
        run: |
          selector="target/debug/syntavra"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            selector="${selector}.exe"
          fi
          set +e
          python tools/verify_r31_provider_prepare_parity.py --selector "$selector" > prepare-result.json
          code=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('prepare-result.json').read_text(encoding='utf-8'))
          print('overall_ok=', data.get('ok'))
          for name, row in (data.get('scenarios') or {}).items():
              print(f"scenario={name} ok={row.get('ok')} plan_equal={row.get('plan_equal')} state_equal={row.get('state_equal')} wrapper_equal={row.get('wrapper_equal')}")
              if not row.get('plan_equal'):
                  py = row.get('python_plan') or {}
                  rs = row.get('rust_plan') or {}
                  diff = [key for key in sorted(set(py) | set(rs)) if py.get(key) != rs.get(key)]
                  print('  plan_diff_keys=', ','.join(diff))
                  for key in diff:
                      print(f"  PLAN {key}: py={py.get(key)!r} rs={rs.get(key)!r}")
              if not row.get('state_equal'):
                  py = row.get('python_state') or {}
                  rs = row.get('rust_state') or {}
                  diff = [key for key in sorted(set(py) | set(rs)) if py.get(key) != rs.get(key)]
                  print('  state_diff_sections=', ','.join(diff))
                  for key in diff:
                      print(f"  STATE {key}: py={py.get(key)!r} rs={rs.get(key)!r}")
          rejection = data.get('credential_rejection') or {}
          print(f"credential_rejection ok={rejection.get('ok')} python_exit={rejection.get('python_exit')} rust_exit={rejection.get('rust_exit')}")
          if not rejection.get('ok'):
              print('  PY_STATE=', rejection.get('python_state'))
              print('  RS_STATE=', rejection.get('rust_state'))
          PY
          rm -f prepare-result.json
          exit "$code"

      - name: Working tree integrity
        if: always()
        shell: bash
        run: |
          rm -f prepare-result.json
          git status --porcelain=v1 --untracked-files=all
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Enforce differential result
        if: always()
        shell: bash
        env:
          DIFFERENTIAL: ${{ steps.differential.outcome }}
        run: test "$DIFFERENTIAL" = "success"
