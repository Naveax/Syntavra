name: Python Authority Manifest Finalize

on:
  push:
    branches:
      - agent/python-authority-v1-final

permissions:
  contents: write

concurrency:
  group: python-authority-manifest-finalize
  cancel-in-progress: false

jobs:
  finalize-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/python-authority-v1-final
          fetch-depth: 0

      - name: Remove finalizer and refresh canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/python-authority-v1-final"
          rm .github/workflows/python-authority-manifest-finalize.yml
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git diff --check

      - name: Commit final authority tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 .github/workflows/python-authority-manifest-finalize.yml
          git commit -m "Refresh Python authority manifest"
          git push origin HEAD:agent/python-authority-v1-final
