name: Phase 2 Graph Language Parity Fix

on:
  push:
    branches:
      - agent/r31-provider-capture-native

permissions:
  contents: write

concurrency:
  group: phase2-graph-language-parity-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0

      - name: Apply bounded frozen-reference parity repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/syntavra-cli/src/native_remaining71_graph_core.rs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"inventory" => language_status(project_root, &database, false),':
                  '"inventory" => language_status(project_root, &database, true),',
              'let detection = detect_language(&project, &source, &data, false)?;':
                  'let detection = detect_language(&project, &source, &data, true)?;',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact replacement precondition failed: {old!r} count={count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- crates/syntavra-cli/src/native_remaining71_graph_core.rs

      - name: Commit bounded source repair
        run: |
          test -n "$(git status --porcelain -- crates/syntavra-cli/src/native_remaining71_graph_core.rs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/syntavra-cli/src/native_remaining71_graph_core.rs
          git commit -m "Align Graph Language with frozen Python reference"
          git push origin HEAD:agent/r31-provider-capture-native
