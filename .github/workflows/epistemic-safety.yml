name: Epistemic Safety

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/epistemic-safety-v1

permissions:
  contents: read

concurrency:
  group: epistemic-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  epistemic-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
      - name: Run Epistemic Safety regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_epistemic_safety_v1 -v
      - name: Generate exact-head Epistemic Safety certificate
        shell: bash
        run: |
          set -euo pipefail
          python tools/certify_epistemic_safety_v1.py --out /tmp/epistemic-safety.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('/tmp/epistemic-safety.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'EPISTEMIC_SAFETY_V1'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['python_complete_ready'] is False
          assert report['rust_resume_allowed'] is False
          assert report['runtime']['epistemic_state_engine'] is True
          assert report['runtime']['prompt_injection_ingress_filter'] is True
          assert report['runtime']['safe_action_commit_gate'] is True
          assert report['runtime']['context_lease_invalidation'] is True
          assert report['runtime']['persistent_store'] is False
          assert report['runtime']['side_effects'] is False
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          PY
      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"
      - name: Upload Epistemic Safety evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epistemic-safety-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/epistemic-safety.json
          if-no-files-found: error
