name: Unified Context Namespace Manifest Seal

on:
  push:
    branches:
      - agent/unified-context-namespace-v1

permissions:
  contents: write

concurrency:
  group: unified-context-namespace-manifest-seal-v1
  cancel-in-progress: false

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      EXPECTED_CANDIDATE_MANIFEST_SHA256: 846947982aff27ac67008519e9cc8e32d35ffedc2428b682ee41bea9201d04c9
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/unified-context-namespace-v1
          fetch-depth: 0

      - name: Verify exact trigger head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Remove applicator and generate canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/unified-context-namespace-manifest-seal.yml
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          printf '%s  %s\n' "$EXPECTED_CANDIDATE_MANIFEST_SHA256" MANIFEST.sha256 | sha256sum -c -
          git add MANIFEST.sha256
          git diff --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/unified-context-namespace-manifest-seal.yml"
          test "${changed[1]}" = "MANIFEST.sha256"

      - name: Commit final permanent tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seal Unified Context Namespace manifest"
          git push origin HEAD:agent/unified-context-namespace-v1
