name: Ultra-Low Token Frontier V3

on:
  pull_request:
    paths:
      - 'docs/plans/SYNTAVRA_ULTRA_LOW_TOKEN_FRONTIER_V3.md'
      - 'docs/plans/SYNTAVRA_TOKEN_ECONOMY_EXECUTION_BACKLOG_V4.md'
      - 'contracts/python/ultra-low-token-frontier-v3.json'
      - 'contracts/python/token-economy-execution-backlog-v4.json'
      - '.github/workflows/ultra-low-token-frontier-v3.yml'
  push:
    branches: [main]
    paths:
      - 'docs/plans/SYNTAVRA_ULTRA_LOW_TOKEN_FRONTIER_V3.md'
      - 'docs/plans/SYNTAVRA_TOKEN_ECONOMY_EXECUTION_BACKLOG_V4.md'
      - 'contracts/python/ultra-low-token-frontier-v3.json'
      - 'contracts/python/token-economy-execution-backlog-v4.json'
      - '.github/workflows/ultra-low-token-frontier-v3.yml'

permissions:
  contents: read

concurrency:
  group: ultra-low-token-frontier-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate V3 floor-search contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          frontier = json.loads(Path('contracts/python/ultra-low-token-frontier-v3.json').read_text(encoding='utf-8'))
          backlog = json.loads(Path('contracts/python/token-economy-execution-backlog-v4.json').read_text(encoding='utf-8'))

          assert frontier['schema_version'] == 3
          assert frontier['family'] == 'syntavra-ultra-low-token-frontier'
          assert frontier['no_new_capability_namespace'] is True
          assert len(frontier['mechanisms']) == 7
          assert frontier['waves'] == ['TE-U15','TE-U16','TE-U17','TE-U18','TE-U19','TE-U20','TE-U21']
          ft = frontier['targets']
          assert ft['verified_repeated_provider_tokens'] == 0
          assert ft['easy_warm_floor_search_max_tokens'] == 100
          assert ft['easy_frontier_floor_search_max_tokens'] == 500
          assert ft['normal_scoped_coding_floor_search_max_tokens'] == 2000
          assert ft['hard_scoped_floor_search_max_tokens'] == 5000
          assert ft['quality_non_inferior'] is True
          assert ft['unexplained_overflow'] == 0

          assert backlog['schema_version'] == 4
          assert backlog['family'] == 'syntavra-token-economy-execution-backlog'
          assert backlog['base_backlog_remains_authoritative'] is True
          assert backlog['no_new_capability_namespace'] is True
          assert backlog['continuous_lowering'] is True
          assert len(backlog['new_items']) == 7
          assert backlog['waves'] == ['TE-U15','TE-U16','TE-U17','TE-U18','TE-U19','TE-U20','TE-U21']
          bt = backlog['research_floor_targets']
          assert bt['verified_repeated_tokens'] == 0
          assert bt['easy_warm_max'] == 100
          assert bt['easy_frontier_max'] == 500
          assert bt['normal_scoped_coding_max'] == 2000
          assert bt['hard_scoped_max'] == 5000

          assert [x['id'] for x in frontier['mechanisms']] == [x['id'] for x in backlog['new_items']]
          PY

      - name: Enforce exact clean head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
