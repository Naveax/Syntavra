name: Adaptive Context Lifecycle Applicator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: adaptive-context-lifecycle-applicator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/adaptive-context-policy-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      EXPECTED_SOURCE_HEAD: 2e9f2ec8b5fbb603359a24f874f90f2d7c0651e8
      TARGET_BRANCH: agent/adaptive-context-policy-v1
      APPLICATOR: .github/workflows/adaptive-context-lifecycle-applicator.yml
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/adaptive-context-policy-v1
          fetch-depth: 0

      - name: Verify one-file staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_HEAD"
          test "$(git diff --name-only "$EXPECTED_SOURCE_HEAD"..HEAD)" = "$APPLICATOR"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply Adaptive certification and next milestone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          registry_path = root / 'contracts/python/capability-completeness-registry-v1.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          by_id = {row['id']: row for row in registry['capabilities']}

          multi = by_id['multi_graph_retrieval_v1']
          assert multi['state'] == 'certified', multi

          adaptive = by_id['adaptive_context_policy_v1']
          assert adaptive['state'] in {'implemented', 'verified', 'certified'}, adaptive
          adaptive['state'] = 'certified'
          adaptive['certification_evidence'] = [
              'contracts/python/adaptive-context-policy-v1.json',
              'syntavra_runtime/adaptive_context_policy.py',
              'tools/certify_adaptive_context_policy.py',
              'tests/runtime/test_adaptive_context_policy.py',
              '.github/workflows/adaptive-context-policy.yml',
          ]

          next_id = 'context_reset_handoff_v1'
          handoff = by_id[next_id]
          assert handoff['state'] == 'partial', handoff
          order = registry['milestone_order']
          assert order[:11] == [
              'python_authority_v1',
              'capability_completeness_registry_v1',
              'rust_feature_freeze_guard_v1',
              'universal_context_item_v1',
              'evidence_store_v2',
              'typed_context_object_store_v1',
              'programmatic_execution_v1',
              'deferred_tool_discovery_v1',
              'unified_context_namespace_v1',
              'multi_graph_retrieval_v1',
              'adaptive_context_policy_v1',
          ], order
          if next_id not in order:
              order.append(next_id)
          assert order.count(next_id) == 1, order

          registry_path.write_text(
              json.dumps(registry, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          checkpoint = root / 'docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt'
          marker = 'APPENDED CURRENT CHECKPOINT — 2026-08-19 — CONTEXT RESET / HANDOFF ACTIVE'
          body = f'''\n\n======================================================================\n{marker}\n======================================================================\n\nCURRENT ADMITTED MAIN:\nff9fe699b835889f326e2a8b0dfbb7ba334d3949\n\nACTIVE IMPLEMENTATION BRANCH:\nagent/adaptive-context-policy-v1\n\nACTIVE PR:\n#145 — Add Adaptive Context Policy v1\n\nPYTHON STATUS:\nPYTHON-FIRST ACTIVE — adaptive_context_policy_v1 is certified; context_reset_handoff_v1 is the current milestone.\n\nRUST STATUS:\nFEATURE FROZEN AND CI-ENFORCED — implementation coverage 245/245; production promotion 174/245; remaining parity/promotion 71; Rust resume false.\n\nADMITTED ADAPTIVE POLICY:\n- deterministic and explainable KEEP/SUMMARIZE/COMPRESS/EXTERNALIZE/ABSTAIN item policy.\n- KEEP/RESET/BRANCH/ABSTAIN session recommendations with explicit safety gates.\n- exact-required context fails closed when budget cannot be satisfied.\n- security deny, tainted exact-required evidence and unsafe irreversible state abstain.\n- shadow mode records recommendations without claiming enforcement.\n- reference-only Multi-Graph and TaskContextPack adapters preserve payload authority boundaries.\n- exact-head Adaptive Context Policy, Rust Freeze, Dual Engine, Release Main and Package Provenance gates passed before lifecycle certification.\n\nNEXT CANONICAL MILESTONE:\ncontext_reset_handoff_v1\n\nEXISTING PRIMITIVES TO REUSE:\n- SessionMemory exact hash chain, multi-view compaction, checkpoint, fork, merge and restore.\n- AutonomousCodingAgent bounded execution receipts and optional session event recording.\n- AdaptiveContextPolicy session recommendations and recoverability/task-drift signals.\n\nNEXT EXACT TASK:\n- define one canonical context reset / structured handoff contract.\n- compose existing session memory and adaptive policy primitives instead of duplicating stores.\n- preserve evidence handles, git state and security state across RESET/BRANCH.\n- add deterministic handoff compiler + verifier and fail-closed recovery checks.\n- add reset benchmark arms and exact-head admission workflow.\n'''
          current = checkpoint.read_text(encoding='utf-8')
          if marker not in current:
              checkpoint.write_text(current + body, encoding='utf-8')
          PY

      - name: Remove applicator and seal exact-tree manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm "$APPLICATOR"
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check

      - name: Verify lifecycle transition
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m unittest tests.runtime.test_adaptive_context_policy tests.runtime.test_python_capability_completeness tests.runtime.test_rust_feature_freeze_guard -v
          python tools/certify_adaptive_context_policy.py --out /tmp/adaptive.json
          python tools/certify_python_capability_completeness.py --out /tmp/completeness.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-freeze.json
          python - <<'PY'
          import json
          from pathlib import Path
          adaptive = json.loads(Path('/tmp/adaptive.json').read_text(encoding='utf-8'))
          completeness = json.loads(Path('/tmp/completeness.json').read_text(encoding='utf-8'))
          freeze = json.loads(Path('/tmp/rust-freeze.json').read_text(encoding='utf-8'))
          assert adaptive['ok'] is True, adaptive
          assert adaptive['admission_ready'] is True, adaptive
          assert completeness['ok'] is True, completeness
          assert completeness['current_milestone'] == 'context_reset_handoff_v1', completeness
          assert completeness['python_complete_ready'] is False, completeness
          assert completeness['rust_resume_allowed'] is False, completeness
          assert freeze['ok'] is True, freeze
          assert freeze['rust']['production_promoted'] == 174, freeze
          assert freeze['rust']['remaining_parity_promotion'] == 71, freeze
          PY
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py --check
          git diff --check

      - name: Commit certified lifecycle tree
        shell: bash
        run: |
          set -euo pipefail
          git add MANIFEST.sha256 contracts/python/capability-completeness-registry-v1.json docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt
          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = "$APPLICATOR"
          test "${changed[1]}" = "MANIFEST.sha256"
          test "${changed[2]}" = "contracts/python/capability-completeness-registry-v1.json"
          test "${changed[3]}" = "docs/SYNTAVRA_PYTHON_FIRST_CHECKPOINT.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Certify Adaptive Context Policy lifecycle"
          git push origin "HEAD:${TARGET_BRANCH}"
