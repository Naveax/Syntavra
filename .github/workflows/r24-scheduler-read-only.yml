name: R24 Scheduler Read-Only CLI Parity

on:
  pull_request:
    paths:
      - "contracts/cli/scheduler-read-only-v1.json"
      - "contracts/engine/descriptor.txt"
      - "contracts/parity/python-rust-full-parity-v1.json"
      - "crates/syntavra-cli/src/main.rs"
      - "crates/syntavra-cli/src/scheduler_read_only_contract.rs"
      - "crates/syntavra-contracts/src/lib.rs"
      - "syntavra_runtime/engine_cli.py"
      - "syntavra_runtime/engine_entry.py"
      - "syntavra_runtime/engine_selector.py"
      - "syntavra_runtime/scheduler_read_only_contract.py"
      - "syntavra_runtime/scheduler_read_only_router_r24.py"
      - "syntavra_runtime/unified_cli.py"
      - "tests/runtime/test_engine_selector_r4.py"
      - "tests/runtime/test_full_parity_catalog_v1.py"
      - "tests/runtime/test_scheduler_read_only_r24.py"
      - "tools/run_engine_parity_r24.py"
      - "tools/verify_r24_scheduler_read_only.py"
      - ".github/workflows/r24-scheduler-read-only.yml"
      - "docs/adr/0028-scheduler-read-only-cli-parity.md"
  push:
    branches:
      - main
      - "feature/full-parity-r24-**"

permissions:
  contents: read

jobs:
  parity:
    name: R24 Scheduler Read-Only Contract and Cargo Parity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run R24 scheduler regressions
        run: >-
          python -m pytest -q
          tests/runtime/test_scheduler_read_only_r24.py
          tests/runtime/test_engine_selector_r4.py
          tests/runtime/test_full_parity_catalog_v1.py
      - name: Set up pinned Rust 1.82
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Cargo-backed scheduler verifier
        run: python tools/verify_r24_scheduler_read_only.py | tee r24-scheduler-read-only-report.json
      - name: Run aggregate R0-R24 parity
        run: python tools/run_engine_parity_r24.py | tee aggregate-r0-r24.json
      - name: Upload R24 scheduler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r24-scheduler-read-only-diagnostics
          path: |
            r24-scheduler-read-only-report.json
            aggregate-r0-r24.json
          if-no-files-found: warn
