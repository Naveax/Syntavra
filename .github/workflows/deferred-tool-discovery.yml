name: Deferred Tool Discovery

on:
  push:
    branches:
      - main
      - agent/deferred-tool-discovery-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deferred-tool-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deferred-tool-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Run Deferred Tool Discovery regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_deferred_tool_discovery -v

      - name: Generate exact-head Deferred Tool Discovery certificate
        shell: bash
        run: |
          set -euo pipefail
          python tools/certify_deferred_tool_discovery.py --out /tmp/deferred-tool-discovery.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('/tmp/deferred-tool-discovery.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'DEFERRED_TOOL_DISCOVERY_V1'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['python_complete_ready'] is False
          assert report['rust_resume_allowed'] is False
          assert report['runtime']['stage1_schema_deferred'] is True
          assert report['runtime']['stage2_explicit_schema_expansion'] is True
          assert report['runtime']['host_negotiation'] is True
          assert report['runtime']['schema_token_budget'] is True
          assert report['runtime']['unknown_query_fail_closed'] is True
          assert report['runtime']['parallel_tool_registry'] is False
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          PY

      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Deferred Tool Discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deferred-tool-discovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/deferred-tool-discovery.json
          if-no-files-found: error
