name: R38 One-Shot Runtime Closure

on:
  push:
    branches:
      - agent/full-dual-engine-runtime

permissions:
  contents: write

concurrency:
  group: r38-one-shot-runtime-closure
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      RUSTUP_TOOLCHAIN: 1.82.0
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect one-shot repair marker
        id: marker
        shell: bash
        run: |
          if [[ -f .github/r38-runtime-repair ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.13
        if: steps.marker.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up pinned Rust 1.82
        if: steps.marker.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt

      - name: Install runtime test dependencies
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: python -m pip install --disable-pip-version-check -e . pytest

      - name: Validate exact-head runtime closure
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/repair_r38_ci_closure.py
          python tools/repair_r38_runtime_regressions.py
          cargo fmt --all
          python tools/repair_r38_runtime_regressions.py --check
          python -m pytest -q tests/runtime/test_r38_runtime_regression_repair.py

      - name: Reproduce generated metadata
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/repair_r38_selector_option_values.py
          python tools/repair_r38_windows_rollout_identity.py
          python tools/sync_r38_generated_metadata.py
          cargo fmt --all
          python tools/sync_r38_generated_metadata.py
          rm .github/r38-runtime-repair
          python tools/refresh_manifest.py
          test ! -e .github/r38-runtime-repair

      - name: Compile repaired selector
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p syntavra-cli --bin syntavra

      - name: Commit atomic closure and remove one-shot workflow
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          rm .github/workflows/r38-one-shot-runtime-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "expected an atomic closure diff" >&2
            exit 1
          fi
          git commit -m "R38: certify status and hook foundations"
          git push origin HEAD:agent/full-dual-engine-runtime
