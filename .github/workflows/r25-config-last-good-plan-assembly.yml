name: R25 Config Last-Good Plan Assembly

on:
  push:
    branches:
      - feature/full-parity-r25-config-last-good-lifecycle-plan
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r25-config-last-good-lifecycle-plan
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Add R25 shadow-plan catalog entry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("contracts/parity/python-rust-full-parity-v1.json")
          catalog = json.loads(path.read_text(encoding="utf-8"))
          rows = catalog.get("features")
          if not isinstance(rows, list):
              raise SystemExit("catalog features must be a list")

          identifier = "config.last-good.lifecycle.plan"
          desired = {
              "id": identifier,
              "target_phase": "R25",
              "category": "config",
              "python_owner": "syntavra_runtime.config_last_good_plan",
              "rust_owner": "crates/syntavra-cli/src/config_last_good_plan.rs",
              "status": "RUST_SHADOW",
              "mutation": "read-only",
              "contract": "contracts/config/config-last-good-lifecycle-plan-v1.json",
              "parity_tests": ["tools/verify_r25_config_last_good_plan.py"],
          }
          matches = [row for row in rows if isinstance(row, dict) and row.get("id") == identifier]
          if matches:
              if len(matches) != 1 or matches[0] != desired:
                  raise SystemExit(f"R25 plan catalog row drifted: {matches!r}")
              print("R25 plan catalog row already current")
          else:
              target_indexes = [
                  index
                  for index, row in enumerate(rows)
                  if isinstance(row, dict) and row.get("id") == "config.profile.lifecycle"
              ]
              if len(target_indexes) != 1:
                  raise SystemExit("expected one config.profile.lifecycle catalog row")
              rows.insert(target_indexes[0], desired)
              path.write_text(
                  json.dumps(catalog, indent=2, sort_keys=False) + "\n",
                  encoding="utf-8",
                  newline="\n",
              )
              print("R25 plan catalog row inserted")
          PY

      - name: Remove one-time assembly workflow
        run: git rm .github/workflows/r25-config-last-good-plan-assembly.yml

      - name: Refresh exact repository manifest
        run: python -m tools.refresh_manifest

      - name: Verify Python plan regressions
        run: |
          python -m pip install --upgrade pytest
          python -m pip install -e .
          python -m pytest -q tests/runtime/test_config_last_good_plan_r25.py

      - name: Commit assembled tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/parity/python-rust-full-parity-v1.json MANIFEST.sha256
          git diff --cached --check
          git commit -m "Register R25 config last-good shadow plan"
          git push origin HEAD:feature/full-parity-r25-config-last-good-lifecycle-plan
