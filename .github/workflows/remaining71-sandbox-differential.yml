name: Remaining 71 Sandbox Differential

# Exercises deterministic direct and platform sandbox semantics across both engines.
on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: remaining71-sandbox-differential
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Expose Python platform sandbox exception
        shell: bash
        run: |
          set +e
          probe='["'"$(command -v python)"'","-c","import json,os;print(json.dumps({\"sandbox\":os.getenv(\"SYNTAVRA_SANDBOX\"),\"workspace\":bool(os.getenv(\"SYNTAVRA_WORKSPACE\")),\"secret\":os.getenv(\"TEST_API_KEY\")},sort_keys=True))"]'
          TEST_API_KEY='sandbox-secret-must-not-leak' \
          python -m syntavra_runtime.engine_entry \
            --engine python \
            --project "$GITHUB_WORKSPACE" \
            --state-root "$RUNNER_TEMP/sandbox-python-diagnostic" \
            run sandbox-run "$probe" --timeout 5 \
            >"$RUNNER_TEMP/sandbox-python.stdout" \
            2>"$RUNNER_TEMP/sandbox-python.stderr"
          rc=$?
          echo "python_platform_sandbox_exit=$rc"
          echo '--- stdout ---'
          cat "$RUNNER_TEMP/sandbox-python.stdout"
          echo '--- stderr ---'
          cat "$RUNNER_TEMP/sandbox-python.stderr"
          echo '--- end diagnostic ---'
          exit 0
      - name: Build Rust selector
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
      - name: Run sandbox differential
        run: |
          python tools/validate_remaining71_sandbox_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/sandbox-differential.json
      - name: Show exact head and clean tree
        run: |
          echo "head=$(git rev-parse HEAD)"
          git status --porcelain --untracked-files=all
