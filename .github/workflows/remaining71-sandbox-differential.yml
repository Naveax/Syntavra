name: Remaining 71 Sandbox Differential

# Exercises deterministic direct and platform sandbox semantics across both engines.
on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: remaining71-sandbox-differential
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pending sandbox parity repair
        run: |
          if [ -f tools/apply_remaining71_sandbox_parity_fix.py ]; then
            python tools/apply_remaining71_sandbox_parity_fix.py
          fi
      - name: Install Python runtime and test dependencies
        run: python -m pip install -e . pytest
      - name: Run Python unified platform sandbox tests
        run: python -m pytest tests/runtime/test_syntavra_unified_platform.py -q
      - name: Build full Rust CLI probe surface
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
      - name: Run Rust sandbox wrapper tests
        run: cargo +1.82.0 test --locked -p syntavra-cli --bin syntavra platform_wrapper_tests -- --nocapture
      - name: Run sandbox differential
        run: |
          python tools/validate_remaining71_sandbox_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/sandbox-differential.json
      - name: Commit validated sandbox parity repair
        run: |
          if [ -f tools/apply_remaining71_sandbox_parity_fix.py ]; then
            rm tools/apply_remaining71_sandbox_parity_fix.py
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Close sandbox Python Rust parity"
            git fetch origin agent/r31-provider-capture-native
            git rebase origin/agent/r31-provider-capture-native
            git push origin HEAD:agent/r31-provider-capture-native
          fi
      - name: Show exact head and clean tree
        run: |
          echo "head=$(git rev-parse HEAD)"
          git status --porcelain --untracked-files=all
