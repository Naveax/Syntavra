name: Remaining 71 Sandbox Differential

# Read-only exact-head proof for deterministic direct and platform sandbox semantics.
on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: remaining71-sandbox-differential
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact checkout head before certification
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_HEAD"
          echo "actual=$actual"
          test "$actual" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime and test dependencies
        run: python -m pip install -e . pytest
      - name: Run Python unified platform sandbox tests
        run: python -m pytest tests/runtime/test_syntavra_unified_platform.py -q
      - name: Build exact-head Rust CLI probe surface
        run: |
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
      - name: Run Rust sandbox wrapper tests
        run: cargo +1.82.0 test --locked -p syntavra-cli --bin syntavra platform_wrapper_tests -- --nocapture
      - name: Run sandbox differential
        run: |
          python tools/validate_remaining71_sandbox_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/sandbox-differential.json
      - name: Upload exact-head sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-differential
          path: /tmp/sandbox-differential.json
          if-no-files-found: warn
          retention-days: 30
      - name: Require exact-head clean tree
        run: |
          actual="$(git rev-parse HEAD)"
          echo "head=$actual"
          test "$actual" = "$EXPECTED_HEAD"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"
