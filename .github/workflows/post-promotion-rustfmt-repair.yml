name: Repair Final Promotion Rust Formatting

on:
  push:
    branches:
      - agent/r31-provider-capture-native

permissions:
  contents: write

concurrency:
  group: repair-final-promotion-rustfmt
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CERTIFIED_PRODUCT_HEAD: 262876b74d2e1db27efb88984a80b963e80c2708
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require certified product preimage
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$CERTIFIED_PRODUCT_HEAD" -- \
            crates/syntavra-cli/src/bin/syntavra-remaining71-ownership.rs \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/native_product.rs

      - name: Install pinned Rust 1.82
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt

      - name: Apply rustfmt and require bounded diff
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.82.0 fmt --all
          cargo +1.82.0 fmt --all -- --check
          git diff --check
          git diff --name-only | sort > /tmp/rustfmt-files.txt
          python - <<'PY'
          from pathlib import Path

          changed = set(Path('/tmp/rustfmt-files.txt').read_text(encoding='utf-8').splitlines())
          allowed = {
              'crates/syntavra-cli/src/bin/syntavra-remaining71-ownership.rs',
              'crates/syntavra-cli/src/bin/syntavra.rs',
              'crates/syntavra-cli/src/native_product.rs',
          }
          if not changed:
              raise SystemExit('rustfmt produced no repair diff')
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected rustfmt changes: {sorted(unexpected)}')
          print(f'rustfmt_changed={sorted(changed)}')
          PY

      - name: Commit bounded Rust formatting repair
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/r31-provider-capture-native | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git add \
            crates/syntavra-cli/src/bin/syntavra-remaining71-ownership.rs \
            crates/syntavra-cli/src/bin/syntavra.rs \
            crates/syntavra-cli/src/native_product.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format promoted native selector with Rust 1.82"
          git push origin HEAD:agent/r31-provider-capture-native
