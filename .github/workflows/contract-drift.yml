name: Dual-Engine Contract Drift

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "syntavra_runtime/**"
      - "contracts/**"
      - "crates/**"
      - "parity/**"
      - "tools/export_python_contract.py"
      - "tools/run_engine_parity.py"
      - "tools/verify_dual_engine_contract.py"
      - "tools/verify_engine_selector.py"
      - "tools/verify_primitive_parity.py"
      - ".github/workflows/contract-drift.yml"
  pull_request:
    branches: [main, "feature/**"]
    paths:
      - "syntavra_runtime/**"
      - "contracts/**"
      - "crates/**"
      - "parity/**"
      - "tools/export_python_contract.py"
      - "tools/run_engine_parity.py"
      - "tools/verify_dual_engine_contract.py"
      - "tools/verify_engine_selector.py"
      - "tools/verify_primitive_parity.py"
      - ".github/workflows/contract-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      - name: Install Python reference runtime
        run: python -m pip install -e .
      - name: Verify static dual-engine contracts
        run: python tools/verify_dual_engine_contract.py
      - name: Verify R4 engine selector contract
        run: python tools/verify_engine_selector.py
      - name: Verify R5 canonical primitive parity
        run: python tools/verify_primitive_parity.py
      - name: Export Python reference inventory
        run: python tools/export_python_contract.py --output python-reference.json
      - name: Run initial Python-Rust parity gate
        shell: bash
        run: |
          set -o pipefail
          python tools/run_engine_parity.py 2>&1 | tee parity.log
      - name: Upload parity diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: syntavra-parity-diagnostics-${{ github.sha }}
          path: parity.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Python reference inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syntavra-python-reference-${{ github.sha }}
          path: python-reference.json
          if-no-files-found: error
          retention-days: 14
