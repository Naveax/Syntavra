name: Assemble R24 Telemetry Metrics Parity

on:
  push:
    branches:
      - feature/full-parity-r24-telemetry-metrics-cli
  pull_request:
    branches:
      - main
    paths:
      - "tools/_assemble_r24_telemetry_metrics.py"
      - ".github/workflows/r24-telemetry-metrics-assemble.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-parity-r24-telemetry-metrics-cli
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest

      - name: Apply guarded assembly
        run: python tools/_assemble_r24_telemetry_metrics.py

      - name: Set up pinned Rust 1.82
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy

      - name: Format Rust
        run: cargo fmt --all

      - name: Run telemetry regressions
        run: python -m pytest -q tests/runtime/test_telemetry_metrics_read_only_r24.py

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Refresh manifest
        run: python -m tools.refresh_manifest

      - name: Guard changed paths
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(MANIFEST\.sha256|contracts/engine/descriptor\.txt|contracts/parity/python-rust-full-parity-v1\.json|crates/syntavra-cli/src/main\.rs|crates/syntavra-contracts/src/lib\.rs|syntavra_runtime/engine_cli\.py|syntavra_runtime/engine_entry\.py|syntavra_runtime/engine_selector\.py|syntavra_runtime/unified_cli\.py|tests/runtime/test_full_parity_catalog_v1\.py|tools/run_engine_parity\.py|tools/run_engine_parity_r24\.py)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected assembly paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit verified assembly
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Assembly already applied."
            exit 0
          fi
          git config user.name "Naveax"
          git config user.email "79841922+Naveax@users.noreply.github.com"
          git add \
            MANIFEST.sha256 \
            contracts/engine/descriptor.txt \
            contracts/parity/python-rust-full-parity-v1.json \
            crates/syntavra-cli/src/main.rs \
            crates/syntavra-contracts/src/lib.rs \
            syntavra_runtime/engine_cli.py \
            syntavra_runtime/engine_entry.py \
            syntavra_runtime/engine_selector.py \
            syntavra_runtime/unified_cli.py \
            tests/runtime/test_full_parity_catalog_v1.py \
            tools/run_engine_parity.py \
            tools/run_engine_parity_r24.py
          git commit -m "Wire R24 telemetry metrics parity"
          git push origin HEAD:feature/full-parity-r24-telemetry-metrics-cli
