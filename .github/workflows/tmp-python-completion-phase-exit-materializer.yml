name: Temporary Python-Only Completion Reconciler

on:
  push:
    branches:
      - agent/python-completion-phase-exit-v1
    paths:
      - .github/workflows/tmp-python-completion-phase-exit-materializer.yml

permissions:
  contents: write

concurrency:
  group: tmp-python-only-completion-reconciler-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
      TARGET_BRANCH: agent/python-completion-phase-exit-v1
    steps:
      - name: Checkout exact Python branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/python-completion-phase-exit-v1
          fetch-depth: 0

      - name: Require exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f tools/tmp_python_only_retirement_repair.py
          test -f tools/tmp_python_only_retirement_continuity_fix.py
          test -f tools/tmp_public_surface_doc_sync.py
          test -f .github/workflows/tmp-python-completion-phase-exit-materializer.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install -e .

      - name: Materialize Python-active Rust-retired authority
        shell: bash
        run: |
          set -euo pipefail
          python tools/tmp_python_only_retirement_repair.py
          python tools/tmp_python_only_retirement_continuity_fix.py
          python tools/tmp_public_surface_doc_sync.py

      - name: Remove temporary surfaces and seal permanent manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/tmp_python_only_retirement_repair.py
          git rm tools/tmp_python_only_retirement_continuity_fix.py
          git rm tools/tmp_public_surface_doc_sync.py
          git rm .github/workflows/tmp-python-completion-phase-exit-materializer.yml
          rm -rf syntavra_runtime.egg-info
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git diff --check
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()
          forbidden = [path for path in changed if path.startswith('crates/') or path.startswith('native/') or path.startswith('contracts/engine/') or path.startswith('.github/workflows/remaining71-') or path.startswith('tools/validate_remaining71_')]
          assert not forbidden, forbidden
          assert 'contracts/engine/dual-engine-public-surface-v2.json' not in changed
          PY

      - name: Validate dirty candidate surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_python_completion_certificate_v1 -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_python_authority -v
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python tools/certify_python_capability_completeness.py --out /tmp/completeness-precommit.json
          python tools/certify_python_authority.py --out /tmp/python-authority-precommit.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-freeze-precommit.json
          python tools/validate.py
          python tools/validate_release.py --smoke --output /tmp/release-smoke-precommit.json
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('contracts/python/capability-completeness-registry-v1.json').read_text(encoding='utf-8'))
          surface = json.loads(Path('contracts/engine/dual-engine-public-surface-v2.json').read_text(encoding='utf-8'))
          assert registry['python_complete']['ready'] is True
          assert registry['python_complete']['rust_resume_allowed'] is False
          assert registry['python_complete']['rust_retired'] is True
          assert registry['policy']['python_complete_does_not_auto_resume_rust'] is True
          assert registry['policy']['rust_retirement_is_independent_of_python_complete'] is True
          assert registry['policy']['python_hardening_continues_while_rust_retired'] is True
          assert registry['policy']['rust_transition_capabilities_deferred_while_retired'] is True
          assert surface['claim'] == 'FULL_DUAL_ENGINE_PARITY_PROVEN'
          assert surface['python_surface']['public_command_count'] == 245
          assert surface['rust_surface']['native_public_command_count'] == 245
          assert surface['rust_surface']['missing_native_public_command_count'] == 0
          readme = Path('README.md').read_text(encoding='utf-8')
          assert '245 executable public command paths' in readme
          assert '257 public command paths' not in readme
          assert readme.count('FULL_DUAL_ENGINE_PARITY_PROVEN') >= 2
          assert 'DUAL_ENGINE_PARITY_INCOMPLETE' not in readme
          checklist = Path('docs/SYNTAVRA_PYTHON_FIRST_CONTINUATION_CHECKLIST.md').read_text(encoding='utf-8')
          assert 'FEATURE/PARITY RESUME ALLOWED' not in checklist
          assert 'Lift Rust feature-freeze guard for feature/parity development' not in checklist
          assert 'Rust feature/parity development may resume.' not in checklist
          assert 'RETIRED/FROZEN — rust_resume_allowed=false' in checklist
          assert 'Capabilities 271–275 are Rust-transition work and remain deferred' in checklist
          live = Path('docs/SYNTAVRA_PYTHON_FIRST_LIVE_CHECKPOINT.md').read_text(encoding='utf-8')
          assert 'PYTHON_COMPLETE = true' in live
          assert 'rust_resume_allowed = false' in live
          assert 'rust_retired = true' in live
          assert '240–270' in live and '271–275' in live and '276–280' in live
          PY

      - name: Commit permanent helper-free candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "python: keep Rust retired after completion"

      - name: Validate exact final local commit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/tmp_python_only_retirement_repair.py
          test ! -e tools/tmp_python_only_retirement_continuity_fix.py
          test ! -e tools/tmp_public_surface_doc_sync.py
          test ! -e .github/workflows/tmp-python-completion-phase-exit-materializer.yml
          python tools/refresh_manifest.py --check
          python -m unittest tests.runtime.test_python_completion_certificate_v1 -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_python_authority -v
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python tools/certify_python_capability_completeness.py --out /tmp/completeness.json
          python tools/certify_python_authority.py --out /tmp/python-authority.json
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-freeze.json
          python tools/certify_python_completion_certificate_v1.py --repo . --out /tmp/completion.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          completeness = json.loads(Path('/tmp/completeness.json').read_text(encoding='utf-8'))
          authority = json.loads(Path('/tmp/python-authority.json').read_text(encoding='utf-8'))
          rust = json.loads(Path('/tmp/rust-freeze.json').read_text(encoding='utf-8'))
          completion = json.loads(Path('/tmp/completion.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('contracts/python/capability-completeness-registry-v1.json').read_text(encoding='utf-8'))
          surface = json.loads(Path('contracts/engine/dual-engine-public-surface-v2.json').read_text(encoding='utf-8'))
          assert completeness['ok'] is True and completeness['exact_head'] == head
          assert completeness['python_complete_ready'] is True and completeness['rust_resume_allowed'] is False
          assert completeness['rust']['feature_development_frozen'] is True
          assert authority['ok'] is True and authority['exact_head'] == head
          assert authority['python_complete_ready'] is True and authority['rust']['resume_allowed'] is False
          assert authority['rust']['feature_development_frozen'] is True
          assert rust['ok'] is True and rust['exact_head'] == head
          assert rust['python_complete_ready'] is True and rust['rust_resume_allowed'] is False
          assert rust['rust']['feature_development_frozen'] is True and rust['rust']['production_promotion_frozen'] is True
          assert rust['rust']['production_promoted'] == 174 and rust['rust']['remaining_parity_promotion'] == 71
          assert completion['ok'] is True and completion['exact_head'] == head
          assert completion['implementation_ready'] is True and completion['python_complete_ready'] is True
          assert completion['rust_resume_allowed'] is False and completion['rust']['feature_development_frozen'] is True
          assert registry['python_complete']['ready'] is True
          assert registry['python_complete']['rust_resume_allowed'] is False
          assert registry['python_complete']['rust_retired'] is True
          assert registry['policy']['python_complete_does_not_auto_resume_rust'] is True
          assert registry['policy']['rust_retirement_is_independent_of_python_complete'] is True
          assert registry['policy']['python_hardening_continues_while_rust_retired'] is True
          assert registry['policy']['rust_transition_capabilities_deferred_while_retired'] is True
          assert surface['claim'] == 'FULL_DUAL_ENGINE_PARITY_PROVEN'
          assert surface['python_surface']['public_command_count'] == 245
          assert surface['rust_surface']['native_public_command_count'] == 245
          assert surface['rust_surface']['missing_native_public_command_count'] == 0
          readme = Path('README.md').read_text(encoding='utf-8')
          assert '245 executable public command paths' in readme
          assert '257 public command paths' not in readme
          assert readme.count('FULL_DUAL_ENGINE_PARITY_PROVEN') >= 2
          assert 'DUAL_ENGINE_PARITY_INCOMPLETE' not in readme
          checklist = Path('docs/SYNTAVRA_PYTHON_FIRST_CONTINUATION_CHECKLIST.md').read_text(encoding='utf-8')
          assert 'FEATURE/PARITY RESUME ALLOWED' not in checklist
          assert 'Lift Rust feature-freeze guard for feature/parity development' not in checklist
          assert 'Rust feature/parity development may resume.' not in checklist
          assert 'RETIRED/FROZEN — rust_resume_allowed=false' in checklist
          PY
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push only if target did not move
        shell: bash
        run: |
          set -euo pipefail
          final_head="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "$final_head:refs/heads/$TARGET_BRANCH"
