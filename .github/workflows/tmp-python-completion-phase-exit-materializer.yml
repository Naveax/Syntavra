name: Temporary Python Completion Phase Exit Materializer

on:
  push:
    branches:
      - agent/python-completion-phase-exit-v1
    paths:
      - .github/workflows/tmp-python-completion-phase-exit-materializer.yml

permissions:
  contents: write

concurrency:
  group: tmp-python-completion-phase-exit-materializer-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact phase-exit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/python-completion-phase-exit-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install -e .

      - name: Materialize canonical Python phase exit
        run: python tools/tmp_python_completion_phase_exit_materializer.py

      - name: Pin registry-derived Python contract freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.certify_python_completion_certificate_v1 import derive_contract_freeze

          registry = json.loads(Path('contracts/python/capability-completeness-registry-v1.json').read_text(encoding='utf-8'))
          contract_path = Path('contracts/python/python-completion-certificate-v1.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          freeze = derive_contract_freeze(Path('.').resolve(), registry)
          assert freeze['contract_count'] > 0, freeze
          contract['contract_freeze']['expected_contract_count'] = freeze['contract_count']
          contract['contract_freeze']['expected_sha256'] = freeze['sha256']
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'contract_count': freeze['contract_count'], 'sha256': freeze['sha256']}, indent=2))
          PY

      - name: Refresh permanent manifest without temporary files
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/tmp-python-completion-phase-exit-materializer.yml
          script=tools/tmp_python_completion_phase_exit_materializer.py
          cp "$helper" /tmp/tmp-python-completion-phase-exit-materializer.yml
          rm "$helper"
          rm "$script"
          python tools/refresh_manifest.py
          mv /tmp/tmp-python-completion-phase-exit-materializer.yml "$helper"
          rm -rf syntavra_runtime.egg-info
          git diff --check

      - name: Commit only permanent non-workflow phase exit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -A MANIFEST.sha256 contracts/python tools tests/runtime docs
          test -z "$(git diff --name-only --cached | grep '^\.github/workflows/' || true)"
          git diff --cached --check
          git commit -m "phase-exit: certify Python COMPLETE and reopen Rust feature work"
          git push origin HEAD:agent/python-completion-phase-exit-v1

      - name: Hide temporary helper for exact validation
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/tmp-python-completion-phase-exit-materializer.yml
          git update-index --skip-worktree "$helper"
          rm "$helper"
          test -z "$(git status --porcelain --untracked-files=all)"
          python tools/refresh_manifest.py --check

      - name: Validate final phase-exit boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_python_completion_certificate_v1 -v
          python -m unittest tests.runtime.test_python_capability_completeness -v
          python -m unittest tests.runtime.test_python_authority -v
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python -m unittest tests.runtime.test_epistemic_safety_v1 -v
          python -m unittest tests.runtime.test_cache_provider_budget_v1 -v
          python -m unittest tests.runtime.test_output_intelligence_v1 -v
          python -m unittest tests.runtime.test_host_adapter_conformance_v1 -v
          python -m unittest tests.runtime.test_observability_attribution_v1 -v
          python -m unittest tests.runtime.test_signalbench_python_product_v1 -v
          python tools/certify_python_completion_certificate_v1.py --repo . --out /tmp/python-completion-phase-exit.json
          python tools/certify_rust_feature_freeze_guard.py --repo . --out /tmp/rust-phase-boundary.json
          python tools/validate.py
          python tools/validate_release.py --smoke --output /tmp/python-completion-phase-exit-release.json
          python - <<'PY'
          import json
          from pathlib import Path

          completion = json.loads(Path('/tmp/python-completion-phase-exit.json').read_text(encoding='utf-8'))
          assert completion['ok'] is True, completion
          assert completion['implementation_ready'] is True, completion
          assert completion['lifecycle_state'] == 'certified', completion
          assert completion['python_complete_ready'] is True, completion
          assert completion['rust_resume_allowed'] is True, completion
          assert completion['platform_runtime_ready'] is False, completion
          assert completion['phase_exit_ready'] is False, completion
          assert completion['certificate_status'] == 'NOT_YET_ADMITTED', completion

          boundary = json.loads(Path('/tmp/rust-phase-boundary.json').read_text(encoding='utf-8'))
          assert boundary['ok'] is True, boundary
          assert boundary['python_complete_ready'] is True, boundary
          assert boundary['rust_resume_allowed'] is True, boundary
          assert boundary['rust']['feature_development_frozen'] is False, boundary
          assert boundary['rust']['production_promotion_frozen'] is True, boundary
          assert boundary['rust']['production_promoted'] == 174, boundary
          assert boundary['rust']['remaining_parity_promotion'] == 71, boundary
          PY
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
