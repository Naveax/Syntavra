name: Finalize Post-R38 Manifest

on:
  push:
    branches:
      - agent/post-r38-release-provenance

permissions:
  contents: write

jobs:
  finalize-manifest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/post-r38-release-provenance
          fetch-depth: 0

      - name: Remove finalizer and persist exact manifest
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          workflow=.github/workflows/persist-post-r38-manifest.yml

          rm -f "$workflow"
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check

          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test "$(printf '%s\n' "$status" | wc -l)" -eq 2
          printf '%s\n' "$status" | grep -Fx ' D .github/workflows/persist-post-r38-manifest.yml'
          printf '%s\n' "$status" | grep -Fx ' M MANIFEST.sha256'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 "$workflow"
          git commit -m "Finalize post-R38 release manifest"
          test "$(git rev-parse HEAD^)" = "$before"
          git push origin HEAD:agent/post-r38-release-provenance
