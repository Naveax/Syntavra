name: Provider Native Context Editing

on:
  pull_request:
    paths:
      - 'syntavra_runtime/model_gateway.py'
      - 'syntavra_runtime/provider_call_observation.py'
      - 'tests/runtime/test_provider_native_context_editing.py'
      - 'contracts/python/provider-native-context-editing-v1.json'
      - 'docs/TE_P0_12_PROVIDER_NATIVE_CONTEXT_EDITING.md'
      - '.github/workflows/provider-native-context-editing.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'syntavra_runtime/model_gateway.py'
      - 'syntavra_runtime/provider_call_observation.py'
      - 'tests/runtime/test_provider_native_context_editing.py'
      - 'contracts/python/provider-native-context-editing-v1.json'
      - 'docs/TE_P0_12_PROVIDER_NATIVE_CONTEXT_EDITING.md'
      - '.github/workflows/provider-native-context-editing.yml'

permissions:
  contents: read

concurrency:
  group: provider-native-context-editing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: '1'
  SYN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  provider-native-context-editing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Compile context-editing surfaces
        run: |
          set -euo pipefail
          python -m compileall -q \
            syntavra_runtime/model_gateway.py \
            syntavra_runtime/provider_call_observation.py \
            tests/runtime/test_provider_native_context_editing.py

      - name: Validate context-editing contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path('contracts/python/provider-native-context-editing-v1.json').read_text(encoding='utf-8')
          )
          assert value['schema_version'] == 1
          assert value['claim'] == 'TE_P0_12_PROVIDER_NATIVE_CONTEXT_EDITING_ADAPTER'
          assert value['strict'] is True
          assert value['capability_policy']['capability_detect_before_native_use'] is True
          assert value['capability_policy']['portable_fallback_required'] is True
          assert value['promotion_policy']['native_editing_requires_end_to_end_benchmark_admission'] is True
          assert value['receipt_policy']['cleared_input_tokens_stored_separately'] is True
          assert value['receipt_policy']['cleared_input_tokens_excluded_from_provider_billed_total'] is True
          assert value['claim_boundary']['provider_billed_savings_proven'] is False
          PY

      - name: Prove capability gate payload and receipt reconciliation
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_provider_native_context_editing -v
          python -m unittest tests.runtime.test_model_gateway_token_envelope -v

      - name: Record exact-head context-editing receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['SYN_EXPECTED_HEAD']
          receipt = {
              'schema_version': 1,
              'claim': 'TE_P0_12_PROVIDER_NATIVE_CONTEXT_EDITING_ADAPTER',
              'exact_head': actual,
              'expected_head': expected,
              'head_match': actual == expected,
              'anthropic_native_selective_editing': True,
              'benchmark_gate_required': True,
              'openai_stateful_compaction_auto_admitted': False,
              'portable_fallback_preserved': True,
              'cleared_input_tokens_receipted_separately': True,
              'provider_billed_savings_proven': False,
          }
          Path('/tmp/provider-native-context-editing.json').write_text(
              json.dumps(receipt, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          assert receipt['head_match'], receipt
          PY

      - name: Enforce clean exact head
        if: always()
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test "$(git rev-parse HEAD)" = "$SYN_EXPECTED_HEAD"
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload context-editing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-native-context-editing-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/provider-native-context-editing.json
          if-no-files-found: error
