name: Remaining 71 Competitive Edge Differential

on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  edge-differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
      SYNTAVRA_BULK_PARITY_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prepare exact Rust 1.82 toolchain
        run: |
          rustup toolchain uninstall 1.82.0 || true
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt

      - name: Validate source formatting and compile exact-head Rust CLI
        run: |
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 check --locked -p syntavra-cli --bins
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra

      - name: Run deterministic edge differential
        run: |
          python - <<'PY' > /tmp/competitive-edge.log 2>&1
          import json, os, subprocess, sys, tempfile
          from pathlib import Path

          repo = Path.cwd()
          rust = (repo / "target/debug/syntavra").resolve()
          contract = json.loads((repo / "contracts/engine/remaining71-competitive-deterministic-edge-v1.json").read_text(encoding="utf-8"))

          def run(engine, args, project, state):
              project.mkdir(parents=True, exist_ok=True); state.mkdir(parents=True, exist_ok=True)
              common = ["--project", str(project), "--state-root", str(state), *args]
              cmd = ([sys.executable, "-m", "syntavra_runtime.engine_entry", "--engine", "python", *common]
                     if engine == "python" else [str(rust), "--engine", "rust", *common])
              env = os.environ.copy(); env.update({"PYTHONPATH": str(repo), "PYTHONIOENCODING": "utf-8", "PYTHONUTF8": "1", "SYNTAVRA_BULK_PARITY_PROBE": "1"})
              done = subprocess.run(cmd, cwd=repo, env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                    text=True, encoding="utf-8", errors="replace", timeout=90, check=False)
              try: value = json.loads(done.stdout)
              except json.JSONDecodeError: value = None
              return {"exit": done.returncode, "value": value, "stdout": done.stdout, "stderr": done.stderr}

          def diff(a, b, path=""):
              if type(a) is not type(b): return [{"path": path or "<root>", "python": a, "rust": b}]
              if isinstance(a, dict):
                  out=[]
                  for key in sorted(set(a)|set(b)):
                      child=f"{path}.{key}" if path else key
                      if key not in a: out.append({"path":child,"python":None,"rust":b[key]})
                      elif key not in b: out.append({"path":child,"python":a[key],"rust":None})
                      else: out += diff(a[key], b[key], child)
                  return out
              if isinstance(a, list):
                  out=[]
                  if len(a)!=len(b): out.append({"path":f"{path}.length","python":len(a),"rust":len(b)})
                  for i,(x,y) in enumerate(zip(a,b)): out += diff(x,y,f"{path}[{i}]")
                  return out
              return [] if a == b else [{"path":path or "<root>","python":a,"rust":b}]

          def semantic(result):
              return {"exit": result["exit"], "value": result["value"]}

          def transcript(engine, raw, root, label):
              project=root/"project"; state=root/"state"; project.mkdir(parents=True, exist_ok=True); state.mkdir(parents=True, exist_ok=True)
              source=project/f"{label}.json"; source.write_text(raw, encoding="utf-8")
              return run(engine,["run","transcript-mine",str(source)],project,state)

          mismatches=[]; receipts={"python":{},"rust":{}}
          with tempfile.TemporaryDirectory(prefix="syntavra-edge-") as tmp:
              root=Path(tmp)
              for case in contract["rewrite_cases"]:
                  if isinstance(case["input"], str):
                      raw=json.dumps([{"command":case["input"],"output":"x"}],ensure_ascii=False,separators=(",",":"))
                      py=transcript("python",raw,root/f"py-{case['id']}",case["id"]); rs=transcript("rust",raw,root/f"rs-{case['id']}",case["id"])
                  else:
                      p=root/f"py-{case['id']}"; r=root/f"rs-{case['id']}"
                      py=run("python",["run","rewrite",*case["input"]],p/"project",p/"state")
                      rs=run("rust",["run","rewrite",*case["input"]],r/"project",r/"state")
                  receipts["python"][case["id"]]=py; receipts["rust"][case["id"]]=rs; mismatches += diff(semantic(py),semantic(rs),f"rewrite.{case['id']}")
              for case in contract["transcript_cases"]:
                  raw=case.get("json") or json.dumps(case["payload"],ensure_ascii=False,separators=(",",":"))
                  py=transcript("python",raw,root/f"py-{case['id']}",case["id"]); rs=transcript("rust",raw,root/f"rs-{case['id']}",case["id"])
                  receipts["python"][case["id"]]=py; receipts["rust"][case["id"]]=rs; mismatches += diff(semantic(py),semantic(rs),f"transcript.{case['id']}")
              for case in contract["compactor_cases"]:
                  output=case.get("json") if "json" in case else "\n".join(case["lines"])
                  raw=json.dumps([{"command":case["command"],"output":output}],ensure_ascii=False,separators=(",",":"))
                  py=transcript("python",raw,root/f"py-{case['id']}",case["id"]); rs=transcript("rust",raw,root/f"rs-{case['id']}",case["id"])
                  receipts["python"][case["id"]]=py; receipts["rust"][case["id"]]=rs; mismatches += diff(semantic(py),semantic(rs),f"compactor.{case['id']}")

          report={"ok":not mismatches,"contract":contract["contract"],"authority":contract["authority"],"mismatch_count":len(mismatches),
                  "mismatches":mismatches,"receipts":receipts,
                  "claim_boundary":"edge parity evidence only; native route count remains frozen until deterministic and stateful competitive gates are green"}
          Path("/tmp/competitive-edge.json").write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True),encoding="utf-8")
          print(json.dumps({"ok":report["ok"],"mismatch_count":len(mismatches),"contract":report["contract"]},sort_keys=True))
          for i,row in enumerate(mismatches[:120]): print(f"EDGE_MISMATCH[{i}] {json.dumps(row,ensure_ascii=False,sort_keys=True)}")
          raise SystemExit(0 if report["ok"] else 1)
          PY

      - name: Upload edge differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitive-edge-differential
          path: |
            /tmp/competitive-edge.json
            /tmp/competitive-edge.log
          if-no-files-found: warn

      - name: Enforce clean exact-head tree
        if: always()
        run: |
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"
