name: Capability Milestone Order Seal

on:
  push:
    branches:
      - agent/certify-context-reset-handoff-v1

permissions:
  contents: write

concurrency:
  group: capability-milestone-fallback-seal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Advance canonical milestone order
        shell: bash
        env:
          EXPECTED_PARENT: 15c4138127618caad0afdb82551bef71d57a0eea
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('contracts/python/capability-completeness-registry-v1.json')
          registry = json.loads(path.read_text(encoding='utf-8'))
          context = next(item for item in registry['capabilities'] if item['id'] == 'context_reset_handoff_v1')
          memory = next(item for item in registry['capabilities'] if item['id'] == 'memory_retrieval_v1')
          assert context['state'] == 'certified', context
          assert memory['state'] != 'certified', memory
          order = registry['milestone_order']
          assert order[-1] == 'context_reset_handoff_v1', order
          assert 'memory_retrieval_v1' not in order, order
          order.append('memory_retrieval_v1')
          assert order[-1] == 'memory_retrieval_v1'
          assert registry['python_complete']['ready'] is False
          assert registry['python_complete']['rust_resume_allowed'] is False
          path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Seal manifest and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/capability-milestone-fallback-seal.yml
          python3 tools/refresh_manifest.py
          python3 tools/refresh_manifest.py --check
          git diff --check
          grep -F '"memory_retrieval_v1"' contracts/python/capability-completeness-registry-v1.json

      - name: Commit final authority seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/python/capability-completeness-registry-v1.json MANIFEST.sha256
          git commit -m 'Advance canonical milestone order to Memory Retrieval'
          git push origin HEAD:agent/certify-context-reset-handoff-v1
