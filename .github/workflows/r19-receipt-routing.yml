name: R19 Receipt Routing Parity

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "syntavra_runtime/engine_cli.py"
      - "syntavra_runtime/read_only_router_r19.py"
      - "syntavra_runtime/state_receipt_contract.py"
      - "syntavra_runtime/state_snapshot_contract.py"
      - "contracts/engine/read-only-routing-v8.json"
      - "tests/runtime/test_read_only_router_r19.py"
      - "tools/verify_r19_receipt_inspect_routing.py"
      - "tools/run_engine_parity.py"
      - ".github/workflows/r19-receipt-routing.yml"
  pull_request:
    branches: [main]
    paths:
      - "syntavra_runtime/engine_cli.py"
      - "syntavra_runtime/read_only_router_r19.py"
      - "syntavra_runtime/state_receipt_contract.py"
      - "syntavra_runtime/state_snapshot_contract.py"
      - "contracts/engine/read-only-routing-v8.json"
      - "tests/runtime/test_read_only_router_r19.py"
      - "tools/verify_r19_receipt_inspect_routing.py"
      - "tools/run_engine_parity.py"
      - ".github/workflows/r19-receipt-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-routing:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - name: Install Python reference runtime
        run: python -m pip install -e .
      - name: Verify pinned Rust workspace quality
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify R19 receipt.inspect routing parity
        id: parity
        shell: bash
        run: |
          set -o pipefail
          python tools/verify_r19_receipt_inspect_routing.py 2>&1 | tee r19-receipt-routing.log
      - name: Upload R19 receipt diagnostics
        if: failure() && steps.parity.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: syntavra-r19-receipt-routing-diagnostics-${{ github.sha }}
          path: r19-receipt-routing.log
          if-no-files-found: error
          retention-days: 7
