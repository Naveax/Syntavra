name: Diagnose R9 Broker Snapshot Parity

on:
  pull_request:
    branches: ["feature/dual-engine-r8-state-inspection"]
    paths:
      - ".github/workflows/r9-diagnostics.yml"
      - "tools/r9_wire_source.py"
      - "tools/r9_wire_source_final.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dual-engine-r9-broker-snapshot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - name: Wire the R9 source tree
        id: wiring
        shell: bash
        run: |
          set +e
          python tools/r9_wire_source_final.py > /tmp/r9-wire-output.txt 2>&1
          status=$?
          cat /tmp/r9-wire-output.txt
          exit "$status"
      - name: Diagnose R9 validation
        id: validation
        if: success()
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            cargo check --workspace
            cargo fmt --all
            cargo fmt --all -- --check
            cargo test --workspace --all-targets --locked
            cargo clippy --workspace --all-targets --locked -- -D warnings
            python -m pip install -e . pytest
            python -m pytest -q tests/runtime/test_broker_snapshot_contract_r9.py
            python tools/verify_dual_engine_contract.py
            python tools/verify_broker_snapshot_parity.py
            python tools/run_engine_parity.py
          ) > /tmp/r9-diagnostics.txt 2>&1
          status=$?
          cat /tmp/r9-diagnostics.txt
          exit "$status"
      - name: Package validated R9 candidate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/r9-validated-source.tar.gz \
            Cargo.lock \
            contracts/state/broker-snapshot-v1.json \
            crates/syntavra-cli/src/broker_snapshot_contract.rs \
            crates/syntavra-cli/src/main.rs \
            syntavra_runtime/broker_snapshot_contract.py \
            tests/runtime/test_broker_snapshot_contract_r9.py \
            tools/run_engine_parity.py
          sha256sum /tmp/r9-validated-source.tar.gz > /tmp/r9-validated-source.sha256
      - name: Upload R9 diagnostics and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syntavra-r9-diagnostics-${{ github.sha }}
          path: |
            /tmp/r9-wire-output.txt
            /tmp/r9-diagnostics.txt
            /tmp/r9-validated-source.tar.gz
            /tmp/r9-validated-source.sha256
            Cargo.lock
          if-no-files-found: warn
          retention-days: 7
