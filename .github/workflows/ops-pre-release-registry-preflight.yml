name: Ops Pre-Release Registry Preflight

on:
  push:
    branches:
      - ops/pre-release-registry-preflight-20260907
    paths:
      - '.github/workflows/ops-pre-release-registry-preflight.yml'

permissions:
  contents: read

concurrency:
  group: ops-pre-release-registry-preflight-20260907
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Probe public registries read-only
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_pre_release_registry_availability.py --output /tmp/pre-release-registry-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/pre-release-registry-preflight.json').read_text(encoding='utf-8'))
          assert value['publication_performed'] is False
          assert value['network_boundary'].startswith('anonymous read-only public registry queries')
          print('REGISTRY_PREFLIGHT_SUMMARY=' + json.dumps({
              'production_available': value['production_available'],
              'legacy_available': value['legacy_available'],
              'all_observed': value['all_observed'],
              'claim': value['claim'],
              'targets': value['targets'],
          }, sort_keys=True))
          PY
      - name: Upload registry preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ops-pre-release-registry-preflight-${{ github.sha }}
          path: /tmp/pre-release-registry-preflight.json
          if-no-files-found: error
          retention-days: 30
