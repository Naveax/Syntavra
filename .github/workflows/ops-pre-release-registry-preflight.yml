name: Ops Pre-Release Publisher Prerequisites

on:
  push:
    branches:
      - ops/pre-release-registry-preflight-20260907
    paths:
      - '.github/workflows/ops-pre-release-registry-preflight.yml'

permissions:
  contents: read
  deployments: read

concurrency:
  group: ops-pre-release-publisher-prerequisites-20260907
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SYNTAVRA_PUBLISH_ARMED_VALUE: ${{ secrets.SYNTAVRA_PUBLISH_ARMED }}
      NPM_TOKEN_VALUE: ${{ secrets.NPM_TOKEN }}
      CRATES_IO_TOKEN_VALUE: ${{ secrets.CRATES_IO_TOKEN }}
      PYTHONUTF8: '1'
    steps:
      - name: Resolve exact canonical main
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          target_head="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$target_head" =~ ^[0-9a-f]{40}$ ]]
          echo "target_head=$target_head" >> "$GITHUB_OUTPUT"

      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.authority.outputs.target_head }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Observe pre-release environment protection
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/environments/pre-release" > /tmp/pre-release-environment.json 2>/tmp/pre-release-environment.err; then
            :
          else
            python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/pre-release-environment.json').write_text(
              json.dumps({'missing': True}, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          fi

      - name: Build zero-write publisher prerequisite report
        shell: bash
        run: |
          set -euo pipefail
          arming_present=false
          arming_matches=false
          npm_present=false
          crates_present=false

          if test -n "${SYNTAVRA_PUBLISH_ARMED_VALUE:-}"; then
            arming_present=true
            if test "$SYNTAVRA_PUBLISH_ARMED_VALUE" = 'PUBLISH_0_0_1_PRE_RELEASE'; then
              arming_matches=true
            fi
          fi
          if test -n "${NPM_TOKEN_VALUE:-}"; then npm_present=true; fi
          if test -n "${CRATES_IO_TOKEN_VALUE:-}"; then crates_present=true; fi

          python tools/check_pre_release_publisher_prerequisites.py \
            --exact-head "${{ steps.authority.outputs.target_head }}" \
            --environment-json /tmp/pre-release-environment.json \
            --arming-secret-present "$arming_present" \
            --arming-secret-matches "$arming_matches" \
            --npm-token-present "$npm_present" \
            --crates-token-present "$crates_present" \
            --output /tmp/pre-release-publisher-prerequisites.json

          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/pre-release-publisher-prerequisites.json').read_text(encoding='utf-8'))
          assert value['publication_performed'] is False
          assert value['secret_values_exposed'] is False
          print('PUBLISHER_PREREQUISITES_SUMMARY=' + json.dumps({
              'exact_head': value['exact_head'],
              'claim': value['claim'],
              'github_environment': value['github_environment'],
              'credentials': value['credentials'],
              'github_checkable_ready': value['github_checkable_ready'],
              'external_bindings_verified': value['external_bindings_verified'],
              'publication_ready': value['publication_ready'],
          }, sort_keys=True))
          PY

      - name: Upload publisher prerequisite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ops-pre-release-publisher-prerequisites-${{ steps.authority.outputs.target_head }}
          path: /tmp/pre-release-publisher-prerequisites.json
          if-no-files-found: error
          retention-days: 30
