name: Remaining 71 Provider Proxy Differential

on:
  push:
    branches:
      - agent/r31-provider-capture-native
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: remaining71-provider-proxy-differential
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-provider-capture-native
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pending provider proxy parity repair
        run: |
          if [ -f tools/apply_remaining71_provider_proxy_parity_fix.py ]; then
            python tools/apply_remaining71_provider_proxy_parity_fix.py
          fi
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Run Python proxy regression suite
        run: python -m unittest discover -s tests/runtime -p 'test_provider_proxy_v4.py' -v
      - name: Build Rust selector
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.82.0 fmt --all
          cargo +1.82.0 build --locked -p syntavra-cli --bin syntavra
      - name: Run Rust provider proxy unit tests
        run: cargo +1.82.0 test --locked -p syntavra-cli --bin syntavra native_remaining71_provider_proxy -- --nocapture
      - name: Run provider proxy differential
        run: |
          python tools/validate_remaining71_provider_proxy_differential.py \
            --rust-bin target/debug/syntavra \
            --output /tmp/provider-proxy-differential.json
      - name: Commit validated parity repair
        if: github.event_name == 'push'
        run: |
          if [ -f tools/apply_remaining71_provider_proxy_parity_fix.py ]; then
            rm tools/apply_remaining71_provider_proxy_parity_fix.py
            rm -f .github/workflows/remaining71-provider-proxy-parity-selfpatch.yml
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Close provider proxy Python Rust parity"
            git fetch origin agent/r31-provider-capture-native
            git rebase origin/agent/r31-provider-capture-native
            git push origin HEAD:agent/r31-provider-capture-native
          fi
      - name: Show exact head and clean tree
        run: |
          echo "head=$(git rev-parse HEAD)"
          git status --porcelain --untracked-files=all
