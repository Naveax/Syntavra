name: Temporary SignalBench Python Product v1 Executor v11

on:
  push:
    branches:
      - automation/signalbench-v11-executor

permissions:
  contents: write

concurrency:
  group: signalbench-python-product-v11-${{ github.sha }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: agent/signalbench-python-product-v1
      TARGET_HEAD: 1b0c5b110b29164439066dc9a711c2d839369c60
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout exact executor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve reviewed helper sources and guard target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          cp .github/workflows/tmp-signalbench-python-product-v1-impl.yml /tmp/signalbench-original-helper.yml
          cp tools/tmp_prepare_signalbench_python_product_v1_fix.py /tmp/signalbench-fix.py
          cp tools/tmp_signalbench_v9_apply.py /tmp/signalbench-v9-apply.py
          git fetch origin "$TARGET_BRANCH"
          actual="$(git rev-parse "origin/$TARGET_BRANCH")"
          printf 'target=%s actual=%s executor=%s\n' "$TARGET_HEAD" "$actual" "${{ github.sha }}"
          test "$actual" = "$TARGET_HEAD"

      - name: Checkout exact canonical target base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_HEAD"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply reviewed SignalBench product hardening
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/signalbench-v9-apply.py

      - name: Canonicalize shipped task template families
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('benchmarks/signalbench/tasks.example.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          mapping = {
              'bug-fix': 'bug-diagnosis',
              'test-failure-repair': 'bug-diagnosis',
              'cross-file-refactor': 'multi-file-implementation',
              'dependency-impact': 'call-graph-impact',
              'configuration-repair': 'bug-diagnosis',
              'cli-contract': 'known-edit',
              'documentation-code-consistency': 'known-edit',
              'long-session-continuation': 'long-session-continuity',
              'large-tool-output-diagnosis': 'output-heavy-verification',
          }
          changed = 0
          for task in value.get('tasks', []):
              family = task.get('family')
              if family in mapping:
                  task['family'] = mapping[family]
                  changed += 1
          if changed != len(mapping):
              raise SystemExit(f'unexpected task-template family rewrite count: {changed}')
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/runtime/test_signalbench_python_product_v1.py')
          text = test_path.read_text(encoding='utf-8')
          old_import = 'from syntavra_runtime.signalbench import ArmSpec, RunResult, SignalBenchProtocol, SignalBenchRunner, TaskSpec\n'
          new_import = 'from syntavra_runtime.signalbench import ArmSpec, RunResult, SignalBenchProtocol, SignalBenchRunner, TASK_FAMILIES, TaskSpec\n'
          if text.count(old_import) != 1:
              raise SystemExit('SignalBench generated test import anchor drift')
          text = text.replace(old_import, new_import, 1)
          anchor = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          method = '''\n    def test_shipped_task_templates_use_canonical_families(self) -> None:\n        tasks = SignalBenchRunner.load_tasks(ROOT / "benchmarks/signalbench/tasks.example.json")\n        self.assertTrue(tasks)\n        unknown = sorted({task.family for task in tasks if task.family not in TASK_FAMILIES})\n        self.assertEqual(unknown, [])\n\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          if text.count(anchor) != 1:
              raise SystemExit('SignalBench generated test tail anchor drift')
          test_path.write_text(text.replace(anchor, method, 1), encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Run focused regressions and negative controls
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_signalbench_python_product_v1 -v
          python -m unittest tests.runtime.test_runtime_v03_unified.RuntimeV03UnifiedTests.test_signalbench_protocol_and_fail_closed_compare -v
          python -m unittest tests.runtime.test_adaptive_context_v04 -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python - <<'PY'
          from tests.runtime.test_complete_competitive_features_v001 import test_provider_billed_signalbench_is_receipt_gated
          test_provider_billed_signalbench_is_receipt_gated()
          PY
          python tools/certify_python_benchmark_proof_reference.py --output /tmp/benchmark-proof-reference.json
          python tools/certify_signalbench_python_product_v1.py --out /tmp/signalbench-python-product.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/signalbench-python-product.json').read_text(encoding='utf-8'))
          assert report['ok'] is True, report
          assert report['runtime_ready'] is True, report
          assert report['lifecycle_state'] == 'partial', report
          assert report['admission_ready'] is False, report
          assert report['frozen_repository_identity'] is True, report
          assert report['exact_arm_identity'] is True, report
          assert report['provider_observed_usage'] is True, report
          assert report['sealed_usage_receipts'] is True, report
          assert report['hardened_comparison_authority'] is True, report
          assert report['external_superiority_proven'] is False, report
          assert report['python_complete_ready'] is False, report
          assert report['rust_resume_allowed'] is False, report
          assert report['rust']['production_promoted'] == 174, report
          assert report['rust']['remaining_parity_promotion'] == 71, report
          PY

      - name: Refresh manifest and validate repository
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          python tools/validate.py

      - name: Guard exact implementation scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            .github/workflows/release-main-merge-gate.yml \
            .github/workflows/signalbench-python-product.yml \
            MANIFEST.sha256 \
            benchmarks/signalbench/adapters/external_cli.py \
            benchmarks/signalbench/tasks.example.json \
            contracts/python/capability-completeness-registry-v1.json \
            contracts/python/signalbench-python-product-v1.json \
            syntavra_runtime/cli.py \
            syntavra_runtime/signalbench.py \
            syntavra_runtime/signalbench_hardened.py \
            tests/runtime/test_complete_competitive_features_v001.py \
            tests/runtime/test_release_action_pins.py \
            tests/runtime/test_signalbench_python_product_v1.py \
            tools/certify_signalbench_python_product_v1.py | sort)"
          test "$changed" = "$expected"
          python tools/refresh_manifest.py --check

      - name: Commit and push guarded implementation
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$TARGET_HEAD"
          git config user.name "syntavra-ci"
          git config user.email "syntavra-ci@users.noreply.github.com"
          git add -- \
            .github/workflows/release-main-merge-gate.yml \
            .github/workflows/signalbench-python-product.yml \
            MANIFEST.sha256 \
            benchmarks/signalbench/adapters/external_cli.py \
            benchmarks/signalbench/tasks.example.json \
            contracts/python/capability-completeness-registry-v1.json \
            contracts/python/signalbench-python-product-v1.json \
            syntavra_runtime/cli.py \
            syntavra_runtime/signalbench.py \
            syntavra_runtime/signalbench_hardened.py \
            tests/runtime/test_complete_competitive_features_v001.py \
            tests/runtime/test_release_action_pins.py \
            tests/runtime/test_signalbench_python_product_v1.py \
            tools/certify_signalbench_python_product_v1.py
          git commit -m "Harden SignalBench Python product v1"
          git push origin HEAD:"$TARGET_BRANCH"
