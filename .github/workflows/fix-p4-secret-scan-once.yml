name: Fix P4 Secret Scan Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-p4-secret-scan-once.yml

permissions:
  contents: write

jobs:
  fix-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-p4-runtime-consolidation
          fetch-depth: 0
      - name: Fix secret token boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/validate.py")
          text = path.read_text(encoding="utf-8")
          old = 'ACTUAL_SECRET = re.compile(r"(?:sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,})")'
          new = 'ACTUAL_SECRET = re.compile(r"(?<![A-Za-z0-9_])(?:sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,})")'
          if text.count(old) != 1:
              raise SystemExit("secret regex anchor mismatch")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
      - name: Refresh manifest and commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate.py MANIFEST.sha256
          git diff --cached --check
          git commit -m "Fix secret scanner token-boundary false positive"
          git push origin HEAD:agent/p0-p4-runtime-consolidation
