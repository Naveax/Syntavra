name: Fix P4 Secret Scan Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-p4-secret-scan-once.yml

permissions:
  contents: write

jobs:
  fix-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-p4-runtime-consolidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fix secret token boundary and add regression coverage
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/validate.py")
          text = path.read_text(encoding="utf-8")
          old = 'ACTUAL_SECRET = re.compile(r"(?:sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,})")'
          new = 'ACTUAL_SECRET = re.compile(r"(?<![A-Za-z0-9])(?:sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,})")'
          if text.count(old) != 1:
              raise SystemExit("secret regex anchor mismatch")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          test = Path("tests/runtime/test_validation_secret_scan.py")
          test.write_text(
              "from tools.validate import ACTUAL_SECRET\n\n"
              "def test_secret_scanner_requires_token_boundary():\n"
              "    assert ACTUAL_SECRET.search('task-to-verified-delivery') is None\n"
              "    assert ACTUAL_SECRET.search('prefix_sk-to-verified-delivery') is None\n"
              "    assert ACTUAL_SECRET.search('sk-' + 'a' * 24) is not None\n"
              "    assert ACTUAL_SECRET.search('ghp_' + 'A' * 24) is not None\n",
              encoding="utf-8",
              newline="\n",
          )
      - name: Install runtime and tests
        run: python -m pip install --disable-pip-version-check -q -e . pytest
      - name: Refresh deterministic manifest
        run: python tools/refresh_manifest.py
      - name: Validate final tree
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q syntavra_runtime tools tests
          python -m tools.validate
          python -m pytest -q
          git diff --check
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate.py tests/runtime/test_validation_secret_scan.py MANIFEST.sha256
          git diff --cached --check
          git commit -m "Fix secret scanner token-boundary false positive"
          git push origin HEAD:agent/p0-p4-runtime-consolidation
