name: Adaptive Rust Freeze Manifest Seal

on:
  push:
    branches:
      - agent/adaptive-context-policy-v1

permissions:
  contents: write

concurrency:
  group: adaptive-rust-freeze-manifest-seal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_HEAD: a148439d1a47691e9d618576567f570c31ce0bc7
      BASE_SHA: ff9fe699b835889f326e2a8b0dfbb7ba334d3949
      SEAL_WORKFLOW: .github/workflows/adaptive-rust-freeze-manifest-seal.yml
      TARGET_BRANCH: agent/adaptive-context-policy-v1
    steps:
      - name: Checkout exact seal head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_HEAD"
          changed="$(git diff --name-only "$EXPECTED_SOURCE_HEAD"..HEAD | sort)"
          expected="$(printf '%s\n%s\n%s\n' \
            "$SEAL_WORKFLOW" \
            tests/runtime/test_rust_feature_freeze_guard.py \
            tools/check_rust_feature_freeze.py | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Validate narrowed Rust freeze guard
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_rust_feature_freeze_guard -v
          python tools/check_rust_feature_freeze.py \
            --repo . \
            --base "$BASE_SHA" \
            --head HEAD \
            --out /tmp/rust-feature-freeze.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/rust-feature-freeze.json').read_text(encoding='utf-8'))
          assert report['ok'] is True, report
          assert report['denied_change_count'] == 0, report
          assert report['allowed_python_surface_metadata_change_count'] == 1, report
          row = report['allowed_python_surface_metadata_changes'][0]
          assert row['path'] == 'contracts/engine/dual-engine-public-surface-v2.json', report
          assert row['allowance'] == 'python-surface-metadata-sync', report
          PY

      - name: Refresh exact-tree manifest and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm "$SEAL_WORKFLOW"
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git add MANIFEST.sha256
          git diff --check
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$SEAL_WORKFLOW" MANIFEST.sha256 | sort)"
          printf '%s\n' "$staged"
          test "$staged" = "$expected"

      - name: Commit exact manifest seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Seal Rust freeze metadata-sync manifest"
          git push origin "HEAD:${TARGET_BRANCH}"
