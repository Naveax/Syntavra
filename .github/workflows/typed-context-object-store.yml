name: Typed Context Object Store

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: typed-context-object-store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typed-context-object-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run Typed Context Object Store regression tests
        run: python -m unittest tests.runtime.test_typed_context_object_store -v

      - name: Generate exact-head Typed Context certificate
        run: |
          python tools/certify_typed_context_object_store.py --out /tmp/typed-context-object-store.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('/tmp/typed-context-object-store.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'TYPED_CONTEXT_OBJECT_STORE_V1'
          assert report['exact_head'] == head
          assert report['admission_ready'] is True
          assert report['python_complete_ready'] is True
          assert report['rust_resume_allowed'] is False
          assert report['runtime']['declared_object_types'] == 16
          assert report['runtime']['all_types_roundtrip'] is True
          assert report['runtime']['all_types_persist_via_evidence_store'] is True
          assert report['runtime']['all_representations_roundtrip'] is True
          assert report['runtime']['secret_policy_inherited'] is True
          assert report['runtime']['parallel_storage_engine'] is False
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          PY

      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Typed Context Object Store evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typed-context-object-store-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/typed-context-object-store.json
          if-no-files-found: error
