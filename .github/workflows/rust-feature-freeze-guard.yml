name: Rust Feature Freeze Guard

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-feature-freeze-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  rust-feature-freeze-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Python runtime
        run: python -m pip install -e .

      - name: Run Rust freeze regression tests
        run: python -m unittest tests.runtime.test_rust_feature_freeze_guard -v

      - name: Certify exact-head Rust freeze authority
        run: |
          python tools/certify_rust_feature_freeze_guard.py --out /tmp/rust-feature-freeze-guard.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('/tmp/rust-feature-freeze-guard.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['ok'] is True, report
          assert report['claim'] == 'RUST_FEATURE_FREEZE_ENFORCED'
          assert report['exact_head'] == head
          assert report['guard_admission_ready'] is True
          assert report['python_complete_ready'] is True
          assert report['rust_resume_allowed'] is False
          assert report['rust']['feature_development_frozen'] is True
          assert report['rust']['production_promotion_frozen'] is True
          assert report['rust']['implementation_coverage'] == 245
          assert report['rust']['production_promoted'] == 174
          assert report['rust']['remaining_parity_promotion'] == 71
          PY

      - name: Enforce ordinary PR diff freeze
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_rust_feature_freeze.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --out /tmp/rust-feature-freeze-diff.json

      - name: Enforce clean exact-head repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf syntavra_runtime.egg-info
          git diff --check
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Upload Rust freeze evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-feature-freeze-guard-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/rust-feature-freeze-guard.json
            /tmp/rust-feature-freeze-diff.json
          if-no-files-found: warn
