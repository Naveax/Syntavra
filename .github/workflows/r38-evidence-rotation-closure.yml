name: R38 Evidence Rotation Closure

on:
  pull_request:
    branches: [main]
    types: [synchronize, labeled]

permissions:
  contents: write

concurrency:
  group: r38-evidence-rotation-closure
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      RUSTUP_TOOLCHAIN: 1.82.0
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_SHA }}
          fetch-depth: 0

      - name: Detect one-shot repair marker
        id: marker
        shell: bash
        run: |
          if [[ -f tools/r38-evidence-rotate-key-repair.marker ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.13
        if: steps.marker.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up pinned Rust 1.82
        if: steps.marker.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt

      - name: Install runtime test dependencies
        if: steps.marker.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check -e . pytest

      - name: Apply native evidence rotation repair
        id: repair_contract
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/repair_r38_evidence_rotate_key_contract.py
          python tools/advance_r38_evidence_rotate_key_inventory.py
          cargo fmt --all
          cargo check --locked -p syntavra-cli --bin syntavra
          git diff --binary > /tmp/evidence-rotate-first.diff
          python tools/repair_r38_evidence_rotate_key_contract.py
          python tools/advance_r38_evidence_rotate_key_inventory.py
          cargo fmt --all
          git diff --binary > /tmp/evidence-rotate-second.diff
          cmp /tmp/evidence-rotate-first.diff /tmp/evidence-rotate-second.diff

      - name: Build repaired selector
        id: build_selector
        if: steps.marker.outputs.present == 'true'
        run: cargo build --locked -p syntavra-cli --bin syntavra

      - name: Validate native evidence and compression routes
        id: targeted_tests
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SYNTAVRA_R38_SELECTOR="$PWD/target/debug/syntavra" \
            python -m pytest -q \
              tests/runtime/test_native_compress_describe_r38.py \
              tests/runtime/test_native_compress_put_r38.py \
              tests/runtime/test_native_compress_get_r38.py \
              tests/runtime/test_native_compress_verify_r38.py \
              tests/runtime/test_native_evidence_get_r38.py \
              tests/runtime/test_native_evidence_rotate_key_r38.py

      - name: Validate exact-head runtime closure
        id: full_validator
        if: steps.marker.outputs.present == 'true'
        run: python tools/validate_r38_regression_closure.py

      - name: Reproduce generated metadata
        id: metadata_reproduction
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/repair_r38_selector_option_values.py
          python tools/repair_r38_windows_rollout_identity.py
          python tools/repair_r38_native_expansion_sync.py
          python tools/repair_r38_backup_create_contract.py
          python tools/repair_r38_backup_evidence_parity.py
          python tools/advance_r38_backup_create_inventory.py
          python tools/repair_r38_backup_verify_contract.py
          python tools/advance_r38_backup_verify_inventory.py
          python tools/repair_r38_backup_restore_contract.py
          python tools/advance_r38_backup_restore_inventory.py
          python tools/repair_r38_compress_describe_contract.py
          python tools/advance_r38_compress_describe_inventory.py
          python tools/repair_r38_compress_put_contract.py
          python tools/advance_r38_compress_put_inventory.py
          python tools/repair_r38_compress_get_contract.py
          python tools/advance_r38_compress_get_inventory.py
          python tools/repair_r38_compress_verify_contract.py
          python tools/advance_r38_compress_verify_inventory.py
          python tools/repair_r38_evidence_get_contract.py
          python tools/advance_r38_evidence_get_inventory.py
          python tools/repair_r38_evidence_rotate_key_contract.py
          python tools/advance_r38_evidence_rotate_key_inventory.py
          python tools/sync_r38_generated_metadata.py
          cargo fmt --all
          python tools/repair_r38_backup_create_contract.py
          python tools/repair_r38_backup_evidence_parity.py
          python tools/advance_r38_backup_create_inventory.py
          python tools/repair_r38_backup_verify_contract.py
          python tools/advance_r38_backup_verify_inventory.py
          python tools/repair_r38_backup_restore_contract.py
          python tools/advance_r38_backup_restore_inventory.py
          python tools/repair_r38_compress_describe_contract.py
          python tools/advance_r38_compress_describe_inventory.py
          python tools/repair_r38_compress_put_contract.py
          python tools/advance_r38_compress_put_inventory.py
          python tools/repair_r38_compress_get_contract.py
          python tools/advance_r38_compress_get_inventory.py
          python tools/repair_r38_compress_verify_contract.py
          python tools/advance_r38_compress_verify_inventory.py
          python tools/repair_r38_evidence_get_contract.py
          python tools/advance_r38_evidence_get_inventory.py
          python tools/repair_r38_evidence_rotate_key_contract.py
          python tools/advance_r38_evidence_rotate_key_inventory.py
          python tools/repair_r38_native_expansion_sync.py
          python tools/sync_r38_generated_metadata.py
          rm tools/r38-evidence-rotate-key-repair.marker
          rm .github/workflows/r38-one-shot-runtime-closure.yml
          rm .github/workflows/r38-evidence-rotation-closure.yml
          python tools/refresh_manifest.py

      - name: Final locked selector compile
        id: final_compile
        if: steps.marker.outputs.present == 'true'
        run: cargo check --locked -p syntavra-cli --bin syntavra

      - name: Commit atomic closure and remove one-shot workflows
        id: atomic_commit
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${VALIDATION_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "expected an atomic closure diff" >&2; exit 1; }
          git commit -m "R38: certify native evidence key rotation inventory"
          git push origin HEAD:agent/full-dual-engine-runtime

      - name: Persist closure failure diagnostics
        if: failure() && steps.marker.outputs.present == 'true'
        shell: bash
        env:
          REPAIR_OUTCOME: ${{ steps.repair_contract.outcome }}
          BUILD_OUTCOME: ${{ steps.build_selector.outcome }}
          TARGETED_OUTCOME: ${{ steps.targeted_tests.outcome }}
          VALIDATOR_OUTCOME: ${{ steps.full_validator.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata_reproduction.outcome }}
          COMPILE_OUTCOME: ${{ steps.final_compile.outcome }}
          COMMIT_OUTCOME: ${{ steps.atomic_commit.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "validation_sha": os.environ["VALIDATION_SHA"],
              "outcomes": {
                  "repair_contract": os.environ.get("REPAIR_OUTCOME", ""),
                  "build_selector": os.environ.get("BUILD_OUTCOME", ""),
                  "targeted_tests": os.environ.get("TARGETED_OUTCOME", ""),
                  "full_validator": os.environ.get("VALIDATOR_OUTCOME", ""),
                  "metadata_reproduction": os.environ.get("METADATA_OUTCOME", ""),
                  "final_compile": os.environ.get("COMPILE_OUTCOME", ""),
                  "atomic_commit": os.environ.get("COMMIT_OUTCOME", ""),
              },
          }
          Path("tools/r38-evidence-rotate-key-failure.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/r38-evidence-rotate-key-failure.json
          git commit -m "R38: record evidence rotation closure failure"
          git push origin HEAD:agent/full-dual-engine-runtime
