name: Bootstrap NPM Scope Publication Authority

on:
  push:
    branches:
      - agent/pre-publish-npm-scope-authority
    paths:
      - '.github/workflows/bootstrap-npm-scope-authority.yml'
      - 'tools/bootstrap_patch_npm_scope_authority.py'

permissions:
  contents: write
  actions: read

jobs:
  validate-and-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pre-publish-npm-scope-authority
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact npm scope workflow patch
        run: python tools/bootstrap_patch_npm_scope_authority.py

      - name: Remove bootstrap-only files from final candidate tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-npm-scope-authority.yml
          rm tools/bootstrap_patch_npm_scope_authority.py

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify npm scope and release authority contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.runtime.test_pre_release_publish_credentials -v
          python -m unittest tests.runtime.test_release_main_protection -v
          python -m unittest tests.runtime.test_pre_release_publish_workflow_contract -v
          python -m unittest tests.runtime.test_pre_release_registry_availability -v
          python -m unittest tests.runtime.test_pre_release_publisher_prerequisites -v
          python -m unittest tests.runtime.test_pre_release_candidate_receipt_plan -v
          python -m unittest tests.runtime.test_python_publication_registry_reference -v
          python tools/certify_python_publication_registry_reference.py --output /tmp/publication-registry.json
          python tools/certify_python_fixture_golden_catalog.py --output /tmp/fixture-golden.json
          python tools/validate_release.py --smoke --output /tmp/release-validation.json
          grep -F "assert value['npm']['scope_publish_rights_verified'] is True" .github/workflows/publish-pre-release.yml
          grep -F "assert value['npm']['scope_authorization']['verified'] is True" .github/workflows/publish-pre-release.yml
          git diff --check

      - name: Refresh bootstrap-free final manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_manifest.py
          python tools/refresh_manifest.py --check
          git checkout -- release-smoke.json 2>/dev/null || true
          rm -rf syntavra_runtime.egg-info
          rm -f fusion-release-smoke.json platform-registry.json native-dry-run.json
          git diff --check

      - name: Enforce exact permanent diff
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git status --short | sed -E 's/^.. //')"
          printf '%s\n' "$actual"
          printf '%s\n' "$actual" | grep -Fx '.github/workflows/bootstrap-npm-scope-authority.yml'
          printf '%s\n' "$actual" | grep -Fx '.github/workflows/publish-pre-release.yml'
          printf '%s\n' "$actual" | grep -Fx 'MANIFEST.sha256'
          printf '%s\n' "$actual" | grep -Fx 'tools/bootstrap_patch_npm_scope_authority.py'
          test "$(printf '%s\n' "$actual" | sed '/^$/d' | wc -l)" -eq 4

      - name: Create validated Git blobs without moving refs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          result = {'refs_moved': False}
          for key, path in (
              ('workflow_sha', Path('.github/workflows/publish-pre-release.yml')),
              ('manifest_sha', Path('MANIFEST.sha256')),
          ):
              payload = json.dumps({
                  'content': base64.b64encode(path.read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  value = json.load(response)
              result[key] = value['sha']
          Path('/tmp/npm-scope-authority-blobs.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: validated-npm-scope-authority-${{ github.sha }}
          path: /tmp/npm-scope-authority-blobs.json
          if-no-files-found: error
          retention-days: 7
