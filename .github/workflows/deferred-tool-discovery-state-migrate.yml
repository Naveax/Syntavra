name: Deferred Tool Discovery State Migration

on:
  push:
    branches:
      - agent/deferred-tool-discovery-v1

permissions:
  contents: write

concurrency:
  group: deferred-tool-discovery-state-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/deferred-tool-discovery-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply exact admission migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path('.')

          # Registry state progression.
          path = root / 'contracts/python/capability-completeness-registry-v1.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          rows = {row['id']: row for row in data['capabilities']}
          programmatic = rows['programmatic_execution_v1']
          deferred = rows['deferred_tool_discovery_v1']
          assert programmatic['state'] == 'implemented', programmatic
          assert deferred['state'] == 'partial', deferred
          programmatic['state'] = 'certified'
          programmatic['certification_evidence'] = [
              'contracts/python/programmatic-execution-v1.json',
              'syntavra_runtime/programmatic_execution.py',
              'tools/certify_programmatic_execution.py',
              'tests/runtime/test_programmatic_execution.py',
              '.github/workflows/programmatic-execution.yml',
          ]
          deferred['state'] = 'implemented'
          deferred['implementation_evidence'] = [
              'syntavra_runtime/tool_registry.py',
              'syntavra_runtime/mcp_application.py',
              'syntavra_runtime/deferred_tool_discovery.py',
              'contracts/python/deferred-tool-discovery-v1.json',
              'tools/certify_deferred_tool_discovery.py',
              'tests/runtime/test_deferred_tool_discovery.py',
              '.github/workflows/deferred-tool-discovery.yml',
          ]
          deferred['certification_evidence'] = []
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Make Programmatic Execution certificate valid after its admitted merge.
          path = root / 'tools/certify_programmatic_execution.py'
          text = path.read_text(encoding='utf-8')
          old = '    _require(completeness.get("current_milestone") == "programmatic_execution_v1", "registry has not advanced to programmatic_execution_v1")\n'
          new = '    current_milestone = completeness.get("current_milestone")\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old = '    _require((by_id.get("programmatic_execution_v1") or {}).get("state") in {"implemented", "verified"}, "Programmatic Execution registry state must be pre-certification implemented/verified")\n'
          new = '''    programmatic_state = (by_id.get("programmatic_execution_v1") or {}).get("state")\n    _require(programmatic_state in {"implemented", "verified", "certified"}, "Programmatic Execution registry state drift")\n    if programmatic_state == "certified":\n        _require(current_milestone != "programmatic_execution_v1", "registry did not advance beyond certified Programmatic Execution")\n    else:\n        _require(current_milestone == "programmatic_execution_v1", "registry has not advanced to Programmatic Execution")\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Release Main trust chain.
          path = root / '.github/workflows/release-main-merge-gate.yml'
          text = path.read_text(encoding='utf-8')
          old = '          python -m unittest tests.runtime.test_programmatic_execution -v\n'
          new = old + '          python -m unittest tests.runtime.test_deferred_tool_discovery -v\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old = '          python tools/certify_programmatic_execution.py --out /tmp/programmatic-execution.json\n'
          new = old + '          python tools/certify_deferred_tool_discovery.py --out /tmp/deferred-tool-discovery.json\n'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Immutable action pin coverage.
          path = root / 'tests/runtime/test_release_action_pins.py'
          text = path.read_text(encoding='utf-8')
          old = '    ".github/workflows/programmatic-execution.yml",\n'
          new = old + '    ".github/workflows/deferred-tool-discovery.yml",\n'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Repository validator required surfaces and certifier check.
          path = root / 'tools/validate.py'
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('    ROOT / "contracts" / "python" / "programmatic-execution-v1.json",\n', '    ROOT / "contracts" / "python" / "programmatic-execution-v1.json",\n    ROOT / "contracts" / "python" / "deferred-tool-discovery-v1.json",\n'),
              ('    ROOT / "syntavra_runtime" / "programmatic_execution.py",\n', '    ROOT / "syntavra_runtime" / "programmatic_execution.py",\n    ROOT / "syntavra_runtime" / "deferred_tool_discovery.py",\n'),
              ('    ROOT / "tests" / "runtime" / "test_programmatic_execution.py",\n', '    ROOT / "tests" / "runtime" / "test_programmatic_execution.py",\n    ROOT / "tests" / "runtime" / "test_deferred_tool_discovery.py",\n'),
              ('    ROOT / "tools" / "certify_programmatic_execution.py",\n', '    ROOT / "tools" / "certify_programmatic_execution.py",\n    ROOT / "tools" / "certify_deferred_tool_discovery.py",\n'),
              ('    ROOT / ".github" / "workflows" / "programmatic-execution.yml",\n', '    ROOT / ".github" / "workflows" / "programmatic-execution.yml",\n    ROOT / ".github" / "workflows" / "deferred-tool-discovery.yml",\n'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new, 1)

          marker = '\n\ndef main() -> int:\n'
          assert text.count(marker) == 1, text.count(marker)
          deferred_check = '''\n\ndef _deferred_tool_discovery_check() -> tuple[bool, str]:\n    try:\n        from tools.certify_deferred_tool_discovery import certify\n        report = certify(ROOT)\n        summary = {\n            "claim": report.get("claim"),\n            "exact_head": report.get("exact_head"),\n            "admission_ready": report.get("admission_ready"),\n            "stage1_schema_deferred": (report.get("runtime") or {}).get("stage1_schema_deferred"),\n            "host_negotiation": (report.get("runtime") or {}).get("host_negotiation"),\n            "schema_token_budget": (report.get("runtime") or {}).get("schema_token_budget"),\n            "rust_promoted": (report.get("rust") or {}).get("production_promoted"),\n            "rust_resume_allowed": report.get("rust_resume_allowed"),\n        }\n        return bool(report.get("ok")), json.dumps(summary, sort_keys=True)\n    except Exception as exc:\n        return False, f"{type(exc).__name__}: {exc}"\n'''
          text = text.replace(marker, deferred_check + marker, 1)
          old = '    programmatic_ok, programmatic_detail = _programmatic_execution_check()\n    checks.append(("programmatic_execution", programmatic_ok, programmatic_detail))\n'
          new = old + '\n    deferred_ok, deferred_detail = _deferred_tool_discovery_check()\n    checks.append(("deferred_tool_discovery", deferred_ok, deferred_detail))\n'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify migrated contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/certify_programmatic_execution.py tools/certify_deferred_tool_discovery.py tools/validate.py syntavra_runtime/deferred_tool_discovery.py syntavra_runtime/mcp_application.py
          python -m unittest tests.runtime.test_programmatic_execution -v
          python -m unittest tests.runtime.test_deferred_tool_discovery -v
          python -m unittest tests.runtime.test_release_action_pins -v
          python tools/certify_programmatic_execution.py --out /tmp/programmatic-after-admission.json
          python tools/certify_deferred_tool_discovery.py --out /tmp/deferred-tool-discovery.json

      - name: Commit migration and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/deferred-tool-discovery-state-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/python/capability-completeness-registry-v1.json tools/certify_programmatic_execution.py .github/workflows/release-main-merge-gate.yml tests/runtime/test_release_action_pins.py tools/validate.py .github/workflows/deferred-tool-discovery-state-migrate.yml
          git diff --cached --check
          git commit -m 'Advance Deferred Tool Discovery admission state'
          git push origin HEAD:agent/deferred-tool-discovery-v1
