[package]
name = "syntavra-cli"
description = "Production-native CLI and engine selector for Syntavra"
default-run = "syntavra-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "syntavra"
path = "src/bin/syntavra.rs"

[[bin]]
name = "syntavra-rs"
path = "src/main.rs"

[[bin]]
name = "syntavra-config-lifecycle-plan"
path = "src/bin/syntavra-config-lifecycle-plan.rs"

[[bin]]
name = "syntavra-config-lifecycle-apply"
path = "src/bin/syntavra-config-lifecycle-apply.rs"

[[bin]]
name = "syntavra-full-parity"
path = "src/bin/syntavra-full-parity.rs"

[dependencies]
# Keep the native syntax pack resolvable on the workspace MSRV (Rust/Cargo 1.82).
indexmap = "=2.7.1"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-dart-orchard = "=0.3.2"
tree-sitter-elixir = "=0.3.5"
tree-sitter-erlang = "=0.20.0"
tree-sitter-fish = "=3.6.0"
tree-sitter-fsharp = "=0.3.11"
tree-sitter-go = "=0.25.0"
tree-sitter-haskell = "=0.23.1"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-julia = "=0.23.1"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-lua = "=0.2.0"
tree-sitter-ocaml = "=0.24.2"
tree-sitter-php = "=0.24.2"
tree-sitter-powershell = "=0.26.4"
tree-sitter-r = "=1.3.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-scala = "=0.24.1"
tree-sitter-solidity = "=1.2.13"
tree-sitter-svelte-ng = "=1.0.2"
tree-sitter-swift = "=0.7.3"
tree-sitter-typescript = "=0.23.2"
tree-sitter-vue-next = "=0.1.0"
tree-sitter-zig = "=1.1.2"
aes-gcm = "0.10.3"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
rand = "0.8.5"
regex = "1.11.1"
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
serde_json = "1.0"
sha2 = "0.10.8"
syntavra-contracts = { version = "0.0.1", path = "../syntavra-contracts" }
syntavra-core = { version = "0.0.1", path = "../syntavra-core" }
tar = "0.4.44"
unicode-normalization = "0.1.24"
zeroize = "=1.8.1"

[lints]
workspace = true
